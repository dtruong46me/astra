": "連絡", "r": "れんらく", "hv": "LIÊN LẠC", "m": "liên lạc"}], "x": {"1": "てんかく: sai cả hai chữ.", "2": "てんらく là 転落 (rơi xuống). 連 đọc れん, không phải てん.", "4": "れんかく: 絡 đọc らく, không phải かく."}, "n": ["いざというとき: lúc khẩn cấp. Xem Đề 10 câu 15 (密接)."], "why": "連 đọc <b>れん<\/b>, 絡 đọc <b>らく<\/b> ＝ <b>れんらく<\/b>: liên lạc. Ngữ cảnh hàng xóm giữ liên lạc chặt chẽ khớp nghĩa."}, {"s": "_商品_の{陳列法|ちんれつほう}は売り上げに大いに{影響|えいきょう}する。", "o": ["しょうひん", "せいひん", "しょくひん", "やくひん"], "a": 1, "ar": "商品", "vi": "Cách bày hàng ảnh hưởng lớn tới doanh số.", "key": [{"w": "商品", "r": "しょうひん", "hv": "THƯƠNG PHẨM", "m": "hàng hóa"}], "x": {"2": "せいひん là 製品 (sản phẩm sản xuất ra). Chữ khác — 商 đọc しょう.", "3": "しょくひん là 食品 (thực phẩm). Chữ khác.", "4": "やくひん là 薬品 (dược phẩm). Chữ khác."}, "why": "商 đọc <b>しょう<\/b>, 品 đọc <b>ひん<\/b> ＝ <b>しょうひん<\/b>: hàng hóa (để bán). Ngữ cảnh 陳列 (trưng bày) và 売り上げ (doanh số) khớp nghĩa."}, {"s": "私が言ったことで彼は_機嫌_を悪くしてしまった。", "o": ["ぎげん", "がいげん", "きげん", "かいげん"], "a": 3, "ar": "機嫌", "vi": "Vì lời tôi nói mà anh ấy phật ý.", "key": [{"w": "機嫌", "r": "きげん", "hv": "CƠ HIỀM", "m": "tâm trạng"}], "x": {"1": "ぎげん: 機 không đục thành ぎ.", "2": "がいげん: không có từ này.", "4": "かいげん là 開眼 (khai nhãn). Chữ khác."}, "n": ["Đồng âm: 期限 きげん (thời hạn, Đề 10 câu 18). ご機嫌いかがですか."], "why": "機 đọc <b>き<\/b>, 嫌 đọc <b>げん<\/b> (âm đặc biệt của 嫌 trong từ này) ＝ <b>きげん<\/b>: tâm trạng. Collocation 機嫌を悪くする (phật ý), 機嫌がいい."}, {"s": "私は毎朝_植木_に水をやります。", "o": ["しょくもく", "うえき", "いえぎ", "しょくぼく"], "a": 2, "ar": "植木", "vi": "Sáng nào tôi cũng tưới nước cho cây cảnh.", "key": [{"w": "植木", "r": "うえき", "hv": "THỰC MỘC", "m": "cây trồng, cây cảnh"}], "x": {"1": "しょくもく: đọc On cả hai — không có từ này.", "3": "いえぎ: 植 không đọc いえ.", "4": "しょくぼく: không có từ này (植物 しょくぶつ mới là từ On)."}, "n": ["Từ thuần Nhật: 植える うえる + 木 き → うえき. 植物 しょくぶつ đọc On."], "why": "植木 đọc Kun＋Kun: 植 <b>うえ<\/b> (植える) ＋ 木 <b>き<\/b> ＝ <b>うえき<\/b>: cây trồng trong chậu, cây cảnh. Ngữ cảnh tưới nước mỗi sáng khớp nghĩa."}, {"s": "初めて発表会で_舞台_に上がったときはすごく{緊張|きんちょう}した。", "o": ["まいだい", "まいたい", "ぶたい", "ぶだい"], "a": 3, "ar": "舞台", "vi": "Lần đầu lên sân khấu trong buổi biểu diễn, tôi rất căng thẳng.", "key": [{"w": "舞台", "r": "ぶたい", "hv": "VŨ ĐÀI", "m": "sân khấu"}], "x": {"1": "まいだい: 舞 âm Kun là まい (舞う まう), nhưng từ Hán 舞台 đọc ぶ.", "2": "まいたい: sai chữ đầu.", "4": "ぶだい: 台 trong 舞台 đọc たい (âm trong); だい chỉ ở 台所, 一台."}, "n": ["舞う まう (múa). 台 だい: 台所; たい: 台風, 舞台."], "why": "舞 đọc <b>ぶ<\/b>, 台 đọc <b>たい<\/b> ＝ <b>ぶたい<\/b>: sân khấu. Ngữ cảnh 舞台に上がる (lên sân khấu) khớp nghĩa."}, {"s": "私はそのパーティーへの招待を{丁寧|ていねい}に_断った_。", "o": ["ことなった", "ことわった", "おこなった", "うしなった"], "a": 2, "ar": "断る", "vi": "Tôi đã lịch sự từ chối lời mời dự tiệc.", "key": [{"w": "断る", "r": "ことわる", "hv": "ĐOẠN", "m": "từ chối"}], "x": {"1": "ことなった là 異なる (khác nhau). Âm gần nhưng chữ khác.", "3": "おこなった là 行う (tiến hành). Chữ khác.", "4": "うしなった là 失う (đánh mất). Chữ khác."}, "n": ["断 On だん: 判断, 油断 (Đề 14 câu 2)."], "why": "断る đọc <b>ことわる<\/b>: từ chối. Ngữ cảnh 招待を丁寧に断った khớp nghĩa. Âm On: 断 だん (油断, 判断)."}], "sum": [{"h": "Quy tắc biến âm của số đếm (một giây, một phiếu…)", "tbl": {"head": ["Chữ sau bắt đầu bằng", "一 → ?", "Ví dụ"], "rows": [["か hàng", "いっ", "一回 いっかい, 一個 いっこ"], ["さ hàng", "いっ", "一冊 いっさつ, 一歳 いっさい"], ["た hàng", "いっ", "一頭 いっとう, 一通 いっつう"], ["は hàng → ぱ", "いっ + ぱ", "一本 いっぽん, 一票 いっぴょう, 一泊 いっぱく"], ["âm đục (が, ざ, だ, ば)", "いち (giữ nguyên)", "一秒 いちびょう, 一台 いちだい, 一軍 いちぐん"]]}}, {"h": "Đục hóa (連濁) và chữ nhiều âm trong đề", "li": ["<b>詰<\/b>: つめ → づめ khi ghép: 缶詰 かんづめ, 瓶詰 びんづめ, 箱詰め はこづめ.", "<b>率<\/b>: りつ (tỷ lệ: 確率, 合格率, 進学率) / そつ (率直 そっちょく, 引率 いんそつ, 軽率 けいそつ).", "<b>嫌<\/b>: げん (機嫌) / けん (嫌悪 けんお) / いや / きら(う).", "<b>舞<\/b>: ぶ (舞台, 舞踊) / ま(う), まい (お見舞い). <b>台<\/b>: たい (舞台, 台風) / だい (台所, 一台)."]}, {"h": "Nội tạng và từ y học hay gặp", "tbl": {"head": ["Từ", "Đọc", "Nghĩa"], "rows": [["心臓", "しんぞう", "tim"], ["腎臓", "じんぞう", "thận"], ["肝臓", "かんぞう", "gan"], ["胃", "い", "dạ dày"], ["肺", "はい", "phổi"], ["腸", "ちょう", "ruột"], ["脳", "のう", "não"], ["血管", "けっかん", "mạch máu"]]}}, {"h": "Nhóm từ đồng âm / gần âm cần tách bạch", "li": ["せんたく: 選択 (lựa chọn) / 洗濯 (giặt).", "かいふく 回復 (hồi phục) / かいほう 解放・開放・介抱 / かいふう 開封.", "しょうひん 商品 (hàng bán) / せいひん 製品 (sản phẩm) / しょくひん 食品 / やくひん 薬品 / さくひん 作品.", "Góc: 隅 すみ (góc trong) / 角 かど (góc ngoài) / 端 はし (mép)."]}], "source": {"folder": "https://drive.google.com/drive/folders/1vA2bH3ORODCjZk0r2_Cns-CYxCupbL7o", "goc": "https://drive.google.com/file/d/1fJs99JiT69DzvkmSD-xAoulbaiHMy100/view", "chua": "https://drive.google.com/file/d/1lyKT6jzJJyiH2cjU1SbLk5ipMxOFDbcN/view"}, "series": "DORA Nihongo · Đề 16 · Kanji N5–N2 trúng tủ"}, {"no": 17, "folderLabel": "Từ vựng", "cat": "Từ vựng", "file": "ĐỀ 23 - TỪ VỰNG N2", "title": "Đề 17 · Từ vựng N2", "jp": "文脈規定", "mondai": "<b>問題4<\/b> （　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。 Chọn từ thích hợp nhất để điền vào chỗ trống.", "qs": [{"s": "商品は土曜日の午前中に（　）してください。", "o": ["配達", "発達", "伝達", "通達"], "a": 1, "ar": "はいたつ", "vi": "Xin hãy giao hàng vào sáng thứ Bảy.", "key": [{"w": "配達", "r": "はいたつ", "hv": "PHỐI ĐẠT", "m": "giao hàng, phát (thư, báo)"}], "x": {"2": "発達 (phát triển): dùng cho công nghệ, cơ thể (技術が発達する). Không “phát triển hàng hóa vào sáng thứ Bảy”.", "3": "伝達 (truyền đạt): dùng cho thông tin, mệnh lệnh. Hàng hóa không “truyền đạt”.", "4": "通達 (thông báo hành chính bằng văn bản): không dùng cho hàng hóa."}, "n": ["新聞配達, 配達料."], "why": "商品 (hàng) ＋ thời gian giao → <b>giao hàng tận nơi<\/b>. <b>配達する<\/b>: phân phát, giao (thư, hàng, báo)."}, {"s": "ゆうべは救急車のサイレンで目が（　）。", "o": ["さめた", "かれた", "ほえた", "ふけた"], "a": 1, "ar": "覚める", "vi": "Tối qua tôi bị tiếng còi xe cấp cứu đánh thức.", "key": [{"w": "目が覚める", "r": "めがさめる", "hv": "GIÁC", "m": "tỉnh giấc"}], "x": {"2": "かれる (枯れる: héo / 嗄れる: khản giọng): 声がかれる — không đi với 目.", "3": "ほえる (吠える: sủa): chủ thể là chó, không phải 目.", "4": "ふける (更ける: đêm khuya / 老ける: già đi): 夜が更ける — không đi với 目."}, "n": ["Đồng âm: 冷める (nguội)."], "why": "Tiếng còi xe cấp cứu → <b>tỉnh giấc<\/b>. Collocation <b>目が覚める<\/b>: tỉnh dậy."}, {"s": "A「あ、また電車の中にかばんを忘れてきた。」　B「どうしてそんなに（　）の。」", "o": ["ずうずうしい", "そそっかしい", "いじわるい", "さわがしい"], "a": 2, "ar": "そそっかしい", "vi": "A: Á, lại quên cặp trên tàu rồi. B: Sao cậu hậu đậu thế?", "key": [{"w": "そそっかしい", "r": "そそっかしい", "hv": "—", "m": "hấp tấp, hậu đậu"}], "x": {"1": "ずうずうしい (trơ trẽn, mặt dày): nói thái độ không biết ngại, không liên quan việc hay quên đồ.", "3": "いじわるい (xấu tính, hay chơi xấu): quên đồ không phải xấu tính.", "4": "さわがしい (ồn ào): không liên quan."}, "n": ["Xem Đề 13 câu 15."], "why": "Lại quên cặp trên tàu → tính <b>hậu đậu, hấp tấp<\/b>. <b>そそっかしい<\/b>: hay sơ suất, cẩu thả (đã gặp ở Đề 13 câu 15)."}, {"s": "彼は（　）家に生まれたので良い教育が受けられなかった。", "o": ["こいしい", "けわしい", "まずしい", "あやしい"], "a": 3, "ar": "貧しい", "vi": "Sinh ra trong gia đình nghèo nên anh ấy không được học hành tử tế.", "key": [{"w": "貧しい", "r": "まずしい", "hv": "BẦN", "m": "nghèo"}], "x": {"1": "こいしい (恋しい: nhớ nhung): tả cảm xúc nhớ người/quê, không tả gia đình.", "2": "けわしい (険しい: hiểm trở, nghiêm khắc): 険しい山, 険しい表情 — không dùng cho gia đình.", "4": "あやしい (怪しい: đáng ngờ): “sinh ra trong nhà đáng ngờ” không giải thích việc không được học."}, "n": ["↔ 豊か, 裕福. Xem Đề 10 câu 17 (乏しい)."], "why": "Không được học hành tử tế vì sinh ra trong gia đình <b>nghèo<\/b>. <b>貧しい家<\/b>: nhà nghèo."}, {"s": "この料理を作るには（　）も時間もかかります。", "o": ["手段", "手続き", "手間", "手入れ"], "a": 3, "ar": "てま", "vi": "Món này tốn cả công sức lẫn thời gian.", "key": [{"w": "手間", "r": "てま", "hv": "THỦ GIAN", "m": "công sức, công phu"}], "x": {"1": "手段 (phương tiện, biện pháp): 手段がかかる không có. Dùng 手段を選ぶ.", "2": "手続き (thủ tục): thủ tục hành chính, không phải công sức nấu ăn.", "4": "手入れ (chăm sóc, bảo dưỡng): 庭の手入れ — không nói “món ăn tốn chăm sóc”."}, "n": ["手間がかかる, 手間をかける, お手間を取らせる (làm phiền)."], "why": "Nấu món này tốn cả <b>công sức<\/b> lẫn thời gian. <b>手間がかかる<\/b> là collocation cố định (tốn công)."}, {"s": "テレビのおかげで我々は世界各国の出来事に（　）ことができる。", "o": ["関する", "達する", "接する", "適する"], "a": 3, "ar": "せっする", "vi": "Nhờ tivi mà chúng ta tiếp cận được các sự kiện khắp thế giới.", "key": [{"w": "接する", "r": "せっする", "hv": "TIẾP", "m": "tiếp xúc, tiếp cận"}], "x": {"1": "関する (liên quan): chỉ dùng dạng 〜に関する＋N / 〜に関して. 〜に関することができる sai cấu trúc.", "2": "達する (đạt tới mức): dùng cho con số, mục tiêu (目標に達する). Không “đạt tới sự kiện”.", "4": "適する (thích hợp): “có thể thích hợp với sự kiện” không có nghĩa."}, "g": ["<b class=\"jp\">〜のおかげで<\/b>: nhờ có."], "why": "Nhờ tivi mà <b>tiếp xúc, tiếp cận<\/b> được sự kiện thế giới. <b>〜に接する<\/b>: tiếp xúc với (thông tin, con người, văn hóa)."}, {"s": "父親は子供にふとんを（　）あげた。", "o": ["のばして", "しいて", "あつめて", "ひっぱって"], "a": 2, "ar": "敷く", "vi": "Người cha trải nệm cho con.", "key": [{"w": "敷く", "r": "しく", "hv": "PHU", "m": "trải (nệm, thảm)"}], "x": {"1": "のばす (kéo dài, duỗi): 足を伸ばす. Không dùng cho trải nệm.", "3": "あつめる (gom lại): “gom nệm cho con” không phải việc chuẩn bị chỗ ngủ.", "4": "ひっぱる (kéo): kéo nệm không phải trải nệm."}, "n": ["布団を敷く ↔ 布団を畳む. 敷地 しきち: khuôn viên."], "why": "ふとん (nệm) → <b>trải<\/b>. Collocation <b>ふとんを敷く<\/b>: trải nệm."}, {"s": "A「館内を{巡回|じゅんかい}してきましたよ。{異状|いじょう}はありません。」　B「それは（　）。」", "o": ["おきのどくに", "ごえんりょなく", "ごくろうさま", "おまちどうさま"], "a": 3, "ar": "ご苦労様", "vi": "A: Tôi vừa đi tuần quanh tòa nhà rồi. Không có gì bất thường. B: Vậy thì vất vả cho anh rồi.", "key": [{"w": "ご苦労様", "r": "ごくろうさま", "hv": "KHỔ LAO", "m": "anh/chị vất vả rồi (nói với người dưới)"}], "x": {"1": "おきのどくに (thật đáng tiếc): câu chia buồn — sai, vì không có chuyện xấu.", "2": "ごえんりょなく (cứ tự nhiên): dùng khi mời, cho phép — không hợp.", "4": "おまちどうさま (xin lỗi đã để chờ): người làm cho người khác chờ mới nói câu này."}, "n": ["Với cấp trên dùng お疲れ様です."], "why": "A vừa đi tuần tra xong báo cáo → B ghi nhận công sức: <b>ご苦労さま<\/b> (vất vả cho anh rồi). Lưu ý: dùng với người ngang hoặc dưới mình."}, {"s": "{地震|じしん}の{規模|きぼ}は大きかったが、{倒|たお}れた家は（　）少なかった。", "o": ["少々", "案外", "当然", "事実"], "a": 2, "ar": "あんがい", "vi": "Trận động đất tuy lớn nhưng số nhà đổ lại ít hơn nghĩ.", "key": [{"w": "案外", "r": "あんがい", "hv": "ÁN NGOẠI", "m": "không ngờ, ngoài dự đoán"}], "x": {"1": "少々 (một chút): 少々少なかった nghe lặp ý và mất nghĩa “bất ngờ” do が tạo ra.", "3": "当然 (đương nhiên): mâu thuẫn — động đất lớn thì ít nhà đổ không phải “đương nhiên”.", "4": "事実 (thực tế là): không thể hiện sự trái ngược với dự đoán."}, "n": ["Đồng nghĩa: 意外に, 思いのほか."], "why": "Động đất lớn nhưng nhà đổ lại ít — <b>trái với dự đoán<\/b>. <b>案外<\/b>: không ngờ, hơn/kém so với tưởng tượng."}, {"s": "僕は少年時代、歌手に（　）ものだ。", "o": ["あこがれた", "あらわれた", "あわてた", "あらそった"], "a": 1, "ar": "憧れる", "vi": "Hồi còn nhỏ tôi từng mơ làm ca sĩ.", "key": [{"w": "憧れる", "r": "あこがれる", "hv": "SUNG", "m": "ngưỡng mộ, khao khát"}], "x": {"2": "あらわれた (xuất hiện): “xuất hiện trước ca sĩ” không hợp với ものだ hồi tưởng.", "3": "あわてた (hoảng hốt): 歌手にあわてる vô nghĩa.", "4": "あらそった (tranh giành): 〜と争う (tranh với ai), không phải 〜に."}, "g": ["<b class=\"jp\">Vたものだ<\/b>: hồi tưởng việc thường làm trong quá khứ."], "why": "Hồi nhỏ <b>ngưỡng mộ, mơ ước<\/b> làm ca sĩ. <b>〜に憧れる<\/b> ＋ Vた＋ものだ (hồi tưởng)."}, {"s": "耳の聞こえない人たちは{手話|しゅわ}によって（　）を行うことができる。", "o": ["コミュニケーション", "ステーション", "コレクション", "ファッション"], "a": 1, "ar": "communication", "vi": "Người khiếm thính có thể giao tiếp bằng ngôn ngữ ký hiệu.", "key": [{"w": "コミュニケーション", "r": "コミュニケーション", "hv": "—", "m": "giao tiếp"}], "x": {"2": "ステーション (nhà ga, trạm): không “thực hiện nhà ga”.", "3": "コレクション (bộ sưu tập): không liên quan ngôn ngữ ký hiệu.", "4": "ファッション (thời trang): không liên quan."}, "why": "Ngôn ngữ ký hiệu dùng để <b>giao tiếp<\/b>. <b>コミュニケーションを行う／取る<\/b>: giao tiếp."}, {"s": "母の父、（　）私の祖父は現在８５歳です。", "o": ["なぜなら", "ところが", "すなわち", "そのうえ"], "a": 3, "ar": "即ち", "vi": "Bố của mẹ tôi, tức là ông ngoại tôi, năm nay 85 tuổi.", "key": [{"w": "すなわち", "r": "すなわち", "hv": "(即ち)", "m": "tức là"}], "x": {"1": "なぜなら (bởi vì): vế sau phải là lý do — “ông ngoại” không phải lý do.", "2": "ところが (thế nhưng): cần quan hệ trái ngược — không có.", "4": "そのうえ (hơn nữa): cộng thêm thông tin mới; “ông ngoại” chỉ là cách gọi khác của cùng một người."}, "n": ["Đồng nghĩa: つまり."], "why": "“Bố của mẹ” ＝ “ông ngoại” — nói lại bằng cách khác. Liên từ <b>すなわち<\/b>: tức là, nói cách khác."}, {"s": "あしたまでに（　）を出さなければならない。", "o": ["完成", "結局", "結論", "完了"], "a": 3, "ar": "けつろん", "vi": "Phải đưa ra kết luận trước ngày mai.", "key": [{"w": "結論", "r": "けつろん", "hv": "KẾT LUẬN", "m": "kết luận"}], "x": {"1": "完成 (hoàn thành): 完成を出す không có; nói 完成させる.", "2": "結局 (rốt cuộc): thường là phó từ, không làm tân ngữ của 出す.", "4": "完了 (hoàn tất): 完了を出す không có; nói 完了する."}, "why": "〜を出す ＝ <b>đưa ra kết luận<\/b>. Collocation <b>結論を出す<\/b>."}, {"s": "引っ越しの準備は（　）にいっている。", "o": ["エチケット", "スムーズ", "スタイル", "アクセント"], "a": 2, "ar": "smooth", "vi": "Việc chuẩn bị chuyển nhà đang suôn sẻ.", "key": [{"w": "スムーズ", "r": "スムーズ", "hv": "—", "m": "trôi chảy, suôn sẻ"}], "x": {"1": "エチケット (phép lịch sự): không mô tả tiến độ công việc.", "3": "スタイル (phong cách): không đi với にいく.", "4": "アクセント (trọng âm): không liên quan."}, "n": ["Đồng nghĩa: 順調に進む."], "why": "Việc chuẩn bị đang <b>suôn sẻ<\/b>. Cấu trúc <b>スムーズにいく<\/b> (diễn ra trôi chảy)."}, {"s": "番組終了後、テレビ局には{抗議|こうぎ}のメールが（　）と{届|とど}いた。", "o": ["着々", "点々", "続々", "別々"], "a": 3, "ar": "ぞくぞく", "vi": "Sau khi chương trình kết thúc, email phản đối gửi tới tấp đến đài.", "key": [{"w": "続々", "r": "ぞくぞく", "hv": "TỤC TỤC", "m": "liên tục, tới tấp"}], "x": {"1": "着々と (từng bước vững chắc): dùng cho tiến độ công việc (工事が着々と進む), không cho email dồn đến.", "2": "点々と (lác đác, rải rác): ngược nghĩa “rất nhiều”.", "4": "別々に (riêng rẽ): không đi với と届く theo nghĩa này."}, "why": "Email phản đối gửi đến <b>tới tấp, liên tiếp<\/b>. <b>続々と<\/b>: nối tiếp nhau dồn dập."}, {"s": "この問題の{解決|かいけつ}はわたしに（　）もらいたい。", "o": ["うけとって", "あずけて", "あずかって", "あたえて"], "a": 2, "ar": "預ける", "vi": "Tôi muốn anh giao việc giải quyết vấn đề này cho tôi.", "key": [{"w": "預ける", "r": "あずける", "hv": "DỰ", "m": "gửi, giao phó"}], "x": {"1": "うけとって (nhận): “muốn anh nhận cho tôi” sai hướng — người nhận là tôi.", "3": "あずかって (預かる: nhận giữ hộ): chủ thể là người nhận. “Muốn anh nhận giữ việc này cho tôi” ngược ý (tôi muốn tự giải quyết).", "4": "あたえて (cho, trao): dùng cho cơ hội, vật — “trao việc giải quyết” không tự nhiên bằng 預ける."}, "g": ["<b class=\"jp\">Vてもらいたい<\/b>: muốn người khác làm cho mình. Người giao là người nghe nên dùng 預ける."], "why": "“Muốn anh <b>giao phó<\/b> việc này cho tôi”. <b>〜を…に預ける<\/b>: giao gửi cho ai giữ, phó thác. Vてもらいたい: muốn người kia làm (giao cho mình)."}, {"s": "彼女はようやく実力を（　）できる機会を与えられた。", "o": ["発揮", "発行", "発表", "発射"], "a": 1, "ar": "はっき", "vi": "Cuối cùng cô ấy cũng được trao cơ hội phát huy thực lực.", "key": [{"w": "発揮", "r": "はっき", "hv": "PHÁT HUY", "m": "phát huy"}], "x": {"2": "発行 (phát hành): dùng cho báo, vé, tiền.", "3": "発表 (công bố, trình bày): 結果を発表する — không đi với 実力.", "4": "発射 (bắn, phóng): tên lửa, súng."}, "n": ["Xem Đề 13 câu 8, Đề 14 câu 18."], "why": "実力を〜 ＝ <b>phát huy<\/b> thực lực. <b>実力を発揮する<\/b> (đã gặp ở Đề 13 câu 8)."}, {"s": "その洋服は、あなたにはちょっと（　）ですが、{上品|じょうひん}ですね。", "o": ["率直", "高度", "妥当", "地味"], "a": 4, "ar": "じみ", "vi": "Bộ đồ đó hơi giản dị so với bạn, nhưng trông thanh lịch nhỉ.", "key": [{"w": "地味", "r": "じみ", "hv": "ĐỊA VỊ", "m": "giản dị, trầm"}], "x": {"1": "率直 (thẳng thắn): tả cách nói của người, không tả quần áo.", "2": "高度 (cao độ, trình độ cao): 高度な技術 — không tả quần áo.", "3": "妥当 (thỏa đáng): tả kết luận, giá cả — không tả quần áo."}, "n": ["↔ 派手 はで (sặc sỡ)."], "why": "Có ですが (nhưng) và 上品 (thanh lịch) → vế trước là nhận xét hơi tiêu cực: <b>hơi giản dị, kém nổi<\/b>. <b>地味<\/b> (じみ) ↔ 派手 はで."}, {"s": "学生は１度に５冊まで{貸|か}し{出|だ}しができる。（　）試験期間中は不可能だ。", "o": ["しかも", "だって", "そのうえ", "ただし"], "a": 4, "ar": "但し", "vi": "Sinh viên được mượn tối đa 5 cuốn mỗi lần. Tuy nhiên trong kỳ thi thì không được.", "key": [{"w": "ただし", "r": "ただし", "hv": "(但し)", "m": "tuy nhiên (thêm điều kiện, ngoại lệ)"}], "x": {"1": "しかも (hơn nữa): cộng thêm điều cùng chiều — ngoại lệ thì ngược chiều.", "2": "だって (vì — bào chữa): khẩu ngữ, không dùng để nêu ngoại lệ quy định.", "3": "そのうえ (thêm vào đó): cộng thêm cùng chiều, không phải ngoại lệ."}, "why": "Câu trước nêu quy định chung, câu sau nêu <b>ngoại lệ<\/b>. Liên từ <b>ただし<\/b>: tuy nhiên (điều kiện, ngoại lệ bổ sung)."}, {"s": "あの選手はけがのため、やむなく（　）した。", "o": ["移動", "引退", "完了", "失業"], "a": 2, "ar": "いんたい", "vi": "Vận động viên đó vì chấn thương đành phải giải nghệ.", "key": [{"w": "引退", "r": "いんたい", "hv": "DẪN THOÁI", "m": "giải nghệ"}], "x": {"1": "移動 (di chuyển): không mang nghĩa rời sự nghiệp.", "3": "完了 (hoàn tất): dùng cho công việc, thủ tục.", "4": "失業 (thất nghiệp): mất việc ngoài ý muốn vì công ty — không dùng cho vận động viên giải nghệ."}, "n": ["やむなく: bất đắc dĩ."], "why": "Vì chấn thương, đành <b>giải nghệ<\/b>. <b>引退する<\/b>: rút lui khỏi sự nghiệp (vận động viên, chính trị gia)."}], "sum": [{"h": "Liên từ (接続詞) — dạng hay ra trong 文脈規定", "tbl": {"head": ["Liên từ", "Quan hệ", "Ví dụ"], "rows": [["すなわち", "nói cách khác", "母の父、すなわち祖父"], ["ただし", "ngoại lệ, điều kiện", "5冊まで。ただし試験中は不可"], ["なお", "bổ sung thông tin", "なお、詳細は後日"], ["しかも / そのうえ", "hơn nữa (cùng chiều)", "安くて、しかもおいしい"], ["ところが", "thế nhưng (bất ngờ)", "晴れると思った。ところが雨だった"], ["なぜなら", "bởi vì (câu sau là lý do)", "なぜなら〜からだ"], ["それとも", "hay là (câu hỏi)", "コーヒー、それとも紅茶？"], ["したがって", "do đó", "したがって中止する"]]}}, {"h": "Câu chào hỏi theo tình huống", "tbl": {"head": ["Câu", "Khi nào dùng"], "rows": [["ご苦労さま", "ghi nhận công sức của người ngang hoặc dưới mình"], ["お疲れさま", "chào đồng nghiệp sau giờ làm (dùng được với cấp trên)"], ["お待ちどうさま", "xin lỗi vì đã để người khác chờ"], ["お気の毒に", "chia buồn"], ["ご遠慮なく", "mời, cho phép: cứ tự nhiên"], ["お大事に", "chúc người ốm mau khỏe"], ["おかげさまで", "nhờ trời / nhờ anh chị (trả lời hỏi thăm)"]]}}, {"h": "Nhóm từ trong đề", "li": ["<b>〜達<\/b>: 配達 (giao hàng), 発達 (phát triển), 伝達 (truyền đạt), 通達 (thông báo), 速達 そくたつ (chuyển phát nhanh).", "<b>手〜<\/b>: 手間 (công sức), 手段 (phương tiện), 手続き (thủ tục), 手入れ (chăm sóc), 手順 てじゅん (trình tự), 手軽 てがる (đơn giản).", "<b>発〜<\/b>: 発揮 (phát huy), 発行 (phát hành), 発表 (công bố), 発射 (phóng), 発明 (phát minh).", "<b>Láy chữ Hán 々<\/b>: 続々 (dồn dập), 着々 (từng bước), 点々 (rải rác), 別々 (riêng rẽ), 堂々 どうどう (đường hoàng), 徐々に じょじょに (dần dần)."]}, {"h": "Cặp động từ dễ nhầm", "li": ["<b>預ける<\/b> (gửi cho người khác giữ) ↔ <b>預かる<\/b> (nhận giữ hộ): 荷物を預ける / 荷物を預かる.", "<b>覚める<\/b> (tỉnh: 目が覚める) ↔ <b>冷める<\/b> (nguội: スープが冷める) — cùng đọc さめる.", "<b>敷く<\/b> (trải: ふとんを敷く) — <b>引く / 惹く / 弾く<\/b> (kéo / thu hút / đánh đàn).", "<b>地味<\/b> ↔ <b>派手<\/b>; <b>上品<\/b> ↔ <b>下品<\/b>; <b>貧しい<\/b> ↔ <b>豊か<\/b>."]}], "source": {"folder": "https://drive.google.com/drive/folders/1VHNmPItgIoowzn-MjsTwkhTLHeUpJ6Q5", "goc": "https://drive.google.com/file/d/15MNQ0ZUsiWys1AL5LDYOPlN4gjELl4o1/view", "chua": "https://drive.google.com/file/d/1t5-HZ-b0X0xDAP_vSstgOcO8qjjNm94T/view"}, "series": "DORA Nihongo · Đề 17 · Từ vựng N5–N2 trúng tủ"}, {"no": 18, "folderLabel": "Ngữ pháp", "cat": "Ngữ pháp", "file": "ĐỀ 24 - NGỮ PHÁP N2", "title": "Đề 18 · Ngữ pháp N2", "jp": "文法形式", "mondai": "<b>問題7<\/b> 次の文の（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。 Chọn mẫu ngữ pháp thích hợp nhất để điền vào chỗ trống.", "qs": [{"s": "客の{要望|ようぼう}に（　）、９時から店を開けることにした。", "o": ["つけて", "おうじて", "ひかくして", "じつげんして"], "a": 2, "ar": "〜に応じて", "vi": "Theo nguyện vọng của khách, chúng tôi quyết định mở cửa từ 9 giờ.", "key": [{"w": "〜に応じて", "r": "におうじて", "hv": "ỨNG", "m": "đáp ứng, tùy theo"}, {"w": "要望", "r": "ようぼう", "hv": "YẾU VỌNG", "m": "nguyện vọng"}], "x": {"1": "〜につけて (hễ… là): đi với động từ cảm nhận (見るにつけ) hoặc cặp. 要望につけて không có nghĩa.", "3": "比較して (so sánh): đi với と (〜と比較して), không với に; và câu không so sánh gì.", "4": "実現して (thực hiện): cần tân ngữ を (要望を実現して). Với に thì sai ngữ pháp."}, "n": ["収入に応じて (tùy thu nhập), 能力に応じて."], "why": "Mở cửa từ 9 giờ để <b>đáp ứng<\/b> nguyện vọng của khách. Mẫu <b>Nに応じて<\/b>: đáp ứng, tùy theo N. 要望に応じて là collocation chuẩn."}, {"s": "{選挙|せんきょ}の{結果|けっか}は{予測|よそく}に（　）、{野党|やとう}の{大敗|たいはい}であった。", "o": ["そって", "したがって", "際して", "反して"], "a": 4, "ar": "〜に反して", "vi": "Trái với dự đoán, kết quả bầu cử là thất bại nặng nề của phe đối lập.", "key": [{"w": "〜に反して", "r": "にはんして", "hv": "PHẢN", "m": "trái với"}, {"w": "野党", "r": "やとう", "hv": "DÃ ĐẢNG", "m": "đảng đối lập"}], "x": {"1": "〜にそって (theo, dọc theo): “theo dự đoán” → kết quả khớp, không phải điều bất ngờ như câu.", "2": "〜にしたがって (theo, tuân theo; càng… càng): cũng mang nghĩa “đúng như”, không phải trái ngược.", "3": "〜に際して (nhân dịp): đi với sự kiện (出発に際して), không với 予測."}, "n": ["Xem Đề 9 câu 9."], "why": "Dự đoán (có lẽ đảng cầm quyền thắng) nhưng kết quả là phe đối lập thua đậm — <b>trái với<\/b> dự đoán. Mẫu <b>予測に反して<\/b>."}, {"s": "殺人の{動機|どうき}は{金銭的|きんせんてき}トラブルではなく{憎|にく}しみに（　）。", "o": ["ともなわない", "かぎらない", "ほかならない", "かかわらない"], "a": 3, "ar": "〜にほかならない", "vi": "Động cơ gây án không phải mâu thuẫn tiền bạc mà chính là hận thù.", "key": [{"w": "〜にほかならない", "r": "にほかならない", "hv": "—", "m": "chính là"}, {"w": "動機", "r": "どうき", "hv": "ĐỘNG CƠ", "m": "động cơ"}], "x": {"1": "ともなわない (không đi kèm): “không đi kèm hận thù” — ngược ý câu.", "2": "〜とは限らない mới là “không hẳn”; にかぎらない không tạo nghĩa khẳng định “chính là”.", "4": "かかわらない (không liên quan): ngược nghĩa với việc hận thù là động cơ."}, "n": ["Xem Đề 9 câu 6."], "why": "Động cơ không phải tiền bạc mà <b>chính là<\/b> hận thù. Cấu trúc <b>AではなくBにほかならない<\/b>: không phải A mà chính là B."}, {"s": "この会社は社長一人の意見で動いていると（　）。", "o": ["言えるはずはない", "言えないはずだ", "言えないこともない", "言えることはない"], "a": 3, "ar": "〜ないこともない", "vi": "Nói công ty này vận hành theo ý kiến của mỗi giám đốc cũng không hẳn là sai.", "key": [{"w": "〜ないこともない", "r": "ないこともない", "hv": "—", "m": "không phải là không (khẳng định dè dặt)"}], "x": {"1": "言えるはずはない (không lý nào nói được): phủ định mạnh — trái với giọng dè dặt.", "2": "言えないはずだ (lẽ ra không thể nói): phán đoán phủ định, không phải khẳng định yếu.", "4": "言えることはない (không có chuyện nói được): phủ định, không tự nhiên."}, "n": ["Xem Đề 9 câu 5."], "why": "Khẳng định dè dặt: nói công ty chạy theo ý một người <b>cũng không phải là không đúng<\/b>. Mẫu <b>〜ないこともない<\/b>."}, {"s": "歩道（　）季節のきれいな{草花|くさばな}が{植|う}えられている。", "o": ["によって", "にそって", "にわたって", "について"], "a": 2, "ar": "〜に沿って", "vi": "Dọc vỉa hè có trồng các loài hoa theo mùa rất đẹp.", "key": [{"w": "〜に沿って", "r": "にそって", "hv": "DUYÊN", "m": "dọc theo; theo (kế hoạch)"}], "x": {"1": "〜によって (bởi, tùy theo): “trồng bởi vỉa hè” vô nghĩa.", "3": "〜にわたって (suốt, trải khắp): đi với khoảng thời gian/phạm vi rộng (全国にわたって), không với 歩道 cụ thể.", "4": "〜について (về): chỉ chủ đề nói/nghĩ, không chỉ vị trí."}, "n": ["Danh từ: 〜沿い (Đề 7 câu 9)."], "why": "Hoa được trồng <b>dọc theo<\/b> vỉa hè. Mẫu <b>Nにそって<\/b> (沿って): dọc theo đường, sông."}, {"s": "あれだけ努力した（　）、結局失敗に終わってしまった。", "o": ["にもかかわらず", "にしたら", "に際して", "にもとづき"], "a": 1, "ar": "〜にもかかわらず", "vi": "Mặc dù đã nỗ lực đến thế, rốt cuộc vẫn thất bại.", "key": [{"w": "〜にもかかわらず", "r": "にもかかわらず", "hv": "—", "m": "mặc dù"}], "x": {"2": "〜にしたら (đối với ai mà nói): đi với danh từ chỉ người (親にしたら). Không đi sau 努力した.", "3": "〜に際して (nhân dịp): đi với danh từ sự kiện, không sau động từ thể た.", "4": "〜にもとづき (dựa trên): cần danh từ làm căn cứ (データにもとづき)."}, "why": "Nỗ lực đến thế <b>mà vẫn<\/b> thất bại. Mẫu <b>Vた＋にもかかわらず<\/b>: mặc dù."}, {"s": "{短距離|たんきょり}（　）、{県内|けんない}には彼に{匹敵|ひってき}する選手は見当たらない。", "o": ["によると", "にとっては", "に対して", "にかけては"], "a": 4, "ar": "〜にかけては", "vi": "Riêng về chạy cự ly ngắn, trong tỉnh không ai sánh được với cậu ấy.", "key": [{"w": "〜にかけては", "r": "にかけては", "hv": "—", "m": "riêng về (năng lực), thì không ai bằng"}, {"w": "匹敵", "r": "ひってき", "hv": "THẤT ĐỊCH", "m": "sánh ngang"}], "x": {"1": "〜によると (theo nguồn tin): vế sau phải là thông tin nghe được (〜そうだ). Không hợp.", "2": "〜にとっては (đối với ai): chủ thể phải là người chịu tác động. 短距離 không phải người.", "3": "〜に対して (đối với; trái lại): không có nghĩa “riêng về năng lực”."}, "n": ["Khác 〜から〜にかけて (Đề 3 câu 12)."], "why": "Riêng <b>về mảng<\/b> chạy cự ly ngắn thì không ai bằng. Mẫu <b>Nにかけては<\/b>: về (năng lực) thì không ai sánh bằng — vế sau là khen, so sánh hơn."}, {"s": "店の{改装|かいそう}に（　）工事のため、３日間休業します。", "o": ["そった", "ともなう", "して", "なった"], "a": 2, "ar": "N1に伴うN2", "vi": "Vì thi công sửa sang cửa hàng, chúng tôi nghỉ 3 ngày.", "key": [{"w": "〜に伴う", "r": "にともなう", "hv": "BẠN", "m": "đi kèm với"}], "x": {"1": "〜にそった (theo, dọc theo): 方針にそった計画 — “thi công theo việc sửa sang” không tự nhiên.", "3": "〜にして: không bổ nghĩa được cho danh từ 工事.", "4": "〜になった (trở thành): “thi công đã trở thành sửa sang” vô nghĩa."}, "n": ["Xem Đề 9 câu 7 (に伴って)."], "why": "Thi công <b>đi kèm theo<\/b> việc sửa sang cửa hàng. Mẫu <b>N1に伴うN2<\/b>: N2 đi kèm với N1 (dạng bổ nghĩa danh từ của 〜に伴って)."}, {"s": "{山本|やまもと}さんはあいさつ（　）いきなり用件を切り出した。", "o": ["しても", "しずで", "ぬきで", "ぬいて"], "a": 3, "ar": "N抜きで", "vi": "Anh Yamamoto bỏ qua chào hỏi, vào thẳng việc chính.", "key": [{"w": "〜抜きで", "r": "ぬきで", "hv": "BẠT", "m": "không có, bỏ qua"}, {"w": "切り出す", "r": "きりだす", "hv": "THIẾT XUẤT", "m": "mở lời"}], "x": {"1": "しても: “dù chào hỏi” rồi vào thẳng việc — mâu thuẫn với いきなり (đột ngột).", "2": "しずで: không có dạng này (dạng đúng là せずに / しないで).", "4": "ぬいて (rút ra): 抜く là động từ “rút”; nghĩa “bỏ qua” phải là 抜きで / 抜きにして."}, "n": ["Xem Đề 9 câu 2."], "why": "<b>Bỏ qua<\/b> chào hỏi, vào thẳng việc chính. Mẫu <b>N抜きで<\/b>: không có N (= Nは抜きにして ở Đề 9)."}, {"s": "あの人に（　）、そんなことはしないでしょう。", "o": ["ともなって", "かぎって", "つれて", "よって"], "a": 2, "ar": "〜に限って", "vi": "Riêng người đó thì chắc chắn không làm chuyện như vậy đâu.", "key": [{"w": "〜に限って", "r": "にかぎって", "hv": "HẠN", "m": "riêng… thì (tin tưởng); đúng lúc… thì lại"}], "x": {"1": "〜にともなって (cùng với): cần một sự thay đổi kéo theo, không đi với người.", "3": "〜につれて (càng… càng): đi với sự biến đổi (時間がたつにつれて), không với người.", "4": "〜によって (bởi, tùy): “tùy người đó mà không làm” không hợp ý tin tưởng."}, "n": ["Nghĩa khác: 急いでいるときに限って電車が遅れる."], "why": "Thể hiện <b>niềm tin đặc biệt<\/b> vào riêng người đó: riêng người ấy thì chắc chắn không làm thế. Mẫu <b>Nに限って〜ない<\/b>."}, {"s": "私は英語ができる（　）、まだろくに読むこともできません。", "o": ["ばかりか", "どころか", "ものなら", "ことなく"], "a": 2, "ar": "〜どころか", "vi": "Nói gì đến giỏi tiếng Anh, đến đọc cho ra hồn tôi còn chưa làm được.", "key": [{"w": "〜どころか", "r": "どころか", "hv": "—", "m": "nói gì đến…, trái lại"}], "x": {"1": "〜ばかりか (không chỉ… mà còn): hai vế cùng chiều (giỏi tiếng Anh, còn giỏi cả…). Câu này ngược chiều.", "3": "〜ものなら (nếu có thể): できる＋ものなら dùng cho thách thức (できるものならやってみろ). Không hợp.", "4": "〜ことなく (mà không): “biết tiếng Anh mà không đọc được” không đúng cấu trúc ý."}, "n": ["ろくに〜ない: không… ra hồn."], "why": "Nói gì đến giỏi, <b>ngay cả<\/b> đọc ra hồn còn không được — vế sau phủ định mạnh vế trước. Mẫu <b>〜どころか<\/b>."}, {"s": "経済が{発展|はってん}するに（　）、社会の{矛盾|むじゅん}も拡大してきた。", "o": ["いたって", "つれて", "さいして", "しても"], "a": 2, "ar": "〜につれて", "vi": "Kinh tế càng phát triển thì mâu thuẫn xã hội cũng ngày càng lớn.", "key": [{"w": "〜につれて", "r": "につれて", "hv": "—", "m": "cùng với (một bên thay đổi kéo theo bên kia)"}, {"w": "矛盾", "r": "むじゅん", "hv": "MÂU THUẪN", "m": "mâu thuẫn"}], "x": {"1": "〜にいたって (đến mức, đến khi): nhấn mạnh tình huống cực đoan, không nói sự biến đổi song song.", "3": "〜に際して (nhân dịp): đi với danh từ sự kiện, không với 発展する.", "4": "発展するにしても (dù có phát triển đi nữa): nghĩa nhượng bộ, không diễn tả hai thay đổi cùng tăng như câu này."}, "n": ["Đồng nghĩa: 〜に伴って, 〜とともに."], "why": "Kinh tế phát triển <b>kéo theo<\/b> mâu thuẫn xã hội tăng — hai thay đổi cùng diễn tiến. Mẫu <b>Vる＋につれて<\/b>."}], "sum": [{"h": "Biến đổi song song: につれて / に伴って / にしたがって / とともに", "tbl": {"head": ["Mẫu", "Nối", "Sắc thái"], "rows": [["〜につれて", "Vる / N", "tự nhiên, dần dần; vế sau không phải ý chí"], ["〜に伴って / に伴うN", "Vる / N", "văn viết, sự kiện lớn kéo theo"], ["〜にしたがって", "Vる / N", "theo; vế sau có thể là ý chí"], ["〜とともに", "Vる / N", "cùng với (cả nghĩa “cùng nhau”)"], ["〜に応じて", "N", "đáp ứng, tùy theo (thu nhập, yêu cầu)"]]}}, {"h": "Nhóm “Nに＋động từ” trong đề (ôn cùng Đề 9)", "tbl": {"head": ["Mẫu", "Nghĩa", "Ví dụ"], "rows": [["〜に反して", "trái với", "予想に反して"], ["〜にそって", "dọc theo; theo", "川にそって, 方針にそって"], ["〜にかけては", "riêng về (năng lực)", "料理にかけては誰にも負けない"], ["〜に限って", "riêng (tin tưởng); đúng lúc lại", "うちの子に限って"], ["〜にほかならない", "chính là", "努力の結果にほかならない"], ["〜にもかかわらず", "mặc dù", "雨にもかかわらず"]]}}, {"h": "Không chỉ / trái lại", "li": ["<b>〜どころか<\/b>: nói gì đến A, ngay cả B (thấp hơn) cũng không; hoặc trái lại hẳn: 休むどころか、ますます忙しい.", "<b>〜ばかりか / 〜ばかりでなく / 〜のみならず<\/b>: không chỉ… mà còn (cùng chiều).", "<b>〜はもちろん / 〜はもとより<\/b>: A đương nhiên, B cũng vậy.", "Trạng từ đi với phủ định: ろくに〜ない (không… ra hồn), ろくな〜ない."]}, {"h": "Mẹo phân biệt nhanh", "li": ["Câu có 予想・予測・期待 → nghĩ ngay tới <b>に反して<\/b>.", "Câu có 道・川・歩道・線路 → <b>にそって<\/b>; có 方針・計画 → <b>にそって / に基づいて<\/b>.", "Câu khen năng lực “không ai bằng” → <b>にかけては<\/b>.", "Câu “riêng người đó thì không thể” → <b>に限って〜ない<\/b>."]}], "source": {"folder": "https://drive.google.com/drive/folders/14tmSQtWaGoqwDOaqvU4el2STikUgH-zp", "goc": "https://drive.google.com/file/d/1L4f6fikUuAsHE6vrJGzVTPq4ekSHiSQA/view", "chua": "https://drive.google.com/file/d/1nZ-PSLvc3Z1w0uts3ZY8d7U0Vl-Qce_k/view"}, "series": "DORA Nihongo · Đề 18 · Ngữ pháp N5–N2 trúng tủ"}, {"no": 19, "folderLabel": "Kanji", "cat": "Kanji", "file": "ĐỀ 25 - KANJI N2", "title": "Đề 19 · Kanji N2", "jp": "漢字読み", "mondai": "<b>問題1<\/b> ＿＿の言葉の読み方として最もよいものを、1・2・3・4から一つ選びなさい。 Chọn cách đọc đúng nhất cho từ được gạch chân.", "qs": [{"s": "この携帯電話は_操作_が簡単だ。", "o": ["ぞうさく", "ぞうさ", "そうさく", "そうさ"], "a": 4, "ar": "操作", "vi": "Điện thoại này thao tác rất đơn giản.", "key": [{"w": "操作", "r": "そうさ", "hv": "THAO TÁC", "m": "thao tác, vận hành"}], "x": {"1": "ぞうさく: không có từ này. 操 không đục thành ぞう, và 作 ở đây đọc さ.", "2": "ぞうさ là 造作 (công sức, phiền hà — ít gặp). Chữ đầu khác (造), không phải 操.", "3": "そうさく là 創作 (sáng tác) / 捜索 (lục soát). 作 trong 操作 đọc さ, không phải さく."}, "n": ["作 đọc さ trong 操作, 動作 どうさ; đọc さく trong 作品, 作文."], "why": "操 đọc <b>そう<\/b> (âm trong), 作 trong từ này đọc <b>さ<\/b> ＝ <b>そうさ<\/b>: thao tác, vận hành. Ngữ cảnh 携帯電話の操作が簡単 khớp nghĩa."}, {"s": "彼のスピーチはその場では_適切_でなかった。", "o": ["てっせつ", "てききり", "てきせつ", "てっきり"], "a": 3, "ar": "適切", "vi": "Bài phát biểu của anh ấy không phù hợp với hoàn cảnh lúc đó.", "key": [{"w": "適切", "r": "てきせつ", "hv": "THÍCH THIẾT", "m": "thích hợp"}], "x": {"1": "てっせつ: không có từ này; không có âm ngắt.", "2": "てききり: 切 trong từ Hán đọc せつ, không đọc Kun きり.", "4": "てっきり là phó từ (cứ ngỡ chắc là). Không phải cách đọc của 適切."}, "n": ["切 せつ: 大切, 親切. Trái nghĩa: 不適切."], "why": "適 đọc <b>てき<\/b>, 切 đọc <b>せつ<\/b> ＝ <b>てきせつ<\/b>: thích hợp. Ngữ cảnh その場では適切でなかった (không phù hợp với hoàn cảnh) khớp nghĩa. Không có âm ngắt vì 切 ở đây là せつ."}, {"s": "{佐藤|さとう}さんはネズミの行動を_観察_した。", "o": ["けんさつ", "けんさい", "かんさい", "かんさつ"], "a": 4, "ar": "観察", "vi": "Anh Sato quan sát hành vi của chuột.", "key": [{"w": "観察", "r": "かんさつ", "hv": "QUAN SÁT", "m": "quan sát"}], "x": {"1": "けんさつ là 検察 (công tố). 観 không đọc けん.", "2": "けんさい: không có từ này.", "3": "かんさい là 関西 (vùng Kansai). 察 đọc さつ, không phải さい."}, "n": ["察 さつ: 警察, 察する. Đồng âm: 監察 (giám sát)."], "why": "観 đọc <b>かん<\/b>, 察 đọc <b>さつ<\/b> ＝ <b>かんさつ<\/b>: quan sát. Ngữ cảnh ネズミの行動を観察した khớp nghĩa."}, {"s": "_医療_の{発達|はったつ}により{乳幼児|にゅうようじ}の{死亡率|しぼうりつ}がぐっと{減|へ}った。", "o": ["ちりゅう", "ちりょう", "いりょう", "いりゅう"], "a": 3, "ar": "医療", "vi": "Nhờ y tế phát triển mà tỷ lệ tử vong ở trẻ nhỏ giảm mạnh.", "key": [{"w": "医療", "r": "いりょう", "hv": "Y LIỆU", "m": "y tế, chữa trị"}], "x": {"1": "ちりゅう: không có từ này.", "2": "ちりょう là 治療 (điều trị). 療 đúng nhưng 医 đọc い, không phải ち.", "4": "いりゅう: 療 đọc りょう, không phải りゅう."}, "n": ["療 りょう: 治療, 療養. ぐっと: mạnh, rõ rệt."], "why": "医 đọc <b>い<\/b>, 療 đọc <b>りょう<\/b> ＝ <b>いりょう<\/b>: y tế. Ngữ cảnh 医療の発達 (y tế phát triển) làm giảm tỷ lệ tử vong khớp nghĩa."}, {"s": "どちらのチームが強いかで兄と_議論_になった。", "o": ["ろんぎ", "いろん", "ぎろん", "ろんい"], "a": 3, "ar": "議論", "vi": "Tôi với anh trai cãi nhau xem đội nào mạnh hơn.", "key": [{"w": "議論", "r": "ぎろん", "hv": "NGHỊ LUẬN", "m": "tranh luận"}], "x": {"1": "ろんぎ là 論議 (bàn luận) — chữ bị đảo thứ tự, không phải 議論.", "2": "いろん là 異論 (ý kiến khác). Chữ đầu khác.", "4": "ろんい: không có từ này."}, "n": ["議 ぎ: 会議, 議員. Xem Đề 7 câu 3 (〜論)."], "why": "議 đọc <b>ぎ<\/b>, 論 đọc <b>ろん<\/b> ＝ <b>ぎろん<\/b>: tranh luận. Ngữ cảnh đội nào mạnh hơn → 議論になった khớp nghĩa."}, {"s": "{震災|しんさい}以後、{燃料輸入額|ねんりょうゆにゅうがく}は約10_兆_円増加した。", "o": ["ちょ", "ちゅう", "ちょう", "ちゅ"], "a": 3, "ar": "兆", "vi": "Kể từ sau thảm họa động đất, kim ngạch nhập khẩu nhiên liệu tăng khoảng 10 nghìn tỷ yên.", "key": [{"w": "兆", "r": "ちょう", "hv": "TRIỆU", "m": "nghìn tỷ (10¹²)"}], "x": {"1": "ちょ: thiếu trường âm.", "2": "ちゅう: là âm của 中, 虫 — không phải 兆.", "4": "ちゅ: không có âm này cho 兆."}, "n": ["万 (10⁴) → 億 おく (10⁸) → 兆 (10¹²). Kun: 兆し きざし (dấu hiệu)."], "why": "兆 đọc <b>ちょう<\/b>: nghìn tỷ (10^12). Ngữ cảnh 約10兆円 (khoảng 10 nghìn tỷ yên) khớp nghĩa. Kun: 兆し きざし (điềm báo)."}, {"s": "彼らは{双子|ふたご}だが、性格はずいぶん_異なって_いる。", "o": ["かさなって", "つらなって", "なくなって", "ことなって"], "a": 4, "ar": "異なる", "vi": "Họ là anh em sinh đôi nhưng tính cách rất khác nhau.", "key": [{"w": "異なる", "r": "ことなる", "hv": "DỊ", "m": "khác"}], "x": {"1": "かさなって là 重なる (chồng lên, trùng). Chữ khác; ngược nghĩa.", "2": "つらなって là 連なる (nối tiếp thành hàng). Chữ khác.", "3": "なくなって (mất đi): không phải cách đọc của 異."}, "n": ["異常 (câu 18), 異文化. Xem Đề 16 câu 20 (ことなった là phương án nhiễu)."], "why": "異なる đọc <b>ことなる<\/b>: khác nhau. Ngữ cảnh 双子だが性格は〜 (sinh đôi nhưng tính cách khác) khớp nghĩa. Âm On: い (異常, 異論)."}, {"s": "彼女はグリーンの_靴_を{履|は}いていたと思います。", "o": ["かさ", "ふく", "かばん", "くつ"], "a": 4, "ar": "靴", "vi": "Tôi nghĩ cô ấy đi đôi giày màu xanh lá.", "key": [{"w": "靴", "r": "くつ", "hv": "NGOA", "m": "giày"}], "x": {"1": "かさ là 傘 (ô). Ô thì 差す, không 履く.", "2": "ふく là 服 (quần áo). Quần áo thì 着る.", "3": "かばん là 鞄 (cặp). Cặp thì 持つ."}, "n": ["履く (giày, quần) / 着る (áo) / かぶる (mũ)."], "why": "靴 âm Kun <b>くつ<\/b>: giày. Động từ 履く (はく: mang giày) xác nhận đáp án."}, {"s": "事故は_単純_な計算ミスが原因だった。", "o": ["かんだん", "たんじゅん", "だんじゅん", "かんたん"], "a": 2, "ar": "単純", "vi": "Nguyên nhân tai nạn là một lỗi tính toán đơn giản.", "key": [{"w": "単純", "r": "たんじゅん", "hv": "ĐƠN THUẦN", "m": "đơn giản, đơn thuần"}], "x": {"1": "かんだん: không có từ này. 単 đọc たん.", "3": "だんじゅん: 単 không đục thành だん.", "4": "かんたん là 簡単 (dễ). Nghĩa gần nhưng chữ khác — bẫy vì 単 là chữ thứ hai của 簡単."}, "n": ["純 じゅん: 純粋 (Đề 11 câu 11). ↔ 複雑."], "why": "単 đọc <b>たん<\/b>, 純 đọc <b>じゅん<\/b> ＝ <b>たんじゅん<\/b>: đơn giản, đơn thuần. Ngữ cảnh 単純な計算ミス khớp nghĩa."}, {"s": "火事で亡くなった人の{身元|みもと}の_調査_はあまり進んでいない。", "o": ["けんさ", "しんさ", "こうさ", "ちょうさ"], "a": 4, "ar": "調査", "vi": "Việc điều tra danh tính người chết trong vụ cháy chưa tiến triển nhiều.", "key": [{"w": "調査", "r": "ちょうさ", "hv": "ĐIỀU TRA", "m": "điều tra"}], "x": {"1": "けんさ là 検査 (kiểm tra). 査 đúng nhưng 調 đọc ちょう.", "2": "しんさ là 審査 (thẩm tra). Chữ đầu khác.", "3": "こうさ là 交差 (giao nhau) / 考査. Chữ đầu khác."}, "why": "調 đọc <b>ちょう<\/b>, 査 đọc <b>さ<\/b> ＝ <b>ちょうさ<\/b>: điều tra. Ngữ cảnh 身元の調査 (điều tra danh tính) khớp nghĩa."}, {"s": "二度と戦争という名の_悲劇_を繰り返してはいけない。", "o": ["きげき", "しょうげき", "こうげき", "ひげき"], "a": 4, "ar": "悲劇", "vi": "Tuyệt đối không được lặp lại bi kịch mang tên chiến tranh.", "key": [{"w": "悲劇", "r": "ひげき", "hv": "BI KỊCH", "m": "bi kịch"}], "x": {"1": "きげき là 喜劇 (hài kịch). Trái nghĩa — 悲 đọc ひ.", "2": "しょうげき là 衝撃 (cú sốc). Khác chữ (撃 cũng đọc げき).", "3": "こうげき là 攻撃 (tấn công). Khác chữ."}, "n": ["劇 げき: 演劇 (Đề 11 câu 17)."], "why": "悲 đọc <b>ひ<\/b> (Kun: 悲しい), 劇 đọc <b>げき<\/b> ＝ <b>ひげき<\/b>: bi kịch. Ngữ cảnh 戦争という名の悲劇 khớp nghĩa."}, {"s": "工場で大きな_爆発_があったが、幸いけが人は出なかった。", "o": ["ばくほつ", "ぼくほつ", "ぼくはつ", "ばくはつ"], "a": 4, "ar": "爆発", "vi": "Nhà máy xảy ra vụ nổ lớn nhưng may không ai bị thương.", "key": [{"w": "爆発", "r": "ばくはつ", "hv": "BỘC PHÁT", "m": "vụ nổ, bùng nổ"}], "x": {"1": "ばくほつ: 発 đọc はつ / ほつ (ほつ chỉ ở 発作 ほっさ, 発端 ほったん), không dùng trong 爆発.", "2": "ぼくほつ: 爆 đọc ばく, không phải ぼく.", "3": "ぼくはつ: 爆 đọc ばく."}, "n": ["発 はつ (xuất phát), ほつ chỉ trong 発作 ほっさ, 発端 ほったん."], "why": "爆 đọc <b>ばく<\/b>, 発 đọc <b>はつ<\/b> ＝ <b>ばくはつ<\/b>: vụ nổ. (Không có âm ngắt vì ばく＋は giữ nguyên trong từ này.)"}, {"s": "今日の仕事はこれで_完了_だ。", "o": ["かんり", "しゅうりょう", "しゅうり", "かんりょう"], "a": 4, "ar": "完了", "vi": "Việc hôm nay đến đây là xong.", "key": [{"w": "完了", "r": "かんりょう", "hv": "HOÀN LIỄU", "m": "hoàn tất"}], "x": {"1": "かんり là 管理 (quản lý). 了 đọc りょう.", "2": "しゅうりょう là 終了 (kết thúc). Nghĩa gần nhưng chữ đầu khác (終).", "3": "しゅうり là 修理 (sửa chữa). Sai cả hai."}, "why": "完 đọc <b>かん<\/b>, 了 đọc <b>りょう<\/b> ＝ <b>かんりょう<\/b>: hoàn tất. Ngữ cảnh 今日の仕事はこれで完了 khớp nghĩa."}, {"s": "美しい景色を見ていると、_寿命_が{延|の}びるようだ。", "o": ["じゅみょう", "じゅうめい", "じゅうみょう", "じゅめい"], "a": 1, "ar": "寿命", "vi": "Ngắm cảnh đẹp như thể tuổi thọ được kéo dài.", "key": [{"w": "寿命", "r": "じゅみょう", "hv": "THỌ MỆNH", "m": "tuổi thọ"}], "x": {"2": "じゅうめい: thừa trường âm và 命 đọc みょう ở đây.", "3": "じゅうみょう: thừa trường âm — 寿 đọc じゅ.", "4": "じゅめい: 命 trong 寿命 đọc みょう (như 一生懸命 いっしょうけんめい), không phải めい."}, "n": ["命 đọc みょう ở 寿命, đọc めい ở 生命, 命令. 平均寿命."], "why": "寿 đọc <b>じゅ<\/b> (ngắn), 命 trong từ này đọc <b>みょう<\/b> ＝ <b>じゅみょう<\/b>: tuổi thọ. Ngữ cảnh 寿命が延びる (kéo dài tuổi thọ) khớp nghĩa."}, {"s": "{勤務先|きんむさき}では{顧客|こきゃく}の{苦情|くじょう}の_処理_を担当している。", "o": ["そり", "しょり", "そち", "しゅち"], "a": 2, "ar": "処理", "vi": "Ở chỗ làm, tôi phụ trách xử lý khiếu nại của khách hàng.", "key": [{"w": "処理", "r": "しょり", "hv": "XỬ LÝ", "m": "xử lý"}], "x": {"1": "そり: 処 đọc しょ, không phải そ.", "3": "そち là 措置 (biện pháp). Khác chữ.", "4": "しゅち: không có từ này."}, "n": ["Xem Đề 1 câu 2. 苦情処理."], "why": "処 đọc <b>しょ<\/b>, 理 đọc <b>り<\/b> ＝ <b>しょり<\/b>: xử lý (đã gặp ở Đề 1 câu 2). Ngữ cảnh 苦情の処理 (xử lý khiếu nại) khớp nghĩa."}, {"s": "弟は自分の間違いをなかなか_認めない_。", "o": ["みとめない", "ふくめない", "すすめない", "つとめない"], "a": 1, "ar": "認める", "vi": "Em trai tôi mãi không chịu nhận lỗi.", "key": [{"w": "認める", "r": "みとめる", "hv": "NHẬN", "m": "thừa nhận, công nhận"}], "x": {"2": "ふくめない là 含める (tính gộp vào). Chữ khác.", "3": "すすめない là 進める / 勧める. Chữ khác.", "4": "つとめない là 勤める / 努める. Chữ khác."}, "n": ["Xem Đề 14 câu 14."], "why": "認める đọc <b>みとめる<\/b>: thừa nhận. Ngữ cảnh 自分の間違いを認めない (không nhận lỗi) khớp nghĩa. Âm On: 確認 かくにん."}, {"s": "わが国は{諸外国|しょがいこく}と_貿易_を行っている。", "o": ["ぼうえき", "もうえき", "ぼういき", "もういき"], "a": 1, "ar": "貿易", "vi": "Nước ta có quan hệ thương mại với các nước.", "key": [{"w": "貿易", "r": "ぼうえき", "hv": "MẬU DỊCH", "m": "thương mại quốc tế"}], "x": {"2": "もうえき: 貿 không đọc もう.", "3": "ぼういき: 易 trong 貿易 đọc えき, không phải いき.", "4": "もういき: sai cả hai chữ."}, "n": ["易 えき (貿易) / い (簡易, 容易 ようい, 易しい やさしい)."], "why": "貿 đọc <b>ぼう<\/b>, 易 đọc <b>えき<\/b> ＝ <b>ぼうえき<\/b>: thương mại quốc tế. Ngữ cảnh 諸外国と貿易を行う khớp nghĩa. (易 còn đọc い trong 容易 ようい, やさしい.)"}, {"s": "このような{状況|じょうきょう}は私にはきわめて_異常_に思える。", "o": ["いじょう", "ひじょう", "こしょう", "ししょう"], "a": 1, "ar": "異常", "vi": "Tình huống như thế này với tôi có vẻ vô cùng bất thường.", "key": [{"w": "異常", "r": "いじょう", "hv": "DỊ THƯỜNG", "m": "bất thường"}], "x": {"2": "ひじょう là 非常 (khẩn cấp; cực kỳ). Chữ đầu khác.", "3": "こしょう là 故障 (hỏng hóc). Sai cả hai chữ.", "4": "ししょう là 支障 (trở ngại). Sai cả hai chữ."}, "n": ["Đồng âm: 以上, 異状 (Đề 17 câu 8)."], "why": "異 đọc <b>い<\/b>, 常 đọc <b>じょう<\/b> ＝ <b>いじょう<\/b>: bất thường. Ngữ cảnh きわめて異常に思える khớp nghĩa."}, {"s": "あの仕事は、たいてい単純な_作業_の繰り返しだと聞いた。", "o": ["さくぎょう", "さぎょ", "さくぎょ", "さぎょう"], "a": 4, "ar": "作業", "vi": "Nghe nói công việc đó phần lớn là lặp lại các thao tác đơn giản.", "key": [{"w": "作業", "r": "さぎょう", "hv": "TÁC NGHIỆP", "m": "công việc, thao tác"}], "x": {"1": "さくぎょう: 作 trong 作業 đọc さ, không phải さく.", "2": "さぎょ: thiếu trường âm ở 業.", "3": "さくぎょ: sai cả hai chỗ."}, "n": ["作 đọc さ (câu 1). 業 ぎょう: 授業, 工業."], "why": "作 trong từ này đọc <b>さ<\/b>, 業 đọc <b>ぎょう<\/b> (có trường âm) ＝ <b>さぎょう<\/b>: thao tác, công việc. Giống 操作 そうさ ở câu 1: 作 đọc さ."}, {"s": "くつの_泥_を落としてから入室してください。", "o": ["とち", "つち", "すな", "どろ"], "a": 4, "ar": "泥", "vi": "Hãy giũ sạch bùn ở giày rồi mới vào phòng.", "key": [{"w": "泥", "r": "どろ", "hv": "NÊ", "m": "bùn"}], "x": {"1": "とち là 土地 (đất đai). Không phải cách đọc của 泥.", "2": "つち là 土 (đất). Chữ khác.", "3": "すな là 砂 (cát). Chữ khác."}, "n": ["泥棒 どろぼう: kẻ trộm. 泥だらけ: lấm lem bùn."], "why": "泥 âm Kun <b>どろ<\/b>: bùn. Ngữ cảnh くつの泥を落とす (giũ bùn ở giày) khớp nghĩa. Âm On: でい (泥酔 でいすい)."}], "sum": [{"h": "Chữ 作 có ba âm On — điểm nóng của đề", "tbl": {"head": ["Âm", "Từ", "Nghĩa"], "rows": [["さ", "操作 そうさ, 作業 さぎょう, 動作 どうさ, 作法 さほう", "thao tác, động tác"], ["さく", "作品 さくひん, 創作 そうさく, 作文, 名作", "tác phẩm, sáng tác"], ["さっ", "作家 さっか, 作曲 さっきょく", "âm ngắt trước か"]]}}, {"h": "Chữ nhiều âm khác trong đề", "li": ["<b>命<\/b>: めい (生命, 命令) / みょう (寿命, 一生懸命) / いのち.", "<b>易<\/b>: えき (貿易) / い (容易, 安易) / やさ(しい).", "<b>発<\/b>: はつ (爆発, 発表) / ほつ (発作 ほっさ, 発端 ほったん).", "<b>異<\/b>: い (異常, 異論) / こと(なる). <b>兆<\/b>: ちょう (一兆) / きざ(し)."]}, {"h": "Cặp từ dễ nhầm", "tbl": {"head": ["Cặp", "Phân biệt"], "rows": [["完了 / 終了", "hoàn tất (việc làm xong) / kết thúc (thời gian, sự kiện)"], ["議論 / 論議", "tranh luận / bàn luận (gần nghĩa, đảo chữ)"], ["悲劇 / 喜劇", "bi kịch / hài kịch"], ["異常 / 非常", "bất thường / khẩn cấp, cực kỳ"], ["医療 / 治療", "y tế (hệ thống) / điều trị (cho một người)"], ["単純 / 簡単", "đơn thuần, đơn giản (bản chất) / dễ làm"], ["調査 / 検査 / 審査", "điều tra / kiểm tra / thẩm tra"]]}}, {"h": "Số lớn trong tiếng Nhật", "li": ["万 まん (10^4) → 億 おく (10^8) → 兆 ちょう (10^12) → 京 けい (10^16).", "1 tỷ ＝ 10億 じゅうおく; 1 nghìn tỷ ＝ 1兆 いっちょう; 100 triệu ＝ 1億 いちおく.", "Biến âm: 一兆 いっちょう, 八兆 はっちょう, 十兆 じゅっちょう."]}], "source": {"folder": "https://drive.google.com/drive/folders/1qEkMB-7JDGOCR4cIfV4xZQk7K_SgHFO5", "goc": "https://drive.google.com/file/d/1jcXk-VRs1h9ZXs1WFx_jodGrfPh0jVpY/view", "chua": "https://drive.google.com/file/d/1AEgBPOODlX_fQpy3Fun2gitCOkes3VPH/view"}, "series": "DORA Nihongo · Đề 19 · Kanji N5–N2 trúng tủ"}, {"no": 20, "folderLabel": "Kanji", "cat": "Từ vựng", "file": "ĐỀ 26 - TỪ VỰNG N2", "title": "Đề 20 · Từ vựng N2", "jp": "言い換え類義", "mondai": "<b>問題5<\/b> ＿＿の言葉に意味が最も近いものを、1・2・3・4から一つ選びなさい。 Chọn từ/cụm từ gần nghĩa nhất với phần gạch chân.", "notice": "Thư mục trên Drive tên là “Đề 20 · Kanji”, nhưng file bên trong là <b>ĐỀ 26 · Từ vựng N2<\/b>. Trang này theo đúng nội dung file.", "qs": [{"s": "それは_思いがけない_ことだった。", "o": ["不思議な", "意外な", "悲しい", "恋しい"], "a": 2, "ar": "いがいな", "vi": "Đó là chuyện hoàn toàn bất ngờ.", "key": [{"w": "思いがけない", "r": "おもいがけない", "hv": "—", "m": "không ngờ tới"}, {"w": "意外", "r": "いがい", "hv": "Ý NGOẠI", "m": "bất ngờ, ngoài dự đoán"}], "x": {"1": "不思議な (kỳ lạ, khó giải thích): là điều không hiểu nổi, không nhất thiết là điều không ngờ tới.", "3": "悲しい (buồn): chuyện bất ngờ có thể vui hoặc buồn — đổi nghĩa.", "4": "恋しい (nhớ nhung): không liên quan."}, "n": ["Xem Đề 4 câu 4 (思いもかけず)."], "why": "<b>思いがけない<\/b> ＝ không ngờ tới, ngoài dự đoán. Đồng nghĩa: <b>意外な<\/b> (いがい: bất ngờ)."}, {"s": "友だちがバイクを安く_ゆずって_くれた。", "o": ["安く預って", "安く直して", "安く貸して", "安く売って"], "a": 4, "ar": "やすくうって", "vi": "Bạn tôi nhượng lại chiếc xe máy cho tôi với giá rẻ.", "key": [{"w": "譲る", "r": "ゆずる", "hv": "NHƯỢNG", "m": "nhường, nhượng lại"}], "x": {"1": "預かる (nhận giữ hộ): quyền sở hữu không đổi — khác 譲る.", "2": "直す (sửa): khác nghĩa.", "3": "貸す (cho mượn/thuê): xe vẫn là của bạn — 譲る là chuyển hẳn cho mình."}, "n": ["席を譲る: nhường ghế. 譲歩 じょうほ: nhượng bộ."], "why": "<b>ゆずる<\/b> (譲る) ＝ nhượng lại, chuyển quyền sở hữu cho người khác. 安く譲ってくれた ＝ bán lại rẻ → <b>安く売って<\/b>."}, {"s": "彼は_おそらく_来ないと思います。", "o": ["たぶん", "とうぜん", "ぜったい", "やはり"], "a": 1, "ar": "多分", "vi": "Tôi nghĩ có lẽ anh ấy sẽ không đến.", "key": [{"w": "恐らく", "r": "おそらく", "hv": "KHỦNG", "m": "có lẽ"}], "x": {"2": "とうぜん (đương nhiên): chắc chắn 100%, mạnh hơn おそらく.", "3": "ぜったい (tuyệt đối): chắc chắn hoàn toàn — mạnh hơn nhiều.", "4": "やはり (quả nhiên): xác nhận điều đã đoán, không phải phỏng đoán."}, "why": "<b>おそらく<\/b> ＝ có lẽ (phán đoán khả năng cao, văn viết hơn). Đồng nghĩa: <b>たぶん<\/b>."}, {"s": "彼は研究者の中でも_優秀だった_。", "o": ["人気があった", "体が丈夫だった", "手際がよかった", "頭がよかった"], "a": 4, "ar": "あたまがよかった", "vi": "Trong số các nhà nghiên cứu, anh ấy là người xuất sắc.", "key": [{"w": "優秀", "r": "ゆうしゅう", "hv": "ƯU TÚ", "m": "xuất sắc"}], "x": {"1": "人気がある (được yêu thích): nói về sự hâm mộ, không phải năng lực.", "2": "体が丈夫 (khỏe mạnh): nói sức khỏe.", "3": "手際がよい (làm khéo, nhanh gọn): là kỹ năng thao tác, không bao quát nghĩa “xuất sắc” của nhà nghiên cứu."}, "n": ["Xem Đề 16 câu 8 (優れる)."], "why": "<b>優秀<\/b> (ゆうしゅう) ＝ xuất sắc, giỏi (về năng lực, trí tuệ). Trong bối cảnh nhà nghiên cứu → <b>頭がよかった<\/b>."}, {"s": "前売券は_たちまち_売り切れとなった。", "o": ["すぐに", "とっくに", "やっと", "すっかり"], "a": 1, "ar": "直ぐに", "vi": "Vé bán trước hết sạch ngay lập tức.", "key": [{"w": "忽ち", "r": "たちまち", "hv": "HỐT", "m": "trong chớp mắt"}], "x": {"2": "とっくに (từ lâu rồi): chỉ việc đã xảy ra từ lâu, không chỉ tốc độ.", "3": "やっと (cuối cùng thì): ngụ ý mất nhiều thời gian — ngược nghĩa.", "4": "すっかり (hoàn toàn): chỉ mức độ, không chỉ tốc độ."}, "n": ["前売券 まえうりけん: vé bán trước."], "why": "<b>たちまち<\/b> ＝ ngay lập tức, trong chớp mắt. Đồng nghĩa: <b>すぐに<\/b>."}, {"s": "彼は_依然として_考えを改めない。", "o": ["これまで", "思ったとおり", "これから", "相変わらず"], "a": 4, "ar": "あいかわらず", "vi": "Anh ấy vẫn không chịu thay đổi suy nghĩ.", "key": [{"w": "依然として", "r": "いぜんとして", "hv": "Y NHIÊN", "m": "vẫn như cũ"}], "x": {"1": "これまで (cho đến nay): chỉ khoảng thời gian, không mang nghĩa “vẫn thế”.", "2": "思ったとおり (đúng như đã nghĩ): xác nhận dự đoán, khác nghĩa.", "3": "これから (từ giờ): chỉ tương lai — khác nghĩa."}, "n": ["Đồng âm: 以前 いぜん (trước đây). Xem Đề 14 câu 8 (改める)."], "why": "<b>依然として<\/b> (いぜんとして) ＝ vẫn y như trước, không thay đổi. Đồng nghĩa: <b>相変わらず<\/b>."}, {"s": "このズボンは僕には_ぶかぶかだ_。", "o": ["すこし小さい", "すこし大きい", "とても大きい", "とても小さい"], "a": 3, "ar": "とてもおおきい", "vi": "Chiếc quần này quá rộng thùng thình với tôi.", "key": [{"w": "ぶかぶか", "r": "ぶかぶか", "hv": "—", "m": "rộng thùng thình"}], "x": {"1": "すこし小さい (hơi chật): ngược nghĩa.", "2": "すこし大きい (hơi rộng): chưa đủ mức — ぶかぶか là rộng quá nhiều.", "4": "とても小さい (rất chật): ngược nghĩa (đó là きつきつ)."}, "n": ["ぴったり (vừa khít), きつい (chật)."], "why": "<b>ぶかぶか<\/b> ＝ rộng thùng thình (quá rộng so với người mặc). Đáp án <b>とても大きい<\/b> diễn đạt đúng mức độ."}, {"s": "自動車を_所有している_と税金がかかります。", "o": ["貸して", "乗って", "持って", "借りて"], "a": 3, "ar": "もっている", "vi": "Sở hữu ô tô thì phải đóng thuế.", "key": [{"w": "所有", "r": "しょゆう", "hv": "SỞ HỮU", "m": "sở hữu"}], "x": {"1": "貸す (cho mượn): xe đem cho người khác dùng — không phải sở hữu.", "2": "乗る (đi xe): có thể đi xe không phải của mình.", "4": "借りる (mượn): ngược nghĩa với sở hữu."}, "n": ["所有権 (Đề 7 câu 19)."], "why": "<b>所有する<\/b> ＝ sở hữu. Đồng nghĩa thông dụng: <b>持っている<\/b>."}, {"s": "テントが_しめっている_。", "o": ["まだ乾いていない", "もう乾いている", "もう片づいている", "まだ片づいていない"], "a": 1, "ar": "まだかわいていない", "vi": "Cái lều vẫn còn ẩm.", "key": [{"w": "湿る", "r": "しめる", "hv": "THẤP", "m": "ẩm"}], "x": {"2": "もう乾いている (đã khô): trái nghĩa.", "3": "もう片づいている (đã dọn xong): không liên quan độ ẩm.", "4": "まだ片づいていない (chưa dọn): không liên quan độ ẩm."}, "n": ["Xem Đề 11 câu 5 (湿っぽい)."], "why": "<b>しめる<\/b> (湿る) ＝ bị ẩm, chưa khô hẳn. しめっている ＝ <b>まだ乾いていない<\/b>."}, {"s": "列車の発車_間際_になって駅に到着した。", "o": ["直後", "直前", "後日", "当日"], "a": 2, "ar": "ちょくぜん", "vi": "Tôi đến ga ngay sát giờ tàu chạy.", "key": [{"w": "間際", "r": "まぎわ", "hv": "GIAN TẾ", "m": "sát lúc, ngay trước khi"}], "x": {"1": "直後 (ngay sau): trái nghĩa — nếu đến sau giờ tàu chạy thì đã lỡ tàu.", "3": "後日 (hôm khác, sau này): khác nghĩa.", "4": "当日 (ngày hôm đó): quá rộng, không chỉ “sát giờ”."}, "n": ["寝る間際, 締め切り間際."], "why": "<b>間際<\/b> (まぎわ) ＝ ngay sát trước (thời điểm). 発車間際 ＝ ngay trước giờ tàu chạy → <b>直前<\/b>."}, {"s": "あの子は{叱|しか}られて赤い顔をして_うつむいた_。", "o": ["右をむいた", "左をむいた", "下をむいた", "上をむいた"], "a": 3, "ar": "したをむいた", "vi": "Đứa bé bị mắng, đỏ mặt cúi gằm xuống.", "key": [{"w": "俯く", "r": "うつむく", "hv": "PHỦ", "m": "cúi đầu, nhìn xuống"}], "x": {"1": "右をむく (quay phải): sai hướng.", "2": "左をむく (quay trái): sai hướng.", "4": "上をむく (ngẩng lên — あおむく): trái nghĩa."}, " /* ---------- storage (per exam, per viewer) ---------- */
const KEY = no => "n2-dora-de" + no;
function load(no) {

  mem[no] = s;

/* ---------- cloud sync: each viewer's own progress, kept in the artifact db

const mem = {};
const syncEl = document.getElementById("sync");
const SYNC_TXT = { wait: "Đang tải tiến độ từ tài khoản…", ok: "☁ Tiến độ đã lưu vào tài khoản", err: "⚠ Chưa lưu được lên tài khoản — đang giữ trên máy này", off: "⚠ Chỉ lưu trên trình duyệt này" };
let cloud = null, syncHide, syncNow = "";
let pulled = false;            // first cloud read finished
const touched = new Set();     // exams changed on this load before that read
function setSync(k) {
  syncNow = k; clearTimeout(syncHide); syncEl.dataset.s = k; syncEl.textContent = SYNC_TXT[k];
  // on the home page the status stays visible; inside an exam a success note fades
  if (cur && k !== "wait") syncHide = setTimeout(() => { syncEl.textContent = ""; }, k === "ok" ? 2500 : 5000);
}
const pend = {}, busy = {};
function push(no) {
  if (!cloud || !pulled) return;   // never write before the cloud copy has been read and merged

}
async function flush(no) {
  clearTimeout(pend[no]);
  if (!cloud || !pulled) return;
  if (busy[no]) { busy[no] = "again"; return; }
  busy[no] = true;
  const s = load(no), n = byNo[no].qs.length;
  const body = { picks: Array.from({ length: n }, (_, i) => s.picks[i] || 0), submitted: !!s.submitted, secs: s.secs || 0, u: s.u || Date.now() };
  try { await cloud.doc("de" + no).set(body); setSync("ok"); }
  catch (e) { setSync(e && e.code === "invalid_argument" ? "off" : "err"); }

  if (again) flush(no);
}
function fromCloud(no, r) {
  const picks = {};
  (Array.isArray(r.picks) ? r.picks : []).forEach((v, i) => { if (v >= 1 && v <= 4) picks[i] = v; });
  const s = { picks, submitted: !!r.submitted, t0: null, secs: +r.secs || 0, u: +r.u || 0 };
  try { localStorage.setItem(KEY(no), JSON.stringify(s)); } catch (e) {}
  mem[no] = s;
}
// Merge one exam's cloud copy into the local one. Normally the newer side wins;
// an exam touched on this load before the first cloud read started from an
// empty local copy, so the cloud copy is kept and only new answers are layered on.
function merge(no, r) {
  const loc = load(no), ru = +r.u || 0, lu = loc.u || 0;
  if (touched.has(no) && !pulled) {
    if (r.submitted && !loc.submitted) { fromCloud(no, r); return "cloud"; }
    if (!r.submitted && !loc.submitted) {
      fromCloud(no, r);
      const m = mem[no];
      Object.assign(m.picks, loc.picks);
      m.secs = Math.max(m.secs, loc.secs || 0);
      save(no, m);
      return "cloud";
    }

}
async function pull() {
  let snap;
  try { snap = await cloud.get(); } catch (e) { setSync("err"); return false; }
  const inCloud = new Set();
  let changed = false;
  snap.docs.forEach(d => {
    const m = d.id.match(/^de(\d+)$/), no = m && +m[1];
    if (!no || !byNo[no]) return;
    inCloud.add(no);
    if (merge(no, d.data() || {})) changed = true;
  });
  EXAMS.forEach(e => { const l = load(e.no); if (!inCloud.has(e.no) && (l.u || Object.keys(l.picks).length)) push(e.no); });
  const merged = [...touched];
  pulled = true; touched.clear();
  merged.forEach(push);
  setSync("ok");
  if (!changed) return true;
  if (!cur) home();
  else if (mem[cur.no] && mem[cur.no] !== st) {
    st = load(cur.no);
    if (!st.submitted) st.t0 = Date.now() - st.secs * 1000;
    drawExam();
  }
  return true;
}
async function initCloud() {
  if (!window.claude || !window.claude.use) { setSync("off"); return; }
  setSync("wait");
  const [user, db] = await Promise.all([claude.use("user"), claude.use("db")]);
  const uid = user ? await user.id() : null;
  if (!db || !uid) { setSync("off"); return; }
  cloud = db.collection("data/users/" + uid);
  if (!(await pull())) {           // one retry after a short pause
    await new Promise(r => setTimeout(r, 2000 + Math.random() * 1000));
    if (!(await pull())) { cloud = null; return; }
  }
  // coming back to the tab (or from another device) picks up newer progress
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && cloud) pull(); });
}

    ${!s.submitted && picked ? `<div class="bar-mini"><i style="width:${picked / n * 100}%"></i></div>` : ""}
    <div class="state">${state}</div>
    <div class="acts"><a class="btn primary" href="#de${ex.no}">${s.submitted ? "Xem lại" : picked ? "Làm tiếp" : "Làm bài"}</a>
      <a class="src" href="${ex.source.goc}" target="_blank" rel="noopener"><span class="k">問題</span>Đề gốc</a>
      <a class="src" href="${ex.source.chua}" target="_blank" rel="noopener"><span class="k">解説</span>Đề chữa</a></div></div>`;
}

/* ---------- exam ---------- */
let cur = null, st = null, timer = null, onlyWrong = false, confirming = false;

function exam(no) {
  cur = byNo[no]; st = load(no); onlyWrong = false; confirming = false;
  if (syncNow) setSync(syncNow);
  if (!st.submitted) st.t0 = Date.now() - st.secs * 1000;
  document.title = `${cur.title} · Luyện đề N2`;
  drawExam();
  window.scrollTo({ top: 0 });
}
function tick() {
  clearInterval(timer);
  if (!cur || st.submitted) return;
  timer = setInterval(() => {
    st.secs = Math.floor((Date.now() - st.t0) / 1000);
    const el = document.getElementById("clock"); if (el) el.textContent = mmss(st.secs);
    if (st.secs % 10 === 0) save(cur.no, st, false);
  }, 1000);
}
function drawExam() {
  const ex = cur, S = ex.source, done = st.submitted, n = ex.qs.length;
  const right = scoreOf(ex, st), picked = Object.keys(st.picks).length;
  const wrongIdx = ex.qs.map((q, i) => st.picks[i] === q.a ? -1 : i).filter(i => i >= 0);
  app.innerHTML = `
    <header class="exam-head">
      <a class="back" href="#">← Tất cả đề</a>
      <div class="eyebrow">${esc(ex.series)} · file “${esc(ex.file)}”</div>
      <h1><span class="jp">${esc(ex.jp)}</span>${esc(ex.title)}</h1>
      <p class="mondai">${ex.mondai}</p>
      <div class="sources">
        <a class="src" href="${S.goc}" target="_blank" rel="noopener"><span class="k">問題</span>Đề gốc (PDF)</a>
        <a class="src" href="${S.chua}" target="_blank" rel="noopener"><span class="k">解説</span>Đề chữa (PDF)</a>
        <a class="src" href="${S.folder}" target="_blank" rel="noopener"><span class="k">Drive</span>Thư mục</a>
      </div>
      ${ex.notice ? `<div class="notice">${ex.notice}</div>` : ""}
    </header>
    <div class="bar">${done
      ? `<div class="info"><span class="score">${right}<small>/${n}</small></span><span>${mmss(st.secs)}</span></div>
         <button class="btn" type="button" id="onlyWrong" aria-pressed="${onlyWrong}">Chỉ câu sai (${wrongIdx.length})</button>
         <button class="btn" type="button" id="openAll">Mở tất cả giải thích</button>
         <button class="btn" type="button" id="retry">Làm lại</button>`
      : `<div class="info"><span>${picked}/${n} câu</span><span id="clock">${mmss(st.secs)}</span></div>
         <button class="btn primary" type="button" id="submit">Nộp bài</button>`}
    </div>
    ${confirming ? `<div class="confirm" role="alert"><p>Còn <b>${n - picked}</b> câu chưa chọn. Câu bỏ trống sẽ tính là sai.</p>
       <button class="btn" type="button" id="cancelSubmit">Làm tiếp</button><button class="btn danger" type="button" id="forceSubmit">Nộp luôn</button></div>` : ""}
    ${done ? `<section class="result"><div class="big"><span class="pen">${right}<small>/${n}</small></span>
        <span>Đúng ${right} · Sai ${n - right} · Thời gian ${mmss(st.secs)}</span></div>
        <div class="jumps">${ex.qs.map((q, i) => `<a href="#q${i + 1}" class="${st.picks[i] === q.a ? "" : "ng"}" data-jump="${i + 1}">${i + 1}</a>`).join("")}</div>
        ${ex.sum ? `<div><a class="btn" href="#recap" data-goto="recap">Tổng kết kiến thức của đề ↓</a></div>` : ""}</section>` : ""}
    <main class="sheet${done ? " done" : ""}${onlyWrong ? " only-wrong" : ""}" id="sheet">${ex.qs.map((q, i) => qHTML(q, i)).join("")}</main>
    ${done ? keyHTML() + recapHTML(ex) : ""}
    <footer>Đề gốc và đáp án © DORA Nihongo. Phần giải thích mở rộng là phần bổ sung, không có trong bản chữa gốc.</footer>`;
  tick();
}
const MARK_OK = `<svg class="mark" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="18" transform="rotate(-20 22 22)" stroke-dasharray="108 6"/></svg>`;
const MARK_NG = `<svg class="mark" viewBox="0 0 44 44" aria-hidden="true"><path d="M9 22 L18 33 L37 8"/></svg>`;
/* Stem tokens: （　） = blank filled by the chosen option (split on ／ for two blanks);
   ［　］ / ［★］ = ordering slots, the chosen option goes into the ★ slot. */
function fillStem(q, html, pickNo, full) {
  const parts = pickNo ? q.o[pickNo - 1].split("／") : [];
  let b = 0;
  html = html.replace(/（　）/g, () => {
    const t = parts.length ? esc(parts[Math.min(b++, parts.length - 1)]) : "";
    return full ? `<u>${t}</u>` : `<span class="blank${t ? " filled" : ""}">${t}</span>`;
  });
  let k = 0;
  html = html.replace(/［(　|★)］/g, (m, c) => {
    if (full) { const w = esc(q.o[q.order[k++] - 1]); return c === "★" ? `<u>${w}</u>` : w; }
    const t = c === "★" && pickNo ? esc(q.o[pickNo - 1]) : "";
    return `<span class="slot${c === "★" ? " star" : ""}${t ? " filled" : ""}">${t || (c === "★" ? "★" : "")}</span>`;
  });
  return html;
}
function qHTML(q, i) {
  const done = st.submitted, pick = st.picks[i], ok = pick === q.a;
  const stem = fillStem(q, fmt(esc(q.s)), pick, false);
  const long = q.o.some(o => o.length > 6);
  return `<section class="q${done ? (ok ? " ok" : " ng") : ""}" id="q${i + 1}" data-i="${i}">
    <div><div class="qn">${i + 1}${done ? (ok ? MARK_OK : MARK_NG) : ""}</div></div>
    <div class="qbody">
      <p class="stem">${stem}</p>
      <ul class="opts${long ? " long" : ""}">${q.o.map((o, j) => {
        const n = j + 1, c = ["opt"];
        if (done && n === q.a) c.push("is-ans");
        if (done && n === pick && n !== q.a) c.push("is-wrong");
        return `<li><button type="button" class="${c.join(" ")}" data-n="${n}" aria-pressed="${pick === n}"${done ? " disabled" : ""}><span class="bub">${n}</span><span class="t">${esc(o)}</span></button></li>`;
      }).join("")}</ul>
      ${done && !pick ? `<div class="unanswered">Bỏ trống</div>` : ""}
      ${done ? `<details class="ex"${ok ? "" : " open"}><summary>Giải thích câu ${i + 1}</summary><div class="exb">${exHTML(q)}</div></details>` : ""}
    </div></section>`;
}
function exHTML(q) {
  const a = q.a, p = [];
  p.push(`<div><h4>Đáp án</h4><div class="ansline"><span class="circ">${CIRC[a]}</span><span class="w">${esc(q.o[a - 1])}</span>${q.ar ? `<span class="r">${fmt(q.ar)}</span>` : ""}</div></div>`);
  if (q.order) p.push(`<div><h4>Thứ tự đúng</h4><div class="ansline">${q.order.map(n => `<span class="${n === a ? "circ" : "r"}">${n}</span>`).join('<span class="r">→</span>')}</div></div>`);
  p.push(`<div><h4>Dịch câu</h4><p class="jpline">${fillStem(q, fmt(q.s), a, true)}</p><p class="vi">${q.vi}</p></div>`);
  if (q.why) p.push(`<div><h4>Vì sao chọn ${CIRC[a]}</h4><p class="why">${fmt(q.why)}</p></div>`);
  if (q.x) {
    const ns = q.order ? [1, 2, 3, 4].filter(n => q.x[n]) : [1, 2, 3, 4].filter(n => n !== a && q.x[n]);
    p.push(`<div><h4>${q.order ? "Vị trí từng mảnh" : "Vì sao không chọn các phương án khác"}</h4><ul class="others">${ns.map(n => `<li><span class="n">${n}</span><div>${q.order ? "" : `<span class="verdict">Loại</span>`}${q.x[n].startsWith(q.o[n - 1]) ? "" : `<span class="jp">${esc(q.o[n - 1])}</span> — `}${fmt(q.x[n])}</div></li>`).join("")}</ul></div>`);
  }
  if (q.key && q.key.length) p.push(`<div><h4>Từ vựng</h4><div class="tbl"><table><thead><tr><th>Từ</th><th>Cách đọc</th><th>Hán Việt</th><th>Nghĩa</th></tr></thead><tbody>${q.key.map(k => `<tr><td class="w">${k.w}</td><td class="r">${k.r}</td><td class="hv">${k.hv || "—"}</td><td>${fmt(k.m)}</td></tr>`).join("")}</tbody></table></div></div>`);
  if (q.g && q.g.length) p.push(`<div><h4>Ngữ pháp trong câu</h4><div style="display:grid;gap:6px">${q.g.map(g => `<div class="g">${fmt(g)}</div>`).join("")}</div></div>`);
  if (q.n && q.n.length) p.push(`<div><h4>Ghi chú · Mở rộng</h4><ul class="notes">${q.n.map(n => `<li>${fmt(n)}</li>`).join("")}</ul></div>`);
  return p.join("");
}
function keyHTML() {
  const qs = cur.qs, rows = [];
  for (let s = 0; s < qs.length; s += 10) {
    const sl = qs.slice(s, s + 10);
    rows.push(`<tr><th>Câu</th>${sl.map((_, k) => `<th>${s + k + 1}</th>`).join("")}</tr><tr><th>Đ/A</th>${sl.map(q => `<td>${q.a}</td>`).join("")}</tr>`);
  }
  return `<details class="ex key"><summary>Bảng đáp án (解答)</summary><div class="exb"><div class="tbl"><table>${rows.join("")}</table></div></div></details>`;
}
function recapHTML(ex) {
  if (!ex.sum || !ex.sum.length) return "";
  const sec = (c, i) => {
    let h = `<div class="rc"><h3><span class="k">${i + 1}</span>${fmt(c.h)}</h3>`;
    if (c.p) h += `<p>${fmt(c.p)}</p>`;
    if (c.tbl) h += `<div class="tbl"><table><thead><tr>${c.tbl.head.map(t => `<th>${fmt(t)}</th>`).join("")}</tr></thead><tbody>${c.tbl.rows.map(r => `<tr>${r.map((t, k) => `<td data-l="${esc(c.tbl.head[k] || "")}">${fmt(t)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    if (c.li) h += `<ul class="notes">${c.li.map(t => `<li>${fmt(t)}</li>`).join("")}</ul>`;
    return h + `</div>`;
  };
  return `<section class="recap" id="recap"><div><h2><span class="jp">${esc(ex.jp)}</span>Tổng kết kiến thức · ${esc(ex.title)}</h2>
    <p class="lead">Những điểm cần nhớ rút ra từ đề này và kiến thức mở rộng cùng nhóm.</p></div>${ex.sum.map(sec).join("")}</section>`;
}
function submit() {
  st.secs = Math.floor((Date.now() - st.t0) / 1000);
  st.submitted = true; confirming = false; clearInterval(timer);
  save(cur.no, st); drawExam(); window.scrollTo({ top: 0 });
}

app.addEventListener("click", e => {
  const t = e.target;
  const opt = t.closest(".opt");
  if (opt && cur && !st.submitted) {
    const qEl = opt.closest(".q"), i = +qEl.dataset.i, n = +opt.dataset.n;
    if (st.picks[i] === n) delete st.picks[i]; else st.picks[i] = n;
    save(cur.no, st);
    qEl.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-pressed", String(+o.dataset.n === st.picks[i])));
    const bl = qEl.querySelector(".blank");
    if (bl || qEl.querySelector(".slot")) qEl.querySelector(".stem").innerHTML = fillStem(cur.qs[i], fmt(esc(cur.qs[i].s)), st.picks[i], false);
    const info = app.querySelector(".bar .info span"); if (info) info.textContent = `${Object.keys(st.picks).length}/${cur.qs.length} câu`;
    return;
  }
  const fb = t.closest("[data-filter]");
  if (fb) { filter = fb.dataset.filter; try { localStorage.setItem("n2-dora-filter", filter); } catch (e) {} home(); return; }
  const go = t.closest("[data-goto]");
  if (go) { e.preventDefault(); document.getElementById(go.dataset.goto).scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const jump = t.closest("[data-jump]");
  if (jump) { e.preventDefault(); document.getElementById("q" + jump.dataset.jump).scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  switch (t.closest("button")?.id) {
    case "submit": if (Object.keys(st.picks).length < cur.qs.length) { confirming = true; drawExam(); } else submit(); break;
    case "forceSubmit": submit(); break;
    case "cancelSubmit": confirming = false; drawExam(); break;
    case "retry": st = { picks: {}, submitted: false, t0: Date.now(), secs: 0 }; save(cur.no, st); drawExam(); window.scrollTo({ top: 0 }); break;
    case "onlyWrong": onlyWrong = !onlyWrong; drawExam(); break;
    case "openAll": {
      const all = [...app.querySelectorAll("#sheet details.ex")], open = !all.every(d => d.open);
      all.forEach(d => d.open = open); t.textContent = open ? "Đóng tất cả giải thích" : "Mở tất cả giải thích"; break;
    }
  }
});

function route() {
  clearInterval(timer);
  if (cur && st && !st.submitted) { save(cur.no, st); flush(cur.no); }
  const m = location.hash.match(/^#de(\d+)$/);
  if (m && byNo[+m[1]]) exam(+m[1]); else { cur = null; home(); }
}
window.addEventListener("hashchange", route);
window.addEventListener("pagehide", () => { if (cur && st && !st.submitted) { save(cur.no, st); flush(cur.no); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && cur && st && !st.submitted) { save(cur.no, st); flush(cur.no); } });
route();
initCloud();
</script>
