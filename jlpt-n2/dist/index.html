<title>Luyện đề N2 DORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho:wght@400;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Klee+One:wght@600&display=swap">
<style>
/* Layout: an exam binder. Home = index of 20 exam slots; exam view = one answer sheet column with a sticky bar; explanations exist only after submitting. */
:root {
  --paper: #f6f7f9;
  --sheet: #ffffff;
  --ink: #1d2433;
  --ink-soft: #566074;
  --rule: #dfe3ea;
  --ai: #2b4a8b;
  --ai-wash: #e8edf7;
  --shu: #d2352b;
  --shu-wash: #fbeceb;
  --ok: #1f7a4d;
  --ok-wash: #e6f4ec;
  --font-jp: "BIZ UDPMincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-pen: "Klee One", "Be Vietnam Pro", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12151b; --sheet: #1a1e26; --ink: #e6e9ef; --ink-soft: #9aa3b5; --rule: #2c323e;
    --ai: #8fb0f0; --ai-wash: #22304a; --shu: #ff7b6e; --shu-wash: #3a2224; --ok: #6fd3a0; --ok-wash: #1d3329;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12151b; --sheet: #1a1e26; --ink: #e6e9ef; --ink-soft: #9aa3b5; --rule: #2c323e;
  --ai: #8fb0f0; --ai-wash: #22304a; --shu: #ff7b6e; --shu-wash: #3a2224; --ok: #6fd3a0; --ok-wash: #1d3329;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }
a { color: var(--ai); }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
button { font: inherit; cursor: pointer; }
.wrap { max-width: 800px; margin: 0 auto; padding-inline: 16px; padding-block: 0 56px; }

/* shared bits */
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
h1 { margin: 0; font-size: clamp(24px, 5vw, 32px); line-height: 1.2; text-wrap: balance; font-weight: 700; }
h1 .jp { font-family: var(--font-jp); margin-inline-end: .35em; }
.btn { border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--ai); }
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--sheet); }
.btn.danger { background: var(--shu); border-color: var(--shu); color: var(--sheet); }
.btn[aria-pressed="true"] { background: var(--ai-wash); border-color: var(--ai); color: var(--ai); }
.chip { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--ai-wash); color: var(--ai); }
.src { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--rule); border-radius: 999px; background: var(--sheet); text-decoration: none; font-size: 13px; font-weight: 500; color: var(--ink); }
.src:hover { border-color: var(--ai); color: var(--ai); }
.src .k { font-family: var(--font-jp); color: var(--ai); font-weight: 700; }
.notice { font-size: 13px; color: var(--ink-soft); background: var(--sheet); border: 1px dashed var(--rule); border-radius: 8px; padding: 8px 12px; }

/* home */
.home-head { padding-block: 32px 18px; display: grid; gap: 10px; }
.home-head p { margin: 0; color: var(--ink-soft); max-width: 62ch; }
.stats { display: flex; flex-wrap: wrap; gap: 18px; font-size: 13px; color: var(--ink-soft); }
.stats b { font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; margin-inline-end: 4px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 8px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.card.off { background: transparent; border-style: dashed; }
.card .no { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card .no b { font-size: 17px; }
.card .file { font-size: 13px; color: var(--ink-soft); font-family: var(--font-jp); }
.card .state { font-size: 13px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; min-height: 26px; }
.card .state .pen { font-family: var(--font-pen); color: var(--shu); font-size: 20px; line-height: 1; }
.card .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.card.off .state { color: var(--ink-soft); }
.bar-mini { height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.bar-mini i { display: block; height: 100%; background: var(--ai); }

/* exam */
.exam-head { padding-block: 22px 16px; display: grid; gap: 10px; }
.back { font-size: 13px; text-decoration: none; font-weight: 600; }
.mondai { margin: 0; color: var(--ink-soft); }
.mondai b { font-family: var(--font-jp); color: var(--ink); }
.sources { display: flex; flex-wrap: wrap; gap: 8px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); margin-inline: -16px; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bar .info { margin-inline-end: auto; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.bar .score { font-family: var(--font-pen); color: var(--shu); font-size: 24px; line-height: 1; }
.bar .score small { font-size: 14px; }
.confirm { margin-top: 12px; background: var(--shu-wash); border: 1px solid var(--shu); border-radius: 10px; padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.confirm p { margin: 0; margin-inline-end: auto; }

.result { margin-top: 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.result .big { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.result .big .pen { font-family: var(--font-pen); color: var(--shu); font-size: 44px; line-height: 1; }
.result .big .pen small { font-size: 22px; }
.result .big span { color: var(--ink-soft); font-size: 14px; }
.jumps { display: flex; flex-wrap: wrap; gap: 6px; }
.jumps a { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; font-size: 13px; font-weight: 700; text-decoration: none; font-variant-numeric: tabular-nums; border: 1.5px solid var(--ok); color: var(--ok); background: var(--ok-wash); }
.jumps a.ng { border-color: var(--shu); color: var(--shu); background: var(--shu-wash); }

.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; margin-top: 16px; }
.q { padding: 20px 18px 16px; border-top: 1px solid var(--rule); display: grid; grid-template-columns: auto 1fr; column-gap: 14px; scroll-margin-top: 80px; }
.q:first-child { border-top: 0; }
.qn { width: 30px; height: 30px; border: 1.5px solid var(--ai); color: var(--ai); border-radius: 6px; display: grid; place-items: center; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; position: relative; }
.qbody { min-width: 0; display: grid; gap: 12px; }
.stem { font-family: var(--font-jp); font-size: 19px; line-height: 2.1; margin: 0; }
.stem ruby rt, .jpline ruby rt { font-size: 10px; color: var(--ink-soft); }
.stem u, .jpline u { text-decoration: none; border-bottom: 2px solid var(--ai); padding-bottom: 1px; }
.blank { display: inline-block; min-width: 4.5em; text-align: center; border-bottom: 2px solid var(--ink-soft); margin-inline: .2em; line-height: 1.5; }
.blank.filled { color: var(--ai); border-bottom-color: var(--ai); }
.blank:empty::before { content: "\3000"; }
.slot { display: inline-block; min-width: 3.2em; text-align: center; border-bottom: 2px solid var(--ink-soft); margin-inline: .25em; line-height: 1.5; color: var(--ink-soft); font-size: .8em; vertical-align: baseline; }
.slot.star { color: var(--shu); }
.slot.filled { color: var(--ai); border-bottom-color: var(--ai); font-size: 1em; }
.opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 10px; list-style: none; margin: 0; padding: 0; }
.opts.long { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 560px) { .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; border: 1px solid transparent; background: transparent; color: var(--ink); padding: 6px 8px; border-radius: 8px; font-family: var(--font-jp); font-size: 17px; min-width: 0; }
.opt:hover { background: var(--ai-wash); }
.opt .bub { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink-soft); display: grid; place-items: center; font-family: var(--font-ui); font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt[aria-pressed="true"] .bub { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.done .opt { cursor: default; }
.done .opt:hover { background: transparent; }
.done .opt.is-ans { background: var(--ok-wash); }
.done .opt.is-ans .bub { border-color: var(--ok); color: var(--ok); }
.done .opt.is-ans[aria-pressed="true"] .bub { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.done .opt.is-wrong { background: var(--shu-wash); }
.done .opt.is-wrong .bub { background: var(--shu); border-color: var(--shu); color: var(--sheet); }
.unanswered { font-size: 12.5px; color: var(--shu); font-weight: 600; }
.mark { position: absolute; left: -7px; top: -8px; width: 44px; height: 44px; pointer-events: none; }
.mark circle, .mark path { fill: none; stroke: var(--shu); stroke-width: 3; stroke-linecap: round; }
.only-wrong .q.ok { display: none; }

details.ex { border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
details.ex > summary { list-style: none; cursor: pointer; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--ai); display: flex; align-items: center; gap: 10px; }
details.ex > summary::-webkit-details-marker { display: none; }
details.ex > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
details.ex[open] > summary::before { transform: rotate(45deg); }
.exb { padding: 4px 14px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; font-size: 14.5px; }
.exb > * { min-width: 0; }
.exb h4 { margin: 0 0 4px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.exb .jp, .exb ruby { font-family: var(--font-jp); }
.ansline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
.ansline .circ { font-family: var(--font-pen); color: var(--shu); font-size: 20px; }
.ansline .w { font-family: var(--font-jp); font-size: 20px; font-weight: 700; }
.ansline .r { font-family: var(--font-jp); color: var(--ink-soft); }
.vi { margin: 0; font-style: italic; }
.jpline { margin: 0 0 2px; font-family: var(--font-jp); font-size: 16px; line-height: 2; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: start; padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
td.w { font-family: var(--font-jp); font-size: 17px; font-weight: 700; white-space: nowrap; }
td.r { font-family: var(--font-jp); white-space: nowrap; }
td.hv { font-size: 12.5px; font-weight: 600; letter-spacing: .04em; color: var(--ai); white-space: nowrap; }
ul.others, ul.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
ul.others li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
ul.others .n { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--shu); color: var(--shu); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
ul.others li > div { min-width: 0; }
ul.notes li { padding-inline-start: 14px; position: relative; }
ul.notes li::before { content: ""; position: absolute; left: 0; top: .7em; width: 6px; height: 6px; border-radius: 50%; background: var(--ai); }
.g { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; }
.g b.jp { color: var(--ai); }
.why { margin: 0; background: var(--ok-wash); border-inline-start: 3px solid var(--ok); border-radius: 0 6px 6px 0; padding: 8px 12px; }
ul.others .verdict { font-size: 12px; font-weight: 700; color: var(--shu); margin-inline-end: 4px; }
.recap { margin-top: 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; scroll-margin-top: 70px; }
.recap > * { min-width: 0; }
.recap h2 { margin: 0; font-size: 20px; line-height: 1.3; }
.recap h2 .jp { font-family: var(--font-jp); color: var(--ai); margin-inline-end: .3em; }
.recap .lead { margin: 4px 0 0; color: var(--ink-soft); font-size: 14px; }
.recap h3 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.recap h3 .k { font-family: var(--font-pen); color: var(--shu); font-size: 16px; }
.recap p { margin: 0 0 8px; }
.recap .jp, .recap ruby { font-family: var(--font-jp); }
.recap td:first-child { font-family: var(--font-jp); font-weight: 700; white-space: nowrap; }
@media (max-width: 560px) {
  /* recap tables become stacked cards on phones so no column gets squeezed */
  .recap .tbl table, .recap .tbl tbody, .recap .tbl tr, .recap .tbl td { display: block; }
  .recap .tbl thead { display: none; }
  .recap .tbl tr { padding: 8px 0; border-bottom: 1px solid var(--rule); }
  .recap .tbl td { border: 0; padding: 1px 0; }
  .recap .tbl td:first-child { white-space: normal; font-size: 16px; }
  .recap .tbl td[data-l]:not(:first-child)::before { content: attr(data-l) " · "; font-size: 11.5px; color: var(--ink-soft); }
}
.recap .rc + .rc { border-top: 1px dashed var(--rule); padding-top: 16px; }
.key { margin-top: 16px; }
.key table { background: var(--sheet); }
.key td, .key th { text-align: center; font-variant-numeric: tabular-nums; }
.key td { font-weight: 700; color: var(--shu); font-family: var(--font-pen); font-size: 17px; }
footer { margin-top: 28px; font-size: 13px; color: var(--ink-soft); }
.sync { position: fixed; right: 12px; bottom: 12px; z-index: 5; font-size: 12px; padding: 5px 10px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--rule); color: var(--ink-soft); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.sync[data-s="ok"] { color: var(--ok); border-color: var(--ok); }
.sync[data-s="err"], .sync[data-s="off"] { color: var(--shu); border-color: var(--shu); }
.sync:empty { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div class="wrap" id="app"></div>
<div class="sync" id="sync" role="status" aria-live="polite"></div>

<script>
const EXAMS = [{"jp": "漢字読み", "title": "Đề 1 · Kanji N2", "mondai": "<b>問題1<\/b> ＿＿の言葉の読み方として最もよいものを、1・2・3・4から一つ選びなさい。 Chọn cách đọc đúng nhất cho từ được gạch chân.", "qs": [{"s": "花見はわが社の春の{恒例|こうれい}_行事_です。", "o": ["こうごと", "こうじ", "ぎょうごと", "ぎょうじ"], "a": 4, "ar": "行事", "vi": "Ngắm hoa là sự kiện thường niên vào mùa xuân của công ty chúng tôi.", "key": [{"w": "行事", "r": "ぎょうじ", "hv": "HÀNH SỰ", "m": "sự kiện, hoạt động tổ chức theo lịch"}, {"w": "恒例", "r": "こうれい", "hv": "HẰNG LỆ", "m": "lệ thường, thông lệ hằng năm"}, {"w": "花見", "r": "はなみ", "hv": "HOA KIẾN", "m": "ngắm hoa (anh đào)"}], "x": {"1": "こう＋ごと: không có từ này. Trộn âm On こう (của 行 trong 旅行) với âm Kun ごと (của 事 trong 仕事) — từ Hán ghép không trộn kiểu này.", "2": "こうじ là cách đọc của 工事 (CÔNG SỰ, thi công) hoặc 公示 (công bố). Sai ở chữ 行: trong 行事, 行 đọc ぎょう chứ không phải こう.", "3": "ぎょう đúng nhưng ごと sai: ごと là âm Kun của 事, chỉ dùng trong từ thuần Nhật như 仕事, 出来事; trong từ Hán ghép 行事 phải đọc じ."}, "g": ["<b class=\"jp\">わが〜<\/b> (我が): của chúng tôi, của ta. わが社 = công ty chúng tôi, わが国 = nước ta."], "n": ["行 có ba âm On: こう (旅行 りょこう, 銀行 ぎんこう), ぎょう (行事, 行列 ぎょうれつ hàng người, 行儀 ぎょうぎ phép tắc), あん (行灯 あんどん đèn lồng).", "事: じ trong từ Hán (火事 かじ, 食事 しょくじ, 用事 ようじ); こと/ごと là Kun (出来事 できごと, 仕事 しごと).", "恒例行事 こうれいぎょうじ: sự kiện thường niên. Hay gặp cùng: 年中行事 ねんじゅうぎょうじ (các lễ hội trong năm)."], "why": "Tách từng chữ: 行 trong từ chỉ sự kiện, nghi lễ đọc <b>ぎょう<\/b> (行列, 行儀); 事 trong từ Hán ghép đọc <b>じ<\/b> (火事, 食事). Ghép lại: ぎょう＋じ ＝ <b>ぎょうじ<\/b>. Gợi ý thêm từ ngữ cảnh: 恒例 (thường niên) luôn đi với 行事 thành cụm cố định 恒例行事."}, {"s": "データをコンピューターで_処理_した。", "o": ["しょうり", "しゅうり", "しゅり", "しょり"], "a": 4, "ar": "処理", "vi": "Tôi đã xử lý dữ liệu bằng máy tính.", "key": [{"w": "処理", "r": "しょり", "hv": "XỬ LÝ", "m": "xử lý"}], "x": {"1": "しょうり là 勝利 (THẮNG LỢI). Sai vì thêm trường âm う vào 処 — 処 luôn đọc ngắn しょ.", "2": "しゅうり là 修理 (TU LÝ, sửa chữa). Sai chữ đầu: 修 đọc しゅう, còn 処 đọc しょ. Về nghĩa, dữ liệu cũng không sửa chữa được bằng 修理.", "3": "しゅり không phải từ thông dụng (chỉ gặp trong địa danh 首里). 処 không có âm しゅ."}, "g": ["<b class=\"jp\">N で<\/b>: chỉ phương tiện, công cụ. コンピューターで = bằng máy tính."], "n": ["処 đọc しょ, âm ngắn: 処分 しょぶん (xử lý, vứt bỏ; kỷ luật), 対処 たいしょ (đối phó), 処置 しょち (xử trí, sơ cứu), 処方 しょほう (kê đơn).", "理 đọc り: 料理, 無理, 理由 りゆう, 管理 かんり."], "why": "処 đọc <b>しょ<\/b> (âm ngắn, không có う), 理 đọc <b>り<\/b>. 処理 ＝ <b>しょり<\/b>: xử lý. Ngữ cảnh データを〜する (xử lý dữ liệu) khớp nghĩa."}, {"s": "もちろん私は_地元_チームを応援します。", "o": ["じもと", "じげん", "ちもと", "ちげん"], "a": 1, "ar": "地元", "vi": "Đương nhiên là tôi sẽ cổ vũ cho đội nhà (đội địa phương).", "key": [{"w": "地元", "r": "じもと", "hv": "ĐỊA NGUYÊN", "m": "địa phương, quê nhà, bản địa"}, {"w": "応援", "r": "おうえん", "hv": "ỨNG VIỆN", "m": "cổ vũ, ủng hộ"}], "x": {"2": "じげん là 次元 (THỨ NGUYÊN: chiều, cấp độ). Sai chữ 元: trong 地元, 元 đọc Kun もと chứ không đọc On げん.", "3": "ちもと: không có từ này. 地 đọc ち ở 地下, 地図, 地域, nhưng riêng 地元 đọc じ.", "4": "ちげん: không có từ này. Sai cả hai chữ — 地 phải là じ, 元 phải là もと."}, "n": ["地元 là kiểu đọc 重箱読み (On + Kun): じ (On) + もと (Kun).", "地 đọc じ: 地震 じしん, 地面 じめん, 地味 じみ (giản dị). Đọc ち: 地下 ちか, 地図 ちず, 地域 ちいき, 地球 ちきゅう.", "元 đọc もと (Kun, gốc), げん (元気), がん (元日 がんじつ, 元旦 がんたん)."], "why": "地元 đọc kiểu 重箱読み (On + Kun): 地 âm On <b>じ<\/b> ＋ 元 âm Kun <b>もと<\/b> ＝ <b>じもと<\/b> (địa phương, quê nhà). Ngữ cảnh 地元チームを応援 (cổ vũ đội nhà) khớp nghĩa."}, {"s": "このカレーは_辛くて_食べられない。", "o": ["にがくて", "しぶくて", "くさくて", "からくて"], "a": 4, "ar": "辛い → からい", "vi": "Món cà ri này cay quá nên tôi không ăn được.", "key": [{"w": "辛い", "r": "からい", "hv": "TÂN", "m": "cay; (cũng đọc つらい: khổ sở, vất vả)"}], "x": {"1": "にがくて là của 苦い (đắng). Chữ khác (苦 KHỔ), không phải cách đọc của 辛.", "2": "しぶくて là của 渋い (chát). Chữ khác (渋 SÁP), không phải cách đọc của 辛.", "3": "くさくて là của 臭い (hôi). Chữ khác (臭 XÚ), và mùi thì không phải lý do “không ăn được” theo vị như câu này."}, "g": ["<b class=\"jp\">Aくて<\/b>: thể て của tính từ い chỉ nguyên nhân (cay nên…).", "<b class=\"jp\">食べられない<\/b>: thể khả năng phủ định, không thể ăn."], "n": ["Năm vị: 甘い あまい (ngọt), 辛い からい (cay), 苦い にがい (đắng), 酸っぱい すっぱい (chua), 塩辛い しおからい / しょっぱい (mặn).", "辛い đọc つらい khi nói về cảm giác khổ sở: 別れが辛い (chia tay thật đau lòng). Xem Đề 2 câu 5.", "On của 辛 là しん: 香辛料 こうしんりょう (gia vị cay), 辛抱 しんぼう (nhẫn nại)."], "why": "辛い có hai cách đọc: <b>からい<\/b> (cay — vị giác) và つらい (khổ sở — cảm xúc). Câu nói về カレー (cà ri) và 食べられない (không ăn nổi) nên là vị cay → <b>からくて<\/b>."}, {"s": "その本について_批評_を書きました。", "o": ["ひべい", "ひびょう", "ひひょう", "ひへい"], "a": 3, "ar": "批評", "vi": "Tôi đã viết bài phê bình về cuốn sách đó.", "key": [{"w": "批評", "r": "ひひょう", "hv": "PHÊ BÌNH", "m": "phê bình, bình luận đánh giá (cả khen lẫn chê)"}], "x": {"1": "ひべい: không có từ này. 評 đọc ひょう (có âm ghép ょ), không phải べい.", "2": "ひびょう: không có từ này. Sai vì đục hóa 評 thành びょう — 批評 không biến âm.", "4": "ひへい là 疲弊 (BÌ TỆ, kiệt quệ). Có thật nhưng khác chữ; 評 không đọc へい."}, "g": ["<b class=\"jp\">〜について<\/b>: về, liên quan đến."], "n": ["評 đọc ひょう: 評判 ひょうばん (tiếng tăm), 評価 ひょうか (đánh giá), 好評 こうひょう (được khen), 不評 ふひょう.", "Phân biệt: 批評 (đánh giá chung, có thể khen) và 批判 ひはん PHÊ PHÁN (chỉ trích, nghiêng về tiêu cực).", "批 đọc ひ: 批判, 批准 ひじゅん (phê chuẩn)."], "why": "批 đọc <b>ひ<\/b>, 評 đọc <b>ひょう<\/b> (không đục hóa) ＝ <b>ひひょう<\/b>: phê bình. Cụm 〜について批評を書く (viết bài phê bình về…) là kết hợp tự nhiên."}, {"s": "{消毒済|しょうどくず}みの_清潔_なガーゼを{傷口|きずぐち}に当てる。", "o": ["せいげつ", "せいぎつ", "せいけつ", "せいきつ"], "a": 3, "ar": "清潔", "vi": "Đặt miếng gạc sạch đã khử trùng lên miệng vết thương.", "key": [{"w": "清潔", "r": "せいけつ", "hv": "THANH KHIẾT", "m": "sạch sẽ, vệ sinh"}, {"w": "消毒", "r": "しょうどく", "hv": "TIÊU ĐỘC", "m": "khử trùng, sát trùng"}, {"w": "傷口", "r": "きずぐち", "hv": "THƯƠNG KHẨU", "m": "miệng vết thương"}], "x": {"1": "せいげつ: không có từ này. 潔 đọc けつ (âm trong), không đục thành げつ; げつ là âm của 月.", "2": "せいぎつ: không có từ này. 潔 không có âm ぎつ.", "4": "せいきつ: không có từ này. Bẫy nhầm hàng か — 潔 đọc けつ chứ không phải きつ."}, "g": ["<b class=\"jp\">Vます + 済み<\/b> (ずみ): đã xong. 支払い済み (đã thanh toán), 使用済み (đã qua sử dụng).", "<b class=\"jp\">〜に当てる<\/b>: áp, đặt vào. 手を額に当てる (đặt tay lên trán)."], "n": ["潔 đọc けつ: 簡潔 かんけつ (ngắn gọn), 不潔 ふけつ (bẩn, trái nghĩa của 清潔). Kun: 潔い いさぎよい (dứt khoát, thẳng thắn).", "清 đọc せい (清掃 せいそう dọn dẹp), しょう (清浄 しょうじょう). Kun: 清い きよい.", "ガーゼ: gạc y tế (từ tiếng Đức Gaze)."], "why": "清 đọc <b>せい<\/b>, 潔 đọc <b>けつ<\/b> ＝ <b>せいけつ<\/b>: sạch sẽ. Ngữ cảnh ガーゼ (gạc) đã 消毒済み (khử trùng) → sạch, khớp nghĩa 清潔."}, {"s": "{抜|ぬ}き{出|だ}したカードを元の場所に_戻す_。", "o": ["かえす", "もどす", "こわす", "なおす"], "a": 2, "ar": "戻す", "vi": "Đặt tấm thẻ đã rút ra trở lại chỗ cũ.", "key": [{"w": "戻す", "r": "もどす", "hv": "LỆ", "m": "đưa về, trả về (vị trí, trạng thái cũ)"}, {"w": "抜き出す", "r": "ぬきだす", "hv": "BẠT XUẤT", "m": "rút ra, lấy ra"}], "x": {"1": "かえす là 返す: trả lại cho chủ sở hữu (本を返す). Khác chữ; và câu nói về đặt lại vị trí chứ không phải trả cho ai.", "3": "こわす là 壊す: làm hỏng. Khác chữ, ngược nghĩa với ngữ cảnh.", "4": "なおす là 直す (sửa) / 治す (chữa bệnh). Khác chữ; tấm thẻ không bị hỏng nên không “sửa”."}, "g": ["<b class=\"jp\">元の場所に戻す / 元に戻す<\/b>: đặt về chỗ cũ, khôi phục như ban đầu."], "n": ["Cặp tự/tha: 戻る もどる (quay về) / 戻す もどす (đưa về).", "返す trả cho chủ sở hữu; 戻す đưa về vị trí hay trạng thái cũ. 借りた本を返す, 本を棚に戻す.", "On của 戻 là れい (返戻 へんれい, ít gặp)."], "why": "戻す (<b>もどす<\/b>) là đưa về vị trí hay trạng thái cũ. Câu có 元の場所に (về chỗ cũ) — đây chính là collocation 元の場所に戻す. Chữ 戻 chỉ có âm Kun もど(る/す)."}, {"s": "花びんの_破片_が床に飛び散っていた。", "o": ["ひがた", "はへん", "ひへん", "はがた"], "a": 2, "ar": "破片", "vi": "Mảnh vỡ của bình hoa văng tung tóe trên sàn nhà.", "key": [{"w": "破片", "r": "はへん", "hv": "PHÁ PHIẾN", "m": "mảnh vỡ"}, {"w": "飛び散る", "r": "とびちる", "hv": "PHI TÁN", "m": "văng tung tóe, bắn ra khắp nơi"}], "x": {"1": "ひがた là 干潟 (bãi bồi). Khác chữ; 破 không đọc ひ.", "3": "ひへん: không có từ này. 片 đúng là へん nhưng 破 đọc は chứ không phải ひ.", "4": "はがた là 歯形 (dấu răng). 破 đúng là は nhưng 片 trong 破片 đọc On へん, không phải Kun かた (かた chỉ dùng ở 片方, 片道)."}, "g": ["<b class=\"jp\">Vていた<\/b>: trạng thái kết quả trong quá khứ (lúc đó mảnh vỡ đang nằm văng khắp sàn)."], "n": ["破 đọc は: 破産 はさん (phá sản), 突破 とっぱ (đột phá). Kun: 破る やぶる, 破れる やぶれる.", "片 đọc へん: 破片, 断片 だんぺん (đục hóa). Kun かた: 片方 かたほう, 片付ける かたづける, 片道 かたみち."], "why": "破 đọc <b>は<\/b>, 片 đọc <b>へん<\/b> ＝ <b>はへん<\/b>: mảnh vỡ. Ngữ cảnh 花びんの〜が飛び散る (mảnh bình hoa văng tung tóe) khớp nghĩa."}, {"s": "_抽象的_な説明はやめてください。", "o": ["つうしょうてき", "ちゅうぞうてき", "ちゅうしょうてき", "つうぞうてき"], "a": 3, "ar": "抽象的", "vi": "Xin đừng giải thích một cách trừu tượng như vậy.", "key": [{"w": "抽象的", "r": "ちゅうしょうてき", "hv": "TRỪU TƯỢNG ĐÍCH", "m": "trừu tượng"}, {"w": "具体的", "r": "ぐたいてき", "hv": "CỤ THỂ ĐÍCH", "m": "cụ thể (trái nghĩa)"}], "x": {"1": "つうしょうてき: không có từ này. Sai chữ đầu: 抽 đọc ちゅう, không phải つう (つうしょう là 通商, thông thương).", "2": "ちゅうぞうてき: không có từ này. Bẫy nhầm 象 với 像 — 像 luôn đọc ぞう (想像, 画像), còn 象 đọc しょう (trừ khi là con voi).", "4": "つうぞくてき mới là từ có thật (通俗的); つうぞうてき thì không có. Sai cả hai chữ."}, "g": ["<b class=\"jp\">Vるのはやめてください / Nはやめてください<\/b>: xin đừng…, thôi… đi."], "n": ["抽 đọc ちゅう: 抽選 ちゅうせん (câu 13), 抽出 ちゅうしゅつ (trích xuất).", "象 đọc しょう: 印象 いんしょう, 現象 げんしょう, 対象 たいしょう. Đọc ぞう khi là con voi (象).", "像 luôn đọc ぞう: 想像 そうぞう, 画像 がぞう, 映像 えいぞう. Đây là bẫy phổ biến."], "why": "抽 đọc <b>ちゅう<\/b>, 象 trong từ trừu tượng đọc <b>しょう<\/b> (印象, 現象, 対象) ＝ <b>ちゅうしょうてき<\/b>. Ngữ cảnh 〜な説明はやめて (đừng giải thích kiểu…) → trừu tượng, khớp nghĩa."}, {"s": "祖父は孫に_極端_に甘い。", "o": ["きょくたん", "ごくだん", "ごくたん", "きょくだん"], "a": 1, "ar": "極端", "vi": "Ông tôi nuông chiều cháu hết mức.", "key": [{"w": "極端", "r": "きょくたん", "hv": "CỰC ĐOAN", "m": "cực đoan, thái quá"}, {"w": "祖父", "r": "そふ", "hv": "TỔ PHỤ", "m": "ông"}, {"w": "孫", "r": "まご", "hv": "TÔN", "m": "cháu"}], "x": {"2": "ごくだん: không có từ này. Sai cả hai: 極 trong từ này đọc きょく, và 端 không đục thành だん.", "3": "ごくたん: không có từ này. ごく là âm của 極 chỉ trong 極楽, 極秘, 極 (rất); 極端 phải là きょく.", "4": "きょくだん: không có từ này. 極 đúng nhưng 端 bị đục hóa sai — phải là たん."}, "g": ["<b class=\"jp\">〜に甘い<\/b>: dễ dãi, nuông chiều với ai. ↔ 〜に厳しい (nghiêm khắc với…).", "<b class=\"jp\">極端に + A<\/b>: quá mức, thái quá."], "n": ["極 đọc きょく: 積極的 せっきょくてき, 消極的, 北極 ほっきょく. Đọc ごく: 極 ごく (rất), 極楽 ごくらく, 極秘 ごくひ.", "端 đọc たん: 先端 せんたん, 途端 とたん, 半端 はんぱ. Kun: 端 はし (mép), は (端数 はすう)."], "why": "極 đọc <b>きょく<\/b>, 端 đọc <b>たん<\/b> (không đục hóa) ＝ <b>きょくたん<\/b>: cực đoan, thái quá. Cụm 極端に甘い (nuông chiều quá mức) là cách nói quen thuộc."}, {"s": "相手チームは選手層の厚さで我々より_圧倒的_に有利だ。", "o": ["おっとうてき", "あつどうてき", "あっとうてき", "おつどうてき"], "a": 3, "ar": "圧倒的", "vi": "Đội đối phương chiếm ưu thế áp đảo so với chúng tôi nhờ lực lượng cầu thủ dày dặn.", "key": [{"w": "圧倒的", "r": "あっとうてき", "hv": "ÁP ĐẢO ĐÍCH", "m": "mang tính áp đảo"}, {"w": "有利", "r": "ゆうり", "hv": "HỮU LỢI", "m": "có lợi, chiếm ưu thế (↔ 不利 ふり)"}, {"w": "選手層", "r": "せんしゅそう", "hv": "TUYỂN THỦ TẦNG", "m": "đội hình, lực lượng cầu thủ"}], "x": {"1": "おっとうてき: không có từ này. 圧 đọc あ(つ), không phải お.", "2": "あつどうてき: không có từ này. Sai hai chỗ: thiếu âm ngắt (あつ→あっ) và đục hóa 倒 thành どう.", "4": "おつどうてき: không có từ này. Sai cả hai chữ."}, "g": ["<b class=\"jp\">〜で<\/b>: nguyên nhân, căn cứ (nhờ vào…).", "<b class=\"jp\">AはBより〜<\/b>: A hơn B."], "n": ["圧 あつ → あっ khi đứng trước âm t/p/k: 圧倒 あっとう, 圧迫 あっぱく, 圧巻 あっかん. Giữ あつ: 圧力 あつりょく, 気圧 きあつ.", "倒 đọc とう: 倒産 とうさん (phá sản), 面倒 めんどう. Kun: 倒れる たおれる."], "why": "圧 (あつ) đứng trước âm hàng た nên biến thành âm ngắt <b>あっ<\/b>; 倒 đọc <b>とう<\/b> ＝ <b>あっとうてき<\/b>: áp đảo. Ngữ cảnh 我々より〜に有利 (có lợi hơn hẳn) khớp nghĩa."}, {"s": "私たちは建物に{冷房|れいぼう}_装置_を付けた。", "o": ["しょうち", "しょち", "そうち", "そち"], "a": 3, "ar": "装置", "vi": "Chúng tôi đã lắp đặt thiết bị làm lạnh cho tòa nhà.", "key": [{"w": "装置", "r": "そうち", "hv": "TRANG TRÍ", "m": "thiết bị, hệ thống máy móc"}, {"w": "冷房", "r": "れいぼう", "hv": "LÃNH PHÒNG", "m": "điều hòa làm lạnh (↔ 暖房 だんぼう)"}], "x": {"1": "しょうち là 承知 (biết, chấp thuận). Khác chữ, không hợp nghĩa “lắp đặt”.", "2": "しょち là 処置 (xử trí, sơ cứu). Có thật nhưng khác chữ; 装 không đọc しょ.", "4": "そち là 措置 (biện pháp). Bẫy gần âm: thiếu trường âm — 装 phải là そう."}, "g": ["<b class=\"jp\">NにNを付ける<\/b>: gắn, lắp cái gì vào đâu."], "n": ["装 đọc そう: 服装 ふくそう (trang phục), 包装 ほうそう (đóng gói), 改装 かいそう. Đọc しょう: 衣装 いしょう.", "置 đọc ち: 位置 いち, 設置 せっち (lắp đặt), 放置 ほうち (bỏ mặc).", "Nhóm dễ nhầm cùng đuôi 〜ち: 装置 そうち / 処置 しょち / 措置 そち / 設置 せっち."], "why": "装 đọc <b>そう<\/b>, 置 đọc <b>ち<\/b> ＝ <b>そうち<\/b>: thiết bị. Ngữ cảnh 冷房装置を付ける (lắp hệ thống làm lạnh) là collocation cố định."}, {"s": "_抽選_で順番を決めました。", "o": ["ちゅうせん", "つうせん", "つうぜん", "ちゅうぜん"], "a": 1, "ar": "抽選", "vi": "Chúng tôi đã quyết định thứ tự bằng cách bốc thăm.", "key": [{"w": "抽選", "r": "ちゅうせん", "hv": "TRỪU TUYỂN", "m": "bốc thăm, rút thăm, xổ số"}, {"w": "順番", "r": "じゅんばん", "hv": "THUẬN PHIÊN", "m": "thứ tự, lượt"}], "x": {"2": "つうせん: không có từ này. 抽 đọc ちゅう, không phải つう.", "3": "つうぜん: không có từ này. Sai cả hai chữ (つう và ぜん).", "4": "ちゅうぜん: không có từ này. 抽 đúng nhưng 選 không đục thành ぜん."}, "g": ["<b class=\"jp\">Nで決める<\/b>: quyết định bằng (cách)…"], "n": ["選 đọc せん: 選挙 せんきょ, 選手 せんしゅ, 選択 せんたく. Kun: 選ぶ えらぶ.", "抽選に当たる (trúng thăm) / 抽選に外れる (trượt thăm)."], "why": "抽 đọc <b>ちゅう<\/b>, 選 đọc <b>せん<\/b> (âm trong) ＝ <b>ちゅうせん<\/b>: bốc thăm. Ngữ cảnh 〜で順番を決める (quyết định thứ tự bằng…) khớp nghĩa."}, {"s": "住民の_要求_により新しい公園が作られた。", "o": ["よっきゅう", "よっきゅ", "ようきゅう", "ようきゅ"], "a": 3, "ar": "要求", "vi": "Một công viên mới đã được xây theo yêu cầu của người dân.", "key": [{"w": "要求", "r": "ようきゅう", "hv": "YẾU CẦU", "m": "yêu cầu, đòi hỏi"}, {"w": "住民", "r": "じゅうみん", "hv": "TRÚ DÂN", "m": "cư dân"}], "x": {"1": "よっきゅう là 欲求 (ham muốn, nhu cầu bản năng). Có thật nhưng khác chữ: 欲 (DỤC) mới có âm ngắt よっ.", "2": "よっきゅ: không có từ này. Vừa sai âm ngắt vừa thiếu trường âm.", "4": "ようきゅ: không có từ này. Thiếu trường âm ở 求 — phải là きゅう."}, "g": ["<b class=\"jp\">Nにより / Nによって<\/b>: do, theo, dựa trên.", "<b class=\"jp\">作られた<\/b>: bị động quá khứ (đã được xây dựng)."], "n": ["Cả hai chữ đều có trường âm: 要 よう (必要, 重要, 要点) + 求 きゅう (請求 せいきゅう, 追求 ついきゅう). Kun: 求める もとめる.", "So sánh: 要求 (đòi hỏi, mạnh), 要望 ようぼう (nguyện vọng, nhẹ hơn), 請求 せいきゅう (đòi thanh toán, yêu cầu chính thức)."], "why": "要 đọc <b>よう<\/b> (có trường âm), 求 đọc <b>きゅう<\/b> (có trường âm) ＝ <b>ようきゅう<\/b>: yêu cầu. Ngữ cảnh 住民の要求により (theo yêu cầu của người dân) khớp nghĩa."}, {"s": "彼は_世の中_のことは何も知らなかった。", "o": ["よのなか", "せのなか", "せのうち", "よのうち"], "a": 1, "ar": "世の中", "vi": "Anh ấy chẳng biết gì về sự đời cả.", "key": [{"w": "世の中", "r": "よのなか", "hv": "THẾ TRUNG", "m": "xã hội, thế gian, sự đời"}], "x": {"2": "せのなか: không có từ này. せ là âm On của 世 (世間, 世話), không dùng trong từ thuần Nhật có の.", "3": "せのうち: không có từ này. Sai cả hai chữ; うち là âm Kun của 内, không phải của 中.", "4": "よのうち: không có từ này. 世 đúng là よ nhưng 中 đọc なか, không phải うち."}, "g": ["<b class=\"jp\">何も〜ない<\/b>: hoàn toàn không… gì."], "n": ["世 đọc よ (Kun): この世, あの世. Đọc せ: 世間 せけん, 世話 せわ, 世界 せかい. Đọc せい: 世紀 せいき.", "Liên quan: 世間知らず せけんしらず (người ngây ngô, không biết sự đời)."], "why": "世の中 đọc hoàn toàn bằng âm Kun: 世 <b>よ<\/b> ＋ の ＋ 中 <b>なか<\/b> ＝ <b>よのなか<\/b>: xã hội, sự đời. Có の ở giữa là dấu hiệu từ thuần Nhật, nên dùng âm Kun."}, {"s": "壁の絵が少し_傾いて_いる。", "o": ["きずついて", "かたむいて", "かわいて", "ういて"], "a": 2, "ar": "傾く → かたむく", "vi": "Bức tranh trên tường hơi bị nghiêng.", "key": [{"w": "傾く", "r": "かたむく", "hv": "KHUYNH", "m": "nghiêng; (kinh tế, vận nước) suy vi"}], "x": {"1": "きずついて là 傷つく (bị thương, tổn thương). Khác chữ; tranh không “bị thương”.", "3": "かわいて là 乾く (khô) / 渇く (khát). Khác chữ, không hợp nghĩa.", "4": "ういて là 浮く (nổi). Khác chữ; tranh treo tường không “nổi”."}, "g": ["<b class=\"jp\">Vている<\/b>: trạng thái hiện tại do kết quả của hành động (đang ở tình trạng nghiêng)."], "n": ["Tha động từ: 傾ける かたむける. 耳を傾ける: lắng nghe chăm chú.", "On けい: 傾向 けいこう (khuynh hướng), 傾斜 けいしゃ (độ dốc)."], "why": "傾く đọc <b>かたむく<\/b>: nghiêng. Ngữ cảnh 壁の絵が少し〜ている (bức tranh trên tường hơi…) → bị nghiêng, khớp nghĩa."}, {"s": "皆様のあたたかいご_声援_に応えるように努力します。", "o": ["せいえん", "しえん", "せいいん", "しいん"], "a": 1, "ar": "声援", "vi": "Tôi sẽ nỗ lực để đáp lại sự cổ vũ nồng nhiệt của mọi người.", "key": [{"w": "声援", "r": "せいえん", "hv": "THANH VIỆN", "m": "tiếng cổ vũ, sự cổ vũ"}, {"w": "応える", "r": "こたえる", "hv": "ỨNG", "m": "đáp lại, đáp ứng (kỳ vọng, cổ vũ)"}], "x": {"2": "しえん là 支援 (hỗ trợ). Có thật nhưng khác chữ: 声 không đọc し.", "3": "せいいん: 声 đúng nhưng 援 đọc えん chứ không phải いん.", "4": "しいん là 子音 (phụ âm) / 死因 (nguyên nhân tử vong). Sai cả hai chữ."}, "g": ["<b class=\"jp\">〜に応える<\/b>: đáp lại. 期待に応える (đáp ứng kỳ vọng). Khác 答える (trả lời câu hỏi).", "<b class=\"jp\">Vるように努力する<\/b>: nỗ lực để có thể…"], "n": ["援 đọc えん: 応援 おうえん, 援助 えんじょ (viện trợ), 救援 きゅうえん (cứu viện).", "声 đọc せい: 音声 おんせい, 名声 めいせい. Kun: こえ, こわ (声色 こわいろ)."], "why": "声 đọc <b>せい<\/b>, 援 đọc <b>えん<\/b> ＝ <b>せいえん<\/b>: sự cổ vũ (bằng tiếng hô). Ngữ cảnh あたたかいご声援に応える (đáp lại sự cổ vũ nồng nhiệt) là câu cảm ơn quen thuộc của vận động viên."}, {"s": "簡単な質問に答えられなくて_恥_をかいた。", "o": ["はし", "はず", "はす", "はじ"], "a": 4, "ar": "恥", "vi": "Tôi bẽ mặt vì không trả lời được một câu hỏi đơn giản.", "key": [{"w": "恥", "r": "はじ", "hv": "SỈ", "m": "nỗi xấu hổ, sự bẽ mặt"}], "x": {"1": "はし là 橋 / 端 / 箸. Sai vì âm cuối là し trong, còn 恥 là じ đục.", "2": "はず là 筈 (lẽ ra). Bẫy vì 恥ずかしい đọc はずかしい, nhưng danh từ 恥 một mình đọc はじ.", "3": "はす là 蓮 (hoa sen). Không phải cách đọc của 恥."}, "g": ["<b class=\"jp\">恥をかく<\/b>: bị bẽ mặt, xấu hổ (quán ngữ, dùng động từ かく). 恥をかかせる: làm ai bẽ mặt.", "<b class=\"jp\">Vられなくて<\/b>: không thể… nên (nguyên nhân)."], "n": ["Cùng chữ 恥: 恥じる はじる (hổ thẹn), 恥ずかしい はずかしい (xấu hổ). On ち: 恥辱 ちじょく.", "Quán ngữ khác với かく: 汗をかく (đổ mồ hôi), いびきをかく (ngáy), あぐらをかく (ngồi xếp bằng)."], "why": "恥 âm Kun đọc <b>はじ<\/b>: nỗi xấu hổ. Quán ngữ cố định <b>恥をかく<\/b> (bị bẽ mặt) — đi với động từ かく."}, {"s": "そのがけは地面に対してほとんど_垂直_です。", "o": ["すいちょく", "ついちょく", "すいじき", "ついじき"], "a": 1, "ar": "垂直", "vi": "Vách đá đó gần như thẳng đứng so với mặt đất.", "key": [{"w": "垂直", "r": "すいちょく", "hv": "THÙY TRỰC", "m": "thẳng đứng, vuông góc"}, {"w": "水平", "r": "すいへい", "hv": "THỦY BÌNH", "m": "nằm ngang (trái nghĩa)"}], "x": {"2": "ついちょく: không có từ này. 垂 đọc すい, không phải つい.", "3": "すいじき: không có từ này. じき chỉ là âm của 直 trong 正直, 直に; ở 垂直 phải là ちょく.", "4": "ついじき: không có từ này. Sai cả hai chữ."}, "g": ["<b class=\"jp\">〜に対して<\/b>: đối với, so với (ở đây là so với mặt đất)."], "n": ["垂 Kun: 垂れる たれる (rủ xuống), 垂らす たらす (nhỏ giọt, thả xuống).", "直 đọc ちょく: 直接 ちょくせつ, 直線 ちょくせん. じき: 正直. Kun: 直す なおす, 直ちに ただちに.", "がけ (崖): vách đá."], "why": "垂 đọc <b>すい<\/b>, 直 đọc <b>ちょく<\/b> ＝ <b>すいちょく<\/b>: thẳng đứng. Ngữ cảnh 地面に対してほとんど〜 (gần như … so với mặt đất) khớp nghĩa thẳng đứng."}, {"s": "いとこが今月_下旬_うちへ遊びに来る予定だ。", "o": ["げじゅん", "けじゅん", "げしゅん", "けしゅん"], "a": 1, "ar": "下旬", "vi": "Cuối tháng này anh chị em họ của tôi dự định đến nhà tôi chơi.", "key": [{"w": "下旬", "r": "げじゅん", "hv": "HẠ TUẦN", "m": "hạ tuần (ngày 21 đến cuối tháng)"}, {"w": "上旬", "r": "じょうじゅん", "hv": "THƯỢNG TUẦN", "m": "ngày 1–10"}, {"w": "中旬", "r": "ちゅうじゅん", "hv": "TRUNG TUẦN", "m": "ngày 11–20"}], "x": {"2": "けじゅん: không có từ này. 下 đọc げ hoặc か, không bao giờ là け.", "3": "げしゅん: không có từ này. Bẫy: 旬 một mình đọc しゅん (đúng mùa), nhưng trong 上旬・中旬・下旬 đọc じゅん.", "4": "けしゅん: không có từ này. Sai cả hai chữ."}, "g": ["<b class=\"jp\">Vます + に来る<\/b>: đến để làm gì. 遊びに来る."], "n": ["下 đọc げ: 下車 げしゃ, 下品 げひん, 下水 げすい, 下旬. Đọc か: 地下 ちか, 下流 かりゅう.", "旬 しゅん: 旬の野菜 (rau đúng mùa)."], "why": "下 trong nhóm 上旬・中旬・下旬 đọc <b>げ<\/b>, 旬 đọc <b>じゅん<\/b> ＝ <b>げじゅん<\/b>: hạ tuần (ngày 21 đến cuối tháng). Câu có 今月 (tháng này) → chỉ khoảng thời gian trong tháng, khớp nghĩa."}], "no": 1, "cat": "Kanji", "file": "ĐỀ 13 - KANJI N2", "folderLabel": "Kanji", "sum": [{"h": "5 kiểu bẫy hay gặp trong 漢字読み (問題1)", "tbl": {"head": ["Kiểu bẫy", "Ví dụ trong đề", "Cách tránh"], "rows": [["Trường âm có / không", "処理 しょり ≠ しょうり (勝利); 要求 ようきゅう ≠ ようきゅ", "Học thuộc chữ đọc ngắn: 処 しょ, 所 しょ, 書 しょ; chữ đọc dài: 要 よう, 求 きゅう, 装 そう"], ["Âm ngắt っ (促音)", "圧倒 あっとう ≠ あつどう; 欲求 よっきゅう", "Âm cuối つ・く・ち + âm đầu hàng か・さ・た・は → thường thành っ"], ["Đục hóa (濁音) sai", "批評 ひひょう ≠ ひびょう; 極端 たん ≠ だん; 抽選 せん ≠ ぜん", "Từ Hán 2 chữ thường KHÔNG đục hóa; ngoại lệ phải nhớ riêng (断片 だんぺん)"], ["Chữ giống nhau, âm khác", "抽象 しょう ≠ 像 ぞう", "象 しょう (印象, 現象); 像 ぞう (想像, 画像)"], ["Trộn On / Kun", "行事 ぎょうじ ≠ ぎょうごと; 地元 じもと", "Từ Hán thường On+On; 重箱読み (On+Kun) như 地元, 本物 phải học riêng"]]}}, {"h": "Chữ Hán nhiều cách đọc xuất hiện trong đề", "tbl": {"head": ["Chữ", "Các cách đọc", "Ví dụ"], "rows": [["行", "こう / ぎょう / あん / い(く) / おこな(う)", "旅行 / 行事・行列 / 行灯 / 行く / 行う"], ["事", "じ / ず / こと", "火事・食事 / 好事家 / 仕事・出来事"], ["地", "ち / じ", "地下・地図・地域 / 地元・地震・地味"], ["極", "きょく / ごく / きわ(める)", "極端・積極的 / 極楽・極秘 / 極める"], ["世", "せ / せい / よ", "世間・世話 / 世紀 / 世の中・この世"], ["下", "か / げ / した / しも / さ(げる)", "地下 / 下旬・下車 / 下 / 下半期 / 下げる"], ["直", "ちょく / じき / なお(す) / ただ(ちに)", "垂直・直接 / 正直 / 直す / 直ちに"], ["旬", "じゅん / しゅん", "上旬・中旬・下旬 / 旬の野菜"], ["辛", "しん / から(い) / つら(い)", "香辛料 / 辛いカレー / 辛い別れ"]]}}, {"h": "Quy tắc biến âm nên thuộc", "li": ["<b>促音化<\/b> (thêm っ): 学＋校 → がっこう, 一＋回 → いっかい, 発＋表 → はっぴょう, 圧＋倒 → あっとう, 決＋定 → けってい.", "<b>連濁<\/b> (đục hóa ở từ ghép thuần Nhật): 手＋紙 → てがみ, 本＋棚 → ほんだな, 傷＋口 → きずぐち. Từ Hán ghép ít khi đục hóa.", "<b>Âm ngắn ↔ dài dễ nhầm<\/b>: 処 しょ / 勝 しょう; 修 しゅう / 手 しゅ; 措 そ / 装 そう; 欲 よく / 要 よう.", "Chữ có の ở giữa (世の中, 目の前, 気の毒) gần như luôn đọc theo âm Kun."]}, {"h": "Nhóm từ mở rộng theo chủ đề", "li": ["<b>Thời gian trong tháng<\/b>: 上旬 じょうじゅん (1–10), 中旬 ちゅうじゅん (11–20), 下旬 げじゅん (21–cuối). Tương tự: 月初め つきはじめ, 月末 げつまつ, 年末 ねんまつ.", "<b>Năm vị<\/b>: 甘い あまい, 辛い からい, 苦い にがい, 酸っぱい すっぱい, 塩辛い しおからい. Thêm: 渋い しぶい (chát), 臭い くさい (hôi).", "<b>Đuôi 〜置<\/b>: 装置 そうち (thiết bị), 処置 しょち (xử trí), 措置 そち (biện pháp), 設置 せっち (lắp đặt), 位置 いち (vị trí), 放置 ほうち (bỏ mặc).", "<b>Đuôi 〜援<\/b>: 声援 せいえん (cổ vũ), 応援 おうえん (ủng hộ), 支援 しえん (hỗ trợ), 援助 えんじょ (viện trợ), 救援 きゅうえん (cứu viện).", "<b>Cặp trái nghĩa<\/b>: 抽象的 ↔ 具体的 ぐたいてき; 清潔 ↔ 不潔 ふけつ; 垂直 ↔ 水平 すいへい; 有利 ↔ 不利 ふり; 積極的 ↔ 消極的."]}, {"h": "Động từ / tính từ Kun trong đề", "li": ["戻す もどす (đưa về chỗ cũ) / 戻る もどる; khác 返す かえす (trả cho người khác).", "傾く かたむく (nghiêng) / 傾ける かたむける — 耳を傾ける: lắng nghe; 傾向 けいこう: khuynh hướng.", "恥 はじ: 恥をかく (bẽ mặt), 恥じる はじる (hổ thẹn), 恥ずかしい はずかしい (xấu hổ).", "Quán ngữ đi với かく: 恥をかく, 汗をかく, いびきをかく, あぐらをかく."]}], "source": {"folder": "https://drive.google.com/drive/folders/1LAixdU5Je_Sl-HqNtl3C_22oaubkXufA", "goc": "https://drive.google.com/file/d/11PYSBCqOM-oxvMjCTAg0iGUaXNPw5Lj6/view", "chua": "https://drive.google.com/file/d/11Res_rm63WqK8ugILN5aG9KFosG8G3rc/view"}, "series": "DORA Nihongo · Đề 1 · Kanji N5–N2 trúng tủ"}, {"jp": "文脈規定", "title": "Đề 2 · Từ vựng N2", "mondai": "<b>問題4<\/b> （　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。 Chọn từ thích hợp nhất để điền vào chỗ trống.", "notice": "Thư mục trên Drive tên là “Đề 2 · Ngữ pháp”, nhưng file bên trong là <b>ĐỀ 7 · Từ vựng N2<\/b>. Trang này theo đúng nội dung file.", "qs": [{"s": "わが校の（　）は国際交流に力を入れていることだ。", "o": ["調子", "異色", "特色", "様子"], "a": 3, "ar": "とくしょく", "vi": "Nét đặc sắc của trường chúng tôi là chú trọng vào giao lưu quốc tế.", "key": [{"w": "特色", "r": "とくしょく", "hv": "ĐẶC SẮC", "m": "nét đặc sắc, điểm nổi bật riêng"}, {"w": "国際交流", "r": "こくさいこうりゅう", "hv": "QUỐC TẾ GIAO LƯU", "m": "giao lưu quốc tế"}], "x": {"1": "調子 (tình trạng, phong độ): nói về sức khỏe, máy móc, nhịp điệu (体の調子). Không dùng để nêu “nét riêng của trường”.", "2": "異色 (khác thường, độc đáo hơn số đông): thường dùng dạng 異色の作品, 異色の経歴 để bổ nghĩa. “Cái khác thường của trường là…” nghe không tự nhiên; câu cần “nét đặc trưng”.", "4": "様子 (dáng vẻ, tình hình quan sát bằng mắt): 様子を見る. Không dùng để định nghĩa thế mạnh của tổ chức."}, "g": ["<b class=\"jp\">AはBことだ<\/b>: A là việc B (giải thích nội dung của A).", "<b class=\"jp\">〜に力を入れる<\/b>: dồn sức, chú trọng vào."], "n": ["特色 gần nghĩa 特徴 とくちょう (đặc trưng, trung tính). 特色 thường mang sắc thái tích cực, là điểm riêng đáng chú ý."], "why": "Mẫu câu <b>AはBことだ<\/b>: A là điểm gì đó, B giải thích nội dung. Chỗ trống phải là danh từ chỉ “điểm riêng, nét nổi bật” của trường → <b>特色<\/b> (đặc sắc). わが校の特色 là cụm hay dùng khi giới thiệu trường."}, {"s": "あの会社はいろんな問題を（　）いる。", "o": ["むかえて", "かかえて", "かぎって", "にぎって"], "a": 2, "ar": "抱える", "vi": "Công ty đó đang ôm rất nhiều vấn đề.", "key": [{"w": "抱える", "r": "かかえる", "hv": "BÃO", "m": "ôm (trong tay); gánh, mang (vấn đề, nợ, nỗi lo)"}], "x": {"1": "迎える (đón): đối tượng là người, thời điểm (客を迎える, 新年を迎える). Không “đón” vấn đề.", "3": "限る (giới hạn): hầu như chỉ dùng trong mẫu 〜に限る, 〜に限って, 〜とは限らない; không nhận 問題を làm tân ngữ với nghĩa này.", "4": "握る (nắm chặt): đi với vật cụ thể hoặc quyền lực (手を握る, 権力を握る, 秘密を握る). “Nắm vấn đề” không phải collocation."}, "g": ["<b class=\"jp\">Vている<\/b>: trạng thái kéo dài (đang mang vấn đề)."], "n": ["Collocation: 問題を抱える, 借金を抱える (gánh nợ), 悩みを抱える (mang nỗi lo), 頭を抱える (vò đầu bứt tai).", "Cùng chữ 抱: 抱く だく (ôm) / いだく (ấp ủ: 夢を抱く)."], "why": "Tân ngữ là 問題 (vấn đề). Kết hợp cố định: <b>問題を抱える<\/b> (đang ôm, gánh vấn đề). Thể ている chỉ trạng thái kéo dài — công ty đang mang nhiều vấn đề."}, {"s": "最終コーナーを曲がったとき、ひざに（　）痛みを感じた。", "o": ["ほそい", "するどい", "にぶい", "あらい"], "a": 3, "ar": "鈍い", "vi": "Lúc rẽ qua khúc cua cuối cùng, tôi thấy một cơn đau âm ỉ ở đầu gối.", "key": [{"w": "鈍い", "r": "にぶい", "hv": "ĐỘN", "m": "âm ỉ (cơn đau); cùn; chậm chạp"}, {"w": "痛み", "r": "いたみ", "hv": "THỐNG", "m": "cơn đau"}], "x": {"1": "細い (mảnh, gầy): tả hình dáng (細い道, 細い指). Không dùng tả cơn đau.", "2": "鋭い (sắc, nhọn): 鋭い痛み (đau nhói) cũng là cụm có thật. Đề chọn 鈍い; khi gặp cả hai trong đề, xem kỹ ngữ cảnh (đau như dao đâm → 鋭い; ê ẩm, nặng → 鈍い). Nên nhớ cả cặp.", "4": "粗い (thô ráp) / 荒い (dữ dội): tả bề mặt hoặc tính chất (目が粗い, 波が荒い, 金遣いが荒い). Không đi với 痛み."}, "g": ["<b class=\"jp\">Vたとき<\/b>: khi đã (làm xong hành động)…"], "n": ["鈍い còn dùng: 動きが鈍い (chậm chạp), 勘が鈍い (kém nhạy), 鈍い音 (tiếng động trầm đục).", "Tả cơn đau: ずきずき (nhức từng cơn), ちくちく (châm chích), ひりひり (rát), がんがん (đau như búa bổ)."], "why": "Danh từ cần bổ nghĩa là 痛み (cơn đau). Tính từ tả kiểu đau: <b>鈍い痛み<\/b> (đau âm ỉ) và 鋭い痛み (đau nhói). Đáp án của đề là 鈍い — cơn đau ê ẩm ở đầu gối khi chạy vào khúc cua cuối."}, {"s": "明日ゴルフだというのに（　）雨のようですね。", "o": ["うっかり", "せっかく", "あいにく", "わざわざ"], "a": 3, "ar": "生憎", "vi": "Mai đi chơi gôn vậy mà không may có vẻ trời lại mưa nhỉ.", "key": [{"w": "あいにく", "r": "あいにく", "hv": "(生憎)", "m": "không may, đáng tiếc (trái với mong đợi)"}], "x": {"1": "うっかり (sơ ý, lơ đễnh): chỉ hành động vô ý của con người (うっかり忘れた). Thời tiết không thể “sơ ý”.", "2": "せっかく (cất công, hiếm có): đi với danh từ hay hành động đáng quý (せっかくの休み, せっかく来たのに). “せっかく雨” vô nghĩa — mưa không phải điều đáng quý ở đây.", "4": "わざわざ (cất công, cố tình): chỉ hành động có chủ ý của người (わざわざ来てくれた). Mưa không có chủ ý."}, "g": ["<b class=\"jp\">〜というのに<\/b>: vậy mà, thế mà (bất mãn vì kết quả trái mong đợi).", "<b class=\"jp\">Nのようだ<\/b>: có vẻ là N."], "n": ["あいにく còn dùng khi từ chối lịch sự: あいにく、その日は都合が悪いです (rất tiếc hôm đó tôi bận)."], "why": "Câu có <b>〜というのに<\/b> (vậy mà) → kết quả trái mong đợi, không may. Phó từ chỉ “thật không may (do hoàn cảnh)” là <b>あいにく<\/b>. Trời mưa đúng ngày đi gôn → あいにく雨."}, {"s": "ずっと彼にうそをついているのが（　）なってきた。", "o": ["痛ましく", "つらく", "重苦しく", "にくく"], "a": 2, "ar": "辛い → つらい", "vi": "Cứ phải nói dối anh ấy mãi khiến tôi thấy ngày càng khổ sở.", "key": [{"w": "辛い", "r": "つらい", "hv": "TÂN", "m": "khổ sở, đau khổ, nặng nề (cảm giác của bản thân)"}], "x": {"1": "痛ましい (thương tâm): cảm xúc khi chứng kiến bi kịch của người khác (痛ましい事故). Không tả cảm giác của bản thân khi nói dối.", "3": "重苦しい (nặng nề, ngột ngạt): tả bầu không khí, tâm trạng chung (重苦しい雰囲気). Không hợp với chủ ngữ “việc nói dối”.", "4": "にくい (憎い: đáng ghét): sai nghĩa. Nếu hiểu là đuôi 〜にくい (khó làm) thì phải gắn sau Vます, không đứng một mình."}, "g": ["<b class=\"jp\">Aく + なってきた<\/b>: dần trở nên… (biến đổi tới hiện tại).", "<b class=\"jp\">Vているのが〜<\/b>: の danh từ hóa mệnh đề."], "n": ["Cùng chữ 辛: からい (cay) — xem Đề 1 câu 4."], "why": "Chủ thể cảm nhận là chính người nói (nói dối mãi thấy khổ). Tính từ chỉ nỗi khổ sở của bản thân là <b>つらい<\/b> (辛い). Aく＋なってきた: dần trở nên khổ sở."}, {"s": "彼女とは久しぶりに会ったので、何時間話しても話が（　）。", "o": ["限りない", "衰えない", "尽きない", "枯れない"], "a": 3, "ar": "つきない", "vi": "Lâu lắm mới gặp lại cô ấy nên nói chuyện mấy tiếng đồng hồ vẫn không hết chuyện.", "key": [{"w": "尽きる", "r": "つきる", "hv": "TẬN", "m": "cạn, hết"}], "x": {"1": "限りない (vô hạn): là tính từ dùng bổ nghĩa trước danh từ (限りない愛). “話が限りない” không phải cách nói.", "2": "衰えない (không suy yếu): chủ ngữ phải là thứ có sức lực, độ nổi tiếng (体力, 人気). Câu chuyện không “suy yếu”.", "4": "枯れない (không héo): dùng cho cây cỏ, nguồn nước (花が枯れる, 井戸が枯れる). Không dùng cho câu chuyện."}, "g": ["<b class=\"jp\">何時間〜ても<\/b>: dù bao nhiêu tiếng… đi nữa.", "<b class=\"jp\">Nとは<\/b>: với N thì (nhấn mạnh đối tượng)."], "n": ["Collocation: 話が尽きない (nói mãi không hết), 話題が尽きない, 力が尽きる (kiệt sức), 運が尽きる (hết vận).", "Tha động từ: 尽くす つくす (tận lực): 全力を尽くす."], "why": "Chủ ngữ là 話 (câu chuyện). Collocation <b>話が尽きない<\/b>: chuyện nói mãi không hết. 尽きる (cạn, hết) ở thể phủ định. Ngữ cảnh lâu ngày gặp lại, nói mấy tiếng vẫn không hết chuyện → hợp."}, {"s": "給与を引き上げただけでは社員の不満は（　）しない。", "o": ["停止", "減量", "削除", "解消"], "a": 4, "ar": "かいしょう", "vi": "Chỉ tăng lương thôi thì không giải tỏa được sự bất mãn của nhân viên.", "key": [{"w": "解消", "r": "かいしょう", "hv": "GIẢI TIÊU", "m": "giải tỏa, xóa bỏ (vấn đề, bất mãn); hủy (hợp đồng, hôn ước)"}, {"w": "給与", "r": "きゅうよ", "hv": "CẤP DỮ", "m": "tiền lương"}, {"w": "引き上げる", "r": "ひきあげる", "hv": "DẪN THƯỢNG", "m": "nâng lên, tăng (giá, lương)"}], "x": {"1": "停止 (đình chỉ, dừng): dùng cho hoạt động, máy móc (運転停止, 営業停止). Không dùng cho cảm xúc.", "2": "減量 (giảm lượng, giảm cân): dùng cho cân nặng, khối lượng. 不満が減量 không phải cách nói.", "3": "削除 (xóa bỏ): dùng cho dữ liệu, câu chữ, điều khoản (データを削除). Không dùng cho cảm xúc."}, "g": ["<b class=\"jp\">Vただけでは〜ない<\/b>: chỉ riêng việc… thì chưa (đủ để)…"], "n": ["Collocation: ストレス解消, 不満を解消する, 渋滞を解消する, 契約を解消する."], "why": "Đối tượng là 不満 (bất mãn). Collocation <b>不満を解消する<\/b>: giải tỏa, xóa bỏ bất mãn. Câu: chỉ tăng lương thì sự bất mãn cũng không được giải tỏa."}, {"s": "彼は収入に（　）して出費が多くなった。", "o": ["対応", "比例", "応答", "比較"], "a": 2, "ar": "ひれい", "vi": "Chi tiêu của anh ấy tăng lên tỷ lệ thuận với thu nhập.", "key": [{"w": "比例", "r": "ひれい", "hv": "TỶ LỆ", "m": "tỷ lệ thuận"}, {"w": "出費", "r": "しゅっぴ", "hv": "XUẤT PHÍ", "m": "chi tiêu, khoản chi"}, {"w": "収入", "r": "しゅうにゅう", "hv": "THU NHẬP", "m": "thu nhập"}], "x": {"1": "対応 (ứng phó, đáp ứng): 〜に対応する nghĩa là ứng phó với thay đổi, đáp ứng khách. Không diễn tả “tăng theo”.", "3": "応答 (trả lời, phản hồi): dùng cho hỏi–đáp, tín hiệu. Không có nghĩa tỷ lệ.", "4": "比較 (so sánh): đi với と (〜と比較して) và chỉ so sánh, không nói chi tiêu tăng theo thu nhập."}, "g": ["<b class=\"jp\">〜に比例して<\/b>: tỷ lệ thuận với… ↔ 〜に反比例して はんぴれい (tỷ lệ nghịch)."], "n": ["Mẫu gần nghĩa ở N2: 〜につれて, 〜に伴って, 〜とともに (cùng với… thì…)."], "why": "Chi tiêu tăng theo thu nhập → quan hệ tăng cùng chiều. Mẫu <b>〜に比例して<\/b>: tỷ lệ thuận với. Trợ từ に trước chỗ trống cũng khớp với 比例する."}, {"s": "ぼくの部屋は通りに（　）いるから、ときどきうるさいんだ。", "o": ["対して", "属して", "適して", "面して"], "a": 4, "ar": "面する", "vi": "Phòng tớ nhìn ra đường nên thỉnh thoảng ồn lắm.", "key": [{"w": "面する", "r": "めんする", "hv": "DIỆN", "m": "hướng ra, giáp mặt với"}], "x": {"1": "対する (đối với): gần như chỉ dùng trong mẫu 〜に対して (đối với, trái với). Không tả vị trí.", "2": "属する (thuộc về): dùng cho tổ chức, nhóm (クラブに属する). Căn phòng không “thuộc về” con đường.", "3": "適する (thích hợp): 〜に適している (phù hợp với). Nói “phòng phù hợp với đường” không hợp nghĩa và không giải thích được lý do ồn."}, "g": ["<b class=\"jp\">〜んだ<\/b>: giải thích lý do (khẩu ngữ)."], "n": ["Hay gặp: 海に面したホテル (khách sạn nhìn ra biển), 危機に面する (đối mặt khủng hoảng; thường dùng 直面する ちょくめんする)."], "why": "Câu tả vị trí căn phòng (nhìn ra đường nên ồn). Động từ chỉ “hướng ra, giáp mặt với” là <b>面する<\/b>: 通りに面している."}, {"s": "{洗面所|せんめんじょ}のトイレが一つ（　）いて使えません。", "o": ["つまって", "もぐって", "うまいて", "しずんで"], "a": 1, "ar": "詰まる", "vi": "Một bồn cầu trong nhà vệ sinh bị tắc nên không dùng được.", "key": [{"w": "詰まる", "r": "つまる", "hv": "CẬT", "m": "tắc, nghẽn, kẹt; kín, đầy"}, {"w": "洗面所", "r": "せんめんじょ", "hv": "TẨY DIỆN SỞ", "m": "chỗ rửa mặt; nhà vệ sinh"}], "x": {"2": "潜る (lặn, chui vào): chủ thể là người, động vật (海に潜る, 布団に潜る). Bồn cầu không “lặn”.", "3": "Đề in “うまいて” — không có dạng này (nhiều khả năng là lỗi in của 埋まって: bị lấp, kín chỗ). Kể cả là 埋まる thì cũng dùng cho chỗ ngồi, hố đất, không dùng cho bồn cầu bị tắc.", "4": "沈む (chìm, lặn): dùng cho tàu, mặt trời (船が沈む). Không hợp nghĩa."}, "g": ["<b class=\"jp\">Vて + 使えません<\/b>: vì… nên không thể dùng."], "n": ["詰まる: 鼻が詰まる (nghẹt mũi), 言葉に詰まる (nghẹn lời), 予定が詰まっている (lịch kín).", "Tha động từ: 詰める つめる (nhồi, xếp chặt; ngồi xích lại)."], "why": "Bồn cầu không dùng được → bị tắc. Động từ chỉ đường ống bị nghẽn là <b>詰まる<\/b>: トイレが詰まる."}, {"s": "ロシア語ができるのが彼女の（　）ですね。", "o": ["強み", "深み", "重み", "高み"], "a": 1, "ar": "つよみ", "vi": "Biết tiếng Nga chính là thế mạnh của cô ấy nhỉ.", "key": [{"w": "強み", "r": "つよみ", "hv": "CƯỜNG", "m": "điểm mạnh, thế mạnh (↔ 弱み よわみ)"}], "x": {"2": "深み (chiều sâu, độ đậm): dùng cho hương vị, tính cách (味に深みがある). Không phải lợi thế kỹ năng.", "3": "重み (sức nặng, uy tín): dùng cho lời nói, trách nhiệm (言葉の重み). Không nói kỹ năng ngoại ngữ là “sức nặng”.", "4": "高み (chỗ cao): chủ yếu trong 高みの見物 (đứng ngoài xem). Không hợp nghĩa."}, "g": ["<b class=\"jp\">Vるのが〜だ<\/b>: việc… là…"], "n": ["Hậu tố 〜み tạo danh từ chỉ điểm, cảm nhận: 強み, 弱み, 楽しみ, 悲しみ. 〜さ chỉ mức độ đo được: 強さ, 深さ.", "弱みを握る: nắm được điểm yếu của ai."], "why": "Biết tiếng Nga là lợi thế của cô ấy → <b>強み<\/b> (điểm mạnh). Hậu tố 〜み biến tính từ thành danh từ chỉ “điểm, cảm giác”."}, {"s": "秋は読書の（　）です。", "o": ["マスター", "コーラス", "パートナー", "シーズン"], "a": 4, "ar": "season", "vi": "Mùa thu là mùa đọc sách.", "key": [{"w": "シーズン", "r": "シーズン", "hv": "—", "m": "mùa, thời điểm thích hợp (season)"}, {"w": "読書", "r": "どくしょ", "hv": "ĐỘC THƯ", "m": "đọc sách"}], "x": {"1": "マスター (chủ quán, thạc sĩ, thành thạo): không chỉ thời gian; “mùa thu là chủ quán của việc đọc sách” vô nghĩa.", "2": "コーラス (hợp xướng): không liên quan đến mùa hay đọc sách.", "3": "パートナー (đối tác, bạn đời): không chỉ thời gian."}, "n": ["Các cụm quen thuộc về mùa thu: 読書の秋, スポーツの秋, 食欲の秋, 芸術の秋.", "Liên quan: シーズンオフ (mùa thấp điểm), オフシーズン, 受験シーズン (mùa thi)."], "why": "Cụm cố định <b>読書のシーズン<\/b> / 読書の秋: mùa thu là mùa đọc sách. シーズン ＝ mùa, thời điểm thích hợp."}, {"s": "雨に降られて、{上着|うわぎ}が（　）{濡|ぬ}れた。", "o": ["ぐっすり", "ぐったり", "ぴったり", "びっしょり"], "a": 4, "ar": "びっしょり", "vi": "Bị mắc mưa nên áo khoác ướt sũng.", "key": [{"w": "びっしょり", "r": "びっしょり", "hv": "—", "m": "ướt sũng, ướt đẫm"}, {"w": "上着", "r": "うわぎ", "hv": "THƯỢNG TRƯỚC", "m": "áo khoác"}, {"w": "濡れる", "r": "ぬれる", "hv": "NHU", "m": "bị ướt"}], "x": {"1": "ぐっすり (ngủ say): chỉ đi với 眠る, 寝る.", "2": "ぐったり (mệt lả, rũ rượi): tả cơ thể kiệt sức, không tả quần áo ướt.", "3": "ぴったり (vừa khít, vừa khớp): tả kích cỡ, thời gian (サイズがぴったり). Không đi với 濡れる."}, "g": ["<b class=\"jp\">雨に降られる<\/b>: bị động gián tiếp (bị làm phiền), bị mắc mưa."], "n": ["Gần nghĩa: びしょびしょ, びしょ濡れ. 汗びっしょり: đầm đìa mồ hôi."], "why": "Động từ là 濡れる (bị ướt) và nguyên nhân là mắc mưa. Từ tượng thái chỉ “ướt sũng” là <b>びっしょり<\/b>: びっしょり濡れる."}, {"s": "（　）言っておくが、これは楽な仕事ではない。", "o": ["思い切って", "一気に", "一斉に", "予め"], "a": 4, "ar": "あらかじめ", "vi": "Tôi nói trước nhé, đây không phải việc nhàn đâu.", "key": [{"w": "予め", "r": "あらかじめ", "hv": "DỰ", "m": "trước, sẵn từ trước"}], "x": {"1": "思い切って (mạnh dạn, dứt khoát): dùng khi lấy hết can đảm làm gì (思い切って告白する). Câu chỉ “nói trước”, không cần can đảm.", "2": "一気に (một mạch, một hơi): chỉ làm liên tục không nghỉ. Không đi với ý “nói trước”.", "3": "一斉に (đồng loạt): cần nhiều chủ thể cùng làm. Ở đây chỉ có một người nói."}, "g": ["<b class=\"jp\">Vておく<\/b>: làm trước (để chuẩn bị). 言っておく = nói trước.", "<b class=\"jp\">〜が、<\/b>: liên từ rào đón trước khi vào ý chính."], "n": ["Đồng nghĩa khẩu ngữ: 前もって まえもって. 予め thường đi với Vておく: 予め準備しておく."], "why": "Động từ là <b>言っておく<\/b> (Vておく: làm trước để chuẩn bị). Phó từ “trước, sẵn từ trước” là <b>予め<\/b>: 予め言っておく (nói trước cho biết)."}, {"s": "{大雨|おおあめ}で{地盤|じばん}が{緩|ゆる}み、{落石|らくせき}が（　）落ちて来た。", "o": ["ぶらぶら", "ごろごろ", "ゆらゆら", "うろうろ"], "a": 2, "ar": "ごろごろ", "vi": "Mưa lớn làm nền đất lỏng ra, đá lăn ầm ầm rơi xuống.", "key": [{"w": "ごろごろ", "r": "ごろごろ", "hv": "—", "m": "(vật nặng) lăn lông lốc; sấm rền; nằm ườn"}, {"w": "地盤", "r": "じばん", "hv": "ĐỊA BÀN", "m": "nền đất"}, {"w": "緩む", "r": "ゆるむ", "hv": "HOÃN", "m": "lỏng ra, chùng xuống"}, {"w": "落石", "r": "らくせき", "hv": "LẠC THẠCH", "m": "đá lở, đá rơi"}], "x": {"1": "ぶらぶら (lang thang; đung đưa lủng lẳng): tả người đi dạo hoặc vật treo. Đá rơi xuống không “đi dạo”.", "3": "ゆらゆら (đung đưa nhè nhẹ): tả ngọn lửa, cành cây lay. Không tả đá lăn.", "4": "うろうろ (đi loanh quanh, lảng vảng): chủ thể là người hoặc động vật."}, "g": ["<b class=\"jp\">Vます形、〜<\/b> (緩み、): thể liên dụng nối câu trong văn viết, tương đương 緩んで.", "<b class=\"jp\">Vて来る<\/b>: hướng về phía người nói (rơi xuống phía mình)."], "n": ["ごろごろ còn dùng: 家でごろごろする (nằm ườn ở nhà), 雷がごろごろ鳴る (sấm rền), 目がごろごろする (cộm mắt)."], "why": "Chủ ngữ là 落石 (đá rơi), động từ 落ちて来た. Từ tượng thanh/tượng thái cho vật nặng lăn lông lốc là <b>ごろごろ<\/b>."}, {"s": "この切符は、明日まで（　）です。", "o": ["効用", "権利", "利点", "有効"], "a": 4, "ar": "ゆうこう", "vi": "Vé này có hiệu lực đến ngày mai.", "key": [{"w": "有効", "r": "ゆうこう", "hv": "HỮU HIỆU", "m": "có hiệu lực, hiệu quả (↔ 無効 むこう)"}], "x": {"1": "効用 (công dụng): dùng cho thuốc, sản phẩm (薬の効用). Vé không có “công dụng đến ngày mai”.", "2": "権利 (quyền lợi): chủ thể có quyền là người, không phải tấm vé.", "3": "利点 (ưu điểm): không đi với mốc thời gian 〜まで."}, "g": ["<b class=\"jp\">〜まで<\/b>: đến (mốc thời gian) — hiệu lực kéo dài đến hết ngày mai."], "n": ["有効期限 ゆうこうきげん: hạn sử dụng/hiệu lực. 時間を有効に使う: dùng thời gian hiệu quả."], "why": "Chủ ngữ là 切符 (vé), có mốc 明日まで (đến ngày mai). Tính chất của vé “còn hiệu lực đến ngày…” là <b>有効<\/b>."}, {"s": "彼はちょっとしたことにもすぐ腹を（　）。", "o": ["立てる", "割る", "切る", "決める"], "a": 1, "ar": "腹を立てる", "vi": "Anh ấy hay nổi giận ngay cả với những chuyện cỏn con.", "key": [{"w": "腹を立てる", "r": "はらをたてる", "hv": "PHÚC", "m": "nổi giận"}], "x": {"2": "腹を割る (thẳng thắn, nói thật lòng): 腹を割って話す. Không liên quan đến nổi giận.", "3": "腹を切る (mổ bụng; nhận trách nhiệm): sai nghĩa hoàn toàn.", "4": "腹を決める (hạ quyết tâm): không phải phản ứng với chuyện nhỏ nhặt."}, "g": ["<b class=\"jp\">ちょっとした<\/b>: nhỏ nhặt, không đáng kể.", "<b class=\"jp\">〜にも<\/b>: ngay cả với…"], "n": ["Cặp tự/tha: 腹が立つ (tức giận) / 腹を立てる (nổi giận). Quán ngữ với 腹 khác: 腹が黒い (thâm hiểm)."], "why": "Ngữ cảnh: chuyện cỏn con cũng ... ngay → nổi giận. Quán ngữ <b>腹を立てる<\/b>: nổi giận (tự động từ tương ứng: 腹が立つ)."}, {"s": "交通渋滞で少しも動けないので車の中で（　）している。", "o": ["いらいら", "ぺらぺら", "すらすら", "わくわく"], "a": 1, "ar": "いらいら", "vi": "Tắc đường không nhích được chút nào nên tôi ngồi trong xe bực bội sốt ruột.", "key": [{"w": "いらいら", "r": "いらいら", "hv": "—", "m": "bực bội, sốt ruột"}, {"w": "渋滞", "r": "じゅうたい", "hv": "SÁP TRỆ", "m": "tắc nghẽn (giao thông)"}], "x": {"2": "ぺらぺら (nói trôi chảy; lật trang): không tả cảm xúc khi kẹt xe.", "3": "すらすら (trôi chảy, suôn sẻ): ngược ngữ cảnh — xe đang không đi được.", "4": "わくわく (háo hức hồi hộp vì điều vui sắp tới): cảm xúc tích cực, trái với tình huống tắc đường."}, "g": ["<b class=\"jp\">少しも〜ない<\/b>: không… chút nào."], "n": ["いらいらする: sốt ruột, cáu vì mọi việc không như ý. Gần nghĩa: むかむか (buồn nôn; tức tối)."], "why": "Tắc đường, không nhích được chút nào → cảm xúc bực bội, sốt ruột → <b>いらいら<\/b>する."}, {"s": "途中寄り道をせず、{岡山|おかやま}まで（　）車を飛ばした。", "o": ["一斉に", "改めて", "一気に", "思い切って"], "a": 3, "ar": "いっきに", "vi": "Không la cà dọc đường, tôi phóng xe một mạch đến Okayama.", "key": [{"w": "一気に", "r": "いっきに", "hv": "NHẤT KHÍ", "m": "một mạch, một hơi"}, {"w": "寄り道", "r": "よりみち", "hv": "KÝ ĐẠO", "m": "tạt ngang, la cà dọc đường"}], "x": {"1": "一斉に (đồng loạt): cần nhiều người/vật cùng lúc. Chỉ có một người lái xe.", "2": "改めて (lại lần nữa, dịp khác): không có ý “liên tục không dừng”.", "4": "思い切って (mạnh dạn): nói về quyết định táo bạo, không liên quan việc không ghé dọc đường."}, "g": ["<b class=\"jp\">Vず(に)<\/b>: không làm… mà (văn viết của ないで). する → せず.", "<b class=\"jp\">車を飛ばす<\/b>: phóng xe nhanh."], "n": ["一気に: 一気に飲む (uống một hơi), 一気に読み終える (đọc một mạch hết)."], "why": "寄り道をせず (không la cà) → chạy liền một mạch đến Okayama. Phó từ “một hơi, một mạch” là <b>一気に<\/b>."}, {"s": "年末の完成を（　）工事を進める。", "o": ["ながめて", "みあげて", "みおろして", "めざして"], "a": 4, "ar": "目指す", "vi": "Tiến hành thi công với mục tiêu hoàn thành vào cuối năm.", "key": [{"w": "目指す", "r": "めざす", "hv": "MỤC CHỈ", "m": "nhắm tới, hướng tới"}, {"w": "完成", "r": "かんせい", "hv": "HOÀN THÀNH", "m": "hoàn thành"}], "x": {"1": "眺める (ngắm nhìn): đối tượng là cảnh vật nhìn bằng mắt. Không “ngắm” sự hoàn thành.", "2": "見上げる (ngước nhìn, ngưỡng mộ): dùng cho vật ở trên cao hoặc người đáng kính.", "3": "見下ろす (nhìn xuống từ trên cao): chỉ hướng nhìn vật lý, không phải mục tiêu."}, "g": ["<b class=\"jp\">〜を目指して<\/b>: hướng tới (mục tiêu)…", "<b class=\"jp\">工事を進める<\/b>: đẩy nhanh, tiến hành thi công."], "n": ["目指す: 合格を目指す (nhắm đến đỗ), 頂上を目指す (hướng lên đỉnh)."], "why": "Tân ngữ là 完成 (hoàn thành) — một mục tiêu. Động từ <b>目指す<\/b> (nhắm tới): 〜を目指して工事を進める (tiến hành thi công hướng tới mục tiêu)."}], "no": 2, "cat": "Từ vựng", "file": "ĐỀ 7 - TỪ VỰNG N2", "folderLabel": "Ngữ pháp", "sum": [{"h": "Cách làm dạng 文脈規定 (問題4 · điền từ theo ngữ cảnh)", "li": ["Bước 1: tìm <b>từ đi kèm<\/b> ngay trước/sau chỗ trống (trợ từ, danh từ, động từ). Hầu hết câu giải được bằng collocation: 問題を<b>抱える<\/b>, 話が<b>尽きない<\/b>, 不満を<b>解消<\/b>する, 腹を<b>立てる<\/b>.", "Bước 2: xác định <b>chủ thể<\/b> — người hay vật? Các phó từ うっかり, わざわざ, 思い切って chỉ dùng cho hành động có ý thức của người.", "Bước 3: xem <b>dấu hiệu ngữ pháp<\/b>: 〜というのに (trái mong đợi → あいにく), Vておく (làm trước → 予め), 〜まで (hạn → 有効).", "Bước 4: các phương án thường cùng nhóm hình thức (cùng đuôi 〜み, cùng chữ 見〜, cùng dạng láy) — phân biệt bằng nghĩa cụ thể, không đoán theo cảm giác."]}, {"h": "Từ láy (オノマトペ) trong đề và nhóm mở rộng", "tbl": {"head": ["Từ", "Nghĩa", "Đi với"], "rows": [["びっしょり", "ướt sũng", "濡れる, 汗びっしょり"], ["ぐっすり", "ngủ say", "眠る"], ["ぐったり", "mệt lả", "疲れて〜する"], ["ぴったり", "vừa khít", "サイズ, 時間"], ["ごろごろ", "lăn lông lốc; nằm ườn; sấm rền", "石が転がる, 家で〜する"], ["いらいら", "bực bội, sốt ruột", "渋滞で〜する"], ["わくわく", "háo hức", "旅行の前に〜する"], ["すらすら / ぺらぺら", "trôi chảy / nói lưu loát", "読む, 解ける / 英語が〜"], ["うろうろ / ぶらぶら", "lảng vảng / đi dạo", "店の前を〜 / 町を〜"], ["ゆらゆら / ぐらぐら", "đung đưa nhẹ / lung lay mạnh", "炎 / 地震で家が〜"]]}}, {"h": "Phó từ dễ nhầm", "tbl": {"head": ["Từ", "Nghĩa", "Sắc thái"], "rows": [["あいにく", "không may", "do hoàn cảnh bên ngoài; cũng dùng từ chối lịch sự"], ["せっかく", "cất công, hiếm có", "tiếc vì công sức / cơ hội bị phí: せっかく来たのに"], ["わざわざ", "cất công, cố ý", "người khác bỏ công làm cho mình: わざわざありがとう"], ["うっかり", "sơ ý", "lỗi vô ý của bản thân"], ["予め / 前もって", "trước, sẵn", "đi với Vておく"], ["一気に", "một mạch", "làm liên tục đến xong"], ["一斉に", "đồng loạt", "nhiều chủ thể cùng lúc"], ["思い切って", "mạnh dạn", "lấy hết can đảm"], ["改めて", "lại lần nữa, dịp khác", "改めて連絡します"]]}}, {"h": "Quán ngữ với 腹 và collocation cần thuộc", "li": ["<b>腹<\/b>: 腹が立つ / 腹を立てる (tức giận), 腹を割る (nói thật lòng), 腹を決める / 腹をくくる (quyết tâm), 腹が黒い (thâm hiểm), 腹八分目 (ăn vừa no).", "<b>抱える<\/b>: 問題を〜, 借金を〜, 悩みを〜, 頭を〜 (vò đầu bứt tai).", "<b>尽きる / 尽くす<\/b>: 話が尽きない, 力が尽きる, 全力を尽くす (dốc toàn lực).", "<b>解消<\/b>: ストレス解消, 不満を解消, 渋滞を解消, 契約を解消.", "<b>面する<\/b>: 海に面したホテル, 通りに面した部屋; 直面する (đối mặt khó khăn)."]}, {"h": "Hậu tố 〜み và 〜さ", "li": ["〜み: điểm, cảm nhận mang tính chất lượng: 強み (thế mạnh), 弱み (điểm yếu), 深み (chiều sâu), 重み (sức nặng), 楽しみ, 悲しみ, 痛み.", "〜さ: mức độ đo được: 強さ, 深さ, 重さ, 高さ. Ví dụ: 水の深さ (độ sâu của nước) ≠ 味の深み (độ đậm đà).", "Không phải tính từ nào cũng có 〜み: 大きさ có, “大きみ” không có."]}], "source": {"folder": "https://drive.google.com/drive/folders/1I__WFm8fTUnUs5Qjv5T8KH4av9jZmLf-", "goc": "https://drive.google.com/file/d/172NfEmOfXeUpahQv1Hn3ge-W-2apyUNw/view", "chua": "https://drive.google.com/file/d/1qxQjPxxp24RejO_r-8iDJluWmw8eOK1a/view"}, "series": "DORA Nihongo · Đề 2 · Ngữ pháp N5–N2 trúng tủ"}, {"no": 3, "folderLabel": "Ngữ pháp", "cat": "Ngữ pháp", "file": "ĐỀ 9 - NGỮ PHÁP N2", "title": "Đề 3 · Ngữ pháp N2", "jp": "文法形式", "mondai": "<b>問題7<\/b> 次の文の（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。 Chọn mẫu ngữ pháp thích hợp nhất để điền vào chỗ trống.", "qs": [{"s": "テーブルのうえに（　）ケーキが{置|お}いてあります。", "o": ["食べはじめの", "食べきった", "食べぬいた", "食べかけの"], "a": 4, "ar": "Vます + かけ(の)", "vi": "Trên bàn có đặt một chiếc bánh ngọt đang ăn dở.", "key": [{"w": "〜かけの N", "r": "かけの", "hv": "—", "m": "N đang làm dở (chưa xong): 食べかけのパン, 読みかけの本"}], "x": {"1": "食べはじめ (lúc bắt đầu ăn): chỉ thời điểm, không mô tả trạng thái của cái bánh. “Bánh lúc bắt đầu ăn” không có nghĩa.", "2": "食べきった (đã ăn hết sạch): mâu thuẫn — đã ăn hết thì không còn bánh đặt trên bàn.", "3": "食べぬいた: 〜ぬく là làm đến cùng vượt qua khó khăn (走りぬく, 考えぬく). Ăn bánh không phải việc gian khổ, và dạng này không bổ nghĩa cho ケーキ."}, "g": ["<b class=\"jp\">Vてある<\/b>: trạng thái kết quả do ai đó cố ý tạo ra (置いてある: được đặt sẵn)."], "n": ["〜かける còn nghĩa là suýt: 死にかける (suýt chết), おぼれかける (suýt chết đuối). Xem Đề 4 câu 6."], "why": "Chiếc bánh đang <b>nằm trên bàn<\/b> (置いてある) → vẫn còn, ăn chưa xong. Mẫu <b>Vます＋かけのN<\/b>: N đang làm dở. 食べかけのケーキ ＝ bánh ăn dở. Hình thức 〜の＋N cũng khớp với danh từ ケーキ phía sau."}, {"s": "この映画は青少年に悪い{影響|えいきょう}を与える（　）。", "o": ["ことはない", "ものがある", "恐れがある", "限りではない"], "a": 3, "ar": "〜おそれがある", "vi": "Bộ phim này có nguy cơ gây ảnh hưởng xấu đến thanh thiếu niên.", "key": [{"w": "恐れがある", "r": "おそれがある", "hv": "KHỦNG", "m": "e rằng, có nguy cơ (việc xấu)"}], "x": {"1": "〜ことはない (không cần phải): dùng để trấn an (心配することはない). “Không cần gây ảnh hưởng xấu” vô nghĩa.", "2": "〜ものがある (có gì đó đáng…): bày tỏ cảm thán về tính chất (心に響くものがある). Không diễn tả nguy cơ.", "4": "〜限りではない (không thuộc phạm vi): dùng trong quy định (この限りではない: không áp dụng). Không đi sau 与える theo nghĩa này."}, "g": ["<b class=\"jp\">Vる / Nの + 恐れがある<\/b>: văn viết, tin tức. 台風が上陸する恐れがある."], "n": ["青少年 せいしょうねん THANH THIẾU NIÊN; 影響を与える: gây ảnh hưởng."], "why": "Phim → ảnh hưởng xấu đến thanh thiếu niên: một <b>khả năng xấu có thể xảy ra<\/b>. Mẫu <b>Vる＋恐れがある<\/b>: e rằng, có nguy cơ (văn viết, tin tức). Đi sau động từ thể từ điển 与える → đúng."}, {"s": "{森田|もりた}さんのお父さんは、声（　）やさしそうですね。", "o": ["をして", "をもって", "からは", "からして"], "a": 4, "ar": "N + からして", "vi": "Bố của anh Morita chỉ nghe giọng thôi đã thấy hiền rồi nhỉ.", "key": [{"w": "〜からして", "r": "からして", "hv": "—", "m": "ngay từ… (lấy một chi tiết tiêu biểu để phán đoán toàn thể)"}], "x": {"1": "〜をして: chỉ dùng trong 〜をして〜させる (khiến ai làm gì: 彼をして言わしめた). Không hợp với “giọng”.", "2": "〜をもって (bằng, với): chỉ phương tiện trang trọng (書面をもって通知する) hoặc mốc (本日をもって). “Bằng giọng nói mà hiền” không có nghĩa.", "3": "〜からは (từ… thì): chỉ điểm xuất phát/nguồn (ここからは見えない). Không có sắc thái “ngay cả chi tiết nhỏ cũng đã cho thấy”."}, "g": ["<b class=\"jp\">〜そうだ<\/b> (Aい bỏ い + そう): trông có vẻ. やさしそう."], "n": ["Cùng mẫu: タイトルからして面白そうだ. Xem thêm Đề 6 câu 2 (体格からして)."], "why": "Chỉ nghe <b>giọng nói<\/b> (một chi tiết) mà đã đoán ông ấy hiền (toàn thể). Mẫu <b>N＋からして<\/b>: ngay từ N (chi tiết tiêu biểu) đã…, dùng để phán đoán. Vị ngữ やさしそう (trông có vẻ) khớp với ý phán đoán."}, {"s": "やっと{契約|けいやく}がまとまったかと（　）、まだ小さな{条件|じょうけん}でもめている。", "o": ["思ったなら", "思い", "思って", "思ったら"], "a": 4, "ar": "〜かと思ったら", "vi": "Cứ tưởng hợp đồng cuối cùng đã chốt xong, vậy mà vẫn đang cãi nhau về mấy điều khoản nhỏ.", "key": [{"w": "〜かと思ったら", "r": "かとおもったら", "hv": "—", "m": "cứ tưởng là… thì (thực tế khác hẳn)"}, {"w": "契約", "r": "けいやく", "hv": "KHẾ ƯỚC", "m": "hợp đồng"}, {"w": "もめる", "r": "もめる", "hv": "—", "m": "tranh cãi, xích mích"}], "x": {"1": "思ったなら: なら là giả định (nếu đã nghĩ…). Mẫu cố định chỉ có 〜かと思ったら / 〜かと思うと, không có かと思ったなら.", "2": "思い (thể liên dụng): chỉ nối câu kiểu văn viết, không tạo nghĩa “tưởng là… hóa ra”.", "3": "思って (vì nghĩ… nên): chỉ nguyên nhân, không diễn tả sự trái ngược giữa hai vế."}, "g": ["<b class=\"jp\">Vた + かと思ったら / かと思うと<\/b>: (1) cứ tưởng… nhưng thực ra; (2) vừa mới… thì đã (thay đổi nhanh)."], "n": ["条件 じょうけん ĐIỀU KIỆN; まとまる: được thống nhất, chốt lại."], "why": "Vế trước: tưởng đã chốt hợp đồng; vế sau: vẫn đang cãi → <b>trái với điều vừa nghĩ<\/b>. Mẫu <b>〜かと思ったら<\/b>: cứ tưởng… thì hóa ra. Trước と có か (まとまったか) — đúng dấu hiệu của mẫu này."}, {"s": "いったん引き受けた（　）、最後までやり通すべきです。", "o": ["からには", "ためには", "うえには", "わけには"], "a": 1, "ar": "〜からには", "vi": "Một khi đã nhận lời thì nên làm đến cùng.", "key": [{"w": "〜からには", "r": "からには", "hv": "—", "m": "một khi đã… thì (phải, nên)"}], "x": {"2": "〜ためには (để): vế trước phải là mục tiêu ở thể từ điển (合格するためには). 引き受けた là việc đã xong, không phải mục tiêu.", "3": "うえには: không có mẫu này. Mẫu đúng là 〜うえは (một khi đã, văn cứng) — không có に.", "4": "〜わけには phải đi với いかない (〜わけにはいかない: không thể). Đứng một mình, câu sau lại khẳng định べき → sai cả cấu trúc lẫn nghĩa."}, "g": ["<b class=\"jp\">Vた + からには<\/b>: vế sau là ý chí, nghĩa vụ: 〜べきだ, 〜なければならない, 〜つもりだ.", "<b class=\"jp\">やり通す<\/b>: làm đến cùng (Vます + 通す)."], "n": ["Đồng nghĩa: 〜以上(は), 〜上は. いったん: một khi, một lần đã."], "why": "Vế trước là việc <b>đã làm<\/b> (いったん引き受けた: đã nhận lời), vế sau là nghĩa vụ (〜べきです). Mẫu <b>Vた＋からには<\/b>: một khi đã… thì phải. Vế sau thường là べき, つもり, なければならない."}, {"s": "ゆうべ私が調べた（　）、工場の機械に問題はなかったのです。", "o": ["ようでは", "うえでは", "次第では", "限りでは"], "a": 4, "ar": "〜限りでは", "vi": "Theo như tôi kiểm tra tối qua thì máy móc trong nhà máy không có vấn đề gì.", "key": [{"w": "〜限りでは", "r": "かぎりでは", "hv": "HẠN", "m": "theo như (phạm vi hiểu biết của người nói)"}], "x": {"1": "〜ようでは (nếu cứ như vậy thì): vế sau là kết quả xấu (こんなミスをするようでは困る). Câu này không có ý phê phán.", "2": "〜うえでは (về mặt, trên phương diện): đi với danh từ (数字のうえでは, 法律のうえでは). Không đi với 調べた.", "3": "〜次第では (tùy vào): đi với danh từ (結果次第では). Không đi sau động từ thể た."}, "g": ["<b class=\"jp\">調べた / 聞いた / 知っている + 限りでは<\/b>: giới hạn phạm vi thông tin."], "n": ["Cùng chữ 限: 〜限り (chừng nào còn), 〜に限って (riêng…). Xem Đề 18 câu 10."], "why": "Kết luận dựa trên phạm vi thông tin mình có (tối qua tôi kiểm tra). Mẫu <b>Vた＋限りでは<\/b>: theo trong phạm vi… thì. Thường đi với 調べた, 聞いた, 知っている."}, {"s": "風邪（　）し、それに着て行く服もないから、パーティーには行かない。", "o": ["かねる", "ぎみだ", "ようだ", "うる"], "a": 2, "ar": "〜気味だ", "vi": "Tôi hơi bị cảm, lại cũng chẳng có đồ để mặc đi, nên tôi không đi dự tiệc.", "key": [{"w": "〜気味", "r": "ぎみ", "hv": "KHÍ VỊ", "m": "hơi có vẻ, hơi bị (tình trạng không tốt)"}], "x": {"1": "〜かねる (khó mà): gắn sau Vます (引き受けかねる). Không gắn sau danh từ 風邪.", "3": "〜ようだ (hình như): sau danh từ phải có の (風邪のようだ). 風邪ようだ sai ngữ pháp.", "4": "〜うる (có thể): gắn sau Vます (ありうる, 起こりうる). Không gắn sau danh từ."}, "g": ["<b class=\"jp\">〜し、それに〜<\/b>: liệt kê lý do (vừa… lại còn…)."], "n": ["Hay gặp: 風邪気味, 疲れ気味, 太り気味, 緊張気味. Xem Đề 6 câu 9 (不足気味)."], "why": "Nhiều lý do không đi tiệc: hơi bị cảm (し, それに…). Mẫu <b>N＋気味<\/b>: hơi có vẻ (thường điều không tốt): 風邪気味 (hơi cảm). Gắn trực tiếp sau danh từ 風邪 → đúng."}, {"s": "あの人とは卒業式のとき別れた（　）。", "o": ["ほどだ", "ことだ", "ばかりだ", "きりだ"], "a": 4, "ar": "Vた + きり", "vi": "Tôi chia tay người ấy từ hôm lễ tốt nghiệp rồi không gặp lại nữa.", "key": [{"w": "〜きり", "r": "きり", "hv": "—", "m": "từ khi… rồi thôi (không có gì tiếp theo)"}], "x": {"1": "〜ほどだ (đến mức): cần một mức độ để so sánh (泣きたいほどだ). “Chia tay đến mức” vô nghĩa.", "2": "〜ことだ: lời khuyên (毎日練習することだ) hoặc cảm thán. Không hợp với việc chia tay trong quá khứ.", "3": "Vた＋ばかりだ (vừa mới): mâu thuẫn — lễ tốt nghiệp đã lâu, và ばかり không có nghĩa “từ đó không gặp lại”."}, "g": ["<b class=\"jp\">Vた + きり(〜ない)<\/b>: 出かけたきり帰ってこない (đi rồi không về)."], "n": ["きり còn nghĩa là chỉ: 二人きり (chỉ hai người)."], "why": "Chia tay từ lễ tốt nghiệp và <b>từ đó không gặp lại<\/b>. Mẫu <b>Vた＋きり(だ)<\/b>: từ khi… rồi thôi, không tiếp diễn nữa. 別れたきりだ ＝ chia tay rồi bặt tin."}, {"s": "雪が降ると、バスは遅れ（　）。", "o": ["かけになる", "きれなくなる", "がちになる", "かけなくなる"], "a": 3, "ar": "〜がち", "vi": "Cứ hễ tuyết rơi là xe buýt hay bị trễ.", "key": [{"w": "〜がち", "r": "がち", "hv": "—", "m": "hay bị, dễ có khuynh hướng (việc không tốt)"}], "x": {"1": "〜かけ (làm dở): 遅れかけ không phải cách nói tự nhiên, và không mang nghĩa “hay bị”.", "2": "〜きれない (không thể làm hết): dùng với việc có khối lượng (食べきれない). “Không trễ hết được” vô nghĩa.", "4": "かけなくなる: không có mẫu ngữ pháp này."}, "g": ["<b class=\"jp\">Vます / N + がち<\/b>: 病気がち, 忘れがち, 遅れがち."], "n": ["Phân biệt: 〜がち (hay xảy ra, lặp lại), 〜気味 (hơi có dấu hiệu), 〜っぽい (có vẻ, dễ)."], "why": "Hễ tuyết rơi thì xe buýt <b>có xu hướng<\/b> bị trễ (việc không mong muốn, lặp lại). Mẫu <b>Vます＋がち<\/b>: hay, dễ bị. 遅れがちになる ＝ trở nên hay trễ."}, {"s": "家に着くか着かない（　）雨が降りだした。", "o": ["かのように", "かのうちに", "ままにして", "ようにして"], "a": 2, "ar": "〜か〜ないかのうちに", "vi": "Vừa về đến nhà thì trời đổ mưa.", "key": [{"w": "〜か〜ないかのうちに", "r": "かないかのうちに", "hv": "—", "m": "vừa mới… thì đã (gần như cùng lúc)"}], "x": {"1": "〜かのように (như thể): so sánh giả định (知っているかのように話す). Không diễn tả thời điểm.", "3": "ままにして: không có cấu trúc này với 着くか着かない. 〜まま là giữ nguyên trạng thái.", "4": "〜ようにして (làm theo cách): chỉ cách thức, không chỉ thời điểm."}, "g": ["<b class=\"jp\">Vる + か + Vない + かのうちに<\/b>. Đồng nghĩa: 〜たとたん, 〜や否や."], "n": ["Xem Đề 6 câu 6 (触れるか触れないかのうちに)."], "why": "Hai việc gần như <b>đồng thời<\/b>: vừa về đến nhà thì mưa. Mẫu cố định <b>Vる＋か＋Vない＋かのうちに<\/b>: vừa mới… thì đã. Câu có sẵn 着くか着かない → chỉ cần かのうちに."}, {"s": "{鈴木|すずき}さんは、おなかがいっぱいな（　）まだ食べようとしている。", "o": ["せいに", "ものに", "うえに", "くせに"], "a": 4, "ar": "〜くせに", "vi": "Anh Suzuki bụng đã no căng vậy mà vẫn cố ăn tiếp.", "key": [{"w": "〜くせに", "r": "くせに", "hv": "—", "m": "dù… vậy mà (chê trách, bất mãn)"}], "x": {"1": "せいに: mẫu đúng là 〜せいで / 〜せいだ (tại vì, đổ lỗi). Nghĩa nguyên nhân cũng không hợp với “no rồi mà vẫn ăn”.", "2": "ものに: không có mẫu ngữ pháp này với nghĩa trái ngược.", "3": "〜うえに (không những… mà còn): cộng thêm cùng chiều, không mang nghĩa trái ngược hay chê trách."}, "g": ["<b class=\"jp\">Aな + くせに<\/b>: いっぱいなくせに. Chủ ngữ thường là người khác.", "<b class=\"jp\">Vよう + とする<\/b>: định, cố làm."], "n": ["Gần nghĩa nhưng trung tính hơn: 〜のに."], "why": "No rồi <b>mà vẫn<\/b> cố ăn — người nói chê trách. Mẫu <b>〜くせに<\/b>: vậy mà, thế mà (sắc thái phê phán). Tính từ な nối bằng な: いっぱいなくせに → đúng."}, {"s": "きのう、３時から４時に（　）{停電|ていでん}があった。", "o": ["かけて", "そって", "わたって", "おいて"], "a": 1, "ar": "〜から〜にかけて", "vi": "Hôm qua bị mất điện khoảng từ 3 giờ đến 4 giờ.", "key": [{"w": "〜から〜にかけて", "r": "にかけて", "hv": "—", "m": "từ khoảng… đến khoảng… (thời gian, không gian)"}, {"w": "停電", "r": "ていでん", "hv": "ĐÌNH ĐIỆN", "m": "mất điện"}], "x": {"2": "〜にそって (dọc theo; theo): dùng với đường, kế hoạch (川にそって, 方針にそって). Không đi với mốc giờ.", "3": "〜にわたって (suốt): đi với cả khoảng (3日間にわたって), không ghép với から〜に.", "4": "〜において (tại, trong — trang trọng): chỉ địa điểm, lĩnh vực. Không tạo cặp với から."}, "g": ["<b class=\"jp\">N1 から N2 にかけて<\/b>: 東北から関東にかけて雪が降る."], "n": ["Phân biệt: 〜から〜まで (mốc rõ ràng) và 〜から〜にかけて (khoảng chừng)."], "why": "Có <b>から<\/b> (từ 3 giờ) → mẫu cặp <b>AからBにかけて<\/b>: khoảng từ A đến B (khoảng thời gian/không gian không chính xác tuyệt đối)."}], "sum": [{"h": "Nhóm hậu tố gắn sau Vます", "tbl": {"head": ["Mẫu", "Nghĩa", "Ví dụ"], "rows": [["〜かけ(の/る)", "đang làm dở; suýt", "食べかけのケーキ, 死にかける"], ["〜きる / 〜きれない", "làm hết / không làm hết được", "食べきる, 数えきれない"], ["〜ぬく", "làm đến cùng (vượt khó)", "走りぬく, 考えぬく"], ["〜がち", "hay, dễ bị (điều xấu)", "遅れがち, 病気がち"], ["〜かねる / 〜かねない", "khó mà / có thể (xấu)", "引き受けかねる, 事故を起こしかねない"], ["〜うる / 〜える", "có thể", "ありうる, 起こりうる"], ["〜っぽい", "có vẻ, hay", "忘れっぽい, 子どもっぽい"]]}}, {"h": "Mẫu chỉ thời điểm “vừa… thì”", "tbl": {"head": ["Mẫu", "Nối", "Ghi chú"], "rows": [["〜か〜ないかのうちに", "Vる か Vない か", "gần như đồng thời"], ["〜たとたん(に)", "Vた", "vế sau là việc bất ngờ"], ["〜かと思ったら / 〜かと思うと", "Vた", "vừa… đã; hoặc tưởng… hóa ra (câu 4)"], ["〜次第", "Vます", "ngay sau khi (vế sau là ý chí): 着き次第連絡します"], ["〜や否や", "Vる", "văn viết, vừa… liền"]]}}, {"h": "Phán đoán, nguy cơ, phạm vi", "li": ["<b>〜恐れがある<\/b>: có nguy cơ (xấu) — văn viết. Gần nghĩa: 〜かねない (có thể xảy ra điều xấu).", "<b>〜からして<\/b>: ngay từ chi tiết nhỏ đã… (名前からして怪しい). Khác 〜からすると / 〜から見ると: xét từ góc độ.", "<b>〜限りでは<\/b>: trong phạm vi hiểu biết (私が知る限りでは). Khác 〜限り (miễn là): 生きている限り.", "<b>〜気味<\/b>: hơi có vẻ (N / Vます): 風邪気味, 疲れ気味, 太り気味."]}, {"h": "Nhóm “một khi đã / vậy mà / từ đó”", "li": ["<b>〜からには / 〜以上(は) / 〜うえは<\/b>: một khi đã… thì phải. Vế sau: べき, つもり, なければならない.", "<b>〜くせに<\/b> (chê trách, khẩu ngữ) ↔ <b>〜のに<\/b> (tiếc nuối, trung tính) ↔ <b>〜にもかかわらず<\/b> (văn viết).", "<b>Vた＋きり<\/b>: từ khi… rồi không tiếp diễn. Khẩu ngữ: 〜っきり. Còn nghĩa “chỉ”: 二人きり (chỉ hai người).", "<b>AからBにかけて<\/b> (khoảng từ A đến B) ↔ <b>Nにわたって<\/b> (suốt toàn bộ N) ↔ <b>AからBまで<\/b> (chính xác từ A đến B)."]}], "source": {"folder": "https://drive.google.com/drive/folders/1NJdTgjv1SPeAPMdzj9SSXXoAp6Iu0e-g", "goc": "https://drive.google.com/file/d/1BFS4wnv23klBa4UWxM4ATBkagFkdGzsC/view", "chua": "https://drive.google.com/file/d/1IQCUgzK3OoZyiVy_k1o-YCfaBpYQ9tNW/view"}, "series": "DORA Nihongo · Đề 3 · Ngữ pháp N5–N2 trúng tủ"}, {"no": 4, "folderLabel": "Kanji", "cat": "Kanji", "file": "ĐỀ 10 - KANJI N2", "title": "Đề 4 · Kanji N2", "jp": "表記", "mondai": "<b>問題2<\/b> ＿＿の言葉を漢字で書くとき、最もよいものを1・2・3・4から一つ選びなさい。 Chọn cách viết chữ Hán đúng cho từ gạch chân.", "qs": [{"s": "あす学校で_ひなん_訓練があります。", "o": ["非乱", "避難", "非難", "避乱"], "a": 2, "ar": "ひなん", "vi": "Ngày mai ở trường có buổi diễn tập sơ tán.", "key": [{"w": "避難", "r": "ひなん", "hv": "TỊ NẠN", "m": "lánh nạn, sơ tán"}, {"w": "訓練", "r": "くんれん", "hv": "HUẤN LUYỆN", "m": "huấn luyện, diễn tập"}], "x": {"1": "非乱: không có từ này. 非 (PHI: không phải) và 乱 (LOẠN: rối loạn) không ghép được nghĩa “sơ tán”.", "3": "非難 (PHI NAN) cũng đọc ひなん nhưng nghĩa là chỉ trích, phê phán. “Diễn tập chỉ trích” vô nghĩa — đây là bẫy đồng âm chính.", "4": "避乱: không có từ này. 避 đúng nhưng 乱 (loạn) không phải “tai nạn”; chữ cần là 難."}, "n": ["避 = tránh: 避ける さける, 回避 かいひ. 難 = nạn, khó: 難しい, 困難 こんなん, 災難 さいなん.", "避難訓練, 避難所 (nơi sơ tán), 避難勧告 (khuyến cáo sơ tán)."], "why": "訓練 (diễn tập) ở trường → diễn tập <b>sơ tán, lánh nạn<\/b>. 避 (TỊ: tránh) ＋ 難 (NAN: tai nạn) ＝ <b>避難<\/b>: tránh nạn. 避難訓練 là cụm cố định."}, {"s": "あの人とはなんとか丸く_おさまった_よ。", "o": ["収まった", "貯まった", "薄まった", "縮まった"], "a": 1, "ar": "おさまる", "vi": "Chuyện với người đó rốt cuộc cũng êm xuôi rồi.", "key": [{"w": "収まる", "r": "おさまる", "hv": "THU", "m": "được giải quyết, lắng xuống; vừa vặn nằm gọn"}], "x": {"2": "貯まる (たまる: tiền được tích lại). Khác âm và khác nghĩa; quan hệ người với người không “tích lại”.", "3": "薄まる (うすまる: loãng, nhạt đi). Khác âm; dùng cho màu, vị (味が薄まる).", "4": "縮まる (ちぢまる: co lại, rút ngắn khoảng cách). Khác âm; 差が縮まる chứ không nói 丸く縮まる."}, "g": ["<b class=\"jp\">丸く収まる<\/b>: giải quyết êm thấm (quán ngữ). なんとか: bằng cách này hay cách khác."], "n": ["おさまる có nhiều chữ: 収まる (vào gọn, êm xuôi), 治まる (bệnh, bạo loạn lắng xuống), 納まる (được nộp, yên vị)."], "why": "丸くおさまる: mọi chuyện êm xuôi, được dàn xếp ổn thỏa. Nghĩa “lắng xuống, yên ổn, gọn vào trong” viết là <b>収まる<\/b> (THU). Cùng âm còn có 治まる (bệnh, loạn yên lại) và 納まる (nạp vào)."}, {"s": "_ごかい_のないように率直に話します。", "o": ["誤悔", "誤解", "語悔", "語解"], "a": 2, "ar": "ごかい", "vi": "Để tránh hiểu lầm, tôi xin nói thẳng.", "key": [{"w": "誤解", "r": "ごかい", "hv": "NGỘ GIẢI", "m": "hiểu lầm"}, {"w": "率直", "r": "そっちょく", "hv": "SUẤT TRỰC", "m": "thẳng thắn"}], "x": {"1": "誤悔: không có từ này. 悔 (HỐI) nghĩa là hối hận (後悔 こうかい), không phải “hiểu”.", "3": "語悔: không có từ này. 語 (NGỮ: ngôn ngữ) đọc ご nhưng không mang nghĩa “sai”; 悔 cũng sai.", "4": "語解: không có từ này. 解 đúng nhưng chữ đầu phải là 誤 (sai), không phải 語 (lời)."}, "g": ["<b class=\"jp\">〜ないように<\/b>: để không…, để tránh…"], "n": ["誤 = sai: 誤り あやまり, 誤字 ごじ. 解 = giải: 理解, 解決, 解く とく."], "why": "Ngữ cảnh: nói thẳng để tránh <b>hiểu lầm<\/b>. 誤 (NGỘ: sai) ＋ 解 (GIẢI: hiểu) ＝ <b>誤解<\/b>: hiểu sai."}, {"s": "_きたく_の途中、思いもかけず高校時代の友人に会った。", "o": ["帰省", "帰宅", "帰国", "帰家"], "a": 2, "ar": "きたく", "vi": "Trên đường về nhà, tôi bất ngờ gặp lại bạn thời cấp ba.", "key": [{"w": "帰宅", "r": "きたく", "hv": "QUY TRẠCH", "m": "về nhà"}, {"w": "思いもかけず", "r": "おもいもかけず", "hv": "—", "m": "không ngờ, bất ngờ"}], "x": {"1": "帰省 (きせい: về quê thăm nhà). Khác âm (せい) — câu cần âm たく.", "3": "帰国 (きこく: về nước). Khác âm; và câu không nói chuyện về nước.", "4": "帰家: không có từ này. 家 đọc か/いえ, không đọc たく; chữ “nhà” mang âm たく là 宅."}, "n": ["宅 たく: 住宅 じゅうたく, 自宅 じたく, お宅 おたく. 帰宅途中 / 帰宅ラッシュ (giờ cao điểm tan tầm)."], "why": "途中 + gặp bạn trên đường → đường <b>về nhà<\/b>. 帰 (QUY: về) ＋ 宅 (TRẠCH: nhà) ＝ <b>帰宅<\/b> (きたく). 帰宅の途中 là cụm quen dùng."}, {"s": "報告書のページの_じゅんじょ_がばらばらになっている。", "o": ["準序", "準所", "順所", "順序"], "a": 4, "ar": "じゅんじょ", "vi": "Thứ tự các trang của bản báo cáo bị lộn xộn.", "key": [{"w": "順序", "r": "じゅんじょ", "hv": "THUẬN TỰ", "m": "thứ tự, trình tự"}], "x": {"1": "準序: không có từ này. 準 (CHUẨN: tiêu chuẩn, chuẩn bị — 準備, 基準) không mang nghĩa thứ tự.", "2": "準所: không có từ này. Sai cả hai chữ; 所 là nơi chốn.", "3": "順所: không có từ này. 順 đúng nhưng 所 (SỞ: nơi chốn) đọc しょ, không phải じょ, và không có nghĩa trật tự."}, "n": ["順 じゅん: 順番, 順調 じゅんちょう. 序 じょ: 秩序 ちつじょ, 序論.", "ばらばら: rời rạc, lộn xộn."], "why": "Các trang bị lộn xộn → <b>thứ tự<\/b>. 順 (THUẬN: theo lượt) ＋ 序 (TỰ: trật tự) ＝ <b>順序<\/b> (じゅんじょ)."}, {"s": "彼はおぼれかけている子供を_きゅうじょ_した。", "o": ["援助", "救財", "救助", "援財"], "a": 3, "ar": "きゅうじょ", "vi": "Anh ấy đã cứu đứa bé đang suýt chết đuối.", "key": [{"w": "救助", "r": "きゅうじょ", "hv": "CỨU TRỢ", "m": "cứu hộ, cứu người"}], "x": {"1": "援助 (えんじょ: viện trợ tiền bạc, vật chất). Khác âm (えん) và khác nghĩa — không dùng cho cứu người đuối nước.", "2": "救財: không có từ này. 財 (TÀI: tiền của) không có nghĩa “giúp”.", "4": "援財: không có từ này. Sai cả hai chữ."}, "g": ["<b class=\"jp\">Vます + かける<\/b>: suýt, sắp (おぼれかける)."], "n": ["救 きゅう: 救急車, 救う すくう. 助 じょ: 助手, 助ける."], "why": "Cứu đứa trẻ suýt chết đuối → <b>cứu hộ<\/b>. 救 (CỨU) ＋ 助 (TRỢ) ＝ <b>救助<\/b> (きゅうじょ): cứu người khỏi nguy hiểm."}, {"s": "ご_せいきゅう_がありしだい、サンプルをお送りします。", "o": ["誘球", "誘求", "請球", "請求"], "a": 4, "ar": "せいきゅう", "vi": "Ngay khi quý khách yêu cầu, chúng tôi sẽ gửi hàng mẫu.", "key": [{"w": "請求", "r": "せいきゅう", "hv": "THỈNH CẦU", "m": "yêu cầu (chính thức); đòi thanh toán"}], "x": {"1": "誘球: không có từ này. 誘 (DỤ: rủ rê) đọc ゆう, không phải せい; 球 (CẦU: quả bóng).", "2": "誘求: không có từ này. 求 đúng nhưng chữ đầu phải là 請 (xin), không phải 誘 (rủ).", "3": "請球: không có từ này. 請 đúng nhưng 球 (quả bóng) sai — chữ “đòi hỏi” là 求."}, "g": ["<b class=\"jp\">Vます / N + 次第<\/b>: ngay sau khi… (sẽ làm ngay)."], "n": ["請求書 せいきゅうしょ: hóa đơn đòi tiền. 求 きゅう: 要求, 追求."], "why": "Khách yêu cầu thì gửi hàng mẫu → <b>yêu cầu (chính thức)<\/b>. 請 (THỈNH: xin) ＋ 求 (CẦU: tìm, đòi) ＝ <b>請求<\/b> (せいきゅう). 資料請求, 請求書 là cách dùng quen thuộc."}, {"s": "気温が３５度を_こえる_ととても耐えられない。", "o": ["数える", "増える", "超える", "過える"], "a": 3, "ar": "こえる", "vi": "Nhiệt độ vượt quá 35 độ thì thật không chịu nổi.", "key": [{"w": "超える", "r": "こえる", "hv": "SIÊU", "m": "vượt quá (mức, con số)"}], "x": {"1": "数える (かぞえる: đếm). Khác âm và khác nghĩa.", "2": "増える (ふえる: tăng). Khác âm; nhiệt độ “tăng 35 độ” cũng không phải nghĩa của câu.", "4": "過える: không có động từ này. 過 dùng trong 過ぎる (すぎる: vượt quá) hoặc 過ごす, không đọc こえる."}, "n": ["超える (vượt mức, con số) và 越える (vượt qua địa hình: 山を越える, 国境を越える)."], "why": "Nhiệt độ vượt quá 35 độ → vượt qua một <b>mức, con số<\/b>. Nghĩa vượt quá giới hạn viết <b>超える<\/b> (SIÊU). (越える dùng khi vượt qua địa điểm như núi, biên giới.)"}
