<style>
/* Layout: an exam binder. Home = index of 20 exam slots; exam view = one answer sheet column with a sticky bar; explanations exist only after submitting. */

.jumps a.ng { border-color: var(--shu); color: var(--shu); background: var(--shu-wash); }

.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; margin-top: 16px; }
.q { padding: 20px 18px 16px; border-top: 1px solid var(--rule); display: grid; grid-template-columns: auto 1fr; column-gap: 14px; scroll-margin-top: 80px; }

.qn { width: 30px; height: 30px; border: 1.5px solid var(--ai); color: var(--ai); border-radius: 6px; display: grid; place-items: center; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; position: relative; }

.stem u, .jpline u { text-decoration: none; border-bottom: 2px solid var(--ai); padding-bottom: 1px; }
.blank { display: inline-block; min-width: 4.5em; text-align: center; border-bottom: 2px solid var(--ink-soft); margin-inline: .2em; line-height: 1.5; }
.blank.filled { color: var(--ai); border-bottom-color: var(--ai); }

.opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 10px; list-style: none; margin: 0; padding: 0; }

@media (max-width: 560px) { .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; border: 1px solid transparent; background: transparent; color: var(--ink); padding: 6px 8px; border-radius: 8px; font-family: var(--font-jp); font-size: 17px; min-width: 0; }

.done .opt.is-ans[aria-pressed="true"] .bub { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.done .opt.is-wrong { background: var(--shu-wash); }
.done .opt.is-wrong .bub { background: var(--shu); border-color: var(--shu); color: var(--sheet); }

.tbl { overflow-x: auto; }

ul.notes li { padding-inline-start: 14px; position: relative; }
ul.notes li::before { content: ""; position: absolute; left: 0; top: .7em; width: 6px; height: 6px; border-radius: 50%; background: var(--ai); }
.g { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; }
.g b.jp { color: var(--ai); }
.key { margin-top: 16px; }
.key table { background: var(--sheet); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

const CIRC = ["", "①", "②", "③", "④"];
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* ---------- storage (per exam, per viewer) ---------- */
const KEY = no => "n2-dora-de" + no;
function load(no) {
  try { const s = JSON.parse(localStorage.getItem(KEY(no))); if (s && s.picks) return s; } catch (e) {}
  return { picks: {}, submitted: false, t0: null, secs: 0 };
}
function save(no, s) { try { localStorage.setItem(KEY(no), JSON.stringify(s)); } catch (e) {} }
const scoreOf = (ex, s) => ex.qs.filter((q, i) => s.picks[i] === q.a).length;
const mmss = t => `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`;

function card(slot) {
  const ex = byNo[slot.no];
  if (!ex) {
    return `<div class="card off"><div class="no"><b>Đề ${slot.no}</b>${slot.cat ? `<span class="chip">${esc(slot.cat)}</span>` : ""}</div>
      <div class="state">Chưa có nội dung</div>
      <div class="acts"><a class="src" href="${slot.folder}" target="_blank" rel="noopener">Mở thư mục</a></div></div>`;
  }
  const s = load(ex.no), n = ex.qs.length, picked = Object.keys(s.picks).length;
  let state;
  if (s.submitted) state = `<span class="pen">${scoreOf(ex, s)}<small>/${n}</small></span><span>Đã nộp · ${mmss(s.secs)}</span>`;
  else if (picked) state = `<span>Đang làm ${picked}/${n}</span>`;
  else state = `<span>Chưa làm · ${n} câu</span>`;
  return `<div class="card"><div class="no"><b>Đề ${ex.no}</b><span class="chip">${esc(ex.cat)}</span></div>
    <div class="file">${esc(ex.file)}</div>
    ${!s.submitted && picked ? `<div class="bar-mini"><i style="width:${picked / n * 100}%"></i></div>` : ""}
    <div class="state">${state}</div>
    <div class="acts"><a class="btn primary" href="#de${ex.no}">${s.submitted ? "Xem lại" : picked ? "Làm tiếp" : "Làm bài"}</a>

      <a class="src" href="${ex.source.chua}" target="_blank" rel="noopener"><span class="k">解説</span>Đề chữa</a></div></div>`;
}

/* ---------- exam ---------- */
let cur = null, st = null, timer = null, onlyWrong = false, confirming = false;

function exam(no) {
  cur = byNo[no]; st = load(no); onlyWrong = false; confirming = false;
  if (!st.submitted) st.t0 = Date.now() - st.secs * 1000;
  document.title = `${cur.title} · Luyện đề N2`;
  drawExam();
  window.scrollTo({ top: 0 });
}
function tick() {
  clearInterval(timer);
  if (!cur || st.submitted) return;
  timer = setInterval(() => {
    st.secs = Math.floor((Date.now() - st.t0) / 1000);
    const el = document.getElementById("clock"); if (el) el.textContent = mmss(st.secs);
    if (st.secs % 10 === 0) save(cur.no, st);
  }, 1000);
}
function drawExam() {
  const ex = cur, S = ex.source, done = st.submitted, n = ex.qs.length;
  const right = scoreOf(ex, st), picked = Object.keys(st.picks).length;

    <header class="exam-head">

      : `<div class="info"><span>${picked}/${n} câu</span><span id="clock">${mmss(st.secs)}</span></div>
         <button class="btn primary" type="button" id="submit">Nộp bài</button>`}

    ${confirming ? `<div class="confirm" role="alert"><p>Còn <b>${n - picked}</b> câu chưa chọn. Câu bỏ trống sẽ tính là sai.</p>
       <button class="btn" type="button" id="cancelSubmit">Làm tiếp</button><button class="btn danger" type="button" id="forceSubmit">Nộp luôn</button></div>` : ""}
    ${done ? `<section class="result"><div class="big"><span class="pen">${right}<small>/${n}</small></span>
        <span>Đúng ${right} · Sai ${n - right} · Thời gian ${mmss(st.secs)}</span></div>
        <div class="jumps">${ex.qs.map((q, i) => `<a href="#q${i + 1}" class="${st.picks[i] === q.a ? "" : "ng"}" data-jump="${i + 1}">${i + 1}</a>`).join("")}</div></section>` : ""}
    <main class="sheet${done ? " done" : ""}${onlyWrong ? " only-wrong" : ""}" id="sheet">${ex.qs.map((q, i) => qHTML(q, i)).join("")}</main>
    ${done ? keyHTML() : ""}
    <footer>Đề gốc và đáp án © DORA Nihongo. Phần giải thích mở rộng là phần bổ sung, không có trong bản chữa gốc.</footer>`;

}
const MARK_OK = `<svg class="mark" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="18" transform="rotate(-20 22 22)" stroke-dasharray="108 6"/></svg>`;
const MARK_NG = `<svg class="mark" viewBox="0 0 44 44" aria-hidden="true"><path d="M9 22 L18 33 L37 8"/></svg>`;
function qHTML(q, i) {
  const done = st.submitted, pick = st.picks[i], ok = pick === q.a;
  const fill = cur.kind === "vocab" && pick ? esc(q.o[pick - 1]) : "";
  const stem = fmt(esc(q.s)).replace("（　）", `<span class="blank${fill ? " filled" : ""}">${fill}</span>`);
  const long = q.o.some(o => o.length > 6);
  return `<section class="q${done ? (ok ? " ok" : " ng") : ""}" id="q${i + 1}" data-i="${i}">
    <div><div class="qn">${i + 1}${done ? (ok ? MARK_OK : MARK_NG) : ""}</div></div>
    <div class="qbody">
      <p class="stem">${stem}</p>
      <ul class="opts${long ? " long" : ""}">${q.o.map((o, j) => {
        const n = j + 1, c = ["opt"];
        if (done && n === q.a) c.push("is-ans");
        if (done && n === pick && n !== q.a) c.push("is-wrong");
        return `<li><button type="button" class="${c.join(" ")}" data-n="${n}" aria-pressed="${pick === n}"${done ? " disabled" : ""}><span class="bub">${n}</span><span class="t">${esc(o)}</span></button></li>`;
      }).join("")}</ul>
      ${done && !pick ? `<div class="unanswered">Bỏ trống</div>` : ""}
      ${done ? `<details class="ex"${ok ? "" : " open"}><summary>Giải thích câu ${i + 1}</summary><div class="exb">${exHTML(q)}</div></details>` : ""}
    </div></section>`;
}
function exHTML(q) {
  const a = q.a, p = [];
  p.push(`<div><h4>Đáp án</h4><div class="ansline"><span class="circ">${CIRC[a]}</span><span class="w">${esc(q.o[a - 1])}</span>${q.ar ? `<span class="r">${fmt(q.ar)}</span>` : ""}</div></div>`);
  p.push(`<div><h4>Dịch câu</h4><p class="jpline">${fmt(q.s.replace("（　）", `<u>${q.o[a - 1]}</u>`))}</p><p class="vi">${q.vi}</p></div>`);
  if (q.key && q.key.length) p.push(`<div><h4>Từ vựng</h4><div class="tbl"><table><thead><tr><th>Từ</th><th>Cách đọc</th><th>Hán Việt</th><th>Nghĩa</th></tr></thead><tbody>${q.key.map(k => `<tr><td class="w">${k.w}</td><td class="r">${k.r}</td><td class="hv">${k.hv || "—"}</td><td>${fmt(k.m)}</td></tr>`).join("")}</tbody></table></div></div>`);
  if (q.x) p.push(`<div><h4>Các phương án còn lại</h4><ul class="others">${[1, 2, 3, 4].filter(n => n !== a && q.x[n]).map(n => `<li><span class="n">${n}</span><div><span class="jp">${esc(q.o[n - 1])}</span> — ${fmt(q.x[n])}</div></li>`).join("")}</ul></div>`);
  if (q.g && q.g.length) p.push(`<div><h4>Ngữ pháp trong câu</h4><div style="display:grid;gap:6px">${q.g.map(g => `<div class="g">${fmt(g)}</div>`).join("")}</div></div>`);
  if (q.n && q.n.length) p.push(`<div><h4>Ghi chú · Mở rộng</h4><ul class="notes">${q.n.map(n => `<li>${fmt(n)}</li>`).join("")}</ul></div>`);
  return p.join("");
}
function keyHTML() {
  const qs = cur.qs, rows = [];
  for (let s = 0; s < qs.length; s += 10) {
    const sl = qs.slice(s, s + 10);
    rows.push(`<tr><th>Câu</th>${sl.map((_, k) => `<th>${s + k + 1}</th>`).join("")}</tr><tr><th>Đ/A</th>${sl.map(q => `<td>${q.a}</td>`).join("")}</tr>`);
  }
  return `<details class="ex key"><summary>Bảng đáp án (解答)</summary><div class="exb"><div class="tbl"><table>${rows.join("")}</table></div></div></details>`;
}
function submit() {
  st.secs = Math.floor((Date.now() - st.t0) / 1000);
  st.submitted = true; confirming = false; clearInterval(timer);
  save(cur.no, st); drawExam(); window.scrollTo({ top: 0 });
}

app.addEventListener("click", e => {
  const t = e.target;
  const opt = t.closest(".opt");
  if (opt && cur && !st.submitted) {
    const qEl = opt.closest(".q"), i = +qEl.dataset.i, n = +opt.dataset.n;
    if (st.picks[i] === n) delete st.picks[i]; else st.picks[i] = n;
    save(cur.no, st);
    qEl.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-pressed", String(+o.dataset.n === st.picks[i])));
    const bl = qEl.querySelector(".blank");
    if (bl) { const p = st.picks[i]; bl.textContent = p ? cur.qs[i].o[p - 1] : ""; bl.classList.toggle("filled", !!p); }
    const info = app.querySelector(".bar .info span"); if (info) info.textContent = `${Object.keys(st.picks).length}/${cur.qs.length} câu`;
    return;
  }
  const jump = t.closest("[data-jump]");
  if (jump) { e.preventDefault(); document.getElementById("q" + jump.dataset.jump).scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  switch (t.closest("button")?.id) {
    case "submit": if (Object.keys(st.picks).length < cur.qs.length) { confirming = true; drawExam(); } else submit(); break;
    case "forceSubmit": submit(); break;
    case "cancelSubmit": confirming = false; drawExam(); break;
    case "retry": st = { picks: {}, submitted: false, t0: Date.now(), secs: 0 }; save(cur.no, st); drawExam(); window.scrollTo({ top: 0 }); break;
    case "onlyWrong": onlyWrong = !onlyWrong; drawExam(); break;
    case "openAll": {
      const all = [...app.querySelectorAll("#sheet details.ex")], open = !all.every(d => d.open);
      all.forEach(d => d.open = open); t.textContent = open ? "Đóng tất cả giải thích" : "Mở tất cả giải thích"; break;
    }
  }
});

function route() {
  clearInterval(timer);
  if (cur && st && !st.submitted) save(cur.no, st);
  const m = location.hash.match(/^#de(\d+)$/);
  if (m && byNo[+m[1]]) exam(+m[1]); else { cur = null; home(); }
}
window.addEventListener("hashchange", route);
window.addEventListener("pagehide", () => { if (cur && st && !st.submitted) save(cur.no, st); });
route();
</script>
