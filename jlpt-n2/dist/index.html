: "Cô ấy ngồi với tư thế thoải mái.", "key": [{"w": "姿勢", "r": "しせい", "hv": "TƯ THẾ", "m": "tư thế; thái độ"}], "x": {"2": "うんせい là 運勢 (vận mệnh). 勢 đúng là せい nhưng 姿 không đọc うん.", "3": "きせい là 規制 (quy chế) / 帰省. Khác chữ.", "4": "じょうせい là 情勢 (tình hình). 勢 đúng nhưng 姿 không đọc じょう."}, "n": ["姿 すがた: dáng vẻ. 前向きな姿勢: thái độ tích cực."], "why": "姿 đọc <b>し<\/b> (Kun: すがた), 勢 đọc <b>せい<\/b> ＝ <b>しせい<\/b>: tư thế. Ngữ cảnh 楽な〜で座る (ngồi với tư thế thoải mái) khớp nghĩa."}, {"s": "帽子を深くかぶり、顔を_隠して_歩く。", "o": ["ころして", "ためして", "かくして", "もやして"], "a": 3, "ar": "隠す", "vi": "Đội sụp mũ, che mặt mà bước đi.", "key": [{"w": "隠す", "r": "かくす", "hv": "ẨN", "m": "giấu, che"}], "x": {"1": "ころして là 殺す (giết). Chữ khác, nghĩa hoàn toàn khác.", "2": "ためして là 試す (thử). Chữ khác.", "4": "もやして là 燃やす (đốt). Chữ khác."}, "n": ["Tự động từ: 隠れる かくれる (trốn). 隠し事: chuyện giấu giếm."], "why": "隠す đọc <b>かくす<\/b>: che giấu. Ngữ cảnh đội sụp mũ, 顔を〜 (che mặt) khớp nghĩa."}, {"s": "_至急_私の家に来てください。", "o": ["しきゅう", "ちきゅう", "しっきゅう", "ちっきゅう"], "a": 1, "ar": "至急", "vi": "Hãy đến nhà tôi gấp.", "key": [{"w": "至急", "r": "しきゅう", "hv": "CHÍ CẤP", "m": "khẩn cấp"}], "x": {"2": "ちきゅう là 地球 (trái đất). Bẫy gần âm; 至 không đọc ち.", "3": "しっきゅう: không có từ này. 至急 không có âm ngắt.", "4": "ちっきゅう: không có từ này. Sai cả hai."}, "n": ["至 し: 至る いたる, 冬至 とうじ. Đồng âm: 支給 しきゅう (chi trả), 子宮."], "why": "至 đọc <b>し<\/b>, 急 đọc <b>きゅう<\/b> ＝ <b>しきゅう<\/b>: gấp, khẩn cấp. Ngữ cảnh 〜私の家に来てください (đến ngay) khớp nghĩa."}, {"s": "ああ、_悔しい_。もっとうまく出来ると思ったのに。", "o": ["おそろしい", "かなしい", "くやしい", "はずかしい"], "a": 3, "ar": "悔しい", "vi": "Ôi, tức thật! Cứ tưởng mình làm tốt hơn được.", "key": [{"w": "悔しい", "r": "くやしい", "hv": "HỐI", "m": "cay cú, tiếc tức"}], "x": {"1": "おそろしい là 恐ろしい (đáng sợ). Chữ khác; câu không nói về sợ hãi.", "2": "かなしい là 悲しい (buồn). Chữ khác; cảm xúc ở đây là tiếc + tức, không phải buồn.", "4": "はずかしい là 恥ずかしい (xấu hổ). Chữ khác."}, "n": ["悔 On かい: 後悔 こうかい. 悔やむ くやむ: hối tiếc."], "why": "悔しい đọc <b>くやしい<\/b>: tức, cay cú vì thua/thất bại. Ngữ cảnh 〜。もっとうまく出来ると思ったのに (cứ tưởng làm tốt hơn) — tiếc và bực vì kết quả kém → くやしい."}, {"s": "漫画が本棚の大半を_占めて_いる。", "o": ["しめて", "せめて", "うめて", "はめて"], "a": 1, "ar": "占める", "vi": "Truyện tranh chiếm phần lớn giá sách.", "key": [{"w": "占める", "r": "しめる", "hv": "CHIẾM", "m": "chiếm (tỷ lệ, vị trí)"}], "x": {"2": "せめて là 攻める (tấn công) / せめて (ít ra). Chữ khác.", "3": "うめて là 埋める (lấp, chôn). Chữ khác.", "4": "はめて là はめる (lắp vào, đeo nhẫn). Chữ khác."}, "n": ["占 còn đọc うらなう (bói): 占い. On せん: 独占 どくせん."], "why": "占める đọc <b>しめる<\/b>: chiếm (tỷ lệ, vị trí). Ngữ cảnh 本棚の大半を〜 (chiếm phần lớn giá sách) khớp nghĩa. Lưu ý 占う đọc うらなう (bói)."}, {"s": "彼を_憎い_と思ったことはない。", "o": ["ひどい", "ずるい", "にくい", "こわい"], "a": 3, "ar": "憎い", "vi": "Tôi chưa từng nghĩ là ghét anh ấy.", "key": [{"w": "憎い", "r": "にくい", "hv": "TĂNG", "m": "đáng ghét, căm ghét"}], "x": {"1": "ひどい là 酷い (tệ, tàn nhẫn). Chữ khác.", "2": "ずるい là 狡い (gian xảo). Chữ khác.", "4": "こわい là 怖い (đáng sợ). Chữ khác."}, "n": ["憎む にくむ, 憎しみ にくしみ (Đề 18 câu 3). On ぞう: 憎悪 ぞうお."], "why": "憎い đọc <b>にくい<\/b>: đáng ghét, căm ghét. Ngữ cảnh 彼を〜と思ったことはない khớp nghĩa. (Khác hậu tố 〜にくい: khó làm.)"}, {"s": "彼は選挙で_圧勝_した。", "o": ["あっじょう", "あつじょう", "あつしょう", "あっしょう"], "a": 4, "ar": "圧勝", "vi": "Anh ấy thắng áp đảo trong cuộc bầu cử.", "key": [{"w": "圧勝", "r": "あっしょう", "hv": "ÁP THẮNG", "m": "thắng áp đảo"}], "x": {"1": "あっじょう: âm ngắt đúng nhưng 勝 không đục thành じょう.", "2": "あつじょう: sai hai chỗ — thiếu âm ngắt và đục hóa 勝.", "3": "あつしょう: thiếu âm ngắt — 圧＋勝 phải thành あっしょう."}, "n": ["あつ + しょう → あっしょう (促音化). Xem Đề 1 câu 11 (圧倒的)."], "why": "圧 (あつ) đứng trước し (hàng さ) → âm ngắt <b>あっ<\/b>; 勝 đọc <b>しょう<\/b> ＝ <b>あっしょう<\/b>: thắng áp đảo. Giống 圧倒 あっとう ở Đề 1."}, {"s": "私は友達にテニス部への入部を_勧誘_した。", "o": ["がんゆう", "かんゆう", "かんゆ", "がんゆ"], "a": 2, "ar": "勧誘", "vi": "Tôi rủ bạn vào câu lạc bộ tennis.", "key": [{"w": "勧誘", "r": "かんゆう", "hv": "KHUYẾN DỤ", "m": "rủ rê, mời tham gia"}], "x": {"1": "がんゆう: 勧 không đục thành がん.", "3": "かんゆ: thiếu trường âm ở 誘 (ゆう).", "4": "がんゆ: sai cả hai chỗ."}, "n": ["勧める すすめる, 誘う さそう (Đề 11 câu 6)."], "why": "勧 đọc <b>かん<\/b> (âm trong), 誘 đọc <b>ゆう<\/b> (có trường âm) ＝ <b>かんゆう<\/b>: mời gọi, rủ. Ngữ cảnh rủ bạn vào câu lạc bộ khớp nghĩa."}, {"s": "この研究の_継続_には資金が必要だ。", "o": ["けいぞく", "たんそく", "けいそく", "たんぞく"], "a": 1, "ar": "継続", "vi": "Để duy trì nghiên cứu này cần kinh phí.", "key": [{"w": "継続", "r": "けいぞく", "hv": "KẾ TỤC", "m": "tiếp tục, duy trì"}], "x": {"2": "たんそく là 嘆息 (thở dài). Sai cả hai chữ.", "3": "けいそく là 計測 (đo lường). 継 đúng âm けい nhưng 続 đọc ぞく (đục), không phải そく.", "4": "たんぞく: không có từ này. 継 không đọc たん."}, "n": ["継 けい: 継ぐ つぐ (kế thừa), 中継 ちゅうけい. 続 ぞく: 連続, 接続."], "why": "継 đọc <b>けい<\/b>, 続 đọc <b>ぞく<\/b> ＝ <b>けいぞく<\/b>: tiếp tục, duy trì. Ngữ cảnh duy trì nghiên cứu cần kinh phí khớp nghĩa."}, {"s": "日本はその国と_密接_な関係がある。", "o": ["みっせつ", "びつぜつ", "みつぜつ", "びっせつ"], "a": 1, "ar": "密接", "vi": "Nhật Bản có quan hệ mật thiết với nước đó.", "key": [{"w": "密接", "r": "みっせつ", "hv": "MẬT TIẾP", "m": "mật thiết"}], "x": {"2": "びつぜつ: không có từ này. 密 không đọc び, và 接 không đục thành ぜつ.", "3": "みつぜつ: thiếu âm ngắt và đục hóa 接 sai.", "4": "びっせつ: 密 đọc み chứ không phải び."}, "n": ["みつ + せつ → みっせつ. 秘密 ひみつ, 密度 みつど."], "why": "密 (みつ) đứng trước せ → âm ngắt <b>みっ<\/b>; 接 đọc <b>せつ<\/b> ＝ <b>みっせつ<\/b>: mật thiết. Ngữ cảnh 〜な関係 (quan hệ mật thiết) khớp nghĩa."}, {"s": "_幼稚_な議論をくりかえしても無駄だ。", "o": ["ようち", "ようじ", "ゆうち", "ゆうじ"], "a": 1, "ar": "幼稚", "vi": "Cứ lặp lại những tranh luận ấu trĩ thì cũng vô ích.", "key": [{"w": "幼稚", "r": "ようち", "hv": "ẤU TRĨ", "m": "non nớt, trẻ con"}], "x": {"2": "ようじ là 幼児 (trẻ nhỏ) / 用事 (việc bận). 幼 đúng nhưng 稚 đọc ち, không phải じ.", "3": "ゆうち là 誘致 (thu hút đầu tư). 幼 không đọc ゆう.", "4": "ゆうじ: không có từ này. Sai cả hai chữ."}, "n": ["幼稚園 ようちえん. 幼い おさない."], "why": "幼 đọc <b>よう<\/b>, 稚 đọc <b>ち<\/b> ＝ <b>ようち<\/b>: ấu trĩ, trẻ con. Ngữ cảnh 〜な議論 (tranh luận ấu trĩ) khớp nghĩa."}, {"s": "日本には{石油資源|せきゆしげん}が_乏しい_。", "o": ["むなしい", "まずしい", "あやしい", "とぼしい"], "a": 4, "ar": "乏しい", "vi": "Nhật Bản nghèo tài nguyên dầu mỏ.", "key": [{"w": "乏しい", "r": "とぼしい", "hv": "PHẠP", "m": "thiếu thốn, nghèo nàn"}], "x": {"1": "むなしい là 空しい / 虚しい (trống rỗng, vô ích). Chữ khác.", "2": "まずしい là 貧しい (nghèo về tiền, đời sống). Nghĩa gần nhưng chữ khác; “nghèo tài nguyên” dùng 乏しい.", "3": "あやしい là 怪しい (đáng ngờ). Chữ khác."}, "n": ["Trái nghĩa: 豊富 ほうふ (câu 19). 経験に乏しい: thiếu kinh nghiệm."], "why": "乏しい đọc <b>とぼしい<\/b>: thiếu thốn, nghèo nàn (tài nguyên, kinh nghiệm). Ngữ cảnh 石油資源が〜 (nghèo tài nguyên dầu mỏ) khớp nghĩa."}, {"s": "借りたDVDの_返却_期限が過ぎてしまった。", "o": ["へんぎゃく", "へんきゃく", "へんかく", "へんがく"], "a": 2, "ar": "返却", "vi": "Đã quá hạn trả đĩa DVD tôi mượn.", "key": [{"w": "返却", "r": "へんきゃく", "hv": "PHẢN KHƯỚC", "m": "hoàn trả"}], "x": {"1": "へんぎゃく: 却 không đục thành ぎゃく (ぎゃく là âm của 逆).", "3": "へんかく là 変革 (cải cách). Khác chữ; 却 có âm ghép きゃく.", "4": "へんがく: không có từ này."}, "n": ["却 きゃく: 却下 きゃっか (bác bỏ), 冷却 れいきゃく."], "why": "返 đọc <b>へん<\/b>, 却 đọc <b>きゃく<\/b> (âm trong) ＝ <b>へんきゃく<\/b>: hoàn trả. Ngữ cảnh 返却期限 (hạn trả đồ mượn) là cụm cố định."}, {"s": "野菜にはビタミンが_豊富_に含まれている。", "o": ["ほうぶ", "ふうふ", "ほうふ", "ふうぶ"], "a": 3, "ar": "豊富", "vi": "Rau có chứa nhiều vitamin.", "key": [{"w": "豊富", "r": "ほうふ", "hv": "PHONG PHÚ", "m": "phong phú, dồi dào"}], "x": {"1": "ほうぶ: 富 không đục thành ぶ.", "2": "ふうふ là 夫婦 (vợ chồng). Khác chữ; 豊 đọc ほう.", "4": "ふうぶ: không có từ này."}, "n": ["豊か ゆたか. 富 ふ: 富士山, 貧富."], "why": "豊 đọc <b>ほう<\/b>, 富 đọc <b>ふ<\/b> (âm trong, không trường âm) ＝ <b>ほうふ<\/b>: phong phú, dồi dào. Ngữ cảnh ビタミンが〜に含まれる khớp nghĩa."}, {"s": "成人式を_祝って_地方自治体で会を催す。", "o": ["いのって", "うらなって", "ねがって", "いわって"], "a": 4, "ar": "祝う", "vi": "Chính quyền địa phương tổ chức buổi lễ mừng Lễ Trưởng thành.", "key": [{"w": "祝う", "r": "いわう", "hv": "CHÚC", "m": "chúc mừng"}, {"w": "催す", "r": "もよおす", "hv": "THÔI", "m": "tổ chức"}], "x": {"1": "いのって là 祈る (cầu nguyện). Chữ khác (cùng bộ 示 nên dễ nhầm).", "2": "うらなって là 占う (bói). Chữ khác.", "3": "ねがって là 願う (mong ước). Chữ khác."}, "n": ["お祝い: quà mừng. 祝日 しゅくじつ: ngày lễ. Xem Đề 11 câu 13 (催し)."], "why": "祝う đọc <b>いわう<\/b>: chúc mừng, ăn mừng. Ngữ cảnh 成人式を〜 (mừng Lễ Trưởng thành) khớp nghĩa."}], "sum": [{"h": "Âm ngắt っ — quy tắc đã gặp ở cả Đề 1 và Đề 10", "tbl": {"head": ["Chữ đầu (âm cuối)", "+ chữ sau bắt đầu bằng", "Ví dụ"], "rows": [["〜つ (圧 あつ, 密 みつ, 発 はつ)", "か・さ・た・は hàng", "圧勝 あっしょう, 密接 みっせつ, 発表 はっぴょう"], ["〜く (学 がく, 欲 よく, 特 とく)", "か hàng", "学校 がっこう, 欲求 よっきゅう"], ["〜ち (一 いち, 八 はち)", "か・さ・た・は hàng", "一回 いっかい, 八歳 はっさい"], ["Không biến", "các trường hợp khác", "圧力 あつりょく, 密度 みつど"]]}}, {"h": "Từ đọc đặc biệt và chữ nhiều âm trong đề", "li": ["<b>景色<\/b> けしき (không phải けいしょく) — giống 今日 きょう, 大人 おとな, 下手 へた (熟字訓, phải học thuộc).", "<b>省<\/b>: しょう (省略, 省エネ, 外務省) / せい (反省, 帰省) / はぶ(く) (thủ tục được lược bỏ).", "<b>占<\/b>: し(める) chiếm / うらな(う) bói / せん (独占 どくせん).", "<b>撮<\/b>: さつ (撮影) / と(る) chụp ảnh. Khác 取る, 捕る, 採る, 執る.", "<b>針<\/b>: はり (kim) / しん (方針 ほうしん: phương châm)."]}, {"h": "Tính từ cảm xúc dễ nhầm (Kun)", "tbl": {"head": ["Từ", "Đọc", "Nghĩa"], "rows": [["悔しい", "くやしい", "cay cú, tức vì thua"], ["悲しい", "かなしい", "buồn"], ["恐ろしい", "おそろしい", "đáng sợ"], ["恥ずかしい", "はずかしい", "xấu hổ"], ["憎い", "にくい", "đáng ghét"], ["空しい", "むなしい", "trống rỗng, vô ích"], ["乏しい", "とぼしい", "thiếu thốn (tài nguyên)"], ["貧しい", "まずしい", "nghèo (tiền)"], ["怪しい", "あやしい", "đáng ngờ"]]}}, {"h": "Động từ Kun cùng bộ dễ nhầm", "li": ["Bộ 示 (礻 — thần linh): 祝う いわう (mừng), 祈る いのる (cầu), 神 かみ, 礼 れい.", "Bộ 金 (kim loại): 針 はり (kim), 釘 くぎ (đinh), 鉄 てつ, 鍵 かぎ.", "Bộ 阝 trái (gò đất): 隣 となり, 隠す かくす, 険しい けわしい, 陰 かげ.", "Từ vựng N2 về tư thế, vị trí: 姿勢 しせい, 隣 となり, 脇 わき, 表 おもて, 裏 うら."]}], "source": {"folder": "https://drive.google.com/drive/folders/1BUu1BTUktXqoK6VYJe1J-mYhpu3QMlBp", "goc": "https://drive.google.com/file/d/1fghPG4dJauAuRc-XvgmXkZzjfqetRVXt/view", "chua": "https://drive.google.com/file/d/18kS47RosvUBue1OUqc0bqiKIBsc9zZ9V/view"}, "series": "DORA Nihongo · Đề 10 · Kanji N5–N2 trúng tủ"}, {"no": 11, "folderLabel": "Kanji", "cat": "Kanji", "file": "ĐỀ 17 - KANJI N2", "title": "Đề 11 · Kanji N2", "jp": "表記", "mondai": "<b>問題2<\/b> ＿＿の言葉を漢字で書くとき、最もよいものを1・2・3・4から一つ選びなさい。 Chọn cách viết chữ Hán đúng cho từ gạch chân.", "qs": [{"s": "大会の_かいさい_の準備をする。", "o": ["開講", "開場", "開演", "開催"], "a": 4, "ar": "かいさい", "vi": "Chuẩn bị cho việc tổ chức đại hội.", "key": [{"w": "開催", "r": "かいさい", "hv": "KHAI THÔI", "m": "tổ chức (sự kiện)"}], "x": {"1": "開講 (かいこう: khai giảng khóa học). Khác âm (こう); đại hội không “khai giảng”.", "2": "開場 (かいじょう: mở cửa hội trường cho khách vào). Khác âm (じょう); chỉ là một bước, không phải “tổ chức đại hội”.", "3": "開演 (かいえん: bắt đầu buổi diễn). Khác âm (えん); dùng cho kịch, hòa nhạc."}, "n": ["催 さい: 主催 しゅさい (đứng ra tổ chức). Kun: 催す もよおす (câu 13)."], "why": "大会の〜 ＝ <b>tổ chức<\/b> đại hội. 開 (KHAI: mở) ＋ 催 (THÔI: tổ chức, triệu tập) ＝ <b>開催<\/b> (かいさい). Cùng chữ 催 với 催し (sự kiện) ở câu 13."}, {"s": "彼女の_しょうじょう_は次第に悪化してきた。", "o": ["症情", "障状", "症状", "障情"], "a": 3, "ar": "しょうじょう", "vi": "Triệu chứng của cô ấy dần xấu đi.", "key": [{"w": "症状", "r": "しょうじょう", "hv": "CHỨNG TRẠNG", "m": "triệu chứng"}], "x": {"1": "症情: không có từ này. 情 (TÌNH: tình cảm) đọc じょう nhưng không mang nghĩa trạng thái bệnh.", "2": "障状: không có từ này. 障 (CHƯỚNG: trở ngại — 障害, 故障) đọc しょう nhưng không phải “bệnh chứng”.", "4": "障情: không có từ này. Sai cả hai chữ."}, "n": ["症 có bộ nạch 疒 (bệnh): 病, 痛, 疲. 状 じょう: 状態, 状況."], "why": "Thứ “xấu dần đi” của người bệnh → <b>triệu chứng<\/b>. 症 (CHỨNG: bệnh chứng) ＋ 状 (TRẠNG: tình trạng) ＝ <b>症状<\/b> (しょうじょう)."}, {"s": "弟が私の結婚式の写真_さつえい_を担当した。", "o": ["撮栄", "撮営", "撮映", "撮影"], "a": 4, "ar": "さつえい", "vi": "Em trai tôi phụ trách chụp ảnh đám cưới của tôi.", "key": [{"w": "撮影", "r": "さつえい", "hv": "TOÁT ẢNH", "m": "chụp ảnh, quay phim"}], "x": {"1": "撮栄: không có từ này. 栄 (VINH: vinh quang — 栄養) đọc えい nhưng không phải hình ảnh.", "2": "撮営: không có từ này. 営 (DOANH: kinh doanh — 営業) đọc えい.", "3": "撮映: không có từ này. Bẫy mạnh nhất vì 映 (ÁNH: chiếu) liên quan hình ảnh (映画, 映像), nhưng “chụp ảnh” viết 撮影."}, "n": ["Xem Đề 10 câu 5 (đọc 撮影)."], "why": "写真〜 ＝ <b>chụp ảnh<\/b>. 撮 (TOÁT: chụp) ＋ 影 (ẢNH: hình bóng) ＝ <b>撮影<\/b> (さつえい). Từ này đã gặp ở phần đọc (Đề 10 câu 5)."}, {"s": "_うで_に黄色いリボンをつけているのはツアーのお客様です。", "o": ["腕", "胸", "肩", "腹"], "a": 1, "ar": "うで", "vi": "Những người đeo ruy băng vàng ở cánh tay là khách của tour.", "key": [{"w": "腕", "r": "うで", "hv": "OẢN", "m": "cánh tay; tay nghề"}], "x": {"2": "胸 (むね: ngực). Khác âm.", "3": "肩 (かた: vai). Khác âm.", "4": "腹 (はら: bụng). Khác âm."}, "n": ["腕がいい (tay nghề giỏi), 腕時計 うでどけい."], "why": "Đeo ruy băng ở <b>cánh tay<\/b> → うで viết là <b>腕<\/b> (OẢN). Đeo băng tay là cách nhận diện khách tour."}, {"s": "ずっと{閉|し}めきりだったので部屋が_しめっぽい_。", "o": ["湿っぽい", "汗っぽい", "汚っぽい", "泡っぽい"], "a": 1, "ar": "しめっぽい", "vi": "Căn phòng đóng kín suốt nên có mùi ẩm.", "key": [{"w": "湿っぽい", "r": "しめっぽい", "hv": "THẤP", "m": "ẩm ướt; (không khí) ảm đạm"}], "x": {"2": "汗っぽい: không có từ này. 汗 (あせ: mồ hôi) — muốn nói “đẫm mồ hôi” là 汗ばむ.", "3": "汚っぽい: không có từ này. 汚 đọc きたない / よごれる, không đọc しめ.", "4": "泡っぽい: không có từ này. 泡 (あわ: bọt)."}, "g": ["<b class=\"jp\">Vます + きり<\/b> (閉めきり): đóng kín suốt. <b class=\"jp\">〜っぽい<\/b>: có vẻ, hơi."], "n": ["湿る しめる (Đề 20 câu 9), 湿度 しつど, 湿気 しっけ."], "why": "Phòng đóng kín lâu → <b>ẩm thấp<\/b>. 湿 (THẤP: ẩm) ＋ っぽい ＝ <b>湿っぽい<\/b> (しめっぽい). Động từ gốc: 湿る しめる (bị ẩm)."}, {"s": "音楽会に行こうと友達を_さそった_。", "o": ["勧った", "招った", "誘った", "請った"], "a": 3, "ar": "さそう", "vi": "Tôi rủ bạn đi xem hòa nhạc.", "key": [{"w": "誘う", "r": "さそう", "hv": "DỤ", "m": "rủ, mời"}], "x": {"1": "勧った: không có dạng này. 勧 đọc 勧める (すすめる: khuyên, mời) — nghĩa gần nhưng âm khác.", "2": "招った: không có dạng này. 招 đọc 招く (まねく: mời đến dự).", "4": "請った: không có dạng này. 請 đọc 請う (こう: xin) / 請ける (うける)."}, "n": ["誘惑 ゆうわく (cám dỗ), 勧誘 (Đề 10 câu 13)."], "why": "Rủ bạn đi xem hòa nhạc → <b>mời rủ<\/b>. さそう viết là <b>誘う<\/b> (DỤ). 〜ようと誘う: rủ cùng làm."}, {"s": "この国は_ふくし_が充実しています。", "o": ["副仕", "副祉", "福祉", "福仕"], "a": 3, "ar": "ふくし", "vi": "Nước này có chế độ phúc lợi rất đầy đủ.", "key": [{"w": "福祉", "r": "ふくし", "hv": "PHÚC CHỈ", "m": "phúc lợi xã hội"}, {"w": "充実", "r": "じゅうじつ", "hv": "SUNG THỰC", "m": "đầy đủ, phong phú"}], "x": {"1": "副仕: không có từ này. 副 (PHÓ: phụ) đọc ふく nhưng không mang nghĩa phúc lợi; 仕 (SĨ: làm việc).", "2": "副祉: không có từ này. 祉 đúng nhưng chữ đầu phải là 福.", "4": "福仕: không có từ này. 福 đúng nhưng 仕 sai."}, "n": ["Đồng âm: 副詞 ふくし (phó từ)."], "why": "Chế độ đầy đủ của một quốc gia → <b>phúc lợi<\/b>. 福 (PHÚC: hạnh phúc) ＋ 祉 (CHỈ: phúc) ＝ <b>福祉<\/b> (ふくし). Cả hai chữ đều có bộ 礻 (thần linh, may mắn)."}, {"s": "誰にでも_じゃくてん_はある。", "o": ["弱点", "欠点", "失点", "短点"], "a": 1, "ar": "じゃくてん", "vi": "Ai cũng có điểm yếu.", "key": [{"w": "弱点", "r": "じゃくてん", "hv": "NHƯỢC ĐIỂM", "m": "điểm yếu"}], "x": {"2": "欠点 (けってん: khuyết điểm). Nghĩa gần nhưng đọc khác — đề hỏi chữ của âm じゃくてん.", "3": "失点 (しってん: điểm bị mất trong thi đấu). Khác âm, khác nghĩa.", "4": "短点: không có từ này. “Sở đoản” là 短所 たんしょ; trái nghĩa 長所."}, "n": ["弱 On じゃく: 弱者. 長所 ↔ 短所."], "why": "じゃくてん ＝ <b>điểm yếu<\/b>: 弱 (NHƯỢC: yếu, đọc じゃく) ＋ 点 (ĐIỂM) ＝ <b>弱点<\/b>."}, {"s": "大臣が工事現場を_おとずれた_。", "o": ["訪れた", "参れた", "伺れた", "尋れた"], "a": 1, "ar": "おとずれる", "vi": "Bộ trưởng đã đến thăm công trường.", "key": [{"w": "訪れる", "r": "おとずれる", "hv": "PHỎNG", "m": "đến thăm (nơi chốn); (mùa) đến"}], "x": {"2": "参れた: không có dạng này. 参 đọc 参る (まいる: đi, đến — khiêm nhường).", "3": "伺れた: không có dạng này. 伺 đọc 伺う (うかがう: hỏi, đến thăm — khiêm nhường).", "4": "尋れた: không có dạng này. 尋 đọc 尋ねる (たずねる: hỏi). Chú ý 訪ねる cũng đọc たずねる (đến thăm)."}, "n": ["訪ねる たずねる: thăm (người). 春が訪れる."], "why": "Bộ trưởng <b>đến thăm<\/b> công trường. おとずれる viết là <b>訪れる<\/b> (PHỎNG). Âm On: 訪問 ほうもん."}, {"s": "あの男は決して自分の_そん_になることはしない。", "o": ["損", "罪", "害", "毒"], "a": 1, "ar": "そん", "vi": "Gã đó tuyệt đối không làm gì thiệt cho bản thân.", "key": [{"w": "損", "r": "そん", "hv": "TỔN", "m": "thiệt, lỗ"}], "x": {"2": "罪 (つみ: tội). Đọc khác; 自分の罪になる sai nghĩa.", "3": "害 (がい: hại). Đọc khác; cụm thường là 害になる nhưng đề hỏi âm そん.", "4": "毒 (どく: độc). Đọc khác; 毒になる (có hại cho sức khỏe) không hợp ngữ cảnh."}, "n": ["損 ↔ 得 とく. 損害 (Đề 14 câu 3)."], "why": "そん ＝ <b>thiệt hại, lỗ<\/b>. 自分の損になる ＝ thiệt cho bản thân. Viết là <b>損<\/b> (TỔN). Trái nghĩa: 得 とく (lợi)."}, {"s": "ユリの花は{純粋|じゅんすい}さを_しょうちょう_している。", "o": ["像微", "像徴", "象微", "象徴"], "a": 4, "ar": "しょうちょう", "vi": "Hoa bách hợp tượng trưng cho sự thuần khiết.", "key": [{"w": "象徴", "r": "しょうちょう", "hv": "TƯỢNG TRƯNG", "m": "tượng trưng"}], "x": {"1": "像微: không có từ này. 像 đọc ぞう; 微 (VI: nhỏ — 微妙) đọc び.", "2": "像徴: không có từ này. 徴 đúng nhưng 像 đọc ぞう, không phải しょう.", "3": "象微: không có từ này. 象 đúng nhưng 微 khác 徴 — chú ý hai chữ trông rất giống nhau."}, "n": ["徴 ちょう: 特徴, 徴収. Xem Đề 1 câu 9 (象 しょう)."], "why": "Hoa bách hợp <b>tượng trưng<\/b> cho sự thuần khiết. 象 (TƯỢNG: hình tượng, đọc しょう) ＋ 徴 (TRƯNG: dấu hiệu) ＝ <b>象徴<\/b> (しょうちょう)."}, {"s": "手術しか彼女を_すくう_道はありません。", "o": ["救う", "療う", "治う", "助う"], "a": 1, "ar": "すくう", "vi": "Chỉ có phẫu thuật mới cứu được cô ấy.", "key": [{"w": "救う", "r": "すくう", "hv": "CỨU", "m": "cứu"}], "x": {"2": "療う: không có. 療 (LIỆU) chỉ dùng trong từ Hán: 治療, 医療.", "3": "治う: không có. 治 đọc 治す (なおす: chữa) / 治める (おさめる: cai trị).", "4": "助う: không có. 助 đọc 助ける (たすける: giúp đỡ) — nghĩa gần nhưng okurigana khác."}, "g": ["<b class=\"jp\">〜しか〜ない<\/b>: chỉ có."], "n": ["Xem Đề 4 câu 6 (救助)."], "why": "Phẫu thuật là cách duy nhất để <b>cứu<\/b> cô ấy. すくう viết là <b>救う<\/b> (CỨU) — cùng chữ với 救助 (Đề 4 câu 6)."}, {"s": "昨日、町内の_もよおし_に参加しました。", "o": ["推し", "権し", "催し", "携し"], "a": 3, "ar": "もよおし", "vi": "Hôm qua tôi tham gia một sự kiện của khu phố.", "key": [{"w": "催し", "r": "もよおし", "hv": "THÔI", "m": "sự kiện, lễ hội"}], "x": {"1": "推し: đọc おし (người/thứ mình yêu thích, từ 推す おす: đẩy, tiến cử). Khác âm.", "2": "権し: không có. 権 (QUYỀN) không có âm Kun.", "4": "携し: không có. 携 đọc 携える (たずさえる: mang theo)."}, "n": ["催し物 もよおしもの. Xem Đề 10 câu 20."], "why": "町内の〜に参加 ＝ tham gia <b>sự kiện<\/b> của khu phố. もよおし viết là <b>催し<\/b> (THÔI). Động từ: 催す もよおす (tổ chức)."}, {"s": "_しんけん_な表情で医者の説明を聞く。", "o": ["真検", "真健", "真堅", "真剣"], "a": 4, "ar": "しんけん", "vi": "Nghe bác sĩ giải thích với vẻ mặt nghiêm túc.", "key": [{"w": "真剣", "r": "しんけん", "hv": "CHÂN KIẾM", "m": "nghiêm túc, hết mình"}], "x": {"1": "真検: không có. 検 (KIỂM: kiểm tra — 検査) đọc けん nhưng sai chữ.", "2": "真健: không có. 健 (KIỆN: khỏe — 健康).", "3": "真堅: không có. 堅 (KIÊN: cứng — 堅い)."}, "n": ["Bốn chữ 検・健・堅・剣 đều đọc けん, chỉ khác bộ."], "why": "Vẻ mặt <b>nghiêm túc<\/b> khi nghe bác sĩ. 真 (CHÂN) ＋ 剣 (KIẾM: thanh kiếm) ＝ <b>真剣<\/b> (しんけん) — gốc nghĩa “kiếm thật”, nay là nghiêm túc."}, {"s": "_くわしい_ことはよく知らないんです。", "o": ["細しい", "詳しい", "税しい", "祥しい"], "a": 2, "ar": "くわしい", "vi": "Chi tiết thì tôi không rõ lắm.", "key": [{"w": "詳しい", "r": "くわしい", "hv": "TƯỜNG", "m": "chi tiết; am hiểu"}], "x": {"1": "細しい: không có. 細 đọc 細かい (こまかい: tỉ mỉ, nhỏ) / 細い (ほそい) — nghĩa gần nhưng okurigana khác.", "3": "税しい: không có. 税 (THUẾ) không có âm Kun.", "4": "祥しい: không có. 祥 (TƯỜNG — 不祥事) trông giống 詳 nhưng bộ 礻, không phải bộ 言."}, "n": ["詳細 しょうさい. 〜に詳しい: rành về…"], "why": "くわしい ＝ <b>chi tiết, tường tận<\/b>. Viết là <b>詳しい<\/b> (TƯỜNG). Âm On: 詳細 しょうさい."}, {"s": "人々は_きそって_その新製品を{買|か}い{求|もと}めた。", "o": ["討って", "競って", "争って", "戦って"], "a": 2, "ar": "きそう", "vi": "Mọi người tranh nhau mua sản phẩm mới đó.", "key": [{"w": "競う", "r": "きそう", "hv": "CẠNH", "m": "tranh đua"}], "x": {"1": "討って: 討つ đọc うつ (đánh dẹp). Khác âm.", "3": "争って: 争う đọc あらそう (tranh chấp). Nghĩa gần nhưng âm khác — đề hỏi chữ của きそう.", "4": "戦って: 戦う đọc たたかう (chiến đấu). Khác âm."}, "n": ["競争 きょうそう, 競技 きょうぎ."], "why": "Mọi người <b>tranh nhau<\/b> mua. きそう viết là <b>競う<\/b> (CẠNH). 競って〜する ＝ đua nhau làm. Âm On: 競争 きょうそう."}, {"s": "主人公を演じた彼の_えんぎ_はすばらしかった。", "o": ["演劇", "園技", "演技", "園劇"], "a": 3, "ar": "えんぎ", "vi": "Diễn xuất của anh ấy trong vai chính thật tuyệt vời.", "key": [{"w": "演技", "r": "えんぎ", "hv": "DIỄN KỸ", "m": "diễn xuất"}], "x": {"1": "演劇 (えんげき: kịch nghệ). Khác âm (げき); là loại hình nghệ thuật, không phải “diễn xuất của anh ấy”.", "2": "園技: không có. 園 (VIÊN: vườn) đọc えん nhưng sai nghĩa.", "4": "園劇: không có."}, "n": ["Đồng âm: 縁起 えんぎ (điềm): 縁起がいい."], "why": "Diễn xuất của diễn viên → <b>演技<\/b> (えんぎ): 演 (DIỄN) ＋ 技 (KỸ: kỹ thuật)."}, {"s": "彼は{赤十字|せきじゅうじ}に{多額|たがく}を_きふ_した。", "o": ["寄付", "奇与", "寄与", "奇付"], "a": 1, "ar": "きふ", "vi": "Anh ấy quyên góp một khoản lớn cho Hội Chữ thập đỏ.", "key": [{"w": "寄付", "r": "きふ", "hv": "KÝ PHÓ", "m": "quyên góp"}], "x": {"2": "奇与: không có. 奇 (KỲ: lạ — 奇妙) trông giống 寄 nhưng không có bộ 宀.", "3": "寄与 (きよ: đóng góp công sức cho xã hội). Đọc khác (きよ) — đề hỏi きふ.", "4": "奇付: không có. 付 đúng nhưng 奇 sai."}, "n": ["寄 き/よる: 寄る, 年寄り. 奇 (KỲ) như 奇妙, 好奇心."], "why": "Đưa số tiền lớn cho Hội Chữ thập đỏ → <b>quyên góp<\/b>. 寄 (KÝ: gửi) ＋ 付 (PHÓ: giao) ＝ <b>寄付<\/b> (きふ)."}, {"s": "{山下|やました}さんは事務_けいとう_の仕事に向いています。", "o": ["系等", "形等", "系統", "形統"], "a": 3, "ar": "けいとう", "vi": "Anh Yamashita hợp với công việc mảng hành chính.", "key": [{"w": "系統", "r": "けいとう", "hv": "HỆ THỐNG", "m": "hệ, mảng; hệ thống"}], "x": {"1": "系等: không có. 等 (ĐẲNG: bằng nhau) đọc とう nhưng sai chữ.", "2": "形等: không có. 形 (HÌNH) đọc けい nhưng sai nghĩa.", "4": "形統: không có. 統 đúng nhưng 形 sai."}, "g": ["<b class=\"jp\">〜に向いている<\/b>: phù hợp với."], "n": ["統 とう: 統一, 伝統. 等 とう: 平等 (bẫy đồng âm)."], "why": "事務〜の仕事 ＝ công việc <b>thuộc mảng<\/b> hành chính. 系 (HỆ) ＋ 統 (THỐNG) ＝ <b>系統<\/b> (けいとう): hệ thống, dòng, mảng."}, {"s": "_じっせん_を通じて技術を学んだ。", "o": ["実践", "実志", "実浅", "実施"], "a": 1, "ar": "じっせん", "vi": "Tôi học kỹ thuật thông qua thực hành.", "key": [{"w": "実践", "r": "じっせん", "hv": "THỰC TIỄN", "m": "thực hành"}], "x": {"2": "実志: không có. 志 (CHÍ: ý chí) đọc し.", "3": "実浅: không có. 浅 (THIỂN: nông — 浅い) đọc せん nhưng sai nghĩa.", "4": "実施 (じっし: thi hành, tiến hành chính sách). Đọc khác (じっし) và nghĩa khác — không “học qua thi hành”."}, "g": ["<b class=\"jp\">〜を通じて<\/b>: thông qua."], "n": ["Đồng âm: 実戦 じっせん (thực chiến)."], "why": "Học kỹ thuật thông qua <b>thực hành<\/b>. 実 (THỰC) ＋ 践 (TIỄN: bước, thực hiện) ＝ <b>実践<\/b> (じっせん)."}], "sum": [{"h": "Chữ Hán trông giống nhau — bẫy chính của 表記", "tbl": {"head": ["Cặp chữ", "Phân biệt", "Ví dụ"], "rows": [["徴 / 微", "徴 trưng (dấu hiệu) / 微 vi (nhỏ)", "象徴, 特徴 / 微妙, 微笑"], ["寄 / 奇", "寄 có 宀 (gửi) / 奇 không có (lạ)", "寄付, 寄与 / 奇妙, 好奇心"], ["詳 / 祥", "詳 bộ 言 (chi tiết) / 祥 bộ 礻", "詳しい, 詳細 / 不祥事"], ["象 / 像", "象 しょう (hình tượng) / 像 ぞう (hình ảnh)", "象徴, 印象 / 映像, 想像"], ["影 / 映", "影 bóng, ảnh / 映 chiếu", "撮影, 影響 / 映画, 映像"], ["剣 / 検 / 険 / 験", "kiếm / kiểm tra / hiểm / thí nghiệm", "真剣 / 検査 / 危険 / 試験"], ["福 / 副", "phúc / phó", "福祉 / 副作用"]]}}, {"h": "Động từ mời, thăm, hỏi — dễ nhầm okurigana", "tbl": {"head": ["Chữ", "Đọc", "Nghĩa"], "rows": [["誘う", "さそう", "rủ"], ["勧める", "すすめる", "khuyên, mời"], ["招く", "まねく", "mời (đến dự)"], ["訪れる / 訪ねる", "おとずれる / たずねる", "đến thăm"], ["尋ねる", "たずねる", "hỏi"], ["伺う", "うかがう", "hỏi / thăm (khiêm nhường)"], ["救う", "すくう", "cứu"], ["助ける", "たすける", "giúp"], ["競う", "きそう", "đua tranh"], ["催す", "もよおす", "tổ chức"]]}}, {"h": "Nhóm từ theo chủ đề", "li": ["<b>開〜<\/b>: 開催 (tổ chức), 開講 (khai giảng), 開場 (mở cửa), 開演 (bắt đầu diễn), 開幕 かいまく (khai mạc), 開店 (khai trương).", "<b>Y tế<\/b>: 症状 (triệu chứng), 治療 (điều trị), 手術 (phẫu thuật), 診察 しんさつ (khám), 処方 (kê đơn).", "<b>Xã hội<\/b>: 福祉 (phúc lợi), 寄付 (quyên góp), 寄与 (đóng góp), 慈善 じぜん (từ thiện), ボランティア.", "<b>Điểm<\/b>: 弱点 (điểm yếu), 欠点 (khuyết điểm), 短所 (sở đoản) ↔ 長所 (sở trường), 利点 (ưu điểm).", "<b>実〜<\/b>: 実践 (thực hành), 実施 (thi hành), 実行 (thực hiện), 実現 (hiện thực hóa), 実験 (thí nghiệm)."]}], "source": {"folder": "https://drive.google.com/drive/folders/1hd-JaV0ycmjMZSqrzvWGXyna2cnVyQuT", "goc": "https://drive.google.com/file/d/1BsHW96TXlRNFtKh1AwB1-04wZHpwPGXa/view", "chua": "https://drive.google.com/file/d/1TYjTJosHww2y_zp6ufWrcfic6mX84jTe/view"}, "series": "DORA Nihongo · Đề 11 · Kanji N5–N2 trúng tủ"}, {"no": 12, "folderLabel": "Ngữ pháp", "cat": "Ngữ pháp", "file": "ĐỀ 18 - NGỮ PHÁP N2", "title": "Đề 12 · Ngữ pháp N2", "jp": "文法形式", "mondai": "<b>問題7<\/b> 次の文の（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。 Chọn mẫu ngữ pháp thích hợp nhất để điền vào chỗ trống.", "qs": [{"s": "彼は生活のために日曜日も休む（　）働いている。", "o": ["ものなく", "わけなく", "ことなく", "ほどなく"], "a": 3, "ar": "Vる + ことなく", "vi": "Vì miếng cơm manh áo, anh ấy làm việc cả Chủ nhật mà không nghỉ.", "key": [{"w": "〜ことなく", "r": "ことなく", "hv": "—", "m": "mà không (= 〜ないで, văn viết)"}], "x": {"1": "ものなく: không có mẫu ngữ pháp này.", "2": "わけなく (dễ dàng) là phó từ độc lập (わけなく解ける). Không gắn sau động từ.", "4": "ほどなく (chẳng bao lâu sau) là phó từ chỉ thời gian. “Nghỉ chẳng bao lâu sau làm việc” vô nghĩa."}, "n": ["休むことなく, 迷うことなく, 誰にも知られることなく."], "why": "Làm việc cả Chủ nhật <b>mà không<\/b> nghỉ. Mẫu <b>Vる＋ことなく<\/b> (văn viết): không làm A mà làm B. Đi sau động từ thể từ điển 休む → đúng."}, {"s": "すっかり{疲|つか}れてしまい、{風呂|ふろ}に入ること（　）おっくうだった。", "o": ["さえ", "だけ", "こそ", "ばかり"], "a": 1, "ar": "〜さえ", "vi": "Mệt rã rời đến mức ngay cả việc đi tắm cũng thấy ngại.", "key": [{"w": "〜さえ", "r": "さえ", "hv": "—", "m": "ngay cả, đến cả"}, {"w": "億劫", "r": "おっくう", "hv": "ỨC KIẾP", "m": "ngại, lười làm"}], "x": {"2": "だけ (chỉ): “chỉ có việc đi tắm là ngại” — mất ý nhấn mạnh mức độ mệt.", "3": "こそ (chính là): nhấn mạnh tích cực (今年こそ合格する). Không dùng với cảm giác ngại.", "4": "ばかり (toàn là): chỉ sự lặp lại / toàn bộ (遊んでばかり). Không hợp."}, "n": ["Xem Đề 15 câu 2 (でさえ), Đề 15 câu 3 (さえ〜ば)."], "why": "Mệt đến mức <b>ngay cả<\/b> việc đi tắm (việc bình thường nhất) cũng ngại. Trợ từ <b>さえ<\/b> ＝ ngay cả, đến cả — nêu ví dụ cực đoan để ám chỉ những việc khác càng không."}, {"s": "{慎重|しんちょう}な彼女の（　）、おそらくうまくやるにちがいない。", "o": ["ところだから", "ことだから", "わけだから", "ものだから"], "a": 2, "ar": "Nの + ことだから", "vi": "Người cẩn thận như cô ấy thì chắc chắn sẽ làm tốt.", "key": [{"w": "〜のことだから", "r": "のことだから", "hv": "—", "m": "vì là (người đó, dựa trên tính cách) nên chắc…"}], "x": {"1": "ところだから: không có mẫu này với nghĩa phán đoán theo tính cách.", "3": "〜わけだから (vì lẽ đó): nêu lý do logic từ sự việc, không đi sau 彼女の.", "4": "〜ものだから (vì… — biện minh): dùng giải thích lý do cá nhân (道が混んでいたものだから遅れた). Không đi sau Nの để phán đoán."}, "g": ["Vế sau thường là suy đoán: 〜にちがいない, 〜だろう."], "why": "Dựa vào <b>tính cách đã biết<\/b> của một người để phán đoán chắc chắn. Mẫu <b>Nの＋ことだから<\/b>: vì là N (người như thế) nên chắc… Vế sau có にちがいない → khớp."}, {"s": "いくら{資金|しきん}がない（　）、そこまで{経費|けいひ}を{削減|さくげん}すべきではないでしょう。", "o": ["といっても", "といったら", "といえば", "というより"], "a": 1, "ar": "〜といっても", "vi": "Dù có nói là không có vốn đến đâu, cũng không nên cắt giảm chi phí đến mức đó chứ.", "key": [{"w": "〜といっても", "r": "といっても", "hv": "—", "m": "dù nói là… nhưng"}, {"w": "削減", "r": "さくげん", "hv": "TƯỚC GIẢM", "m": "cắt giảm"}], "x": {"2": "〜といったら (nói đến… thì — cảm thán mạnh): その美しさといったら. Không mang nghĩa nhượng bộ.", "3": "〜といえば (nhắc đến… thì nhớ ra): dùng để liên tưởng chủ đề. Không phản bác.", "4": "〜というより (nói đúng hơn là): dùng để điều chỉnh cách diễn đạt. Không đi với いくら."}, "n": ["Xem Đề 15 câu 4 (といっても nghĩa: nói là… nhưng thực ra)."], "why": "Thừa nhận vế trước (không có vốn) nhưng vế sau phản bác (cũng không nên cắt đến thế). Mẫu <b>いくら〜といっても<\/b>: dù có nói là… đi nữa."}, {"s": "かぜ{薬|ぐすり}を飲んだのに、まだ熱が（　）。", "o": ["高さにすぎない", "高くてたまらない", "高いこともない", "高いほかない"], "a": 2, "ar": "〜てたまらない", "vi": "Uống thuốc cảm rồi mà vẫn sốt cao không chịu nổi.", "key": [{"w": "〜てたまらない", "r": "てたまらない", "hv": "—", "m": "… không chịu nổi, vô cùng"}], "x": {"1": "〜にすぎない (chỉ là): sau danh từ; “chỉ là độ cao” vô nghĩa và không diễn tả khó chịu.", "3": "〜こともない (cũng không hẳn): khẳng định dè dặt, mâu thuẫn với “vẫn sốt”.", "4": "〜ほかない (chỉ còn cách): sau Vる (待つほかない), không sau tính từ 高い."}, "n": ["Đồng nghĩa: 〜てしかたがない, 〜てならない (câu 12)."], "why": "Đã uống thuốc mà vẫn sốt cao, khó chịu <b>không chịu nổi<\/b>. Mẫu <b>Aくて＋たまらない<\/b>: … không chịu nổi (cảm giác của bản thân)."}, {"s": "今まで何度もタバコを止めようと思った（　）。", "o": ["ことだ", "ものだ", "ことか", "ものか"], "a": 3, "ar": "〜ことか", "vi": "Không biết bao nhiêu lần tôi đã định bỏ thuốc lá.", "key": [{"w": "〜ことか", "r": "ことか", "hv": "—", "m": "biết bao, biết bao nhiêu (cảm thán)"}], "x": {"1": "〜ことだ (nên): lời khuyên (毎日運動することだ). Không phải cảm thán về bản thân.", "2": "〜ものだ (thường hay — hồi tưởng; lẽ thường): 子どもの頃よく遊んだものだ. Không đi với 何度も để cảm thán số lần.", "4": "〜ものか (làm gì có chuyện — phủ định mạnh): ngược nghĩa câu."}, "g": ["Đi với từ nghi vấn: 何度, どんなに, どれほど + 〜ことか."], "why": "Cảm thán: <b>không biết bao nhiêu lần<\/b> đã định bỏ thuốc. Mẫu <b>(何度も／どんなに)〜ことか<\/b>: biết bao, biết mấy. Có 何度も → dấu hiệu rõ."}, {"s": "うれしい（　）、今度の集会は、あちらこちらから多くの参加者があった。", "o": ["せいで", "ものから", "ことに", "ばかりに"], "a": 3, "ar": "〜ことに", "vi": "Thật đáng mừng là buổi tụ họp lần này có rất đông người tham gia từ khắp nơi.", "key": [{"w": "〜ことに", "r": "ことに", "hv": "—", "m": "thật là… (cảm xúc người nói, đặt đầu câu)"}], "x": {"1": "〜せいで (tại vì — kết quả xấu): ngược với うれしい.", "2": "〜ものから: dạng cổ (vì / mặc dù), không dùng trong câu hiện đại này.", "4": "〜ばかりに (chỉ vì — dẫn đến kết quả xấu): ngược với tin vui."}, "n": ["残念なことに, 驚いたことに, 不思議なことに."], "why": "Mở đầu câu bằng cảm xúc người nói: <b>thật đáng mừng là<\/b>… Mẫu <b>Aい／Aな＋ことに<\/b>: うれしいことに, 残念なことに, 驚いたことに."}, {"s": "{夜中|よなか}の２時に電話してくるなんて、それは{非常識|ひじょうしき}（　）。", "o": ["というわけではない", "ということではない", "というものだ", "というからだ"], "a": 3, "ar": "〜というものだ", "vi": "Gọi điện lúc 2 giờ đêm thì đúng là thiếu ý thức.", "key": [{"w": "〜というものだ", "r": "というものだ", "hv": "—", "m": "đúng là, quả thật là (nhận định theo lẽ thường)"}], "x": {"1": "〜というわけではない (không hẳn là): phủ định một phần — trái với giọng phê phán.", "2": "〜ということではない (không có nghĩa là): phủ định cách hiểu — không hợp.", "4": "というからだ: “vì người ta nói là” — không tạo nghĩa đánh giá."}, "n": ["Phủ định: 〜というものではない (Đề 15 câu 8)."], "why": "Đánh giá mạnh mẽ dựa trên lẽ thường: gọi lúc 2 giờ đêm thì <b>đúng là<\/b> thiếu ý thức. Mẫu <b>Nというものだ<\/b>: đó chính là…"}, {"s": "{有望|ゆうぼう}な社員だと思う（　）課長は彼をきびしく教育しているのだ。", "o": ["に応じて", "からこそ", "に加えて", "からさえ"], "a": 2, "ar": "〜からこそ", "vi": "Chính vì nghĩ anh ấy là nhân viên có triển vọng nên trưởng phòng mới rèn anh ấy nghiêm khắc.", "key": [{"w": "〜からこそ", "r": "からこそ", "hv": "—", "m": "chính vì… nên mới"}, {"w": "有望", "r": "ゆうぼう", "hv": "HỮU VỌNG", "m": "có triển vọng"}], "x": {"1": "〜に応じて (tùy theo): đi với danh từ (能力に応じて), không đi sau mệnh đề 思う.", "3": "〜に加えて (thêm vào): đi với danh từ, không nêu lý do.", "4": "からさえ: không có mẫu này."}, "g": ["Câu thường kết bằng 〜のだ."], "why": "Nhấn mạnh <b>chính vì<\/b> nghĩ anh ấy có triển vọng nên mới rèn nghiêm. Mẫu <b>〜からこそ<\/b>: chính vì… (thường đi với のだ ở cuối — câu có のだ)."}, {"s": "A「毎日６時間は勉強しなさい。」　B「そんなこと、（　）よ。」", "o": ["できるほかはない", "できざるをえない", "できるしかない", "できっこない"], "a": 4, "ar": "Vます + っこない", "vi": "A: Mỗi ngày học ít nhất 6 tiếng đi. B: Chuyện đó sao mà làm nổi!", "key": [{"w": "〜っこない", "r": "っこない", "hv": "—", "m": "làm sao mà… được (khẩu ngữ)"}], "x": {"1": "〜ほかはない (chỉ còn cách): đồng ý làm — ngược ý phản bác.", "2": "〜ざるをえない (đành phải): cũng là đồng ý làm, và できる không chia với ざるをえない.", "3": "〜しかない (chỉ còn cách): đồng ý làm — ngược ý."}, "n": ["分かりっこない, 勝てっこない. Ba phương án kia đều là “đành phải làm”, trái nghĩa với B."], "why": "B phản bác mạnh: học 6 tiếng mỗi ngày thì <b>làm sao mà làm được<\/b>. Mẫu <b>Vます＋っこない<\/b> (khẩu ngữ): tuyệt đối không thể. できる → できっこない."}, {"s": "彼女は、明るく責任感が強い（　）、同級生に好かれている。", "o": ["ことから", "ことだから", "ことなく", "ことに"], "a": 1, "ar": "〜ことから", "vi": "Vì tính tình vui vẻ, có trách nhiệm nên cô ấy được bạn bè quý mến.", "key": [{"w": "〜ことから", "r": "ことから", "hv": "—", "m": "từ việc…, do… (căn cứ)"}], "x": {"2": "〜ことだから (vì là người như vậy nên chắc…): dùng để phán đoán (câu 3), đi sau Nの. Ở đây là nêu nguyên nhân.", "3": "〜ことなく (mà không): ngược nghĩa.", "4": "〜ことに (thật là — cảm xúc): chỉ đi với tính từ cảm xúc (うれしいことに)."}, "n": ["Câu này ôn cả 4 mẫu với こと trong cùng đề."], "why": "Nêu <b>căn cứ<\/b> dẫn đến kết quả: vì vui vẻ, có trách nhiệm nên được quý mến. Mẫu <b>〜ことから<\/b>: từ việc…, vì… (căn cứ khách quan)."}, {"s": "かわいがっていた犬に死なれて悲しくて（　）。", "o": ["はならない", "ならない", "はかなわない", "かまわない"], "a": 2, "ar": "〜てならない", "vi": "Con chó cưng chết, tôi buồn không nguôi.", "key": [{"w": "〜てならない", "r": "てならない", "hv": "—", "m": "… không chịu nổi (cảm xúc tự nhiên trào dâng)"}], "x": {"1": "〜てはならない (không được phép): mệnh lệnh cấm — 悲しくてはならない vô nghĩa ở đây.", "3": "〜てはかなわない (… thì chịu không nổi — phàn nàn): dùng cho điều làm phiền (こう暑くてはかなわない), không hợp nỗi buồn mất thú cưng.", "4": "〜てかまわない (làm cũng được): cho phép — sai nghĩa."}, "g": ["<b class=\"jp\">犬に死なれる<\/b>: bị động gián tiếp (chịu thiệt)."], "n": ["Xem Đề 15 câu 9 (うれしくてならない)."], "why": "Chó cưng chết, buồn <b>không kìm được, không nguôi<\/b>. Mẫu <b>Aくて＋ならない<\/b>: cảm xúc tự nhiên trào dâng (悲しくてならない, 心配でならない)."}], "sum": [{"h": "Họ mẫu với こと — phân biệt nhanh", "tbl": {"head": ["Mẫu", "Nghĩa", "Ví dụ"], "rows": [["Vる＋ことなく", "mà không", "休むことなく働く"], ["Nの＋ことだから", "vì là (người đó) nên chắc", "彼女のことだから大丈夫"], ["〜ことから", "vì (căn cứ)", "責任感が強いことから好かれる"], ["A＋ことに", "thật là (cảm xúc)", "うれしいことに"], ["〜ことか", "biết bao (cảm thán)", "何度思ったことか"], ["Vる＋ことだ", "nên (lời khuyên)", "よく休むことだ"], ["〜ことはない", "không cần", "心配することはない"], ["〜ないことはない", "không phải là không", "行けないことはない"]]}}, {"h": "Cảm xúc “không chịu nổi”", "tbl": {"head": ["Mẫu", "Sắc thái", "Ví dụ"], "rows": [["〜てたまらない", "mạnh, cảm giác cơ thể / cảm xúc", "暑くてたまらない"], ["〜てならない", "cảm xúc tự trào dâng", "心配でならない"], ["〜てしかたがない / しょうがない", "khẩu ngữ", "眠くてしょうがない"], ["〜てはかなわない", "phàn nàn về điều làm phiền", "毎日残業ではかなわない"], ["〜てはならない", "(khác hẳn) cấm", "忘れてはならない"]]}}, {"h": "Khả năng và phủ định mạnh", "li": ["<b>Vます＋っこない<\/b>: không đời nào (khẩu ngữ): 勝てっこない.", "<b>〜わけがない / 〜はずがない<\/b>: không có lý nào.", "<b>〜ものか / もんか<\/b>: làm gì có chuyện (ý chí phủ định): 二度と行くものか.", "<b>Đành phải<\/b>: 〜しかない, 〜ほかない, 〜ざるをえない (行かざるをえない; する → せざるをえない)."]}, {"h": "Nhấn mạnh lý do và nhượng bộ", "li": ["<b>〜からこそ<\/b>: chính vì (thường kèm のだ). <b>〜ばかりに<\/b>: chỉ vì (kết quả xấu). <b>〜せいで<\/b>: tại vì (đổ lỗi). <b>〜おかげで<\/b>: nhờ.", "<b>〜といっても<\/b>: dù nói là… nhưng thực ra (料理ができるといっても簡単なものだけ).", "<b>〜というものだ<\/b>: đó mới chính là (khẳng định theo lẽ thường); <b>〜というものではない<\/b>: không phải cứ… là được."]}], "source": {"folder": "https://drive.google.com/drive/folders/1VmKY24YGYW4x3S2wOzmQjN3ApN_BEwDy", "goc": "https://drive.google.com/file/d/1cUcqkxwRRZPHQ-BmpkuHhFsoeQV0vXcn/view", "chua": "https://drive.google.com/file/d/1b3zFCeTQ8iyifU4CQNrH0nJo4GC05EBS/view"}, "series": "DORA Nihongo · Đề 12 · Ngữ pháp N5–N2 trúng tủ"}, {"no": 13, "folderLabel": "Từ vựng", "cat": "Từ vựng", "file": "ĐỀ 19 - TỪ VỰNG N2", "title": "Đề 13 · Từ vựng N2", "jp": "文脈規定", "mondai": "<b>問題4<\/b> （　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。 Chọn từ thích hợp nhất để điền vào chỗ trống.", "qs": [{"s": "30代の女性を（　）にした雑誌がよく売れている。", "o": ["ターゲット", "ゴール", "アピール", "インパクト"], "a": 1, "ar": "target", "vi": "Tạp chí nhắm tới phụ nữ tuổi 30 đang bán rất chạy.", "key": [{"w": "ターゲット", "r": "ターゲット", "hv": "—", "m": "đối tượng hướng tới"}], "x": {"2": "ゴール (đích, đích đến): là nơi phải đạt tới, không phải nhóm khách hàng. “Lấy phụ nữ làm đích” không hợp.", "3": "アピール (sự thu hút, kêu gọi): dùng 〜にアピールする (thu hút ai). Cấu trúc 〜をアピールにした sai.", "4": "インパクト (ấn tượng mạnh): インパクトがある. Không làm đối tượng mục tiêu."}, "g": ["<b class=\"jp\">NをターゲットにしたN<\/b>: N nhắm vào đối tượng…"], "why": "Tạp chí <b>nhắm tới<\/b> phụ nữ tuổi 30. Cấu trúc <b>NをターゲットにしたN<\/b>: lấy N làm đối tượng mục tiêu (khách hàng). ターゲット ＝ đối tượng nhắm tới."}, {"s": "年末にベートーベンの{交響曲|こうきょうきょく}第九番を{演奏|えんそう}することは日本（　）の風習だ。", "o": ["孤立", "専属", "独特", "限定"], "a": 3, "ar": "どくとく", "vi": "Biểu diễn Giao hưởng số 9 của Beethoven vào cuối năm là phong tục riêng của Nhật.", "key": [{"w": "独特", "r": "どくとく", "hv": "ĐỘC ĐẶC", "m": "độc đáo, riêng biệt"}, {"w": "風習", "r": "ふうしゅう", "hv": "PHONG TẬP", "m": "phong tục"}], "x": {"1": "孤立 (cô lập): dùng cho người, quốc gia bị tách biệt (孤立した村). “Phong tục cô lập của Nhật” sai nghĩa.", "2": "専属 (độc quyền, chuyên thuộc): dùng cho người làm việc riêng cho một nơi (専属モデル). Không dùng cho phong tục.", "4": "限定 (giới hạn): 期間限定, 地域限定 (chỉ bán ở…). 日本限定の風習 không phải cách nói tự nhiên về phong tục."}, "n": ["日本独特の文化, 独特な味."], "why": "Phong tục <b>riêng có<\/b> của Nhật. <b>Nに独特の／N独特の<\/b>＋N: đặc trưng riêng của N. 日本独特の風習 là collocation cố định."}, {"s": "人をそんなに（　）見るのは失礼ですよ。", "o": ["じろじろ", "ささと", "たまたま", "うっかり"], "a": 1, "ar": "じろじろ", "vi": "Nhìn chằm chằm người khác như thế là bất lịch sự đấy.", "key": [{"w": "じろじろ", "r": "じろじろ", "hv": "—", "m": "nhìn chằm chằm, soi mói"}], "x": {"2": "“ささと” không có; nếu là さっさと (nhanh gọn) thì “nhìn nhanh” không bất lịch sự.", "3": "たまたま (tình cờ): nhìn tình cờ thì không bị trách là thất lễ.", "4": "うっかり (lơ đễnh): chỉ hành động sơ ý, không phải kiểu nhìn soi mói."}, "n": ["ちらちら (liếc), じっと (nhìn chăm chú), きょろきょろ (nhìn quanh)."], "why": "Kiểu nhìn bị coi là <b>bất lịch sự<\/b> → nhìn <b>chằm chằm<\/b>. <b>じろじろ見る<\/b>: nhìn soi mói."}, {"s": "いいことばかり言うのではなく、ちゃんとデメリットも教えてくれたので（　）。", "o": ["くわしかった", "たのもしかった", "したしかった", "なつかしかった"], "a": 2, "ar": "頼もしい", "vi": "Không chỉ nói toàn điều tốt mà còn nói rõ cả mặt bất lợi nên tôi thấy rất đáng tin.", "key": [{"w": "頼もしい", "r": "たのもしい", "hv": "LẠI", "m": "đáng tin cậy"}], "x": {"1": "くわしい (chi tiết): tả lời giải thích, nhưng câu nói về cảm nhận với người nói thật → không phải độ chi tiết.", "3": "したしい (thân thiết): quan hệ bạn bè, không phải kết quả của việc nói thật.", "4": "なつかしい (nhớ, hoài niệm): nói về quá khứ — không hợp."}, "n": ["デメリット ↔ メリット."], "why": "Nói thật cả mặt bất lợi → người nghe thấy người đó <b>đáng tin cậy<\/b>. <b>頼もしい<\/b> (たのもしい): đáng tin, có thể trông cậy."}, {"s": "私の部屋はいろいろな物で（　）している。", "o": ["きょろきょろ", "きちんと", "ぼんやり", "ごちゃごちゃ"], "a": 4, "ar": "ごちゃごちゃ", "vi": "Phòng tôi bừa bộn đủ thứ đồ.", "key": [{"w": "ごちゃごちゃ", "r": "ごちゃごちゃ", "hv": "—", "m": "lộn xộn, bừa bãi"}], "x": {"1": "きょろきょろ (nhìn ngó quanh): tả ánh mắt của người, không tả căn phòng.", "2": "きちんと (ngăn nắp): ngược nghĩa với “đầy đủ thứ đồ”, và きちんとしている không đi với 〜で (bằng đồ vật).", "3": "ぼんやり (lơ mơ, mờ mờ): tả tinh thần hoặc hình ảnh, không tả sự bừa bộn."}, "why": "Phòng đầy đủ thứ đồ (いろいろな物で) → <b>bừa bộn<\/b>. <b>ごちゃごちゃしている<\/b>: lộn xộn, chật chội nhiều thứ."}, {"s": "ちょっと聞きたいことがあったから帰ろうとした友達を（　）。", "o": ["取り付けた", "受け入れた", "引き止めた", "持ち寄った"], "a": 3, "ar": "ひきとめる", "vi": "Có chuyện muốn hỏi nên tôi giữ người bạn đang định về lại.", "key": [{"w": "引き止める", "r": "ひきとめる", "hv": "DẪN CHỈ", "m": "giữ lại, níu lại"}], "x": {"1": "取り付ける (lắp đặt; đạt được thỏa thuận): không dùng với người bạn.", "2": "受け入れる (tiếp nhận): dùng cho đề nghị, người mới — không phải giữ người đang về.", "4": "持ち寄る (mỗi người mang đến góp): dùng cho đồ ăn, ý kiến — không hợp."}, "g": ["<b class=\"jp\">Vよう + とした<\/b>: định làm."], "why": "Người bạn đang định về, mình có chuyện muốn hỏi → <b>giữ lại<\/b>. <b>引き止める<\/b>: níu giữ người đang muốn đi."}, {"s": "列車は混んでいたが、何とか席を二つ（　）できた。", "o": ["作成", "保存", "確保", "制作"], "a": 3, "ar": "かくほ", "vi": "Tàu đông nhưng tôi vẫn giữ được hai chỗ ngồi.", "key": [{"w": "確保", "r": "かくほ", "hv": "XÁC BẢO", "m": "đảm bảo có được, giữ chắc"}], "x": {"1": "作成 (soạn thảo): dùng cho tài liệu, kế hoạch. Không “soạn” chỗ ngồi.", "2": "保存 (bảo quản, lưu): dùng cho thực phẩm, dữ liệu. Không dùng cho chỗ trên tàu.", "4": "制作 (chế tác): dùng cho tác phẩm nghệ thuật, chương trình."}, "n": ["予算の確保, 人材の確保."], "why": "Tàu đông mà vẫn <b>giữ được<\/b> hai chỗ. <b>確保する<\/b>: đảm bảo có được (chỗ ngồi, nguồn vốn, nhân lực). 席を確保する là collocation chuẩn."}, {"s": "体が弱くては実力を十分に（　）することはできない。", "o": ["表現", "明示", "公開", "発揮"], "a": 4, "ar": "はっき", "vi": "Sức khỏe yếu thì không thể phát huy hết thực lực.", "key": [{"w": "発揮", "r": "はっき", "hv": "PHÁT HUY", "m": "phát huy"}], "x": {"1": "表現 (biểu hiện, diễn đạt): dùng cho cảm xúc, ý tưởng (気持ちを表現する), không dùng với 実力.", "2": "明示 (chỉ rõ): dùng cho điều kiện, giá (価格を明示する).", "3": "公開 (công khai): dùng cho thông tin, phim. “Công khai thực lực” không phải ý câu."}, "g": ["<b class=\"jp\">〜ては<\/b>: nếu mà (kết quả xấu)."], "n": ["Xem Đề 17 câu 17 (実力を発揮)."], "why": "実力を十分に〜 ＝ <b>phát huy<\/b> hết thực lực. <b>発揮する<\/b>: 実力を発揮, 能力を発揮 là collocation cố định."}, {"s": "私は会社を辞める決意を（　）。", "o": ["まとめた", "合わせた", "仕上げた", "固めた"], "a": 4, "ar": "決意を固める", "vi": "Tôi đã hạ quyết tâm nghỉ việc.", "key": [{"w": "決意を固める", "r": "けついをかためる", "hv": "QUYẾT Ý", "m": "hạ quyết tâm"}], "x": {"1": "まとめる (tổng hợp, thu xếp): 意見をまとめる — không đi với 決意.", "2": "合わせる (gộp, khớp): không đi với 決意.", "3": "仕上げる (hoàn thiện): dùng cho sản phẩm, công việc."}, "n": ["Cùng kiểu: 覚悟を決める, 腹を決める."], "why": "決意を〜 ＝ <b>hạ quyết tâm<\/b>. Collocation <b>決意を固める<\/b> (làm cho quyết tâm vững chắc)."}, {"s": "その選手は体力の（　）を理由に{現役|げんえき}を引退した。", "o": ["制限", "境界", "境目", "限界"], "a": 4, "ar": "げんかい", "vi": "Vận động viên đó giải nghệ với lý do thể lực đã tới giới hạn.", "key": [{"w": "限界", "r": "げんかい", "hv": "HẠN GIỚI", "m": "giới hạn"}, {"w": "現役", "r": "げんえき", "hv": "HIỆN DỊCH", "m": "đang còn thi đấu, đương chức"}], "x": {"1": "制限 (hạn chế do quy định): 年齢制限, 速度制限 — do người khác đặt ra, không phải giới hạn tự nhiên của cơ thể.", "2": "境界 (ranh giới giữa hai vùng): 国の境界. Không dùng cho thể lực.", "3": "境目 (đường ranh): cũng là ranh giới giữa hai thứ, không phải mức tối đa."}, "why": "Thể lực <b>đã tới giới hạn<\/b> nên giải nghệ. <b>体力の限界<\/b>: giới hạn thể lực (mức tối đa có thể)."}, {"s": "祖母の視力は急速に（　）きています。", "o": ["散って", "傷んで", "枯れて", "衰えて"], "a": 4, "ar": "おとろえる", "vi": "Thị lực của bà tôi đang suy giảm nhanh.", "key": [{"w": "衰える", "r": "おとろえる", "hv": "SUY", "m": "suy giảm"}], "x": {"1": "散る (rơi rụng): hoa, lá (桜が散る).", "2": "傷む (hư, dập, thối): đồ ăn, đồ vật (果物が傷む).", "3": "枯れる (héo): cây cỏ."}, "n": ["Xem Đề 2 câu 6 (衰えない)."], "why": "Thị lực <b>suy giảm<\/b> nhanh. <b>衰える<\/b>: suy yếu dần (thể lực, thị lực, trí nhớ, sức ảnh hưởng)."}, {"s": "野菜を無農薬で（　）する農家が増えている。", "o": ["養成", "栽培", "製造", "制作"], "a": 2, "ar": "さいばい", "vi": "Ngày càng nhiều nông hộ trồng rau không dùng thuốc trừ sâu.", "key": [{"w": "栽培", "r": "さいばい", "hv": "TÀI BỒI", "m": "trồng trọt"}], "x": {"1": "養成 (đào tạo): nhân lực (教員を養成する).", "3": "製造 (sản xuất trong nhà máy): xe, thuốc — không dùng cho rau.", "4": "制作 (chế tác): tác phẩm, chương trình."}, "why": "Rau → <b>trồng trọt<\/b>. <b>栽培する<\/b>: trồng (rau, cây, hoa) có chăm sóc."}, {"s": "この机は（　）を取り過ぎている。", "o": ["フロント", "ステージ", "フロア", "スペース"], "a": 4, "ar": "space", "vi": "Chiếc bàn này chiếm quá nhiều chỗ.", "key": [{"w": "スペース", "r": "スペース", "hv": "—", "m": "không gian, chỗ"}], "x": {"1": "フロント (quầy lễ tân): không “chiếm quầy lễ tân”.", "2": "ステージ (sân khấu): không hợp.", "3": "フロア (sàn, tầng): フロアを取る không phải cách nói “chiếm chỗ”."}, "g": ["<b class=\"jp\">スペースを取る<\/b>: chiếm chỗ."], "why": "Chiếc bàn chiếm nhiều <b>chỗ<\/b>. <b>スペースを取る<\/b>: chiếm diện tích."}, {"s": "川沿いの{朝市|あさいち}は（　）の人たちにも観光客にもとても人気がある。", "o": ["地元", "根元", "立場", "土台"], "a": 1, "ar": "じもと", "vi": "Chợ sáng ven sông rất được người địa phương lẫn khách du lịch ưa thích.", "key": [{"w": "地元", "r": "じもと", "hv": "ĐỊA NGUYÊN", "m": "địa phương"}], "x": {"2": "根元 (gốc cây, gốc rễ): 木の根元 — không dùng cho người.", "3": "立場 (lập trường, vị trí): 立場の人 không đối lập được với khách du lịch.", "4": "土台 (nền móng): không dùng cho người."}, "n": ["Xem Đề 1 câu 3 (đọc 地元)."], "why": "Đối lập với 観光客 (khách du lịch) → <b>người địa phương<\/b>: <b>地元の人<\/b>."}, {"s": "そんなうわさを真に受けるなんて、彼ちょっと（　）んだよ。", "o": ["そそっかしい", "たのもしい", "そうぞうしい", "あつかましい"], "a": 1, "ar": "そそっかしい", "vi": "Tin ngay lời đồn như thế, anh ta hơi hấp tấp đấy.", "key": [{"w": "そそっかしい", "r": "そそっかしい", "hv": "—", "m": "hấp tấp, cẩu thả"}, {"w": "真に受ける", "r": "まにうける", "hv": "—", "m": "tin là thật"}], "x": {"2": "頼もしい (đáng tin): ngược nghĩa với việc dễ tin lời đồn.", "3": "騒々しい (ồn ào): không liên quan việc tin lời đồn.", "4": "厚かましい (trơ trẽn, mặt dày): chỉ thái độ không biết ngại, không phải dễ tin."}, "n": ["Xem Đề 17 câu 3."], "why": "Tin ngay lời đồn → <b>hấp tấp, thiếu suy xét<\/b>. <b>そそっかしい<\/b>: vội vàng, cẩu thả, hay nhầm lẫn."}, {"s": "京都は紅葉の（　）で、秋になると大勢の観光客が訪れる。", "o": ["名所", "要所", "実地", "現場"], "a": 1, "ar": "めいしょ", "vi": "Kyoto là nơi ngắm lá đỏ nổi tiếng, mùa thu có rất đông du khách.", "key": [{"w": "名所", "r": "めいしょ", "hv": "DANH SỞ", "m": "danh thắng"}], "x": {"2": "要所 (nơi hiểm yếu, điểm then chốt): dùng trong quân sự, giao thông, không cho cảnh đẹp.", "3": "実地 (thực địa): 実地調査 — không phải nơi tham quan.", "4": "現場 (hiện trường): 事故現場, 工事現場."}, "why": "Kyoto là <b>địa điểm nổi tiếng<\/b> ngắm lá đỏ. <b>紅葉の名所<\/b>: danh thắng ngắm lá đỏ."}, {"s": "子どもたちはみな{猛暑|もうしょ}の中で（　）していた。", "o": ["すっきり", "ぐったり", "しっかり", "ぎっしり"], "a": 2, "ar": "ぐったり", "vi": "Lũ trẻ đều mệt lả dưới cái nóng gay gắt.", "key": [{"w": "ぐったり", "r": "ぐったり", "hv": "—", "m": "mệt lả, rũ rượi"}], "x": {"1": "すっきり (sảng khoái): ngược ngữ cảnh nóng bức.", "3": "しっかり (vững vàng, chắc chắn): không tả mệt mỏi.", "4": "ぎっしり (chật ních): tả đồ vật xếp kín (予定がぎっしり), không tả người."}, "n": ["Xem Đề 2 câu 13."], "why": "Dưới cái nóng gay gắt, bọn trẻ <b>mệt lả<\/b>. <b>ぐったりする<\/b>: rũ rượi, kiệt sức."}, {"s": "彼のメールには一枚の写真が（　）されていた。", "o": ["付属", "添付", "輸送", "郵送"], "a": 2, "ar": "てんぷ", "vi": "Email của anh ấy có đính kèm một tấm ảnh.", "key": [{"w": "添付", "r": "てんぷ", "hv": "THIÊM PHÓ", "m": "đính kèm"}], "x": {"1": "付属 (phụ thuộc, kèm theo sản phẩm): 付属品, 大学付属病院. Không dùng cho email.", "3": "輸送 (vận chuyển hàng hóa): không dùng cho ảnh trong email.", "4": "郵送 (gửi qua bưu điện): không phải gửi email."}, "n": ["添付ファイル: file đính kèm."], "why": "Ảnh được <b>đính kèm<\/b> trong email. <b>添付する<\/b>: đính kèm (file, tài liệu). 添付ファイル."}, {"s": "一人の男が順番を無視してタクシーを待つ列に（　）きた。", "o": ["付け加えて", "割り込んで", "当てはまって", "行き着いて"], "a": 2, "ar": "わりこむ", "vi": "Một người đàn ông phớt lờ thứ tự, chen vào hàng chờ taxi.", "key": [{"w": "割り込む", "r": "わりこむ", "hv": "CÁT", "m": "chen ngang"}], "x": {"1": "付け加える (bổ sung): dùng cho lời nói, thông tin.", "3": "当てはまる (áp dụng được, khớp): 条件に当てはまる.", "4": "行き着く (đi tới được, rốt cuộc đến): không mang nghĩa chen hàng."}, "why": "Phớt lờ thứ tự, <b>chen vào<\/b> hàng. <b>割り込む<\/b>: chen ngang (hàng, câu chuyện). 列に割り込む."}, {"s": "{工程|こうてい}が多い作業は、個々の得意分野を活かし、（　）して作業に取り組んでいます。", "o": ["分担", "分別", "区分", "区別"], "a": 1, "ar": "ぶんたん", "vi": "Với công việc nhiều công đoạn, chúng tôi phân chia nhau làm, phát huy sở trường của từng người.", "key": [{"w": "分担", "r": "ぶんたん", "hv": "PHÂN ĐẢM", "m": "phân chia công việc"}], "x": {"2": "分別 (ぶんべつ: phân loại rác) / ふんべつ (sự suy xét). Không phải chia việc.", "3": "区分 (phân khu, phân loại theo tiêu chí): dùng cho đất đai, hạng mục.", "4": "区別 (phân biệt): 善悪を区別する — không phải chia việc."}, "n": ["役割分担 やくわりぶんたん."], "why": "Công việc nhiều công đoạn, mỗi người làm phần sở trường → <b>phân công nhau<\/b>. <b>分担する<\/b>: chia phần việc."}], "sum": [{"h": "Động từ ghép (複合動詞) N2 hay ra", "tbl": {"head": ["Từ", "Nghĩa", "Đi với"], "rows": [["引き止める", "giữ lại (người)", "帰ろうとする人を〜"], ["割り込む", "chen ngang", "列に〜, 話に〜"], ["取り付ける", "lắp đặt; đạt được", "エアコンを〜, 合意を〜"], ["受け入れる", "tiếp nhận", "提案を〜, 留学生を〜"], ["持ち寄る", "mỗi người mang góp", "料理を〜"], ["付け加える", "bổ sung", "一言〜"], ["当てはまる", "khớp, áp dụng", "条件に〜"], ["行き着く", "rốt cuộc đi tới", "結論に〜"]]}}, {"h": "Collocation danh từ + động từ trong đề", "li": ["席を<b>確保<\/b>する, 実力を<b>発揮<\/b>する, 決意を<b>固める<\/b>, 野菜を<b>栽培<\/b>する, 写真を<b>添付<\/b>する, 作業を<b>分担<\/b>する, スペースを<b>取る<\/b>.", "<b>Phân biệt 作〜 / 制〜 / 製〜<\/b>: 作成 (soạn tài liệu), 制作 (chế tác tác phẩm), 製作 (chế tạo đồ vật), 製造 (sản xuất hàng loạt).", "<b>Phân biệt 分〜 / 区〜<\/b>: 分担 (chia việc), 分別 (phân loại rác), 区分 (phân khu), 区別 (phân biệt).", "<b>Giới hạn<\/b>: 限界 (giới hạn tự nhiên), 制限 (hạn chế quy định), 限定 (giới hạn phạm vi bán), 境界 / 境目 (ranh giới)."]}, {"h": "Tính từ tả tính cách người", "tbl": {"head": ["Từ", "Nghĩa", "Sắc thái"], "rows": [["頼もしい", "đáng tin cậy", "khen"], ["そそっかしい", "hấp tấp, cẩu thả", "chê nhẹ"], ["厚かましい / ずうずうしい", "trơ trẽn", "chê"], ["騒々しい", "ồn ào", "chê"], ["おとなしい", "hiền, ít nói", "trung tính"], ["だらしない", "luộm thuộm", "chê"], ["几帳面 きちょうめん", "cẩn thận, ngăn nắp", "khen"], ["図々しい", "mặt dày", "chê"]]}}, {"h": "Từ láy trạng thái", "li": ["ごちゃごちゃ (bừa bộn) ↔ すっきり / きちんと (gọn gàng).", "じろじろ (nhìn chằm chằm, soi mói) · きょろきょろ (ngó nghiêng) · ちらっと (liếc qua) · じっと (nhìn chăm chú).", "ぐったり (mệt lả) · へとへと (kiệt sức) · くたくた (rã rời).", "ぎっしり (chật ních) · びっしり (kín đặc) · がらがら (vắng tanh)."]}], "source": {"folder": "https://drive.google.com/drive/folders/1qyh5LVW7K_NQ0zPPz6UaGVvfSbhmhjML", "goc": "https://drive.google.com/file/d/1feHo6Q-EqbHGauz4wunyUuerMKLr_P5Y/view", "chua": "https://drive.google.com/file/d/1gI632CeEsjZnRDoa8Yx6tYZhzrFwNVC5/view"}, "series": "DORA Nihongo · Đề 13 · Từ vựng N5–N2 trúng tủ"}, {"no": 14, "folderLabel": "Kanji", "cat": "Kanji", "file": "ĐỀ 20 - KANJI N2", "title": "Đề 14 · Kanji N2", "jp": "漢字読み", "mondai": "<b>問題1<\/b> ＿＿の言葉の読み方として最もよいものを、1・2・3・4から一つ選びなさい。 Chọn cách đọc đúng nhất cho từ được gạch chân.", "qs": [{"s": "電車が遅れて授業に10分_遅刻_しました。", "o": ["ちこく", "ちごく", "じこく", "じごく"], "a": 1, "ar": "遅刻", "vi": "Tàu đến trễ nên tôi vào học muộn 10 phút.", "key": [{"w": "遅刻", "r": "ちこく", "hv": "TRÌ KHẮC", "m": "đến muộn"}], "x": {"2": "ちごく: không có từ này. 刻 không đục thành ごく.", "3": "じこく là 時刻 (giờ, thời khắc). 遅 không đọc じ.", "4": "じごく là 地獄 (địa ngục). Sai cả hai chữ."}, "n": ["遅 ち: 遅延 ちえん. 刻 こく: 時刻, 深刻."], "why": "遅 đọc <b>ち<\/b> (Kun: 遅い おそい), 刻 đọc <b>こく<\/b> (âm trong) ＝ <b>ちこく<\/b>: đến muộn. Ngữ cảnh 授業に10分遅刻 khớp nghĩa."}, {"s": "_油断_しているすきに財布をすられた。", "o": ["ゆうたん", "ゆだん", "ゆうだん", "ゆたん"], "a": 2, "ar": "油断", "vi": "Tôi bị móc ví trong lúc sơ hở.", "key": [{"w": "油断", "r": "ゆだん", "hv": "DU ĐOẠN", "m": "sơ hở, mất cảnh giác"}], "x": {"1": "ゆうたん: sai hai chỗ — thừa trường âm và 断 không đọc たん.", "3": "ゆうだん là 勇断 (quyết đoán dũng cảm). 油 đọc ゆ, không có trường âm.", "4": "ゆたん: 油 đúng nhưng 断 đọc だん (đục)."}, "g": ["<b class=\"jp\">〜すきに<\/b> (隙に): thừa lúc sơ hở. <b class=\"jp\">財布をすられる<\/b>: bị móc túi."], "n": ["油断大敵 ゆだんたいてき: chủ quan là kẻ thù lớn nhất."], "why": "油 đọc <b>ゆ<\/b> (âm ngắn, không phải ゆう), 断 đọc <b>だん<\/b> ＝ <b>ゆだん<\/b>: lơ là, sơ hở. Ngữ cảnh 油断しているすきに (lúc sơ hở) bị móc ví khớp nghĩa."}, {"s": "洪水による_損害_は２億円に達する。", "o": ["ひがい", "そんがい", "ひかい", "そんかい"], "a": 2, "ar": "損害", "vi": "Thiệt hại do lũ lụt lên tới 200 triệu yên.", "key": [{"w": "損害", "r": "そんがい", "hv": "TỔN HẠI", "m": "thiệt hại (tài sản)"}], "x": {"1": "ひがい là 被害 (bị hại). Nghĩa gần nhưng chữ khác — 損 không đọc ひ.", "3": "ひかい: không có từ này.", "4": "そんかい: 損 đúng nhưng 害 đọc がい (đục), không phải かい."}, "n": ["損害 (thiệt hại về tiền của) và 被害 (sự bị hại nói chung)."], "why": "損 đọc <b>そん<\/b>, 害 đọc <b>がい<\/b> ＝ <b>そんがい<\/b>: thiệt hại (thường tính bằng tiền). Ngữ cảnh 損害は２億円に達する khớp nghĩa."}, {"s": "_略さず_に正式名称を書いてください。", "o": ["りゃくさず", "ぞくさず", "かくさず", "やくさず"], "a": 1, "ar": "略す", "vi": "Hãy viết tên chính thức, đừng viết tắt.", "key": [{"w": "略す", "r": "りゃくす", "hv": "LƯỢC", "m": "lược bớt, viết tắt"}], "x": {"2": "ぞくさず: không có. 属す / 続す không phải cách đọc của 略.", "3": "かくさず là 隠さず (không giấu). Chữ khác.", "4": "やくさず là 訳さず (không dịch). Chữ khác; 略 có âm ghép りゃく."}, "g": ["<b class=\"jp\">Vずに<\/b> = Vないで."], "n": ["略 りゃく: 省略 (Đề 10 câu 4), 略語."], "why": "略す đọc <b>りゃくす<\/b>: viết tắt, lược bỏ. 略さずに ＝ đừng viết tắt. Ngữ cảnh 正式名称を書く (viết tên chính thức) khớp nghĩa. Cùng chữ với 省略 (Đề 10)."}, {"s": "我がチームは大差で相手に_敗れた_。", "o": ["やぶれた", "みだれた", "たおれた", "つぶれた"], "a": 1, "ar": "敗れる", "vi": "Đội chúng tôi thua đối thủ với cách biệt lớn.", "key": [{"w": "敗れる", "r": "やぶれる", "hv": "BẠI", "m": "thua"}], "x": {"2": "みだれた là 乱れる (rối loạn). Chữ khác.", "3": "たおれた là 倒れる (ngã đổ). Chữ khác.", "4": "つぶれた là 潰れる (bẹp, phá sản). Chữ khác."}, "n": ["破れる cũng đọc やぶれる (rách). 敗北 はいぼく, 失敗."], "why": "敗れる đọc <b>やぶれる<\/b>: thua trận. Ngữ cảnh 大差で相手に〜 (thua đối thủ cách biệt lớn) khớp nghĩa. (Đồng âm: 破れる — rách.)"}, {"s": "まず先生が_模範_を示してくれた。", "o": ["もはん", "もうはん", "もうばん", "もばん"], "a": 1, "ar": "模範", "vi": "Trước tiên thầy làm mẫu cho chúng tôi.", "key": [{"w": "模範", "r": "もはん", "hv": "MÔ PHẠM", "m": "gương mẫu, làm mẫu"}], "x": {"2": "もうはん: thừa trường âm — 模 đọc も (hoặc ぼ trong 規模), không có もう.", "3": "もうばん: thừa trường âm và đục hóa sai.", "4": "もばん: 範 không đục thành ばん."}, "n": ["模 も (模型 もけい) / ぼ (規模 きぼ, câu 20). 範 はん: 範囲 はんい."], "why": "模 đọc <b>も<\/b> (ngắn), 範 đọc <b>はん<\/b> ＝ <b>もはん<\/b>: khuôn mẫu, tấm gương. Ngữ cảnh 模範を示す (làm mẫu) khớp nghĩa."}, {"s": "部屋の空気がとても_乾燥_しています。", "o": ["けんぞう", "かんぞう", "けんそう", "かんそう"], "a": 4, "ar": "乾燥", "vi": "Không khí trong phòng rất khô.", "key": [{"w": "乾燥", "r": "かんそう", "hv": "CAN TÁO", "m": "khô"}], "x": {"1": "けんぞう: không có từ này. 乾 không đọc けん.", "2": "かんぞう là 肝臓 (gan). 乾 đúng nhưng 燥 đọc そう (âm trong), không phải ぞう.", "3": "けんそう: 乾 không đọc けん."}, "n": ["Đồng âm: 感想 かんそう (cảm tưởng). 乾く かわく."], "why": "乾 đọc <b>かん<\/b> (Kun: 乾く かわく), 燥 đọc <b>そう<\/b> ＝ <b>かんそう<\/b>: khô hanh. Ngữ cảnh 空気が乾燥している khớp nghĩa."}, {"s": "彼女の話に_改めて_付け加えることはありません。", "o": ["なぐさめて", "あきらめて", "たしかめて", "あらためて"], "a": 4, "ar": "改めて", "vi": "Tôi không có gì cần bổ sung thêm vào lời cô ấy.", "key": [{"w": "改めて", "r": "あらためて", "hv": "CẢI", "m": "lại lần nữa; dịp khác"}], "x": {"1": "なぐさめて là 慰める (an ủi). Chữ khác.", "2": "あきらめて là 諦める (từ bỏ). Chữ khác.", "3": "たしかめて là 確かめる (xác nhận). Chữ khác."}, "n": ["改める: sửa đổi (考えを改める, Đề 20 câu 6). Xem Đề 2 câu 19."], "why": "改めて đọc <b>あらためて<\/b>: lại lần nữa, thêm một lần. Ngữ cảnh 〜付け加えることはない (không có gì cần bổ sung thêm) khớp nghĩa."}, {"s": "一方通行の_標識_に気づかず逆行していた。", "o": ["ひょうしき", "しょうじき", "しょうしき", "ひょうじき"], "a": 1, "ar": "標識", "vi": "Không để ý biển báo đường một chiều nên tôi đã đi ngược chiều.", "key": [{"w": "標識", "r": "ひょうしき", "hv": "TIÊU THỨC", "m": "biển báo"}], "x": {"2": "しょうじき là 正直 (thật thà). Sai cả hai chữ.", "3": "しょうしき: 標 đọc ひょう, không phải しょう.", "4": "ひょうじき: 識 đọc しき (âm trong), không đục thành じき."}, "n": ["識 しき: 知識, 常識 (Đề 12 câu 8)."], "why": "標 đọc <b>ひょう<\/b>, 識 đọc <b>しき<\/b> ＝ <b>ひょうしき<\/b>: biển báo. Ngữ cảnh 一方通行の標識 (biển đường một chiều) khớp nghĩa."}, {"s": "机の上に本を山のように_積んで_いる。", "o": ["たたんで", "つんで", "あんで", "むすんで"], "a": 2, "ar": "積む", "vi": "Sách chất cao như núi trên bàn.", "key": [{"w": "積む", "r": "つむ", "hv": "TÍCH", "m": "chất lên; tích lũy"}], "x": {"1": "たたんで là 畳む (gấp). Chữ khác; sách không “gấp như núi”.", "3": "あんで là 編む (đan). Chữ khác.", "4": "むすんで là 結ぶ (buộc). Chữ khác."}, "n": ["経験を積む: tích lũy kinh nghiệm. 積極的."], "why": "積む đọc <b>つむ<\/b>: chất đống. Ngữ cảnh 本を山のように〜 (chất sách như núi) khớp nghĩa. Âm On: 面積 めんせき, 積極的."}, {"s": "彼女は昨日_退院_したばかりです。", "o": ["たんいん", "だんいん", "だいいん", "たいいん"], "a": 4, "ar": "退院", "vi": "Cô ấy vừa mới xuất viện hôm qua.", "key": [{"w": "退院", "r": "たいいん", "hv": "THOÁI VIỆN", "m": "xuất viện"}], "x": {"1": "たんいん: không có từ này. 退 đọc たい.", "2": "だんいん là 団員 (đoàn viên). Chữ khác.", "3": "だいいん: 退 không đục thành だい."}, "n": ["退 たい: 引退, 退職. ↔ 入院."], "why": "退 đọc <b>たい<\/b>, 院 đọc <b>いん<\/b> ＝ <b>たいいん<\/b>: xuất viện (↔ 入院 にゅういん). Ngữ cảnh 昨日〜したばかり khớp nghĩa."}, {"s": "いま、{民謡|みんよう}の_踊り_を習っています。", "o": ["おどり", "まづり", "まつり", "おとり"], "a": 1, "ar": "踊り", "vi": "Hiện tôi đang học múa dân ca.", "key": [{"w": "踊り", "r": "おどり", "hv": "DŨNG", "m": "điệu múa"}], "x": {"2": "まづり: không có; viết sai chính tả của まつり.", "3": "まつり là 祭り (lễ hội). Chữ khác; không “học lễ hội”.", "4": "おとり là 囮 (mồi nhử). Âm と trong, không phải ど."}, "n": ["踊る おどる (múa) và 躍る (nhảy nhót, rộn ràng)."], "why": "踊り đọc <b>おどり<\/b>: điệu múa. Ngữ cảnh 民謡の踊りを習う (học múa dân ca) khớp nghĩa. Động từ: 踊る おどる."}, {"s": "学業とスポーツを両立させるなんて本当に_偉い_よ。", "o": ["ありがたい", "めでたい", "いい", "えらい"], "a": 4, "ar": "偉い", "vi": "Vừa học vừa chơi thể thao được như vậy thật đáng nể.", "key": [{"w": "偉い", "r": "えらい", "hv": "VĨ", "m": "giỏi, đáng nể; có địa vị"}], "x": {"1": "ありがたい là 有り難い (đáng biết ơn). Không phải cách đọc của 偉.", "2": "めでたい (đáng mừng). Không phải cách đọc của 偉.", "3": "いい (tốt): không phải cách đọc của 偉."}, "n": ["偉大 (Đề 8 câu 11)."], "why": "偉い đọc <b>えらい<\/b>: giỏi, đáng nể. Ngữ cảnh vừa học vừa chơi thể thao được thì thật đáng khen khớp nghĩa."}, {"s": "_大幅_に学生の自由を認める。", "o": ["おおはば", "おおはし", "だいはし", "だいはば"], "a": 1, "ar": "大幅", "vi": "Công nhận quyền tự do của học sinh ở mức độ lớn.", "key": [{"w": "大幅", "r": "おおはば", "hv": "ĐẠI PHÚC", "m": "mức độ lớn, đáng kể"}], "x": {"2": "おおはし: 幅 đọc はば, không phải はし.", "3": "だいはし: sai cả hai chữ.", "4": "だいはば: 大 trong từ thuần Nhật này đọc おお, không đọc だい."}, "n": ["幅 はば: bề rộng. 大〜 đọc おお với từ thuần Nhật (大雨, 大勢, 大幅)."], "why": "大幅 đọc <b>おおはば<\/b> (Kun＋Kun): 大 おお ＋ 幅 はば ＝ mức lớn, đáng kể. Ngữ cảnh 〜に認める (công nhận ở mức lớn) khớp nghĩa."}, {"s": "農薬は雑草を_除く_のに便利だ。", "o": ["とどく", "まねく", "のぞく", "くだく"], "a": 3, "ar": "除く", "vi": "Thuốc nông nghiệp tiện cho việc diệt cỏ dại.", "key": [{"w": "除く", "r": "のぞく", "hv": "TRỪ", "m": "loại bỏ; trừ ra"}], "x": {"1": "とどく là 届く (tới nơi). Chữ khác.", "2": "まねく là 招く (mời; gây ra). Chữ khác.", "4": "くだく là 砕く (đập vỡ). Chữ khác."}, "n": ["〜を除いて: trừ… ra (Đề 9 câu 11). 掃除, 削除."], "why": "除く đọc <b>のぞく<\/b>: loại bỏ. Ngữ cảnh 雑草を〜 (loại bỏ cỏ dại) khớp nghĩa. Âm On: じょ (除去, 掃除)."}, {"s": "ポストなら駅へ行く_途中_にありますよ。", "o": ["とっちゅう", "とんちゅう", "とうちゅう", "とちゅう"], "a": 4, "ar": "途中", "vi": "Hòm thư thì nằm trên đường ra ga đấy.", "key": [{"w": "途中", "r": "とちゅう", "hv": "ĐỒ TRUNG", "m": "giữa đường, giữa chừng"}], "x": {"1": "とっちゅう: không có âm ngắt.", "2": "とんちゅう: không có âm ん.", "3": "とうちゅう: 途 đọc と, không có trường âm."}, "n": ["途 と: 前途, 用途 ようと."], "why": "途 đọc <b>と<\/b> (ngắn), 中 đọc <b>ちゅう<\/b> ＝ <b>とちゅう<\/b>: giữa đường. Ngữ cảnh 駅へ行く途中 khớp nghĩa."}, {"s": "部屋の温度を２５度に_調節_する。", "o": ["ちょうさい", "ちょうさつ", "ちょうせつ", "ちょうせい"], "a": 3, "ar": "調節", "vi": "Chỉnh nhiệt độ phòng ở 25 độ.", "key": [{"w": "調節", "r": "ちょうせつ", "hv": "ĐIỀU TIẾT", "m": "điều chỉnh (thông số)"}], "x": {"1": "ちょうさい: 節 không đọc さい.", "2": "ちょうさつ: 節 không đọc さつ.", "4": "ちょうせい là 調整 (điều phối lịch, ý kiến). Chữ khác — 節 đọc せつ."}, "n": ["節 せつ: 季節, 節約."], "why": "調 đọc <b>ちょう<\/b>, 節 đọc <b>せつ<\/b> ＝ <b>ちょうせつ<\/b>: điều chỉnh (độ, mức bằng thiết bị). Ngữ cảnh 温度を25度に調節する khớp nghĩa."}, {"s": "彼に実力を{発揮|はっき}できる機会を_与えて_やろう。", "o": ["とらえて", "そなえて", "あたえて", "くわえて"], "a": 3, "ar": "与える", "vi": "Hãy cho cậu ấy cơ hội phát huy thực lực.", "key": [{"w": "与える", "r": "あたえる", "hv": "DỮ", "m": "trao, cho"}], "x": {"1": "とらえて là 捕らえる (bắt giữ). Chữ khác.", "2": "そなえて là 備える (chuẩn bị). Chữ khác.", "4": "くわえて là 加える (thêm vào). Chữ khác."}, "g": ["<b class=\"jp\">Vてやる<\/b>: làm cho (người dưới)."], "why": "与える đọc <b>あたえる<\/b>: trao, cho. Ngữ cảnh 機会を与える (cho cơ hội) là collocation cố định."}, {"s": "スポンサーの_協力_を得てプロジェクトを進めた。", "o": ["どりょく", "どうりょく", "きょりょく", "きょうりょく"], "a": 4, "ar": "協力", "vi": "Chúng tôi triển khai dự án nhờ sự hợp tác của nhà tài trợ.", "key": [{"w": "協力", "r": "きょうりょく", "hv": "HIỆP LỰC", "m": "hợp tác"}], "x": {"1": "どりょく là 努力 (nỗ lực). Chữ khác.", "2": "どうりょく là 動力 (động lực máy). Chữ khác.", "3": "きょりょく: thiếu trường âm ở 協."}, "n": ["Xem Đề 16 câu 12 (努力 với cùng bộ phương án)."], "why": "協 đọc <b>きょう<\/b> (có trường âm), 力 đọc <b>りょく<\/b> ＝ <b>きょうりょく<\/b>: hợp tác. Ngữ cảnh スポンサーの協力を得る khớp nghĩa."}, {"s": "あの商店主は店の_規模_を大きくした。", "o": ["きもう", "きぼ", "きぼう", "きも"], "a": 2, "ar": "規模", "vi": "Ông chủ tiệm đó đã mở rộng quy mô cửa hàng.", "key": [{"w": "規模", "r": "きぼ", "hv": "QUY MÔ", "m": "quy mô"}], "x": {"1": "きもう: không có từ này.", "3": "きぼう là 希望 (hy vọng). Bẫy trường âm — 規模 không có う.", "4": "きも là 肝 (gan). 模 trong 規模 đọc ぼ."}, "n": ["模 đọc ぼ ở đây, đọc も ở 模範 (câu 6)."], "why": "規 đọc <b>き<\/b>, 模 trong từ này đọc <b>ぼ<\/b> ＝ <b>きぼ<\/b>: quy mô. Ngữ cảnh 店の規模を大きくする khớp nghĩa. Chú ý 模 đọc も ở 模範 (câu 6)."}], "sum": [{"h": "Bẫy trường âm và âm ngắn trong đề", "tbl": {"head": ["Từ đúng", "Bẫy", "Ghi nhớ"], "rows": [["油断 ゆだん", "ゆうだん (勇断)", "油 ゆ ngắn (石油 せきゆ)"], ["模範 もはん", "もうはん", "模 も / ぼ, không có もう"], ["途中 とちゅう", "とうちゅう", "途 と ngắn (途端, 前途)"], ["規模 きぼ", "きぼう (希望)", "規模 không có う"], ["協力 きょうりょく", "きょりょく", "協 きょう dài (協会, 妥協)"]]}}, {"h": "Chữ có hai cách đọc trong cùng bộ đề", "li": ["<b>模<\/b>: も (模範, 模様 もよう) / ぼ (規模).", "<b>敗れる / 破れる<\/b>: cùng đọc やぶれる — 敗 (thua trận), 破 (rách).", "<b>大<\/b>: おお (大幅, 大勢 おおぜい, 大雨) / だい (大学) / たい (大会, 大切).", "<b>調〜<\/b>: 調節 ちょうせつ (chỉnh mức), 調整 ちょうせい (điều phối), 調査 ちょうさ (điều tra), 調子 ちょうし."]}, {"h": "Cặp từ trái nghĩa / cùng nhóm", "li": ["退院 たいいん ↔ 入院 にゅういん; 退学 ↔ 入学; 退社 ↔ 入社.", "損害 そんがい (thiệt hại, tính bằng tiền) vs 被害 ひがい (bị hại nói chung) vs 損失 そんしつ (tổn thất).", "Thiệt hại tự nhiên: 洪水 こうずい (lũ), 地震, 台風, 津波 つなみ, 土砂崩れ どしゃくずれ.", "乾燥 かんそう (khô) ↔ 湿気 しっけ (độ ẩm); 乾く かわく ↔ 湿る しめる."]}, {"h": "Động từ Kun nên nhớ", "tbl": {"head": ["Từ", "Đọc", "Nghĩa"], "rows": [["略す", "りゃくす", "viết tắt"], ["敗れる", "やぶれる", "thua"], ["積む", "つむ", "chất đống"], ["除く", "のぞく", "loại bỏ"], ["与える", "あたえる", "trao"], ["改める", "あらためる", "sửa đổi; 改めて: lại lần nữa"], ["畳む", "たたむ", "gấp"], ["編む", "あむ", "đan"], ["偉い", "えらい", "giỏi, đáng nể"], ["踊る", "おどる", "nhảy múa"]]}}], "source": {"folder": "https://drive.google.com/drive/folders/1jb4nEjT31qcy3ThqmGquY76XxzZSPOwB", "goc": "https://drive.google.com/file/d/1fnIPjYuYKyYMidsckqiI_UHYCxwmHQJ2/view", "chua": "https://drive.google.com/file/d/1GUiOAQfAJ4rpfVxPagQn5bREz6RoT5-h/view"}, "series": "DORA Nihongo · Đề 14 · Kanji N5–N2 trúng tủ"}, {"no": 15, "folderLabel": "Ngữ pháp", "cat": "Ngữ pháp", "file": "ĐỀ 21 - NGỮ PHÁP N2", "title": "Đề 15 · Ngữ pháp N2", "jp": "文法形式", "mondai": "<b>問題7<\/b> 次の文の（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。 Chọn mẫu ngữ pháp thích hợp nhất để điền vào chỗ trống.", "qs": [{"s": "{山口|やまぐち}さんは、見た目で学校の先生（　）、銀行員のようだ。", "o": ["にもかかわらず", "というより", "だけで", "どころか"], "a": 2, "ar": "AというよりB", "vi": "Nhìn bề ngoài anh Yamaguchi giống nhân viên ngân hàng hơn là giáo viên.", "key": [{"w": "〜というより", "r": "というより", "hv": "—", "m": "nói đúng hơn là, hơn là"}], "x": {"1": "〜にもかかわらず (mặc dù): cần quan hệ trái ngược (dù là giáo viên nhưng…). Câu chỉ so sánh ấn tượng bề ngoài, anh ấy không phải giáo viên.", "3": "だけで (chỉ bằng): “chỉ là giáo viên trường học” không nối được với 銀行員のようだ.", "4": "〜どころか (nói gì đến, trái lại): dùng khi vế sau còn mạnh hơn hoặc ngược hẳn (英語どころか日本語も…). Không phải so sánh nhẹ nhàng."}, "n": ["見た目 みため: vẻ bề ngoài."], "why": "So sánh hai cách nhận xét: giống nhân viên ngân hàng <b>hơn là<\/b> giáo viên. Mẫu <b>AというよりB<\/b>: nói là A thì đúng hơn là B. Vế sau có 〜のようだ → khớp."}, {"s": "日本人（　）正しく書けないのだから、外国人が正しく書けないのはあたりまえでしょう。", "o": ["だから", "なら", "でさえ", "だけか"], "a": 3, "ar": "Nでさえ", "vi": "Ngay cả người Nhật còn không viết đúng, người nước ngoài viết sai là đương nhiên.", "key": [{"w": "〜でさえ", "r": "でさえ", "hv": "—", "m": "ngay cả"}], "x": {"1": "だから (vì là): “vì là người Nhật nên không viết đúng” — logic ngược, mất ý so sánh.", "2": "なら (nếu là): “nếu là người Nhật thì không viết đúng” — không hợp vế sau.", "4": "だけか: không có mẫu này (chỉ có ばかりか / だけでなく)."}, "n": ["Xem Đề 12 câu 2 (さえ)."], "why": "Nêu ví dụ cực đoan: <b>ngay cả<\/b> người Nhật còn viết sai → người nước ngoài viết sai là đương nhiên. Mẫu <b>Nでさえ<\/b>: ngay cả N."}, {"s": "この{困難|こんなん}（　）、あとは楽になりますよ。", "o": ["こそ乗り切ると", "さえ乗り切れば", "さえ乗り切ると", "こそ乗り切れば"], "a": 2, "ar": "Nさえ〜ば", "vi": "Chỉ cần vượt qua khó khăn này, sau đó sẽ nhẹ nhàng thôi.", "key": [{"w": "〜さえ〜ば", "r": "さえ〜ば", "hv": "—", "m": "chỉ cần… là"}, {"w": "乗り切る", "r": "のりきる", "hv": "THỪA THIẾT", "m": "vượt qua"}], "x": {"1": "こそ乗り切ると: こそ (chính là) không tạo nghĩa “chỉ cần”; và と không ghép với こそ thành điều kiện đủ.", "3": "さえ乗り切ると: さえ phải đi với thể ば (さえ〜ば / さえ〜たら); さえ〜と không phải mẫu chuẩn.", "4": "こそ乗り切れば: こそ chỉ ghép với ば theo dạng 〜ばこそ (chính vì…), không phải Nこそ〜ば."}, "n": ["お金さえあれば, 薬を飲みさえすれば."], "why": "Điều kiện đủ: <b>chỉ cần<\/b> vượt qua khó khăn này thì sau sẽ nhẹ. Mẫu cố định <b>Nさえ〜ば<\/b>: chỉ cần N… là. 乗り切れば là thể ば → khớp."}, {"s": "コンピューターを使う（　）、筆と絵の具の代わりにコンピューターの{彩色|さいしき}ソフトを使って彩色をするという作業です。", "o": ["どころか", "といっても", "としたら", "というもの"], "a": 2, "ar": "〜といっても", "vi": "Nói là dùng máy tính, nhưng thực ra chỉ là dùng phần mềm tô màu thay cho bút lông và màu vẽ.", "key": [{"w": "〜といっても", "r": "といっても", "hv": "—", "m": "nói là… nhưng thực ra (không to tát)"}], "x": {"1": "〜どころか (trái lại): vế sau phải ngược hoặc vượt hẳn. Câu chỉ giải thích cụ thể, không ngược.", "3": "〜としたら (nếu giả sử): việc dùng máy tính là thực tế, không phải giả định.", "4": "〜というもの: dùng sau khoảng thời gian (この3年というもの: suốt 3 năm nay). Không đi sau 使う."}, "n": ["Xem Đề 12 câu 4 (いくら〜といっても)."], "why": "Thừa nhận vế trước (có dùng máy tính) rồi <b>điều chỉnh<\/b>: thực ra chỉ là tô màu bằng phần mềm. Mẫu <b>〜といっても<\/b>: nói là… nhưng thực tế (mức độ thấp hơn tưởng)."}, {"s": "やり方（　）、８時間の仕事も６時間で終わる。", "o": ["次第では", "ほどで", "ばかりに", "上は"], "a": 1, "ar": "N次第では", "vi": "Tùy cách làm mà việc 8 tiếng cũng có thể xong trong 6 tiếng.", "key": [{"w": "〜次第では", "r": "しだいでは", "hv": "THỨ ĐỆ", "m": "tùy vào… mà (có thể)"}], "x": {"2": "ほどで (khoảng chừng): đi với số lượng (1時間ほどで). Không đi với やり方.", "3": "〜ばかりに (chỉ vì — hậu quả xấu): kết quả ở đây là tốt (xong sớm).", "4": "〜上は (một khi đã): đi sau động từ (決めた上は), không sau danh từ やり方."}, "n": ["Xem Đề 4 câu 7 (次第: ngay sau khi)."], "why": "Kết quả <b>thay đổi tùy<\/b> cách làm: 8 tiếng có thể xong trong 6 tiếng. Mẫu <b>N次第では<\/b>: tùy vào N mà (có trường hợp)…"}, {"s": "大阪に行った（　）、大学時代の友人に会ってきた。", "o": ["とおりに", "うちに", "ついでに", "ばかりに"], "a": 3, "ar": "〜ついでに", "vi": "Nhân tiện đi Osaka, tôi ghé gặp bạn thời đại học.", "key": [{"w": "〜ついでに", "r": "ついでに", "hv": "—", "m": "nhân tiện"}], "x": {"1": "〜とおりに (đúng như): 言ったとおりに. “Đúng như đã đi Osaka” vô nghĩa.", "2": "〜うちに (trong lúc còn): đi với Vる / Vている, không với Vた theo nghĩa này.", "4": "〜ばかりに (chỉ vì — hậu quả xấu): gặp bạn không phải hậu quả xấu."}, "why": "Đi Osaka (việc chính), <b>nhân tiện<\/b> gặp bạn (việc phụ). Mẫu <b>Vた／Nの＋ついでに<\/b>: nhân tiện."}, {"s": "あの人の計画には、どこかおかしいところがあると（　）。", "o": ["言わずにおくしかない", "言わざるをえない", "言うどころではない", "言うわけにはいかない"], "a": 2, "ar": "Vない + ざるをえない", "vi": "Tôi buộc phải nói rằng kế hoạch của người đó có chỗ nào đó bất thường.", "key": [{"w": "〜ざるを得ない", "r": "ざるをえない", "hv": "ĐẮC", "m": "đành phải, không thể không"}], "x": {"1": "言わずにおくしかない (chỉ còn cách không nói): ngược nghĩa — câu có と (trích nội dung nói ra).", "3": "言うどころではない (không phải lúc để nói): không hợp vì câu đang nhận xét kế hoạch.", "4": "言うわけにはいかない (không thể nói vì đạo lý): ngược nghĩa."}, "n": ["する → せざるを得ない."], "why": "Dù không muốn nhưng <b>buộc phải<\/b> nói ra (do sự thật). Mẫu <b>Vない＋ざるをえない<\/b>: không thể không, đành phải. 言わ＋ざるをえない."}, {"s": "環境問題は、決して他人にまかせておけばいい（　）ではない。", "o": ["というはず", "というもの", "というよう", "というそう"], "a": 2, "ar": "〜というものではない", "vi": "Vấn đề môi trường tuyệt đối không phải cứ phó mặc cho người khác là xong.", "key": [{"w": "〜というものではない", "r": "というものではない", "hv": "—", "m": "không hẳn là (phủ định suy nghĩ đơn giản)"}], "x": {"1": "というはず: không có mẫu “というはずではない”.", "3": "というよう: không có mẫu này.", "4": "というそう: không có mẫu này (そう truyền đạt không đi sau という như vậy)."}, "n": ["Khẳng định: 〜というものだ (Đề 12 câu 8)."], "why": "Phủ định một quan niệm sai: vấn đề môi trường <b>không phải cứ<\/b> phó mặc người khác là được. Mẫu <b>〜ばいいというものではない<\/b>: không phải cứ… là xong."}, {"s": "{西村|にしむら}さんは娘の大学合格がうれしくて（　）らしい。", "o": ["ならない", "きれない", "しかない", "ほかない"], "a": 1, "ar": "〜てならない", "vi": "Có vẻ ông Nishimura vui khôn xiết vì con gái đỗ đại học.", "key": [{"w": "〜てならない", "r": "てならない", "hv": "—", "m": "vô cùng, không kìm được"}], "x": {"2": "〜きれない (không làm hết được): gắn sau Vます (食べきれない), không sau うれしくて.", "3": "〜しかない (chỉ còn cách): gắn sau Vる, không sau tính từ thể て.", "4": "〜ほかない (chỉ còn cách): tương tự, không sau うれしくて."}, "n": ["Xem Đề 12 câu 12."], "why": "Vui <b>khôn xiết, không kìm được<\/b> vì con đỗ đại học. Mẫu <b>Aくて＋ならない<\/b>: cảm xúc trào dâng tự nhiên (thường dùng cho người khác kèm らしい／ようだ)."}, {"s": "授業を（　）最中に、非常ベルが鳴り出した。", "o": ["している", "して", "する", "した"], "a": 1, "ar": "Vている + 最中に", "vi": "Đang giữa giờ học thì chuông báo động reo.", "key": [{"w": "〜最中に", "r": "さいちゅうに", "hv": "TỐI TRUNG", "m": "đang lúc giữa chừng"}], "x": {"2": "して: thể て không nối trực tiếp với danh từ 最中.", "3": "する: Vる không đi với 最中 (phải là している).", "4": "した: Vた chỉ hành động đã xong — mâu thuẫn với “đang giữa chừng”."}, "n": ["N の最中: 会議の最中."], "why": "Đúng lúc <b>đang giữa<\/b> giờ học thì chuông reo. Mẫu <b>Vている／Nの＋最中に<\/b>: đang lúc cao điểm của hành động."}, {"s": "友だちの家へ（　）、あいにく留守だった。", "o": ["行ったばかり", "行ったところ", "行くところ", "行くばかり"], "a": 2, "ar": "Vた + ところ", "vi": "Tôi đến nhà bạn thì không may cậu ấy vắng nhà.", "key": [{"w": "Vたところ", "r": "たところ", "hv": "—", "m": "làm… thì (phát hiện kết quả)"}], "x": {"1": "行ったばかり (vừa mới đi): chỉ thời gian ngắn, không nối với kết quả “không có ở nhà”.", "3": "行くところ (sắp đi): chưa đến thì chưa biết bạn vắng nhà.", "4": "行くばかり: không có nghĩa phù hợp (〜ばかりだ: ngày càng xấu)."}, "n": ["あいにく (Đề 2 câu 4). 留守 るす: vắng nhà."], "why": "Làm một việc (đến nhà bạn) <b>thì kết quả là<\/b> phát hiện bạn vắng nhà. Mẫu <b>Vた＋ところ<\/b>: làm… thì (kết quả bất ngờ)."}, {"s": "{夏目漱石|なつめそうせき}（　）、「こころ」という小説を思い出す人も多いだろう。", "o": ["というと", "からいって", "からいえば", "というより"], "a": 1, "ar": "Nというと", "vi": "Nhắc đến Natsume Soseki, hẳn nhiều người sẽ nhớ tới tiểu thuyết “Kokoro”.", "key": [{"w": "〜というと", "r": "というと", "hv": "—", "m": "nhắc đến… thì (liên tưởng)"}], "x": {"2": "〜からいって (xét từ): cần một tiêu chí đánh giá (経験からいって). “Xét từ Natsume Soseki” không hợp.", "3": "〜からいえば (xét từ góc độ): tương tự, không dùng để liên tưởng.", "4": "〜というより (nói đúng hơn là): cần hai thứ để so sánh, không có ở đây."}, "n": ["Đồng nghĩa: 〜といえば, 〜といったら."], "why": "Nhắc đến một chủ đề rồi <b>liên tưởng<\/b> tới điều liên quan. Mẫu <b>Nというと／といえば<\/b>: nhắc đến N thì (nghĩ ngay đến)…"}], "sum": [{"h": "Họ mẫu với という — dễ nhầm nhất N2", "tbl": {"head": ["Mẫu", "Nghĩa", "Ví dụ"], "rows": [["AというよりB", "B thì đúng hơn A", "先生というより銀行員だ"], ["〜といっても", "nói là… nhưng thực ra", "料理ができるといっても卵焼きだけ"], ["Nというと / といえば", "nhắc đến N thì", "夏目漱石というと「こころ」"], ["Nといったら", "nói đến N thì (cảm thán)", "その寒さといったら"], ["〜というものではない", "không phải cứ… là", "お金があればいいというものではない"], ["〜というものだ", "đó mới chính là", "それが親心というものだ"], ["期間＋というもの", "suốt (thời gian dài)", "この1週間というもの"], ["〜ということだ", "nghe nói; nghĩa là", "明日は休みだということだ"]]}}, {"h": "さえ / でさえ / こそ", "li": ["<b>Nさえ〜ば<\/b>: chỉ cần N là đủ — お金さえあれば; Vます＋さえすれば: 謝りさえすれば許す.", "<b>Nでさえ / Nさえ<\/b>: ngay cả N (ví dụ cực đoan) — 子どもでさえ知っている.", "<b>Nこそ<\/b>: chính N (nhấn mạnh tích cực) — 今年こそ. <b>〜ばこそ / 〜からこそ<\/b>: chính vì.", "<b>Nすら<\/b>: ngay cả (văn viết, ≈ さえ)."]}, {"h": "Mẫu chỉ thời điểm và kết quả", "tbl": {"head": ["Mẫu", "Nghĩa", "Ví dụ"], "rows": [["Vている / Nの＋最中に", "đang giữa lúc", "会議の最中に電話が鳴った"], ["Vた＋ところ", "làm… thì (kết quả)", "聞いてみたところ、知らなかった"], ["Vた＋ばかり", "vừa mới", "来たばかりだ"], ["Vる＋ところ", "sắp", "出かけるところだ"], ["Vた / Nの＋ついでに", "nhân tiện", "買い物のついでに"], ["N次第で / 次第では", "tùy vào", "天気次第では中止"]]}}, {"h": "Buộc phải / cảm xúc trào dâng", "li": ["<b>Vない＋ざるをえない<\/b>: buộc phải (する → せざるをえない). Gần nghĩa: 〜ないわけにはいかない, 〜しかない.", "<b>〜てならない<\/b> / <b>〜てたまらない<\/b> / <b>〜てしかたがない<\/b>: … không chịu nổi; với người thứ ba thêm らしい／ようだ／がっている.", "Đối lập: 〜わけにはいかない (không thể làm), 〜どころではない (không phải lúc), 〜ずにおく (cố ý không làm)."]}], "source": {"folder": "https://drive.google.com/drive/folders/1BQ4m_OfdIIQXfPKdB2uaPDOkNHgiWyh7", "goc": "https://drive.google.com/file/d/1s4FFvCMdeZZYJyIThv-JR_HWq1tB8ojv/view", "chua": "https://drive.google.com/file/d/1CLv36P_DkIx9-W7eZAFn08AxsIfQrInK/view"}, "series": "DORA Nihongo · Đề 15 · Ngữ pháp N5–N2 trúng tủ"}, {"no": 16, "folderLabel": "Kanji", "cat": "Kanji", "file": "ĐỀ 22 - KANJI N2", "title": "Đề 16 · Kanji N2", "jp": "漢字読み", "mondai": "<b>問題1<\/b> ＿＿の言葉の読み方として最もよいものを、1・2・3・4から一つ選びなさい。 Chọn cách đọc đúng nhất cho từ được gạch chân.", "qs": [{"s": "部屋の_隅_にたまったほこりを掃除した。", "o": ["すみ", "うち", "はし", "かど"], "a": 1, "ar": "隅", "vi": "Tôi quét sạch bụi đọng ở góc phòng.", "key": [{"w": "隅", "r": "すみ", "hv": "NGUNG", "m": "góc (phía trong)"}], "x": {"2": "うち là 内 (bên trong). Chữ khác.", "3": "はし là 端 (mép, rìa). Chữ khác; nghĩa gần nhưng mép không phải góc.", "4": "かど là 角 (góc lồi ra ngoài: 机の角, 曲がり角). Góc phòng phía trong dùng 隅."}, "n": ["隅から隅まで: từ đầu đến cuối, kỹ lưỡng."], "why": "隅 âm Kun <b>すみ<\/b>: góc (lõm vào trong, như góc phòng). Ngữ cảnh 部屋の隅にたまったほこり (bụi đọng ở góc phòng) khớp nghĩa."}, {"s": "{上司|じょうし}からの{信頼|しんらい}が_回復_しないうちは君の{昇進|しょうしん}は無理だ。", "o": ["かいふく", "かいほう", "かいほく", "かいふう"], "a": 1, "ar": "回復", "vi": "Chừng nào chưa lấy lại được lòng tin của cấp trên thì cậu khó mà thăng chức.", "key": [{"w": "回復", "r": "かいふく", "hv": "HỒI PHỤC", "m": "phục hồi"}], "x": {"2": "かいほう là 解放 / 開放 / 介抱. 復 đọc ふく, không phải ほう.", "3": "かいほく: không có từ này.", "4": "かいふう là 開封 (mở phong bì). 復 có âm cuối く, không phải う."}, "g": ["<b class=\"jp\">〜ないうちは<\/b>: chừng nào chưa…"], "n": ["復 ふく: 復習, 往復."], "why": "回 đọc <b>かい<\/b>, 復 đọc <b>ふく<\/b> ＝ <b>かいふく<\/b>: hồi phục. Ngữ cảnh 信頼が回復する (lấy lại lòng tin) khớp nghĩa."}, {"s": "川にはごみがたくさん_浮いて_いる。", "o": ["ういて", "ふいて", "わいて", "まいて"], "a": 1, "ar": "浮く", "vi": "Có rất nhiều rác nổi trên sông.", "key": [{"w": "浮く", "r": "うく", "hv": "PHÙ", "m": "nổi"}], "x": {"2": "ふいて là 拭く (lau) / 吹く (thổi). Chữ khác.", "3": "わいて là 沸く (sôi). Chữ khác.", "4": "まいて là 巻く (cuộn) / 撒く (rải). Chữ khác."}, "n": ["↔ 沈む. Xem Đề 1 câu 16 (ういて là phương án nhiễu)."], "why": "浮く đọc <b>うく<\/b>: nổi. Ngữ cảnh ごみが川に浮いている (rác nổi trên sông) khớp nghĩa."}, {"s": "_缶詰_は{冷暗所|れいあんしょ}に{保存|ほぞん}してください。", "o": ["かんづめ", "びんつめ", "びんづめ", "かんつめ"], "a": 1, "ar": "缶詰", "vi": "Hãy bảo quản đồ hộp ở nơi tối mát.", "key": [{"w": "缶詰", "r": "かんづめ", "hv": "PHỮU CẬT", "m": "đồ hộp"}], "x": {"2": "びんつめ: 缶 không đọc びん; và つめ phải đục thành づめ.", "3": "びんづめ là 瓶詰 (đồ đóng lọ). Chữ khác — 缶 là lon, 瓶 là chai lọ.", "4": "かんつめ: 缶 đúng nhưng thiếu đục hóa (連濁): 缶＋詰 → かんづめ."}, "n": ["詰める → 〜詰め đục thành づめ. Xem Đề 2 câu 10 (詰まる)."], "why": "缶 đọc <b>かん<\/b>, 詰 (つめ) đục hóa khi đứng sau thành <b>づめ<\/b> ＝ <b>かんづめ<\/b>: đồ hộp. Ngữ cảnh bảo quản ở nơi tối mát khớp nghĩa."}, {"s": "{早朝通勤者|そうちょうつうきんしゃ}が_郊外_から都心に集まってくる。", "o": ["ごうがい", "きょうがい", "ぎょうがい", "こうがい"], "a": 4, "ar": "郊外", "vi": "Người đi làm sớm từ ngoại ô đổ về trung tâm.", "key": [{"w": "郊外", "r": "こうがい", "hv": "GIAO NGOẠI", "m": "ngoại ô"}], "x": {"1": "ごうがい là 号外 (số báo phát hành đặc biệt). 郊 không đục thành ごう.", "2": "きょうがい: không phải từ thông dụng.", "3": "ぎょうがい: không có từ này (業界 đọc ぎょうかい)."}, "n": ["Đồng âm: 公害 こうがい (ô nhiễm)."], "why": "郊 đọc <b>こう<\/b>, 外 đọc <b>がい<\/b> ＝ <b>こうがい<\/b>: ngoại ô. Ngữ cảnh 郊外から都心に (từ ngoại ô vào trung tâm) khớp nghĩa."}, {"s": "本校における大学_進学率_は高いです。", "o": ["しんがくいつ", "しんがくそつ", "しんがくしつ", "しんがくりつ"], "a": 4, "ar": "進学率", "vi": "Tỷ lệ học lên đại học của trường chúng tôi rất cao.", "key": [{"w": "進学率", "r": "しんがくりつ", "hv": "TIẾN HỌC SUẤT", "m": "tỷ lệ học lên"}], "x": {"1": "しんがくいつ: 率 không có âm いつ.", "2": "しんがくそつ: そつ chỉ dùng khi 率 nghĩa là “dẫn dắt, thẳng thắn” (率直 そっちょく, 引率 いんそつ), không phải tỷ lệ.", "3": "しんがくしつ: 率 không đọc しつ."}, "n": ["率 りつ sau danh từ: 確率, 能率. 率 そつ: 率直 そっちょく (Đề 4 câu 3)."], "why": "率 có hai âm: <b>りつ<\/b> khi chỉ tỷ lệ (確率, 合格率) và そつ (率直, 引率). Ở đây là tỷ lệ → 進学率 ＝ <b>しんがくりつ<\/b>."}, {"s": "多くの{警官|けいかん}が{大使館|たいしかん}の_警備_に当たっていた。", "o": ["けいひ", "けいび", "けんび", "けんひ"], "a": 2, "ar": "警備", "vi": "Nhiều cảnh sát đảm nhận việc canh gác đại sứ quán.", "key": [{"w": "警備", "r": "けいび", "hv": "CẢNH BỊ", "m": "bảo vệ, canh gác"}], "x": {"1": "けいひ là 経費 (kinh phí). 備 đọc び (đục), không phải ひ.", "3": "けんび: 警 đọc けい, không phải けん.", "4": "けんひ: sai cả hai chữ."}, "g": ["<b class=\"jp\">〜に当たる<\/b>: đảm nhận."], "n": ["備 び: 準備, 設備. Kun: 備える (Đề 14 câu 18)."], "why": "警 đọc <b>けい<\/b>, 備 đọc <b>び<\/b> ＝ <b>けいび<\/b>: canh gác, bảo vệ. Ngữ cảnh cảnh sát 大使館の警備に当たる khớp nghĩa."}, {"s": "あの子は特に語学に_優れて_いる。", "o": ["あこがれて", "すぐれて", "めぐまれて", "あふれて"], "a": 2, "ar": "優れる", "vi": "Đứa bé đó đặc biệt giỏi ngoại ngữ.", "key": [{"w": "優れる", "r": "すぐれる", "hv": "ƯU", "m": "xuất sắc, vượt trội"}], "x": {"1": "あこがれて là 憧れる (ngưỡng mộ). Chữ khác.", "3": "めぐまれて là 恵まれる (được ưu ái, may mắn có). Chữ khác.", "4": "あふれて là 溢れる (tràn đầy). Chữ khác."}, "n": ["優 còn đọc やさしい (優しい). 優秀 ゆうしゅう."], "why": "優れる đọc <b>すぐれる<\/b>: giỏi, xuất sắc. Ngữ cảnh 語学に優れている (giỏi ngoại ngữ) khớp nghĩa. Âm On: 優秀 ゆうしゅう."}, {"s": "{出番|でばん}を待ちながら_心臓_がどきどきした。", "o": ["しんそう", "じんぞう", "しんぞう", "じんそう"], "a": 3, "ar": "心臓", "vi": "Chờ đến lượt lên sân khấu, tim tôi đập thình thịch.", "key": [{"w": "心臓", "r": "しんぞう", "hv": "TÂM TẠNG", "m": "quả tim"}], "x": {"1": "しんそう: 臓 đọc ぞう (đục), không phải そう.", "2": "じんぞう là 腎臓 (thận). Chữ khác; 心 đọc しん (âm trong).", "4": "じんそう: sai cả hai chữ."}, "n": ["臓 ぞう: 内臓, 肝臓 (Đề 14 câu 7)."], "why": "心 đọc <b>しん<\/b>, 臓 đọc <b>ぞう<\/b> ＝ <b>しんぞう<\/b>: tim. Ngữ cảnh 心臓がどきどきする (tim đập thình thịch) khớp nghĩa."}, {"s": "_一秒_でも遅刻すると授業が受けられません。", "o": ["いっびょう", "いちびょう", "いっぴょう", "いちぴょう"], "a": 2, "ar": "一秒", "vi": "Muộn dù chỉ một giây cũng không được vào học.", "key": [{"w": "一秒", "r": "いちびょう", "hv": "NHẤT MIỂU", "m": "một giây"}], "x": {"1": "いっびょう: âm ngắt っ không đứng trước âm đục び.", "3": "いっぴょう: 秒 không chuyển thành ぴょう (chỉ chữ hàng は như 票 ひょう mới thành っぴょう: 一票 いっぴょう).", "4": "いちぴょう: 秒 đọc びょう, không phải ぴょう."}, "n": ["Khác với 一分 いっぷん, 一泊 いっぱく: 秒 bắt đầu bằng b nên không xúc âm."], "why": "一 đọc <b>いち<\/b>, 秒 đọc <b>びょう<\/b>. Vì 秒 bắt đầu bằng び (âm đục) nên 一 <b>không<\/b> biến thành いっ ＝ <b>いちびょう<\/b>."}, {"s": "{休暇|きゅうか}にどこへ行くかの_選択_は彼女に任せた。", "o": ["ぜいたく", "せいたく", "せんたく", "ぜんたく"], "a": 3, "ar": "選択", "vi": "Tôi để cô ấy chọn đi đâu trong kỳ nghỉ.", "key": [{"w": "選択", "r": "せんたく", "hv": "TUYỂN TRẠCH", "m": "lựa chọn"}], "x": {"1": "ぜいたく là 贅沢 (xa xỉ). Chữ khác.", "2": "せいたく: 選 đọc せん, không phải せい.", "4": "ぜんたく: 選 không đục thành ぜん."}, "n": ["Đồng âm: 洗濯 せんたく (giặt)."], "why": "選 đọc <b>せん<\/b>, 択 đọc <b>たく<\/b> ＝ <b>せんたく<\/b>: lựa chọn. Ngữ cảnh 〜は彼女に任せた (để cô ấy chọn) khớp nghĩa. (Đồng âm: 洗濯 — giặt giũ.)"}, {"s": "彼の長年の_努力_がようやく{報|むく}われた。", "o": ["きょりょく", "どりょく", "きょうりょく", "どうりょく"], "a": 2, "ar": "努力", "vi": "Nỗ lực bao năm của anh ấy cuối cùng đã được đền đáp.", "key": [{"w": "努力", "r": "どりょく", "hv": "NỖ LỰC", "m": "nỗ lực"}, {"w": "報われる", "r": "むくわれる", "hv": "BÁO", "m": "được đền đáp"}], "x": {"1": "きょりょく: không có từ này.", "3": "きょうりょく là 協力 (hợp tác). Chữ khác (đã gặp ở Đề 14).", "4": "どうりょく là 動力 (động lực máy). 努 không có trường âm."}, "n": ["Xem Đề 14 câu 19 (cùng bộ phương án)."], "why": "努 đọc <b>ど<\/b> (ngắn), 力 đọc <b>りょく<\/b> ＝ <b>どりょく<\/b>: nỗ lực. Ngữ cảnh 長年の努力が報われた khớp nghĩa."}, {"s": "彼は{同僚|どうりょう}のアイデアを_盗んで_論文を書いたと告白した。", "o": ["たたんで", "つかんで", "ぬすんで", "はさんで"], "a": 3, "ar": "盗む", "vi": "Anh ta thú nhận đã ăn cắp ý tưởng của đồng nghiệp để viết luận văn.", "key": [{"w": "盗む", "r": "ぬすむ", "hv": "ĐẠO", "m": "ăn cắp"}], "x": {"1": "たたんで là 畳む (gấp). Chữ khác.", "2": "つかんで là 掴む (nắm). Chữ khác.", "4": "はさんで là 挟む (kẹp). Chữ khác."}, "n": ["盗難 とうなん, 強盗 ごうとう."], "why": "盗む đọc <b>ぬすむ<\/b>: ăn cắp. Ngữ cảnh アイデアを盗んで論文を書いた khớp nghĩa. Âm On: 盗難 とうなん."}, {"s": "彼は{通信|つうしん}会社に{技師|ぎし}として_雇われて_います。", "o": ["すくわれて", "ねがわれて", "やとわれて", "いわわれて"], "a": 3, "ar": "雇われる", "vi": "Anh ấy được một công ty viễn thông thuê làm kỹ sư.", "key": [{"w": "雇う", "r": "やとう", "hv": "CỐ", "m": "thuê (người làm)"}], "x": {"1": "すくわれて là 救われる (được cứu). Chữ khác.", "2": "ねがわれて: bị động của 願う — không tự nhiên và là chữ khác.", "4": "いわわれて là 祝われる (được chúc mừng). Chữ khác."}, "n": ["雇用 こよう: tuyển dụng, việc làm."], "why": "雇う đọc <b>やとう<\/b>: thuê người. Bị động 雇われる ＝ <b>やとわれる<\/b>: được thuê. Ngữ cảnh 技師として雇われている khớp nghĩa."}, {"s": "いざというときのためにご{近所同士|きんじょどうし}{密接|みっせつ}な_連絡_が必要です。", "o": ["てんかく", "てんらく", "れんらく", "れんかく"], "a": 3, "ar": "連絡", "vi": "Phòng khi khẩn cấp, hàng xóm cần giữ liên lạc chặt chẽ với nhau.", "key": [{"w
