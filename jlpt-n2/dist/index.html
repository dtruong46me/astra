<title>Luyện đề N2 DORA</title>

<style>
/* Layout: an exam binder. Home = index of 20 exam slots; exam view = one answer sheet column with a sticky bar; explanations exist only after submitting. */
:root {
  --paper: #f6f7f9;
  --sheet: #ffffff;
  --ink: #1d2433;
  --ink-soft: #566074;
  --rule: #dfe3ea;
  --ai: #2b4a8b;
  --ai-wash: #e8edf7;
  --shu: #d2352b;
  --shu-wash: #fbeceb;
  --ok: #1f7a4d;
  --ok-wash: #e6f4ec;
  --font-jp: "BIZ UDPMincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-pen: "Klee One", "Be Vietnam Pro", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12151b; --sheet: #1a1e26; --ink: #e6e9ef; --ink-soft: #9aa3b5; --rule: #2c323e;
    --ai: #8fb0f0; --ai-wash: #22304a; --shu: #ff7b6e; --shu-wash: #3a2224; --ok: #6fd3a0; --ok-wash: #1d3329;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12151b; --sheet: #1a1e26; --ink: #e6e9ef; --ink-soft: #9aa3b5; --rule: #2c323e;
  --ai: #8fb0f0; --ai-wash: #22304a; --shu: #ff7b6e; --shu-wash: #3a2224; --ok: #6fd3a0; --ok-wash: #1d3329;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }
a { color: var(--ai); }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
button { font: inherit; cursor: pointer; }
.wrap { max-width: 800px; margin: 0 auto; padding-inline: 16px; padding-block: 0 56px; }

/* shared bits */
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
h1 { margin: 0; font-size: clamp(24px, 5vw, 32px); line-height: 1.2; text-wrap: balance; font-weight: 700; }
h1 .jp { font-family: var(--font-jp); margin-inline-end: .35em; }
.btn { border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--ai); }
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--sheet); }
.btn.danger { background: var(--shu); border-color: var(--shu); color: var(--sheet); }
.btn[aria-pressed="true"] { background: var(--ai-wash); border-color: var(--ai); color: var(--ai); }
.chip { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--ai-wash); color: var(--ai); }
.src { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--rule); border-radius: 999px; background: var(--sheet); text-decoration: none; font-size: 13px; font-weight: 500; color: var(--ink); }
.src:hover { border-color: var(--ai); color: var(--ai); }
.src .k { font-family: var(--font-jp); color: var(--ai); font-weight: 700; }
.notice { font-size: 13px; color: var(--ink-soft); background: var(--sheet); border: 1px dashed var(--rule); border-radius: 8px; padding: 8px 12px; }

/* home */
.home-head { padding-block: 32px 18px; display: grid; gap: 10px; }
.home-head p { margin: 0; color: var(--ink-soft); max-width: 62ch; }
.stats { display: flex; flex-wrap: wrap; gap: 18px; font-size: 13px; color: var(--ink-soft); }
.stats b { font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; margin-inline-end: 4px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 8px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.card.off { background: transparent; border-style: dashed; }
.card .no { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card .no b { font-size: 17px; }
.card .file { font-size: 13px; color: var(--ink-soft); font-family: var(--font-jp); }
.card .state { font-size: 13px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; min-height: 26px; }
.card .state .pen { font-family: var(--font-pen); color: var(--shu); font-size: 20px; line-height: 1; }
.card .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.card.off .state { color: var(--ink-soft); }
.bar-mini { height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.bar-mini i { display: block; height: 100%; background: var(--ai); }

/* exam */
.exam-head { padding-block: 22px 16px; display: grid; gap: 10px; }
.back { font-size: 13px; text-decoration: none; font-weight: 600; }
.mondai { margin: 0; color: var(--ink-soft); }
.mondai b { font-family: var(--font-jp); color: var(--ink); }
.sources { display: flex; flex-wrap: wrap; gap: 8px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); margin-inline: -16px; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bar .info { margin-inline-end: auto; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.bar .score { font-family: var(--font-pen); color: var(--shu); font-size: 24px; line-height: 1; }
.bar .score small { font-size: 14px; }
.confirm { margin-top: 12px; background: var(--shu-wash); border: 1px solid var(--shu); border-radius: 10px; padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.confirm p { margin: 0; margin-inline-end: auto; }

.result { margin-top: 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.result .big { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.result .big .pen { font-family: var(--font-pen); color: var(--shu); font-size: 44px; line-height: 1; }
.result .big .pen small { font-size: 22px; }
.result .big span { color: var(--ink-soft); font-size: 14px; }
.jumps { display: flex; flex-wrap: wrap; gap: 6px; }
.jumps a { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; font-size: 13px; font-weight: 700; text-decoration: none; font-variant-numeric: tabular-nums; border: 1.5px solid var(--ok); color: var(--ok); background: var(--ok-wash); }
.jumps a.ng { border-color: var(--shu); color: var(--shu); background: var(--shu-wash); }

.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; margin-top: 16px; }
.q { padding: 20px 18px 16px; border-top: 1px solid var(--rule); display: grid; grid-template-columns: auto 1fr; column-gap: 14px; scroll-margin-top: 80px; }
.q:first-child { border-top: 0; }
.qn { width: 30px; height: 30px; border: 1.5px solid var(--ai); color: var(--ai); border-radius: 6px; display: grid; place-items: center; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; position: relative; }
.qbody { min-width: 0; display: grid; gap: 12px; }
.stem { font-family: var(--font-jp); font-size: 19px; line-height: 2.1; margin: 0; }
.stem ruby rt, .jpline ruby rt { font-size: 10px; color: var(--ink-soft); }
.stem u, .jpline u { text-decoration: none; border-bottom: 2px solid var(--ai); padding-bottom: 1px; }
.blank { display: inline-block; min-width: 4.5em; text-align: center; border-bottom: 2px solid var(--ink-soft); margin-inline: .2em; line-height: 1.5; }
.blank.filled { color: var(--ai); border-bottom-color: var(--ai); }
.blank:empty::before { content: "\3000"; }
.slot { display: inline-block; min-width: 3.2em; text-align: center; border-bottom: 2px solid var(--ink-soft); margin-inline: .25em; line-height: 1.5; color: var(--ink-soft); font-size: .8em; vertical-align: baseline; }
.slot.star { color: var(--shu); }
.slot.filled { color: var(--ai); border-bottom-color: var(--ai); font-size: 1em; }
.opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 10px; list-style: none; margin: 0; padding: 0; }
.opts.long { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 560px) { .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; border: 1px solid transparent; background: transparent; color: var(--ink); padding: 6px 8px; border-radius: 8px; font-family: var(--font-jp); font-size: 17px; min-width: 0; }
.opt:hover { background: var(--ai-wash); }
.opt .bub { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink-soft); display: grid; place-items: center; font-family: var(--font-ui); font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt[aria-pressed="true"] .bub { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.done .opt { cursor: default; }
.done .opt:hover { background: transparent; }
.done .opt.is-ans { background: var(--ok-wash); }
.done .opt.is-ans .bub { border-color: var(--ok); color: var(--ok); }
.done .opt.is-ans[aria-pressed="true"] .bub { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.done .opt.is-wrong { background: var(--shu-wash); }
.done .opt.is-wrong .bub { background: var(--shu); border-color: var(--shu); color: var(--sheet); }
.unanswered { font-size: 12.5px; color: var(--shu); font-weight: 600; }
.mark { position: absolute; left: -7px; top: -8px; width: 44px; height: 44px; pointer-events: none; }
.mark circle, .mark path { fill: none; stroke: var(--shu); stroke-width: 3; stroke-linecap: round; }
.only-wrong .q.ok { display: none; }

details.ex { border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
details.ex > summary { list-style: none; cursor: pointer; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--ai); display: flex; align-items: center; gap: 10px; }
details.ex > summary::-webkit-details-marker { display: none; }
details.ex > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
details.ex[open] > summary::before { transform: rotate(45deg); }
.exb { padding: 4px 14px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; font-size: 14.5px; }
.exb > * { min-width: 0; }
.exb h4 { margin: 0 0 4px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.exb .jp, .exb ruby { font-family: var(--font-jp); }
.ansline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
.ansline .circ { font-family: var(--font-pen); color: var(--shu); font-size: 20px; }
.ansline .w { font-family: var(--font-jp); font-size: 20px; font-weight: 700; }
.ansline .r { font-family: var(--font-jp); color: var(--ink-soft); }
.vi { margin: 0; font-style: italic; }
.jpline { margin: 0 0 2px; font-family: var(--font-jp); font-size: 16px; line-height: 2; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: start; padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
td.w { font-family: var(--font-jp); font-size: 17px; font-weight: 700; white-space: nowrap; }
td.r { font-family: var(--font-jp); white-space: nowrap; }
td.hv { font-size: 12.5px; font-weight: 600; letter-spacing: .04em; color: var(--ai); white-space: nowrap; }
ul.others, ul.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
ul.others li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
ul.others .n { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--shu); color: var(--shu); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
ul.others li > div { min-width: 0; }
ul.notes li { padding-inline-start: 14px; position: relative; }
ul.notes li::before { content: ""; position: absolute; left: 0; top: .7em; width: 6px; height: 6px; border-radius: 50%; background: var(--ai); }
.g { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; }
.g b.jp { color: var(--ai); }
.key { margin-top: 16px; }
.key table { background: var(--sheet); }
.key td, .key th { text-align: center; font-variant-numeric: tabular-nums; }
.key td { font-weight: 700; color: var(--shu); font-family: var(--font-pen); font-size: 17px; }
footer { margin-top: 28px; font-size: 13px; color: var(--ink-soft); }
.sync { position: fixed; right: 12px; bottom: 12px; z-index: 5; font-size: 12px; padding: 5px 10px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--rule); color: var(--ink-soft); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.sync[data-s="ok"] { color: var(--ok); border-color: var(--ok); }
.sync[data-s="err"], .sync[data-s="off"] { color: var(--shu); border-color: var(--shu); }
.sync:empty { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<script>

c, hiệu quả (↔ 無効 むこう)"}], "x": {"1": "<span class=\"jp\">こうよう<\/span> (HIỆU DỤNG): công dụng (薬の効用).", "2": "<span class=\"jp\">けんり<\/span> (QUYỀN LỢI): quyền (↔ 義務 nghĩa vụ).", "3": "<span class=\"jp\">りてん<\/span> (LỢI ĐIỂM): ưu điểm."}, "g": ["<b class=\"jp\">〜まで<\/b>: đến (mốc thời gian) — hiệu lực kéo dài đến hết ngày mai."], "n": ["有効期限 ゆうこうきげん: hạn sử dụng/hiệu lực. 時間を有効に使う: dùng thời gian hiệu quả."]}, {"s": "彼はちょっとしたことにもすぐ腹を（　）。", "o": ["立てる", "割る", "切る", "決める"], "a": 1, "ar": "腹を立てる", "vi": "Anh ấy hay nổi giận ngay cả với những chuyện cỏn con.", "key": [{"w": "腹を立てる", "r": "はらをたてる", "hv": "PHÚC", "m": "nổi giận"}], "x": {"2": "<span class=\"jp\">腹を割る<\/span>: thẳng thắn, nói thật lòng (腹を割って話す).", "3": "<span class=\"jp\">腹を切る<\/span>: mổ bụng tự sát; nghĩa bóng: nhận trách nhiệm.", "4": "<span class=\"jp\">腹を決める<\/span>: hạ quyết tâm (≈ 腹をくくる)."}, "g": ["<b class=\"jp\">ちょっとした<\/b>: nhỏ nhặt, không đáng kể.", "<b class=\"jp\">〜にも<\/b>: ngay cả với…"], "n": ["Cặp tự/tha: 腹が立つ (tức giận) / 腹を立てる (nổi giận). Quán ngữ với 腹 khác: 腹が黒い (thâm hiểm)."]}, {"s": "交通渋滞で少しも動けないので車の中で（　）している。", "o": ["いらいら", "ぺらぺら", "すらすら", "わくわく"], "a": 1, "ar": "いらいら", "vi": "Tắc đường không nhích được chút nào nên tôi ngồi trong xe bực bội sốt ruột.", "key": [{"w": "いらいら", "r": "いらいら", "hv": "—", "m": "bực bội, sốt ruột"}, {"w": "渋滞", "r": "じゅうたい", "hv": "SÁP TRỆ", "m": "tắc nghẽn (giao thông)"}], "x": {"2": "nói trôi chảy (tiếng nước ngoài); lật giở trang sách.", "3": "trôi chảy, suôn sẻ (すらすら読む, すらすら解ける).", "4": "hồi hộp háo hức (điều sắp tới vui)."}, "g": ["<b class=\"jp\">少しも〜ない<\/b>: không… chút nào."], "n": ["いらいらする: sốt ruột, cáu vì mọi việc không như ý. Gần nghĩa: むかむか (buồn nôn; tức tối)."]}, {"s": "途中寄り道をせず、{岡山|おかやま}まで（　）車を飛ばした。", "o": ["一斉に", "改めて", "一気に", "思い切って"], "a": 3, "ar": "いっきに", "vi": "Không la cà dọc đường, tôi phóng xe một mạch đến Okayama.", "key": [{"w": "一気に", "r": "いっきに", "hv": "NHẤT KHÍ", "m": "một mạch, một hơi"}, {"w": "寄り道", "r": "よりみち", "hv": "KÝ ĐẠO", "m": "tạt ngang, la cà dọc đường"}], "x": {"1": "<span class=\"jp\">いっせいに<\/span>: đồng loạt (nhiều người/vật cùng lúc).", "2": "<span class=\"jp\">あらためて<\/span>: lại lần nữa, dịp khác (改めて連絡します).", "4": "<span class=\"jp\">おもいきって<\/span>: mạnh dạn, dứt khoát."}, "g": ["<b class=\"jp\">Vず(に)<\/b>: không làm… mà (văn viết của ないで). する → せず.", "<b class=\"jp\">車を飛ばす<\/b>: phóng xe nhanh."], "n": ["一気に: 一気に飲む (uống một hơi), 一気に読み終える (đọc một mạch hết)."]}, {"s": "年末の完成を（　）工事を進める。", "o": ["ながめて", "みあげて", "みおろして", "めざして"], "a": 4, "ar": "目指す", "vi": "Tiến hành thi công với mục tiêu hoàn thành vào cuối năm.", "key": [{"w": "目指す", "r": "めざす", "hv": "MỤC CHỈ", "m": "nhắm tới, hướng tới"}, {"w": "完成", "r": "かんせい", "hv": "HOÀN THÀNH", "m": "hoàn thành"}], "x": {"1": "<span class=\"jp\">眺める<\/span> (THIẾU) ながめる: ngắm nhìn (景色を眺める).", "2": "<span class=\"jp\">見上げる<\/span>: ngước nhìn; ngưỡng mộ.", "3": "<span class=\"jp\">見下ろす<\/span>: nhìn xuống (từ trên cao). Khác 見下す みくだす (coi thường)."}, "g": ["<b class=\"jp\">〜を目指して<\/b>: hướng tới (mục tiêu)…", "<b class=\"jp\">工事を進める<\/b>: đẩy nhanh, tiến hành thi công."], "n": ["目指す: 合格を目指す (nhắm đến đỗ), 頂上を目指す (hướng lên đỉnh)."]}], "no": 2, "cat": "Từ vựng", "file": "ĐỀ 7 - TỪ VỰNG N2", "folderLabel": "Ngữ pháp", "source": {"folder": "https://drive.google.com/drive/folders/1I__WFm8fTUnUs5Qjv5T8KH4av9jZmLf-", "goc": "https://drive.google.com/file/d/172NfEmOfXeUpahQv1Hn3ge-W-2apyUNw/view", "chua": "https://drive.google.com/file/d/1qxQjPxxp24RejO_r-8iDJluWmw8eOK1a/view"}, "series": "DORA Nihongo · Đề 2 · Ngữ pháp N5–N2 trúng tủ"}, {"no": 3, "folderLabel": "Ngữ pháp", "cat": "Ngữ pháp", "file": "ĐỀ 9 - NGỮ PHÁP N2", "title": "Đề 3 · Ngữ pháp N2", "jp": "文法形式", "mondai": "<b>問題7<\/b> 次の文の（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。 Chọn mẫu ngữ pháp thích hợp nhất để điền vào chỗ trống.", "qs": [{"s": "テーブルのうえに（　）ケーキが{置|お}いてあります。", "o": ["食べはじめの", "食べきった", "食べぬいた", "食べかけの"], "a": 4, "ar": "Vます + かけ(の)", "vi": "Trên bàn có đặt một chiếc bánh ngọt đang ăn dở.", "key": [{"w": "〜かけの N", "r": "かけの", "hv": "—", "m": "N đang làm dở (chưa xong): 食べかけのパン, 読みかけの本"}], "x": {"1": "〜はじめ: bắt đầu làm. 食べはじめ chỉ lúc bắt đầu ăn, không mô tả trạng thái cái bánh đang dở.", "2": "〜きる: làm hết, trọn vẹn. 食べきった = đã ăn hết, vậy thì không còn bánh trên bàn.", "3": "〜ぬく: làm đến cùng dù khó khăn (走りぬく, 考えぬく). Không dùng với 食べる trong nghĩa này."}, "g": ["<b class=\"jp\">Vてある<\/b>: trạng thái kết quả do ai đó cố ý tạo ra (置いてある: được đặt sẵn)."], "n": ["〜かける còn nghĩa là suýt: 死にかける (suýt chết), おぼれかける (suýt chết đuối). Xem Đề 4 câu 6."]}, {"s": "この映画は青少年に悪い{影響|えいきょう}を与える（　）。", "o": ["ことはない", "ものがある", "恐れがある", "限りではない"], "a": 3, "ar": "〜おそれがある", "vi": "Bộ phim này có nguy cơ gây ảnh hưởng xấu đến thanh thiếu niên.", "key": [{"w": "恐れがある", "r": "おそれがある", "hv": "KHỦNG", "m": "e rằng, có nguy cơ (việc xấu)"}], "x": {"1": "〜ことはない: không cần phải… (心配することはない). Không hợp nghĩa.", "2": "〜ものがある: có cái gì đó (cảm thán): 彼の歌には心に響くものがある.", "4": "〜限りではない: không thuộc phạm vi (quy định) này. この限りではない = không áp dụng."}, "g": ["<b class=\"jp\">Vる / Nの + 恐れがある<\/b>: văn viết, tin tức. 台風が上陸する恐れがある."], "n": ["青少年 せいしょうねん THANH THIẾU NIÊN; 影響を与える: gây ảnh hưởng."]}, {"s": "{森田|もりた}さんのお父さんは、声（　）やさしそうですね。", "o": ["をして", "をもって", "からは", "からして"], "a": 4, "ar": "N + からして", "vi": "Bố của anh Morita chỉ nghe giọng thôi đã thấy hiền rồi nhỉ.", "key": [{"w": "〜からして", "r": "からして", "hv": "—", "m": "ngay từ… (lấy một chi tiết tiêu biểu để phán đoán toàn thể)"}], "x": {"1": "〜をして: dùng trong 〜をして〜させる (khiến ai làm gì), không hợp.", "2": "〜をもって: bằng, với (phương tiện, trang trọng): 書面をもって通知する.", "3": "〜からは: từ… thì (điểm xuất phát). Không mang nghĩa “ngay từ… đã”."}, "g": ["<b class=\"jp\">〜そうだ<\/b> (Aい bỏ い + そう): trông có vẻ. やさしそう."], "n": ["Cùng mẫu: タイトルからして面白そうだ. Xem thêm Đề 6 câu 2 (体格からして)."]}, {"s": "やっと{契約|けいやく}がまとまったかと（　）、まだ小さな{条件|じょうけん}でもめている。", "o": ["思ったなら", "思い", "思って", "思ったら"], "a": 4, "ar": "〜かと思ったら", "vi": "Cứ tưởng hợp đồng cuối cùng đã chốt xong, vậy mà vẫn đang cãi nhau về mấy điều khoản nhỏ.", "key": [{"w": "〜かと思ったら", "r": "かとおもったら", "hv": "—", "m": "cứ tưởng là… thì (thực tế khác hẳn)"}, {"w": "契約", "r": "けいやく", "hv": "KHẾ ƯỚC", "m": "hợp đồng"}, {"w": "もめる", "r": "もめる", "hv": "—", "m": "tranh cãi, xích mích"}], "x": {"1": "〜なら: nếu (giả định). Không đi thành mẫu かと思ったなら.", "2": "Thể liên dụng 思い, không tạo thành mẫu ngữ pháp.", "3": "思って: vì nghĩ… nên. Không diễn tả sự trái ngược."}, "g": ["<b class=\"jp\">Vた + かと思ったら / かと思うと<\/b>: (1) cứ tưởng… nhưng thực ra; (2) vừa mới… thì đã (thay đổi nhanh)."], "n": ["条件 じょうけん ĐIỀU KIỆN; まとまる: được thống nhất, chốt lại."]}, {"s": "いったん引き受けた（　）、最後までやり通すべきです。", "o": ["からには", "ためには", "うえには", "わけには"], "a": 1, "ar": "〜からには", "vi": "Một khi đã nhận lời thì nên làm đến cùng.", "key": [{"w": "〜からには", "r": "からには", "hv": "—", "m": "một khi đã… thì (phải, nên)"}], "x": {"2": "〜ためには: để (mục đích). Vế trước phải là mục tiêu, không phải việc đã làm.", "3": "〜うえは (không có に): một khi đã… (văn cứng). うえには không phải mẫu đúng.", "4": "〜わけにはいかない: không thể (vì lý do đạo lý). Thiếu いかない."}, "g": ["<b class=\"jp\">Vた + からには<\/b>: vế sau là ý chí, nghĩa vụ: 〜べきだ, 〜なければならない, 〜つもりだ.", "<b class=\"jp\">やり通す<\/b>: làm đến cùng (Vます + 通す)."], "n": ["Đồng nghĩa: 〜以上(は), 〜上は. いったん: một khi, một lần đã."]}, {"s": "ゆうべ私が調べた（　）、工場の機械に問題はなかったのです。", "o": ["ようでは", "うえでは", "次第では", "限りでは"], "a": 4, "ar": "〜限りでは", "vi": "Theo như tôi kiểm tra tối qua thì máy móc trong nhà máy không có vấn đề gì.", "key": [{"w": "〜限りでは", "r": "かぎりでは", "hv": "HẠN", "m": "theo như (phạm vi hiểu biết của người nói)"}], "x": {"1": "〜ようでは: nếu cứ như thế thì (kết quả xấu): こんなミスをするようでは困る.", "2": "〜うえでは: về mặt, trên phương diện (数字のうえでは). Không đi với 調べた.", "3": "〜次第では: tùy vào… mà (結果次第では). Đi với danh từ."}, "g": ["<b class=\"jp\">調べた / 聞いた / 知っている + 限りでは<\/b>: giới hạn phạm vi thông tin."], "n": ["Cùng chữ 限: 〜限り (chừng nào còn), 〜に限って (riêng…). Xem Đề 18 câu 10."]}, {"s": "風邪（　）し、それに着て行く服もないから、パーティーには行かない。", "o": ["かねる", "ぎみだ", "ようだ", "うる"], "a": 2, "ar": "〜気味だ", "vi": "Tôi hơi bị cảm, lại cũng chẳng có đồ để mặc đi, nên tôi không đi dự tiệc.", "key": [{"w": "〜気味", "r": "ぎみ", "hv": "KHÍ VỊ", "m": "hơi có vẻ, hơi bị (tình trạng không tốt)"}], "x": {"1": "〜かねる: khó mà (Vます + かねる), không đi sau danh từ.", "3": "〜ようだ: hình như. Về nghĩa có thể nhưng 風邪ようだ sai ngữ pháp (phải là 風邪のようだ).", "4": "〜うる: có thể (Vます + うる), không đi sau danh từ."}, "g": ["<b class=\"jp\">〜し、それに〜<\/b>: liệt kê lý do (vừa… lại còn…)."], "n": ["Hay gặp: 風邪気味, 疲れ気味, 太り気味, 緊張気味. Xem Đề 6 câu 9 (不足気味)."]}, {"s": "あの人とは卒業式のとき別れた（　）。", "o": ["ほどだ", "ことだ", "ばかりだ", "きりだ"], "a": 4, "ar": "Vた + きり", "vi": "Tôi chia tay người ấy từ hôm lễ tốt nghiệp rồi không gặp lại nữa.", "key": [{"w": "〜きり", "r": "きり", "hv": "—", "m": "từ khi… rồi thôi (không có gì tiếp theo)"}], "x": {"1": "〜ほどだ: đến mức. Không hợp nghĩa.", "2": "〜ことだ: nên (lời khuyên) hoặc cảm thán. Không hợp.", "3": "Vた + ばかりだ: vừa mới. Chia tay từ lễ tốt nghiệp thì không phải “vừa mới”."}, "g": ["<b class=\"jp\">Vた + きり(〜ない)<\/b>: 出かけたきり帰ってこない (đi rồi không về)."], "n": ["きり còn nghĩa là chỉ: 二人きり (chỉ hai người)."]}, {"s": "雪が降ると、バスは遅れ（　）。", "o": ["かけになる", "きれなくなる", "がちになる", "かけなくなる"], "a": 3, "ar": "〜がち", "vi": "Cứ hễ tuyết rơi là xe buýt hay bị trễ.", "key": [{"w": "〜がち", "r": "がち", "hv": "—", "m": "hay bị, dễ có khuynh hướng (việc không tốt)"}], "x": {"1": "〜かけ: làm dở. 遅れかけになる không tự nhiên.", "2": "〜きれない: không thể làm hết. Không hợp nghĩa.", "4": "Không có mẫu này."}, "g": ["<b class=\"jp\">Vます / N + がち<\/b>: 病気がち, 忘れがち, 遅れがち."], "n": ["Phân biệt: 〜がち (hay xảy ra, lặp lại), 〜気味 (hơi có dấu hiệu), 〜っぽい (có vẻ, dễ)."]}, {"s": "家に着くか着かない（　）雨が降りだした。", "o": ["かのように", "かのうちに", "ままにして", "ようにして"], "a": 2, "ar": "〜か〜ないかのうちに", "vi": "Vừa về đến nhà thì trời đổ mưa.", "key": [{"w": "〜か〜ないかのうちに", "r": "かないかのうちに", "hv": "—", "m": "vừa mới… thì đã (gần như cùng lúc)"}], "x": {"1": "〜かのように: như thể là. Không hợp.", "3": "〜まま: để nguyên. Không hợp.", "4": "〜 const KEY = no => "n2-dora-de" + no;

/* ---------- cloud sync: each viewer's own progress, kept in the artifact db
   (data/users/<id>/deN) so it survives cleared browser storage and follows
   the account across devices. localStorage stays as the fast local copy. ---------- */
const mem = {};
const syncEl = document.getElementById("sync");
const SYNC_TXT = { wait: "Đang tải tiến độ…", ok: "✓ Đã lưu vào tài khoản", err: "⚠ Chưa lưu được lên tài khoản — đang giữ trên máy này", off: "⚠ Chỉ lưu trên trình duyệt này" };
let cloud = null, syncHide;
function setSync(k) {
  clearTimeout(syncHide); syncEl.dataset.s = k; syncEl.textContent = SYNC_TXT[k];
  if (k === "ok") syncHide = setTimeout(() => { syncEl.textContent = ""; }, 2500);
}
const pend = {}, busy = {};
function push(no) {
  if (!cloud) return;
  clearTimeout(pend[no]);
  pend[no] = setTimeout(() => flush(no), 700);
}
async function flush(no) {
  clearTimeout(pend[no]);
  if (!cloud) return;
  if (busy[no]) { busy[no] = "again"; return; }
  busy[no] = true;
  const s = load(no), n = byNo[no].qs.length;
  const body = { picks: Array.from({ length: n }, (_, i) => s.picks[i] || 0), submitted: !!s.submitted, secs: s.secs || 0, u: s.u || Date.now() };
  try { await cloud.doc("de" + no).set(body); setSync("ok"); }
  catch (e) { setSync(e && e.code === "invalid_argument" ? "off" : "err"); }
  const again = busy[no] === "again"; busy[no] = false;
  if (again) flush(no);
}
function fromCloud(no, r) {
  const picks = {};
  (Array.isArray(r.picks) ? r.picks : []).forEach((v, i) => { if (v >= 1 && v <= 4) picks[i] = v; });
  const s = { picks, submitted: !!r.submitted, t0: null, secs: +r.secs || 0, u: +r.u || 0 };
  try { localStorage.setItem(KEY(no), JSON.stringify(s)); } catch (e) {}
  mem[no] = s;
}
async function initCloud() {
  if (!window.claude || !window.claude.use) return;
  setSync("wait");
  const [user, db] = await Promise.all([claude.use("user"), claude.use("db")]);
  const uid = user ? await user.id() : null;
  if (!db || !uid) { setSync("off"); return; }
  const col = db.collection("data/users/" + uid);
  let snap;
  try { snap = await col.get(); } catch (e) { setSync("err"); return; }
  cloud = col;
  const inCloud = new Set();
  let changed = false;
  snap.docs.forEach(d => {
    const m = d.id.match(/^de(\d+)$/), no = m && +m[1];
    if (!no || !byNo[no]) return;
    inCloud.add(no);
    const r = d.data() || {}, loc = load(no);
    if ((+r.u || 0) > (loc.u || 0)) { fromCloud(no, r); changed = true; }
    else if ((loc.u || 0) > (+r.u || 0)) push(no);
  });
  EXAMS.forEach(e => { if (!inCloud.has(e.no) && (load(e.no).u || Object.keys(load(e.no).picks).length)) push(e.no); });
  setSync("ok");
  if (!changed) return;
  if (!cur) home();
  else if (mem[cur.no] && mem[cur.no] !== st) {
    st = load(cur.no);
    if (!st.submitted) st.t0 = Date.now() - st.secs * 1000;
    drawExam();
  }
}

      <div class="sources">
        <a class="src" href="${S.goc}" target="_blank" rel="noopener"><span class="k">問題</span>Đề gốc (PDF)</a>
        <a class="src" href="${S.chua}" target="_blank" rel="noopener"><span class="k">解説</span>Đề chữa (PDF)</a>
        <a class="src" href="${S.folder}" target="_blank" rel="noopener"><span class="k">Drive</span>Thư mục</a>
      </div>
      ${ex.notice ? `<div class="notice">${ex.notice}</div>` : ""}
    </header>
    <div class="bar">${done
      ? `<div class="info"><span class="score">${right}<small>/${n}</small></span><span>${mmss(st.secs)}</span></div>
         <button class="btn" type="button" id="onlyWrong" aria-pressed="${onlyWrong}">Chỉ câu sai (${wrongIdx.length})</button>
         <button class="btn" type="button" id="openAll">Mở tất cả giải thích</button>
         <button class="btn" type="button" id="retry">Làm lại</button>`
      : `<div class="info"><span>${picked}/${n} câu</span><span id="clock">${mmss(st.secs)}</span></div>
         <button class="btn primary" type="button" id="submit">Nộp bài</button>`}
    </div>
    ${confirming ? `<div class="confirm" role="alert"><p>Còn <b>${n - picked}</b> câu chưa chọn. Câu bỏ trống sẽ tính là sai.</p>
       <button class="btn" type="button" id="cancelSubmit">Làm tiếp</button><button class="btn danger" type="button" id="forceSubmit">Nộp luôn</button></div>` : ""}
    ${done ? `<section class="result"><div class="big"><span class="pen">${right}<small>/${n}</small></span>
        <span>Đúng ${right} · Sai ${n - right} · Thời gian ${mmss(st.secs)}</span></div>
        <div class="jumps">${ex.qs.map((q, i) => `<a href="#q${i + 1}" class="${st.picks[i] === q.a ? "" : "ng"}" data-jump="${i + 1}">${i + 1}</a>`).join("")}</div></section>` : ""}
    <main class="sheet${done ? " done" : ""}${onlyWrong ? " only-wrong" : ""}" id="sheet">${ex.qs.map((q, i) => qHTML(q, i)).join("")}</main>
    ${done ? keyHTML() : ""}
    <footer>Đề gốc và đáp án © DORA Nihongo. Phần giải thích mở rộng là phần bổ sung, không có trong bản chữa gốc.</footer>`;
  tick();
}
const MARK_OK = `<svg class="mark" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="18" transform="rotate(-20 22 22)" stroke-dasharray="108 6"/></svg>`;
const MARK_NG = `<svg class="mark" viewBox="0 0 44 44" aria-hidden="true"><path d="M9 22 L18 33 L37 8"/></svg>`;
/* Stem tokens: （　） = blank filled by the chosen option (split on ／ for two blanks);
   ［　］ / ［★］ = ordering slots, the chosen option goes into the ★ slot. */
function fillStem(q, html, pickNo, full) {
  const parts = pickNo ? q.o[pickNo - 1].split("／") : [];
  let b = 0;
  html = html.replace(/（　）/g, () => {
    const t = parts.length ? esc(parts[Math.min(b++, parts.length - 1)]) : "";
    return full ? `<u>${t}</u>` : `<span class="blank${t ? " filled" : ""}">${t}</span>`;
  });
  let k = 0;
  html = html.replace(/［(　|★)］/g, (m, c) => {
    if (full) { const w = esc(q.o[q.order[k++] - 1]); return c === "★" ? `<u>${w}</u>` : w; }
    const t = c === "★" && pickNo ? esc(q.o[pickNo - 1]) : "";
    return `<span class="slot${c === "★" ? " star" : ""}${t ? " filled" : ""}">${t || (c === "★" ? "★" : "")}</span>`;
  });
  return html;
}
function qHTML(q, i) {
  const done = st.submitted, pick = st.picks[i], ok = pick === q.a;
  const stem = fillStem(q, fmt(esc(q.s)), pick, false);
  const long = q.o.some(o => o.length > 6);
  return `<section class="q${done ? (ok ? " ok" : " ng") : ""}" id="q${i + 1}" data-i="${i}">
    <div><div class="qn">${i + 1}${done ? (ok ? MARK_OK : MARK_NG) : ""}</div></div>
    <div class="qbody">
      <p class="stem">${stem}</p>
      <ul class="opts${long ? " long" : ""}">${q.o.map((o, j) => {
        const n = j + 1, c = ["opt"];
        if (done && n === q.a) c.push("is-ans");
        if (done && n === pick && n !== q.a) c.push("is-wrong");
        return `<li><button type="button" class="${c.join(" ")}" data-n="${n}" aria-pressed="${pick === n}"${done ? " disabled" : ""}><span class="bub">${n}</span><span class="t">${esc(o)}</span></button></li>`;
      }).join("")}</ul>
      ${done && !pick ? `<div class="unanswered">Bỏ trống</div>` : ""}
      ${done ? `<details class="ex"${ok ? "" : " open"}><summary>Giải thích câu ${i + 1}</summary><div class="exb">${exHTML(q)}</div></details>` : ""}
    </div></section>`;
}
function exHTML(q) {
  const a = q.a, p = [];
  p.push(`<div><h4>Đáp án</h4><div class="ansline"><span class="circ">${CIRC[a]}</span><span class="w">${esc(q.o[a - 1])}</span>${q.ar ? `<span class="r">${fmt(q.ar)}</span>` : ""}</div></div>`);
  if (q.order) p.push(`<div><h4>Thứ tự đúng</h4><div class="ansline">${q.order.map(n => `<span class="${n === a ? "circ" : "r"}">${n}</span>`).join('<span class="r">→</span>')}</div></div>`);
  p.push(`<div><h4>Dịch câu</h4><p class="jpline">${fillStem(q, fmt(q.s), a, true)}</p><p class="vi">${q.vi}</p></div>`);
  if (q.key && q.key.length) p.push(`<div><h4>Từ vựng</h4><div class="tbl"><table><thead><tr><th>Từ</th><th>Cách đọc</th><th>Hán Việt</th><th>Nghĩa</th></tr></thead><tbody>${q.key.map(k => `<tr><td class="w">${k.w}</td><td class="r">${k.r}</td><td class="hv">${k.hv || "—"}</td><td>${fmt(k.m)}</td></tr>`).join("")}</tbody></table></div></div>`);
  if (q.x) p.push(`<div><h4>Các phương án còn lại</h4><ul class="others">${[1, 2, 3, 4].filter(n => n !== a && q.x[n]).map(n => `<li><span class="n">${n}</span><div><span class="jp">${esc(q.o[n - 1])}</span> — ${fmt(q.x[n])}</div></li>`).join("")}</ul></div>`);
  if (q.g && q.g.length) p.push(`<div><h4>Ngữ pháp trong câu</h4><div style="display:grid;gap:6px">${q.g.map(g => `<div class="g">${fmt(g)}</div>`).join("")}</div></div>`);
  if (q.n && q.n.length) p.push(`<div><h4>Ghi chú · Mở rộng</h4><ul class="notes">${q.n.map(n => `<li>${fmt(n)}</li>`).join("")}</ul></div>`);
  return p.join("");
}
function keyHTML() {
  const qs = cur.qs, rows = [];
  for (let s = 0; s < qs.length; s += 10) {
    const sl = qs.slice(s, s + 10);
    rows.push(`<tr><th>Câu</th>${sl.map((_, k) => `<th>${s + k + 1}</th>`).join("")}</tr><tr><th>Đ/A</th>${sl.map(q => `<td>${q.a}</td>`).join("")}</tr>`);
  }
  return `<details class="ex key"><summary>Bảng đáp án (解答)</summary><div class="exb"><div class="tbl"><table>${rows.join("")}</table></div></div></details>`;
}
function submit() {
  st.secs = Math.floor((Date.now() - st.t0) / 1000);
  st.submitted = true; confirming = false; clearInterval(timer);
  save(cur.no, st); drawExam(); window.scrollTo({ top: 0 });
}

app.addEventListener("click", e => {
  const t = e.target;
  const opt = t.closest(".opt");
  if (opt && cur && !st.submitted) {
    const qEl = opt.closest(".q"), i = +qEl.dataset.i, n = +opt.dataset.n;
    if (st.picks[i] === n) delete st.picks[i]; else st.picks[i] = n;
    save(cur.no, st);
    qEl.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-pressed", String(+o.dataset.n === st.picks[i])));
    const bl = qEl.querySelector(".blank");
    if (bl || qEl.querySelector(".slot")) qEl.querySelector(".stem").innerHTML = fillStem(cur.qs[i], fmt(esc(cur.qs[i].s)), st.picks[i], false);
    const info = app.querySelector(".bar .info span"); if (info) info.textContent = `${Object.keys(st.picks).length}/${cur.qs.length} câu`;
    return;
  }
  const fb = t.closest("[data-filter]");
  if (fb) { filter = fb.dataset.filter; try { localStorage.setItem("n2-dora-filter", filter); } catch (e) {} home(); return; }
  const jump = t.closest("[data-jump]");
  if (jump) { e.preventDefault(); document.getElementById("q" + jump.dataset.jump).scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  switch (t.closest("button")?.id) {
    case "submit": if (Object.keys(st.picks).length < cur.qs.length) { confirming = true; drawExam(); } else submit(); break;
    case "forceSubmit": submit(); break;
    case "cancelSubmit": confirming = false; drawExam(); break;
    case "retry": st = { picks: {}, submitted: false, t0: Date.now(), secs: 0 }; save(cur.no, st); drawExam(); window.scrollTo({ top: 0 }); break;
    case "onlyWrong": onlyWrong = !onlyWrong; drawExam(); break;
    case "openAll": {
      const all = [...app.querySelectorAll("#sheet details.ex")], open = !all.every(d => d.open);
      all.forEach(d => d.open = open); t.textContent = open ? "Đóng tất cả giải thích" : "Mở tất cả giải thích"; break;
    }
  }
});

function route() {
  clearInterval(timer);
  if (cur && st && !st.submitted) { save(cur.no, st); flush(cur.no); }
  const m = location.hash.match(/^#de(\d+)$/);
  if (m && byNo[+m[1]]) exam(+m[1]); else { cur = null; home(); }
}
window.addEventListener("hashchange", route);
window.addEventListener("pagehide", () => { if (cur && st && !st.submitted) { save(cur.no, st); flush(cur.no); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && cur && st && !st.submitted) { save(cur.no, st); flush(cur.no); } });
route();
initCloud();
</script>
