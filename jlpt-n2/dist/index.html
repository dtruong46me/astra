, {"s": "彼は２位以下を大きく_はなして_ゴールインした。", "o": ["拒して", "距して", "離して", "理して"], "a": 3, "ar": "はなす", "vi": "Anh ấy về đích, bỏ xa người về nhì trở xuống.", "key": [{"w": "離す", "r": "はなす", "hv": "LY", "m": "tách ra, giãn cách; bỏ xa"}], "x": {"1": "拒して: không có. 拒 (CỰ) nghĩa là từ chối (拒否 きょひ, 拒む こばむ).", "2": "距して: không có. 距 (CỰ) chỉ dùng trong 距離 (きょり: cự ly), không làm động từ.", "4": "理して: không có. 理 (LÝ: lý lẽ) không có âm Kun はなす."}, "n": ["はなす có 3 chữ: 話す (nói), 離す (tách xa), 放す (thả ra: 鳥を放す).", "Tự động từ: 離れる はなれる."], "why": "Bỏ xa người về sau → tạo <b>khoảng cách<\/b>. 離す (LY: tách ra, để cách xa) ＝ <b>はなす<\/b>. 〜を大きく離してゴール ＝ về đích với khoảng cách lớn."}, {"s": "ひらがなを漢字に_へんかん_するときはこのキーを押してください。", "o": ["変替", "変改", "変換", "変更"], "a": 3, "ar": "へんかん", "vi": "Khi chuyển hiragana sang kanji, hãy bấm phím này.", "key": [{"w": "変換", "r": "へんかん", "hv": "BIẾN HOÁN", "m": "chuyển đổi (dạng thức, chữ)"}], "x": {"1": "変替: không có từ này. 替 (THẾ) đọc たい/かえる, không đọc かん.", "2": "変改: không có từ này. 改 (CẢI) đọc かい.", "4": "変更 (へんこう: thay đổi kế hoạch, lịch). Có thật nhưng khác âm (こう) và khác nghĩa — không nói “thay đổi chữ hiragana thành kanji”."}, "n": ["換 かん: 交換 こうかん, 換気 かんき. Kun: 換える かえる."], "why": "Chuyển hiragana sang kanji → <b>chuyển đổi<\/b> dạng này sang dạng khác. 変 (BIẾN) ＋ 換 (HOÁN: đổi) ＝ <b>変換<\/b> (へんかん). Phím 変換 trên bàn phím Nhật."}, {"s": "患者の_こきゅう_が戻ってきた。", "o": ["呼処", "呼拠", "呼吸", "呼扱"], "a": 3, "ar": "こきゅう", "vi": "Bệnh nhân đã thở lại được.", "key": [{"w": "呼吸", "r": "こきゅう", "hv": "HÔ HẤP", "m": "hô hấp, hơi thở"}], "x": {"1": "呼処: không có từ này. 処 (XỬ) đọc しょ.", "2": "呼拠: không có từ này. 拠 (CỨ: căn cứ) đọc きょ — gần âm nhưng sai.", "4": "呼扱: không có từ này. 扱 (TRÁP) là 扱う あつかう (xử lý), không đọc きゅう."}, "n": ["吸 = hút vào: 吸う すう, 吸収 きゅうしゅう. 呼 = thở ra, gọi: 呼ぶ."], "why": "Bệnh nhân thở lại được → <b>hô hấp<\/b>. 呼 (HÔ: thở ra) ＋ 吸 (HẤP: hút vào) ＝ <b>呼吸<\/b> (こきゅう)."}, {"s": "私は音楽部に_しょぞく_しています。", "o": ["序続", "所属", "序属", "所続"], "a": 2, "ar": "しょぞく", "vi": "Tôi là thành viên câu lạc bộ âm nhạc.", "key": [{"w": "所属", "r": "しょぞく", "hv": "SỞ THUỘC", "m": "trực thuộc, là thành viên"}], "x": {"1": "序続: không có từ này. 序 (TỰ) đọc じょ, 続 (TỤC) đọc ぞく — đúng âm từng phần nhưng sai chữ.", "3": "序属: không có từ này. 属 đúng nhưng chữ đầu phải là 所 (しょ), không phải 序 (じょ).", "4": "所続: không có từ này. 所 đúng nhưng 続 (tiếp tục) không mang nghĩa “thuộc về”."}, "n": ["属 ぞく: 属する ぞくする, 金属 きんぞく. Xem Đề 2 câu 9 (属して)."], "why": "Là thành viên câu lạc bộ → <b>trực thuộc<\/b>. 所 (SỞ) ＋ 属 (THUỘC) ＝ <b>所属<\/b> (しょぞく). 〜に所属する: thuộc về tổ chức."}, {"s": "あの国ではユーロが_つうか_だよ。", "o": ["運賃", "通貨", "運貨", "通賃"], "a": 2, "ar": "つうか", "vi": "Ở nước đó tiền tệ là đồng Euro đấy.", "key": [{"w": "通貨", "r": "つうか", "hv": "THÔNG HÓA", "m": "tiền tệ"}], "x": {"1": "運賃 (うんちん: cước vận chuyển, tiền vé). Khác âm và khác nghĩa.", "3": "運貨: không có từ này. 運 đọc うん, không phải つう.", "4": "通賃: không có từ này. 通 đúng nhưng 賃 (NHẪM: tiền công, cước) đọc ちん."}, "n": ["貨 か: 貨物 かもつ (hàng hóa). 賃 ちん: 家賃 やちん, 賃金 ちんぎん.", "Đồng âm: 通過 つうか (đi qua)."], "why": "Đồng Euro là <b>tiền tệ<\/b> của nước đó. 通 (THÔNG: lưu thông) ＋ 貨 (HÓA: tiền, hàng) ＝ <b>通貨<\/b> (つうか)."}, {"s": "{感染者|かんせんしゃ}は２万人に_およんで_いる。", "o": ["満んで", "総んで", "及んで", "至んで"], "a": 3, "ar": "およぶ", "vi": "Số người nhiễm bệnh đã lên tới 20.000 người.", "key": [{"w": "及ぶ", "r": "およぶ", "hv": "CẬP", "m": "lên tới, đạt tới, lan tới"}], "x": {"1": "満んで: không có. 満 đọc みちる / みたす (đầy), không có dạng 満ぶ.", "2": "総んで: không có. 総 (TỔNG) không có âm Kun およぶ.", "4": "至んで: không có. 至 đọc 至る (いたる: đạt tới) — nghĩa gần nhưng chia là 至って, không phải およんで."}, "g": ["<b class=\"jp\">〜に及ぶ<\/b>: 被害は全国に及んだ. <b class=\"jp\">〜には及ばない<\/b>: không cần phải."], "n": ["及 On きゅう: 普及 ふきゅう, 追及 ついきゅう."], "why": "Số người nhiễm lên tới 2 vạn → <b>đạt tới, lan đến<\/b> một mức. Động từ <b>及ぶ<\/b> (CẬP) ＝ およぶ: 〜に及ぶ (lên tới, lan tới)."}, {"s": "彼はバラの_はなたば_を抱えてやって来た。", "o": ["花続", "花属", "花族", "花束"], "a": 4, "ar": "はなたば", "vi": "Anh ấy ôm bó hoa hồng bước đến.", "key": [{"w": "花束", "r": "はなたば", "hv": "HOA THÚC", "m": "bó hoa"}], "x": {"1": "花続: không có từ này. 続 (tiếp tục) không có nghĩa “bó”.", "2": "花属: không có từ này. 属 (thuộc) không có nghĩa “bó”.", "3": "花族: không có từ này. 族 (TỘC: gia tộc) không có nghĩa “bó”."}, "n": ["束 たば: bó; On そく: 約束 やくそく, 結束. 束ねる たばねる: bó lại."], "why": "Ôm <b>bó hoa<\/b> hồng. 花 (HOA) ＋ 束 (THÚC: bó) ＝ <b>花束<\/b> (はなたば). たば là âm Kun của 束 (札束 さつたば: xấp tiền); âm On là そく (約束 やくそく)."}, {"s": "トマトの葉が_ちぢれて_枯れてしまった。", "o": ["削れて", "縮れて", "減れて", "略れて"], "a": 2, "ar": "ちぢれる", "vi": "Lá cà chua bị quăn lại rồi héo mất.", "key": [{"w": "縮れる", "r": "ちぢれる", "hv": "SÚC", "m": "quăn, xoăn, nhăn nhúm"}], "x": {"1": "削れる (けずれる: bị gọt, bị bào mòn). Khác âm, khác nghĩa.", "3": "減れて: không có. 減 đọc 減る (へる: giảm), không đọc ちぢれる.", "4": "略れて: không có. 略 (LƯỢC) dùng trong 略す (りゃくす: viết tắt)."}, "n": ["縮 nhóm: 縮む ちぢむ (co lại), 縮める, 縮まる, 縮れる. On しゅく: 短縮 たんしゅく."], "why": "Lá cà chua <b>quăn lại<\/b> rồi héo. 縮れる (SÚC) ＝ ちぢれる: quăn, co rúm (縮れた髪: tóc xoăn)."}, {"s": "とんだハプニングにみんな_はら_を抱えて笑った。", "o": ["腹", "腰", "背", "肩"], "a": 1, "ar": "はら", "vi": "Trước sự cố dở khóc dở cười đó, ai nấy đều ôm bụng cười.", "key": [{"w": "腹", "r": "はら", "hv": "PHÚC", "m": "bụng"}], "x": {"2": "腰 (こし: eo, hông). Khác âm; 腰を抱える không phải quán ngữ cười.", "3": "背 (せ: lưng, chiều cao). Khác âm.", "4": "肩 (かた: vai). Khác âm; quán ngữ là 肩を落とす (thất vọng), 肩を持つ (bênh vực)."}, "g": ["<b class=\"jp\">腹を抱えて笑う<\/b>: cười ôm bụng."], "n": ["Xem Đề 2 câu 17 (腹を立てる). とんだ: tai hại, không ngờ."], "why": "Quán ngữ <b>腹を抱えて笑う<\/b>: ôm bụng cười (cười lăn lộn). はら viết là <b>腹<\/b> (PHÚC: bụng)."}, {"s": "彼女の声は_そうおん_でよく聞こえなかった。", "o": ["焦音", "驚音", "騒音", "怖音"], "a": 3, "ar": "そうおん", "vi": "Giọng cô ấy bị tiếng ồn át mất nên tôi không nghe rõ.", "key": [{"w": "騒音", "r": "そうおん", "hv": "TAO ÂM", "m": "tiếng ồn"}], "x": {"1": "焦音: không có. 焦 (TIÊU: cháy, sốt ruột — 焦る あせる) đọc しょう.", "2": "驚音: không có. 驚 (KINH: ngạc nhiên — 驚く) đọc きょう.", "4": "怖音: không có. 怖 (BỐ: sợ — 怖い) đọc ふ."}, "n": ["騒 = ồn: 騒ぐ さわぐ, 騒がしい さわがしい, 物騒 ぶっそう."], "why": "Giọng bị át nên nghe không rõ → <b>tiếng ồn<\/b>. 騒 (TAO: ồn ào — 騒ぐ さわぐ) ＋ 音 (ÂM) ＝ <b>騒音<\/b> (そうおん)."}, {"s": "このテレビは_えいぞう_が鮮明だ。", "o": ["映象", "影像", "影象", "映像"], "a": 4, "ar": "えいぞう", "vi": "Chiếc tivi này hình ảnh rất sắc nét.", "key": [{"w": "映像", "r": "えいぞう", "hv": "ÁNH TƯỢNG", "m": "hình ảnh (phim, màn hình)"}, {"w": "鮮明", "r": "せんめい", "hv": "TIÊN MINH", "m": "rõ nét"}], "x": {"1": "映象: không có. 象 đọc しょう (印象) hoặc ぞう chỉ khi là con voi; chữ “hình ảnh” là 像.", "2": "影像: không dùng (影 えい/かげ: cái bóng). Chữ “chiếu hình” là 映.", "3": "影象: không có. Sai cả hai chữ."}, "n": ["像 ぞう: 想像, 画像, 銅像. 映 えい: 映画, 反映."], "why": "Tivi có <b>hình ảnh<\/b> sắc nét. 映 (ÁNH: chiếu) ＋ 像 (TƯỢNG: hình ảnh) ＝ <b>映像<\/b> (えいぞう)."}, {"s": "彼には味方も多いが_てき_も多い。", "o": ["敵", "適", "争", "逆"], "a": 1, "ar": "てき", "vi": "Anh ấy có nhiều đồng minh nhưng cũng nhiều kẻ thù.", "key": [{"w": "敵", "r": "てき", "hv": "ĐỊCH", "m": "kẻ thù, đối thủ"}, {"w": "味方", "r": "みかた", "hv": "VỊ PHƯƠNG", "m": "phe mình, đồng minh"}], "x": {"2": "適 (THÍCH: thích hợp) cũng đọc てき nhưng không đứng một mình làm danh từ, và nghĩa không đối lập với 味方 — bẫy đồng âm.", "3": "争 (TRANH: tranh giành) đọc そう / あらそう, không đọc てき.", "4": "逆 (NGHỊCH: ngược) đọc ぎゃく, không đọc てき."}, "n": ["Cùng bộ 攵/啇: 敵 (địch), 適 (thích), 滴 (giọt: 水滴 すいてき)."], "why": "Đối lập với 味方 (đồng minh) → <b>kẻ thù<\/b>. てき viết là <b>敵<\/b> (ĐỊCH). Cấu trúc 〜も多いが〜も多い đối xứng rõ."}], "sum": [{"h": "Cách làm dạng 表記 (問題2 · chọn chữ Hán đúng)", "li": ["Bước 1: đọc cả câu để hiểu <b>nghĩa<\/b> — đề hay cài từ đồng âm (避難/非難, 敵/適).", "Bước 2: tách từ thành từng chữ và hỏi “chữ này nghĩa gì?”. Ví dụ ごかい: ご ＝ sai (誤), かい ＝ hiểu (解).", "Bước 3: loại chữ có <b>âm đọc sai<\/b> trước (家 không đọc たく, 所 không đọc じょ) — thường loại được 2 phương án ngay.", "Bước 4: với động từ, kiểm tra okurigana: 縮れる, 及ぶ, 超える — chữ nào không có dạng đó là sai."]}, {"h": "Cặp đồng âm khác nghĩa cần nhớ", "tbl": {"head": ["Âm", "Chữ", "Nghĩa"], "rows": [["ひなん", "避難 / 非難", "lánh nạn / chỉ trích"], ["てき", "敵 / 適 / 的", "kẻ thù / thích hợp / mục tiêu, 〜tính"], ["こえる", "超える / 越える", "vượt mức, con số / vượt địa điểm (山を越える)"], ["おさまる", "収まる / 治まる / 納まる", "êm xuôi, gọn / yên (bệnh, loạn) / nạp vào"], ["はなす", "離す / 放す / 話す", "tách xa / thả ra / nói"], ["せいきゅう", "請求 / 性急", "yêu cầu thanh toán / nóng vội"], ["かいほう", "解放 / 開放 / 介抱", "giải phóng / mở cửa / chăm sóc"]]}}, {"h": "Bộ phận chữ giúp đoán nghĩa", "tbl": {"head": ["Bộ", "Nghĩa gợi ý", "Ví dụ"], "rows": [["扌 (thủ: tay)", "hành động bằng tay", "換 (đổi), 拒 (từ chối), 扱 (xử lý)"], ["口 (khẩu: miệng)", "miệng, hơi thở", "呼 (thở ra), 吸 (hút vào)"], ["貝 (bối: vỏ sò, tiền)", "tiền bạc", "貨 (tiền), 賃 (cước), 財 (tài sản)"], ["言 (ngôn: lời)", "lời nói", "請 (xin), 誤 (sai), 誘 (rủ), 語 (ngữ)"], ["⻌ (sước: đi)", "di chuyển", "避 (tránh), 逆 (ngược), 通 (thông)"], ["糸 (mịch: sợi)", "sợi, nối", "縮 (co), 続 (nối tiếp)"], ["馬 (mã: ngựa)", "náo động", "騒 (ồn), 驚 (kinh ngạc)"]]}}, {"h": "Từ vựng mở rộng theo nhóm", "li": ["<b>帰〜<\/b>: 帰宅 きたく (về nhà), 帰省 きせい (về quê), 帰国 きこく (về nước), 帰社 きしゃ (về công ty), 帰還 きかん (trở về).", "<b>〜助 / 援〜<\/b>: 救助 (cứu hộ), 援助 (viện trợ), 補助 ほじょ (trợ cấp), 助言 じょげん (lời khuyên), 支援 (hỗ trợ).", "<b>変〜<\/b>: 変換 (chuyển đổi), 変更 (thay đổi), 変化 へんか (biến hóa), 変動 へんどう (biến động).", "<b>〜像<\/b>: 映像 (hình ảnh), 画像 がぞう (ảnh), 想像 そうぞう (tưởng tượng), 銅像 どうぞう (tượng đồng).", "<b>Quán ngữ cơ thể<\/b>: 腹を抱える (ôm bụng cười), 腰が低い (khiêm tốn), 肩を持つ (bênh vực), 背を向ける (quay lưng)."]}], "source": {"folder": "https://drive.google.com/drive/folders/1D_x36MSL9e2qhxyH9XT-BB_bk0wt-A9m", "goc": "https://drive.google.com/file/d/1IEiPLFAJs6-0WT1eFX6qeSNMM_uhW1RX/view", "chua": "https://drive.google.com/file/d/18mmhXMGtKRrVFSNsjhAJz39C_Leg3sRl/view"}, "series": "DORA Nihongo · Đề 4 · Kanji N5–N2 trúng tủ"}, {"no": 5, "folderLabel": "Từ vựng", "cat": "Từ vựng", "file": "ĐỀ 8 - TỪ VỰNG N2", "title": "Đề 5 · Từ vựng N2", "jp": "言い換え類義", "mondai": "<b>問題5<\/b> ＿＿の言葉に意味が最も近いものを、1・2・3・4から一つ選びなさい。 Chọn từ/cụm từ gần nghĩa nhất với phần gạch chân.", "qs": [{"s": "そのことを彼から_じかに_聞いた。", "o": ["すべて", "確実", "直接", "あとで"], "a": 3, "ar": "直接 = ちょくせつ", "vi": "Tôi đã nghe chuyện đó trực tiếp từ anh ấy.", "key": [{"w": "直に", "r": "じかに", "hv": "TRỰC", "m": "trực tiếp, không qua trung gian"}, {"w": "直接", "r": "ちょくせつ", "hv": "TRỰC TIẾP", "m": "trực tiếp"}], "x": {"1": "すべて (tất cả): nói về lượng thông tin, không phải cách nghe. Thay vào thành “nghe tất cả từ anh ấy” — đổi nghĩa.", "2": "確実 (chắc chắn): là tính từ な, 確実に聞いた nghĩa là chắc chắn đã nghe — không phải “nghe trực tiếp”.", "4": "あとで (sau đó): chỉ thời điểm, không chỉ cách thức. Đổi nghĩa câu."}, "n": ["直 đọc じか: 直に, 直火 じかび (lửa trực tiếp). Xem Đề 1 câu 19 (các âm của 直)."], "why": "<b>じかに<\/b> (直に) ＝ trực tiếp, không qua trung gian. 彼から直に聞いた ＝ nghe tận miệng anh ấy. Thay bằng <b>直接<\/b> (ちょくせつ) nghĩa giữ nguyên hoàn toàn — cùng chữ 直."}, {"s": "今の仕事は_ハードだ_。", "o": ["大変だ", "楽しい", "簡単だ", "新しい"], "a": 1, "ar": "たいへんだ", "vi": "Công việc hiện tại rất vất vả.", "key": [{"w": "ハード", "r": "ハード", "hv": "—", "m": "(hard) nặng nhọc, vất vả"}, {"w": "大変", "r": "たいへん", "hv": "ĐẠI BIẾN", "m": "vất vả, gay go"}], "x": {"2": "楽しい (vui): trái sắc thái — công việc hard thì không “vui” theo nghĩa của từ.", "3": "簡単だ (đơn giản): trái nghĩa với ハード.", "4": "新しい (mới): không liên quan đến độ vất vả."}, "n": ["Trái nghĩa của ハード: 楽 らく. ハードスケジュール: lịch dày đặc."], "why": "<b>ハード<\/b> (hard) khi nói về công việc ＝ nặng nhọc, vất vả. Từ tiếng Nhật tương ứng là <b>大変だ<\/b>."}, {"s": "高度な_テクニック_を要する作業だ。", "o": ["訓練", "工夫", "知識", "技術"], "a": 4, "ar": "ぎじゅつ", "vi": "Đây là công việc đòi hỏi kỹ thuật cao.", "key": [{"w": "テクニック", "r": "テクニック", "hv": "—", "m": "(technique) kỹ thuật, kỹ xảo"}, {"w": "技術", "r": "ぎじゅつ", "hv": "KỸ THUẬT", "m": "kỹ thuật"}], "x": {"1": "訓練 (huấn luyện): là quá trình tập luyện để có kỹ thuật, không phải bản thân kỹ thuật.", "2": "工夫 (tìm tòi, nghĩ cách làm): là sự sáng tạo cách làm, không đồng nghĩa với kỹ thuật chuyên môn.", "3": "知識 (kiến thức): là hiểu biết lý thuyết; テクニック là kỹ năng thực hành."}, "g": ["<b class=\"jp\">〜を要する<\/b> (ようする): cần, đòi hỏi (văn viết)."], "n": ["高度 こうど: trình độ cao."], "why": "<b>テクニック<\/b> (technique) ＝ kỹ thuật, kỹ năng làm việc. Từ Hán tương ứng là <b>技術<\/b> (ぎじゅつ). 高度な技術を要する ＝ đòi hỏi kỹ thuật cao."}, {"s": "私は_当分_は忙しいと思う。", "o": ["少し", "今回", "全部", "しばらく"], "a": 4, "ar": "しばらく", "vi": "Tôi nghĩ trong một thời gian tới mình sẽ bận.", "key": [{"w": "当分", "r": "とうぶん", "hv": "ĐƯƠNG PHÂN", "m": "trong thời gian tới, tạm thời"}], "x": {"1": "少し (một chút): chỉ lượng/mức độ, “hơi bận” khác với “bận trong một thời gian”.", "2": "今回 (lần này): chỉ một lần cụ thể, không chỉ khoảng thời gian kéo dài.", "3": "全部 (tất cả): chỉ lượng, không chỉ thời gian."}, "n": ["Đồng nghĩa: しばらく, 当面 とうめん. 当分の間 (trong một thời gian)."], "why": "<b>当分<\/b> (とうぶん) ＝ trong một thời gian (từ giờ trở đi), không biết chính xác bao lâu. Đồng nghĩa: <b>しばらく<\/b>. 当分は忙しい ＝ một thời gian tới sẽ bận."}, {"s": "あの子は_臆病だ_。", "o": ["よく病気をする", "何でも忘れる", "何でも怖がる", "よく泣く"], "a": 3, "ar": "なんでもこわがる", "vi": "Đứa bé đó nhát gan.", "key": [{"w": "臆病", "r": "おくびょう", "hv": "ỨC BỆNH", "m": "nhát gan, nhút nhát"}], "x": {"1": "よく病気をする (hay ốm): bẫy vì chữ 病 — nhưng 臆病 không liên quan đến bệnh tật.", "2": "何でも忘れる (hay quên): là 忘れっぽい, khác nghĩa.", "4": "よく泣く (hay khóc): là 泣き虫, khác nghĩa; người nhát gan không nhất thiết hay khóc."}, "n": ["臆病者 おくびょうもの: kẻ nhát gan. Trái nghĩa: 大胆 だいたん (táo bạo), 勇敢 ゆうかん."], "why": "<b>臆病<\/b> (おくびょう) ＝ nhát gan, cái gì cũng sợ. Giải thích bằng cụm <b>何でも怖がる<\/b> (sợ mọi thứ) là đúng nghĩa."}, {"s": "チンパンジーは_利口な_動物だ。", "o": ["かわいい", "元気な", "かっこいい", "頭がいい"], "a": 4, "ar": "あたまがいい", "vi": "Tinh tinh là loài động vật thông minh.", "key": [{"w": "利口", "r": "りこう", "hv": "LỢI KHẨU", "m": "thông minh, khôn"}], "x": {"1": "かわいい (đáng yêu): nói về vẻ ngoài, không phải trí tuệ.", "2": "元気な (khỏe khoắn, hoạt bát): nói về sức khỏe, tinh thần.", "3": "かっこいい (ngầu, bảnh): nói về vẻ ngoài."}, "n": ["Đồng nghĩa: 賢い かしこい. Trái nghĩa: 馬鹿 ばか."], "why": "<b>利口<\/b> (りこう) ＝ thông minh, lanh lợi. Đồng nghĩa: <b>頭がいい<\/b>, 賢い."}, {"s": "早く_引き返した_方がいいよ。", "o": ["答えた", "払った", "直した", "戻った"], "a": 4, "ar": "もどった", "vi": "Nên quay trở lại sớm thì hơn.", "key": [{"w": "引き返す", "r": "ひきかえす", "hv": "DẪN PHẢN", "m": "quay lại (giữa đường)"}], "x": {"1": "答える (trả lời): bẫy vì 返 trong 返事 (trả lời), nhưng 引き返す là di chuyển quay lại.", "2": "払う (trả tiền): bẫy vì 返す cũng có nghĩa trả lại — nhưng 引き返す không liên quan tiền.", "3": "直す (sửa): khác nghĩa hoàn toàn."}, "g": ["<b class=\"jp\">Vた方がいい<\/b>: nên làm."], "n": ["Xem Đề 1 câu 7 (戻す)."], "why": "<b>引き返す<\/b> (ひきかえす) ＝ quay lại theo đường cũ, quay đầu. Đồng nghĩa: <b>戻る<\/b>. 早く引き返した方がいい ＝ nên quay lại sớm."}, {"s": "あの選手はすばらしい_人柄_で有名だ。", "o": ["格好", "性格", "気分", "体調"], "a": 2, "ar": "せいかく", "vi": "Vận động viên đó nổi tiếng nhờ nhân cách tuyệt vời.", "key": [{"w": "人柄", "r": "ひとがら", "hv": "NHÂN BÍNH", "m": "nhân cách, tính tình"}, {"w": "性格", "r": "せいかく", "hv": "TÍNH CÁCH", "m": "tính cách"}], "x": {"1": "格好 (かっこう: dáng vẻ bề ngoài): 人柄 nói về bên trong, không phải bề ngoài.", "3": "気分 (tâm trạng): tạm thời, thay đổi theo lúc; 人柄 là tính cách lâu dài.", "4": "体調 (thể trạng): nói về sức khỏe cơ thể."}, "n": ["柄 がら: hoa văn; tính chất (家柄, 土地柄)."], "why": "<b>人柄<\/b> (ひとがら) ＝ nhân cách, tính cách con người (thường khen). Gần nhất là <b>性格<\/b> (せいかく: tính cách)."}, {"s": "彼の態度に_むかついた_。", "o": ["驚いた", "困った", "怖がった", "怒った"], "a": 4, "ar": "おこった", "vi": "Tôi bực mình với thái độ của anh ta.", "key": [{"w": "むかつく", "r": "むかつく", "hv": "—", "m": "bực mình, phát cáu; buồn nôn"}], "x": {"1": "驚く (ngạc nhiên): phản ứng bất ngờ, không mang cảm xúc tức giận.", "2": "困る (khó xử, bối rối): không phải giận.", "3": "怖がる (sợ): cảm xúc khác hẳn tức giận."}, "n": ["Đồng nghĩa: 腹が立つ, 頭にくる, いらいらする."], "why": "<b>むかつく<\/b> ＝ bực mình, tức tối (khẩu ngữ). Đồng nghĩa: <b>怒る<\/b>, 腹が立つ. 態度にむかついた ＝ bực vì thái độ."}, {"s": "彼女はその知らせを聞いてとても_動揺した_。", "o": ["不満になった", "面白いと思った", "うれしくなった", "不安になった"], "a": 4, "ar": "ふあんになった", "vi": "Nghe tin đó cô ấy rất hoang mang.", "key": [{"w": "動揺", "r": "どうよう", "hv": "ĐỘNG DAO", "m": "dao động, hoang mang"}], "x": {"1": "不満 (bất mãn): là không hài lòng, không phải hoang mang.", "2": "面白いと思う (thấy thú vị): cảm xúc tích cực, ngược với 動揺.", "3": "うれしい (vui): cảm xúc tích cực, ngược với 動揺."}, "n": ["動揺を隠せない: không giấu được sự bối rối."], "why": "<b>動揺する<\/b> (どうよう) ＝ dao động, hoang mang, mất bình tĩnh. Gần nhất là <b>不安になった<\/b> (trở nên bất an)."}, {"s": "彼は_たびたび_その山に登った。", "o": ["偶然", "何度も", "必ず", "ようやく"], "a": 2, "ar": "なんども", "vi": "Anh ấy nhiều lần leo ngọn núi đó.", "key": [{"w": "度々", "r": "たびたび", "hv": "ĐỘ ĐỘ", "m": "nhiều lần, thường xuyên"}], "x": {"1": "偶然 (tình cờ): chỉ sự ngẫu nhiên, không chỉ số lần.", "3": "必ず (nhất định, luôn luôn): chỉ sự chắc chắn, không phải tần suất nhiều lần.", "4": "ようやく (cuối cùng thì): chỉ kết quả sau thời gian chờ đợi, ngược ý lặp lại."}, "n": ["Đồng nghĩa: しばしば, よく."], "why": "<b>たびたび<\/b> (度々) ＝ nhiều lần, thường xuyên. Đồng nghĩa: <b>何度も<\/b>, しばしば."}, {"s": "彼女は町の名所を_ガイドして_います。", "o": ["宣伝して", "案内して", "記録して", "調査して"], "a": 2, "ar": "あんないして", "vi": "Cô ấy đang hướng dẫn tham quan các danh thắng của thị trấn.", "key": [{"w": "案内", "r": "あんない", "hv": "ÁN NỘI", "m": "hướng dẫn, dẫn đường"}], "x": {"1": "宣伝する (quảng cáo): giới thiệu để bán, không đi cùng dẫn khách.", "3": "記録する (ghi chép): khác nghĩa.", "4": "調査する (điều tra, khảo sát): khác nghĩa."}, "n": ["名所 めいしょ: danh lam thắng cảnh."], "why": "<b>ガイドする<\/b> (guide) ＝ dẫn đường, hướng dẫn tham quan. Từ tương ứng: <b>案内する<\/b> (あんない). 名所を案内する là collocation chuẩn."}, {"s": "バットの中心にボールを_当てた_。", "o": ["ぶつけた", "落とした", "隠した", "詰めた"], "a": 1, "ar": "ぶつける", "vi": "Tôi đánh bóng trúng giữa cây gậy.", "key": [{"w": "当てる", "r": "あてる", "hv": "ĐƯƠNG", "m": "làm trúng, chạm trúng"}], "x": {"2": "落とす (đánh rơi): không có ý chạm trúng.", "3": "隠す (giấu): khác nghĩa.", "4": "詰める (nhồi, lấp đầy): khác nghĩa."}, "n": ["当てる còn: áp vào (Đề 1 câu 6), đoán trúng (答えを当てる)."], "why": "<b>当てる<\/b> ở đây ＝ làm cho chạm trúng (bóng trúng tâm gậy). Đồng nghĩa: <b>ぶつける<\/b> (va, đập vào)."}, {"s": "彼は朝９時に仕事に_とりかかった_。", "o": ["仕事を頼んだ", "仕事を始めた", "仕事を探した", "仕事を教えた"], "a": 2, "ar": "しごとをはじめた", "vi": "Anh ấy bắt tay vào việc lúc 9 giờ sáng.", "key": [{"w": "取りかかる", "r": "とりかかる", "hv": "THỦ", "m": "bắt tay vào (làm)"}], "x": {"1": "仕事を頼む (nhờ việc): giao việc cho người khác, không phải tự bắt đầu.", "3": "仕事を探す (tìm việc): khác nghĩa.", "4": "仕事を教える (dạy việc): khác nghĩa."}, "n": ["Đồng nghĩa: 着手する ちゃくしゅする."], "why": "<b>とりかかる<\/b> (取り掛かる) ＝ bắt tay vào làm. 仕事にとりかかる ＝ <b>仕事を始める<\/b>."}, {"s": "_愉快な_友人がいる。", "o": ["かわいい", "面白い", "親切な", "おしゃれな"], "a": 2, "ar": "おもしろい", "vi": "Tôi có một người bạn vui tính.", "key": [{"w": "愉快", "r": "ゆかい", "hv": "DU KHOÁI", "m": "vui vẻ, thú vị"}], "x": {"1": "かわいい (đáng yêu): nói vẻ ngoài.", "3": "親切な (tốt bụng): nói lòng tốt, không phải sự vui tính.", "4": "おしゃれな (sành điệu): nói cách ăn mặc."}, "n": ["Trái nghĩa: 不愉快 ふゆかい (khó chịu)."], "why": "<b>愉快<\/b> (ゆかい) ＝ vui vẻ, thú vị, khiến người khác cười. Gần nhất: <b>面白い<\/b>."}, {"s": "一生懸命やったのに合格できなくて_失望した_。", "o": ["がっかりした", "かっとした", "ぞっとした", "びっくりした"], "a": 1, "ar": "がっかりした", "vi": "Đã cố gắng hết sức mà vẫn không đỗ nên tôi rất thất vọng.", "key": [{"w": "失望", "r": "しつぼう", "hv": "THẤT VỌNG", "m": "thất vọng"}], "x": {"2": "かっとする (nổi nóng bất chợt): là giận, không phải thất vọng.", "3": "ぞっとする (rùng mình sợ): cảm giác sợ hãi.", "4": "びっくりする (giật mình): cảm giác bất ngờ."}, "n": ["Đồng nghĩa: がっかり, 落胆 らくたん."], "why": "<b>失望する<\/b> (しつぼう) ＝ thất vọng. Từ láy tương ứng: <b>がっかりする<\/b>. Ngữ cảnh cố gắng mà không đỗ → thất vọng."}, {"s": "レモンを入れると_一層_紅茶の風味が増します。", "o": ["もっと", "できるだけ", "少し", "すぐに"], "a": 1, "ar": "もっと", "vi": "Cho chanh vào thì hương vị hồng trà càng đậm hơn.", "key": [{"w": "一層", "r": "いっそう", "hv": "NHẤT TẦNG", "m": "hơn nữa, càng thêm"}], "x": {"2": "できるだけ (cố hết mức có thể): chỉ nỗ lực, không chỉ mức độ tăng thêm.", "3": "少し (một chút): ngược sắc thái — 一層 nhấn mạnh tăng hơn.", "4": "すぐに (ngay): chỉ thời gian, không chỉ mức độ."}, "n": ["より一層: càng hơn nữa. 風味 ふうみ: hương vị."], "why": "<b>一層<\/b> (いっそう) ＝ càng thêm, hơn nữa. Đồng nghĩa: <b>もっと<\/b>, より. 一層風味が増す ＝ hương vị càng đậm hơn."}, {"s": "キャベツの生産が_過剰_である。", "o": ["早すぎる", "少なすぎる", "多すぎる", "遅すぎる"], "a": 3, "ar": "おおすぎる", "vi": "Sản lượng bắp cải đang dư thừa.", "key": [{"w": "過剰", "r": "かじょう", "hv": "QUÁ THẶNG", "m": "dư thừa, quá mức"}], "x": {"1": "早すぎる (quá sớm): 過 có nghĩa “quá” nhưng 剰 là “thừa” về lượng, không phải thời gian.", "2": "少なすぎる (quá ít): trái nghĩa — đó là 不足.", "4": "遅すぎる (quá muộn): nói thời gian, không nói lượng."}, "n": ["Trái nghĩa: 不足 ふそく. 過剰反応: phản ứng thái quá."], "why": "<b>過剰<\/b> (かじょう) ＝ thừa, vượt quá mức cần. 生産が過剰 ＝ sản xuất <b>quá nhiều<\/b> → 多すぎる."}, {"s": "この辺も_物騒に_なってきた。", "o": ["さびしくなってきた", "きれいじゃなくなってきた", "安全じゃなくなってきた", "うるさくなってきた"], "a": 3, "ar": "あんぜんじゃなくなってきた", "vi": "Khu này dạo này cũng trở nên mất an ninh.", "key": [{"w": "物騒", "r": "ぶっそう", "hv": "VẬT TAO", "m": "nguy hiểm, không an toàn"}], "x": {"1": "さびしい (vắng vẻ, buồn): vắng không có nghĩa là nguy hiểm.", "2": "きれいじゃない (không sạch): khác nghĩa.", "4": "うるさい (ồn ào): bẫy vì chữ 騒 (ồn) trong 物騒, nhưng 物騒 nói về an ninh chứ không phải tiếng ồn."}, "g": ["<b class=\"jp\">〜になってきた<\/b>: dần trở nên."], "n": ["Xem Đề 4 câu 18 (騒音)."], "why": "<b>物騒<\/b> (ぶっそう) ＝ bất an, nguy hiểm, mất trật tự (trộm cắp, tội phạm). Giải thích: <b>安全じゃなくなってきた<\/b> (không còn an toàn)."}, {"s": "私は彼が大変頭のいい生徒だったと_記憶している_。", "o": ["語って", "覚えて", "心配して", "応援して"], "a": 2, "ar": "おぼえている", "vi": "Tôi nhớ rằng cậu ấy từng là một học sinh rất thông minh.", "key": [{"w": "記憶", "r": "きおく", "hv": "KÝ ỨC", "m": "trí nhớ, ghi nhớ"}], "x": {"1": "語る (kể): là nói ra cho người khác, không phải ghi nhớ.", "3": "心配する (lo lắng): khác nghĩa.", "4": "応援する (cổ vũ): khác nghĩa."}, "n": ["記憶力 (trí nhớ), 記憶に残る (đọng lại trong ký ức)."], "why": "<b>記憶している<\/b> ＝ nhớ, còn giữ trong trí nhớ. Đồng nghĩa: <b>覚えている<\/b>."}], "sum": [{"h": "Cách làm dạng 言い換え類義 (問題5 · tìm từ gần nghĩa)", "li": ["Chỉ cần hiểu <b>nghĩa của từ gạch chân<\/b> — không cần dịch cả câu. Sau đó thay từng phương án vào câu, phương án giữ nguyên nghĩa là đáp án.", "Coi chừng bẫy <b>chữ Hán gây hiểu lầm<\/b>: 臆<b>病<\/b> ≠ bệnh, 物<b>騒<\/b> ≠ ồn, 引き<b>返<\/b>す ≠ trả lời / trả tiền, 過<b>剰<\/b> ≠ quá sớm.", "Từ ngoại lai → tìm từ Hán tương ứng: ハード ＝ 大変, テクニック ＝ 技術, ガイド ＝ 案内.", "Phó từ thường có cặp đồng nghĩa cố định: 当分 ＝ しばらく, たびたび ＝ 何度も, 一層 ＝ もっと, じかに ＝ 直接."]}, {"h": "Bảng cặp đồng nghĩa trong đề", "tbl": {"head": ["Từ trong đề", "＝", "Nghĩa"], "rows": [["じかに", "直接", "trực tiếp"], ["当分", "しばらく", "một thời gian"], ["臆病", "何でも怖がる", "nhát gan"], ["利口", "頭がいい / 賢い", "thông minh"], ["引き返す", "戻る", "quay lại"], ["人柄", "性格", "nhân cách"], ["むかつく", "怒る / 腹が立つ", "bực tức"], ["動揺する", "不安になる", "hoang mang"], ["たびたび", "何度も / しばしば", "nhiều lần"], ["とりかかる", "始める / 着手する", "bắt tay vào"], ["愉快", "面白い", "vui vẻ"], ["失望する", "がっかりする", "thất vọng"], ["一層", "もっと / より", "càng hơn"], ["過剰", "多すぎる", "dư thừa"], ["物騒", "安全じゃない", "mất an ninh"], ["記憶する", "覚える", "ghi nhớ"]]}}, {"h": "Từ láy cảm xúc nên học cùng nhóm", "tbl": {"head": ["Từ láy", "Cảm xúc", "Từ Hán gần nghĩa"], "rows": [["がっかり", "thất vọng", "失望, 落胆"], ["かっと / むっと", "nổi nóng / phật ý", "激怒, 立腹"], ["ぞっと", "rùng mình sợ", "恐怖"], ["びっくり / どきっと", "giật mình", "驚く"], ["いらいら / むかむか", "bực bội", "腹が立つ"], ["はらはら / ひやひや", "lo thót tim", "心配, 不安"], ["わくわく", "háo hức", "期待"], ["ほっと", "nhẹ nhõm", "安心"]]}}, {"h": "Trái nghĩa và từ cùng chủ đề", "li": ["臆病 ↔ 大胆 だいたん / 勇敢 ゆうかん; 利口 ↔ 馬鹿; 愉快 ↔ 不愉快; 過剰 ↔ 不足; 物騒 ↔ 平和 / 安全.", "<b>Tần suất<\/b>: いつも > よく / しょっちゅう > たびたび / しばしば > 時々 > たまに > めったに〜ない > 全然〜ない.", "<b>Thời gian tới<\/b>: 当分 / しばらく / 当面 (một thời gian) — 今後 (từ nay về sau) — 近いうちに (sắp tới).", "<b>Tính cách<\/b>: 人柄 (nhân cách), 性格 (tính cách), 性質 せいしつ (bản chất), 気性 きしょう (tính khí), 素直 すなお (thật thà, ngoan)."]}], "source": {"folder": "https://drive.google.com/drive/folders/19tlJE8c5wUgE9MHRJWmBhW3W1hBl5YrO", "goc": "https://drive.google.com/file/d/1O6QI6HqCk1YCPz_eKQab3nfQM7UU3t5P/view", "chua": "https://drive.google.com/file/d/1fNe2Y1bDfF4DsGCAhqMJJDcVKySX-a1Y/view"}, "series": "DORA Nihongo · Đề 5 · Từ vựng N5–N2 trúng tủ"}, {"no": 6, "folderLabel": "Ngữ pháp", "cat": "Ngữ pháp", "file": "ĐỀ 12 - NGỮ PHÁP N2", "title": "Đề 6 · Ngữ pháp N2", "jp": "文の組み立て", "mondai": "<b>問題8<\/b> 次の文の　★　に入る最もよいものを、1・2・3・4から一つ選びなさい。 Sắp xếp 4 phương án thành câu đúng rồi chọn phương án nằm ở vị trí ★.", "qs": [{"s": "現地記者の話すところによると、{状況|じょうきょう}は［　］［　］［★］［　］だ。", "o": ["悪化", "のよう", "する", "一方"], "order": [1, 3, 4, 2], "a": 4, "ar": "悪化 → する → 一方 → のよう", "vi": "Theo lời phóng viên tại chỗ, tình hình dường như ngày càng xấu đi.", "key": [{"w": "〜一方だ", "r": "いっぽうだ", "hv": "NHẤT PHƯƠNG", "m": "ngày càng… (một chiều, thường xấu)"}, {"w": "悪化", "r": "あっか", "hv": "ÁC HÓA", "m": "xấu đi"}], "g": ["<b class=\"jp\">Vる + 一方だ<\/b>: 悪化する一方だ. Thêm <b class=\"jp\">のようだ<\/b> ở cuối: 一方のようだ (có vẻ ngày càng…).", "<b class=\"jp\">〜ところによると<\/b>: theo như (nguồn tin)."], "n": ["Mẹo: だ ở cuối câu chỉ có thể nối sau のよう, nên のよう đứng ô cuối. 悪化 + する là cặp chắc chắn."], "why": "Bước 1: cặp chắc chắn <b>悪化＋する<\/b> (danh từ する). Bước 2: mẫu <b>Vる＋一方<\/b> (ngày càng) → 悪化する一方. Bước 3: だ cuối câu cần đứng sau <b>のよう<\/b> → 一方のようだ. Thứ tự: 悪化 → する → <b>一方<\/b>(★) → のよう. Ô ★ là ô thứ ba → <b>一方<\/b>.", "x": {"1": "悪化 — ô 1: là danh từ gốc, phải đứng trước する. Không thể ở ★ vì sau ★ còn một ô rồi mới đến だ, mà 悪化 không nối được với のようだ theo nghĩa “ngày càng”.", "2": "のよう — ô 4: chỉ のよう mới nối được với だ ở cuối câu (のようだ). Vì vậy nó luôn ở ô cuối, không ở ★.", "3": "する — ô 2: luôn đi ngay sau 悪化 và đứng trước 一方 (Vる＋一方).", "4": "一方 — ô 3 (★): mẫu Vる＋一方だ ＝ ngày càng…; nằm giữa する và のよう."}}, 要らないと言う。", "o": ["と言った", "お菓子が", "食べたい", "かと思うと"], "order": [2, 3, 1, 4], "a": 1, "ar": "お菓子が → 食べたい → と言った → かと思うと", "vi": "Em gái tôi vừa bảo muốn ăn bánh xong thì đã bảo không cần nữa.", "key": [{"w": "〜かと思うと", "r": "かとおもうと", "hv": "—", "m": "vừa mới… thì đã (đổi ý rất nhanh)"}], "g": ["<b class=\"jp\">Vた + かと思うと<\/b>: 泣いたかと思うと笑い出す. Xem Đề 3 câu 4."], "n": ["Mẹo: dấu 、 ngay sau ô cuối, nên かと思うと đứng cuối; trước nó phải là thể た (と言った)."], "why": "Bước 1: trước dấu 、 là liên từ → <b>かと思うと<\/b> ở ô cuối. Bước 2: かと思うと cần thể た đứng trước → <b>と言った<\/b>. Bước 3: nội dung lời nói: お菓子が食べたい. Thứ tự: お菓子が → 食べたい → <b>と言った<\/b>(★) → かと思うと.", "x": {"1": "と言った — ô 3 (★): là thể た, đứng ngay trước かと思うと (Vた＋かと思うと: vừa… thì đã).", "2": "お菓子が — ô 1: tân ngữ của 食べたい (〜が食べたい).", "3": "食べたい — ô 2: nội dung câu nói, đứng trước trích dẫn と.", "4": "かと思うと — ô 4: nối hai vế đối lập, đứng ngay trước dấu 、 và vế sau もう要らないと言う."}}, {"s": "{現時点|げんじてん}で、［　］［★］［　］［　］やってみたが、だめだった。", "o": ["考え", "方法で", "最善の", "うる"], "order": [1, 4, 3, 2], "a": 4, "ar": "考え → うる → 最善の → 方法で", "vi": "Ở thời điểm hiện tại, tôi đã thử bằng cách tốt nhất có thể nghĩ ra nhưng vẫn không được.", "key": [{"w": "〜うる", "r": "うる / える", "hv": "ĐẮC", "m": "có thể (khả năng xảy ra)"}, {"w": "最善", "r": "さいぜん", "hv": "TỐI THIỆN", "m": "tốt nhất"}], "g": ["<b class=\"jp\">Vます + うる<\/b>: 考えうる (có thể nghĩ ra), あり得る ありうる. Phủ định: 〜えない."], "n": ["Mẹo: 方法で nối với やってみた (làm bằng cách…), nên đứng cuối."], "why": "Bước 1: やってみた cần cách thức → <b>方法で<\/b> ở ô cuối. Bước 2: <b>最善の＋方法で<\/b>. Bước 3: <b>考え＋うる<\/b> (Vます＋うる: có thể nghĩ ra) bổ nghĩa cho 最善の方法. Thứ tự: 考え → <b>うる<\/b>(★) → 最善の → 方法で.", "x": {"1": "考え — ô 1: thể ます bỏ ます, phải đứng trước うる.", "2": "方法で — ô 4: chỉ cách thức của hành động やってみた phía sau.", "3": "最善の — ô 3: bổ nghĩa cho 方法 (最善の方法: cách tốt nhất).", "4": "うる — ô 2 (★): hậu tố gắn ngay sau Vます (考えうる), tạo cụm bổ nghĩa cho danh từ phía sau."}}, {"s": "その［　］［　］［★］［　］「その話はよそう」と言われた。", "o": ["かのうちに", "触れない", "話に", "触れるか"], "order": [3, 4, 2, 1], "a": 2, "ar": "話に → 触れるか → 触れない → かのうちに", "vi": "Tôi vừa mới nhắc tới chuyện đó thì đã bị bảo “Thôi đừng nói chuyện đó nữa”.", "key": [{"w": "触れる", "r": "ふれる", "hv": "XÚC", "m": "chạm; đề cập tới"}, {"w": "よそう", "r": "よそう", "hv": "—", "m": "thôi, bỏ đi (よす: thôi)"}], "g": ["<b class=\"jp\">Vるか Vないかのうちに<\/b>: vừa mới… thì. Xem Đề 3 câu 10."], "n": ["Mẹo: その + 話に (N に触れる: đề cập tới N)."], "why": "Bước 1: その cần danh từ → <b>話に<\/b> (話に触れる: nhắc tới chuyện). Bước 2: mẫu <b>Vるか＋Vないか＋のうちに<\/b>. Thứ tự: 話に → 触れるか → <b>触れない<\/b>(★) → かのうちに.", "x": {"1": "かのうちに — ô 4: phần cuối của mẫu, đứng sau 触れない, nối với vế sau 「その話はよそう」と言われた.", "2": "触れない — ô 3 (★): thể phủ định, đứng giữa 触れるか và かのうちに.", "3": "話に — ô 1: nối với その (その話) và làm bổ ngữ của 触れる (Nに触れる).", "4": "触れるか — ô 2: thể khẳng định + か, mở đầu mẫu Vるか Vないか."}}, {"s": "［　］［　］［★］［　］、このあたりは夜とてもあぶないですよ。", "o": ["うちに", "と", "帰らない", "明るい"], "order": [4, 1, 3, 2], "a": 3, "ar": "明るい → うちに → 帰らない → と", "vi": "Nếu không về khi trời còn sáng thì khu này ban đêm nguy hiểm lắm đấy.", "key": [{"w": "〜うちに", "r": "うちに", "hv": "—", "m": "trong lúc còn… (trước khi thay đổi)"}], "g": ["<b class=\"jp\">Aい + うちに<\/b>: 明るいうちに, 若いうちに. <b class=\"jp\">Vないと<\/b>: nếu không… thì."], "n": ["Mẹo: と (điều kiện) đứng ngay trước dấu 、."], "why": "Bước 1: <b>明るい＋うちに<\/b> (khi trời còn sáng). Bước 2: <b>帰らない＋と<\/b> (nếu không về thì) đứng trước dấu 、. Thứ tự: 明るい → うちに → <b>帰らない<\/b>(★) → と.", "x": {"1": "うちに — ô 2: đi ngay sau tính từ 明るい (Aい＋うちに: trong lúc còn…).", "2": "と — ô 4: trợ từ điều kiện, đứng ngay trước dấu 、.", "3": "帰らない — ô 3 (★): thể ない để nối với と (Vないと: nếu không… thì).", "4": "明るい — ô 1: tính từ đứng trước うちに; đứng đầu câu."}}, {"s": "庭に{咲|さ}いている［　］［　］［★］［　］すごくいい。", "o": ["香りも", "きれいな", "うえに", "花は"], "order": [4, 2, 3, 1], "a": 3, "ar": "花は → きれいな → うえに → 香りも", "vi": "Hoa nở trong vườn không những đẹp mà hương cũng rất thơm.", "key": [{"w": "〜うえに", "r": "うえに", "hv": "THƯỢNG", "m": "không những… mà còn"}, {"w": "香り", "r": "かおり", "hv": "HƯƠNG", "m": "mùi thơm"}], "g": ["<b class=\"jp\">Aな + うえに<\/b>: きれいなうえに. Hai vế cùng chiều (cùng tốt hoặc cùng xấu)."], "n": ["Mẹo: 咲いている bổ nghĩa cho 花, và 香りも + すごくいい."], "why": "Bước 1: 咲いている bổ nghĩa cho danh từ → <b>花は<\/b>. Bước 2: <b>きれいな＋うえに<\/b> (không những đẹp mà còn). Bước 3: <b>香りも<\/b>＋すごくいい. Thứ tự: 花は → きれいな → <b>うえに<\/b>(★) → 香りも.", "x": {"1": "香りも — ô 4: chủ ngữ của すごくいい (hương cũng rất thơm), も thể hiện ý “cũng”.", "2": "きれいな — ô 2: tính từ な giữ な khi nối với うえに.", "3": "うえに — ô 3 (★): nối vế “đẹp” với vế “thơm” (cùng chiều tích cực).", "4": "花は — ô 1: danh từ được 咲いている bổ nghĩa, làm chủ đề câu."}}, {"s": "あなたが［　］［★］［　］［　］なのに、あなたにやめられたら本当に困りますよ。", "o": ["不足気味", "人手が", "いて", "さえ"], "order": [3, 4, 2, 1], "a": 4, "ar": "いて → さえ → 人手が → 不足気味", "vi": "Ngay cả khi có bạn mà nhân lực còn hơi thiếu, bạn nghỉ việc thì chúng tôi thật sự khó khăn đấy.", "key": [{"w": "人手", "r": "ひとで", "hv": "NHÂN THỦ", "m": "nhân lực, người làm"}, {"w": "〜気味", "r": "ぎみ", "hv": "KHÍ VỊ", "m": "hơi có vẻ"}], "g": ["<b class=\"jp\">Vて + さえ<\/b>: ngay cả khi. <b class=\"jp\">やめられたら<\/b>: bị động gây phiền (迷惑の受身)."], "n": ["Mẹo: 不足気味 + なのに (N + なのに). Xem Đề 3 câu 7 (気味)."], "why": "Bước 1: なのに cần N/Aな đứng trước → <b>不足気味<\/b> ở ô cuối. Bước 2: <b>人手が<\/b>＋不足気味. Bước 3: あなたが＋<b>いて＋さえ<\/b> (ngay cả khi có bạn). Thứ tự: いて → <b>さえ<\/b>(★) → 人手が → 不足気味.", "x": {"1": "不足気味 — ô 4: danh từ＋気味, nối với なのに phía sau.", "2": "人手が — ô 3: chủ ngữ của 不足気味 (nhân lực hơi thiếu).", "3": "いて — ô 1: nối với あなたが (あなたがいて: có bạn ở đây).", "4": "さえ — ô 2 (★): Vて＋さえ (ngay cả khi), gắn ngay sau いて."}}, {"s": "［　］［　］［★］［　］のは、かえって失礼になることもあります。", "o": ["高価な", "といって", "物だから", "遠慮する"], "order": [1, 3, 2, 4], "a": 2, "ar": "高価な → 物だから → といって → 遠慮する", "vi": "Từ chối chỉ vì đó là đồ đắt tiền đôi khi lại thành thất lễ.", "key": [{"w": "〜からといって", "r": "からといって", "hv": "—", "m": "chỉ vì… mà (không hẳn)"}, {"w": "遠慮", "r": "えんりょ", "hv": "VIỄN LỰ", "m": "khách sáo, ngại, từ chối"}, {"w": "かえって", "r": "かえって", "hv": "—", "m": "ngược lại"}], "g": ["<b class=\"jp\">〜からといって<\/b>: お金があるからといって幸せとは限らない."], "n": ["Mẹo: 遠慮する + のは (Vる + の danh từ hóa) đứng cuối."], "why": "Bước 1: のは cần Vる → <b>遠慮する<\/b> ở ô cuối (遠慮するのは). Bước 2: mẫu <b>〜からといって<\/b> → <b>物だから＋といって<\/b>. Bước 3: <b>高価な＋物<\/b>. Thứ tự: 高価な → 物だから → <b>といって<\/b>(★) → 遠慮する.", "x": {"1": "高価な — ô 1: tính từ な bổ nghĩa cho 物.", "2": "といって — ô 3 (★): ghép với から ở cuối 物だから thành からといって (chỉ vì… mà).", "3": "物だから — ô 2: chứa から để tạo mẫu からといって với mảnh sau.", "4": "遠慮する — ô 4: động từ thể từ điển, nối với のは (danh từ hóa) làm chủ ngữ."}}], "sum": [{"h": "Chiến thuật làm 文の組み立て (問題8 · câu ★)", "li": ["<b>Bước 1 — tìm mảnh cuối<\/b>: xem chữ ngay sau ô thứ 4 (だ, 。, 、, なのに, のは). Mảnh nào nối được với nó thì đặt ô 4. Ví dụ: のよう＋だ, 不足気味＋なのに, 遠慮する＋のは.", "<b>Bước 2 — tìm mảnh đầu<\/b>: xem chữ ngay trước ô 1 (その, 試験の, 咲いている). Danh từ thường đứng ô 1.", "<b>Bước 3 — ghép cặp cố định<\/b>: から＋して, 心配の＋あまり, 明るい＋うちに, きれいな＋うえに, 考え＋うる.", "<b>Bước 4<\/b>: chỉ cần chắc vị trí ★, không cần dịch hoàn chỉnh. Ghép xong đọc lại một lần để kiểm tra nghĩa."]}, {"h": "Mẫu ngữ pháp trong đề", "tbl": {"head": ["Mẫu", "Nối", "Nghĩa"], "rows": [["〜一方だ", "Vる", "ngày càng (một chiều)"], ["〜からして", "N", "ngay từ (chi tiết) đã…"], ["〜あまり", "Nの / Vる", "quá… đến mức"], ["〜かと思うと", "Vた", "vừa… thì đã"], ["〜うる / 〜える", "Vます", "có thể (考えうる, ありうる)"], ["〜か〜ないかのうちに", "Vる・Vない", "vừa mới… thì"], ["〜うちに", "Aい / Vない / Nの", "trong lúc còn…"], ["〜うえに", "thể thường (Aな giữ な)", "không những… mà còn"], ["〜てさえ", "Vて", "ngay cả khi"], ["〜からといって", "thể thường", "chỉ vì… mà (không hẳn)"]]}}, {"h": "Quy tắc nối cần nhớ khi xếp câu", "li": ["Danh từ ＋ <b>の<\/b> trước あまり, うちに, ような; tính từ な giữ <b>な<\/b> trước うえに, のに, くせに.", "Mẫu cần <b>Vた<\/b>: かと思うと, とたん, きり, あげく, 末に.", "Mẫu cần <b>Vます<\/b>: うる, かねる, がち, かけ, ぬく, きる, 次第.", "Mẫu cần <b>Vる<\/b>: 一方だ, 恐れがある, 際に, にあたって (cũng nhận N).", "Trợ từ đi sau danh từ (が, を, に, は, も) — mảnh có trợ từ thường là chủ ngữ/tân ngữ, đứng trước động từ của nó."]}, {"h": "Mở rộng: nhóm mẫu dễ ra trong câu ★", "li": ["<b>Xu hướng<\/b>: 〜一方だ (ngày càng), 〜つつある (đang dần), 〜ばかりだ (chỉ toàn xấu đi).", "<b>Mức độ quá<\/b>: 〜あまり, 〜すぎて, 〜ほど, 〜くらい.", "<b>Không hẳn<\/b>: 〜からといって〜とは限らない, 〜わけではない, 〜とも限らない.", "<b>Cộng thêm<\/b>: 〜うえに, 〜ばかりか, 〜のみならず, 〜に加えて."]}], "source": {"folder": "https://drive.google.com/drive/folders/1dL7Iev1IwiAwZ-ZuLi2B6E6ZC5eF1H12", "goc": "https://drive.google.com/file/d/1KYlj-NBbilY567_RzgbWHTI4BZgxQNEn/view", "chua": "https://drive.google.com/file/d/1BsWde6fjsXsV6EvC6Bx_NMkVTijg9w_3/view"}, "series": "DORA Nihongo · Đề 6 · Ngữ pháp N5–N2 trúng tủ"}, {"no": 7, "folderLabel": "Từ vựng", "cat": "Từ vựng", "file": "ĐỀ 11 - TỪ VỰNG N2", "title": "Đề 7 · Từ vựng N2", "jp": "語形成", "mondai": "<b>問題3<\/b> （　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。 Chọn tiền tố / hậu tố thích hợp để tạo thành từ.", "qs": [{"s": "彼らは金銭（　）でその活動を支援している。", "o": ["類", "味", "面", "機"], "a": 3, "ar": "金銭面 きんせんめん", "vi": "Họ hỗ trợ hoạt động đó về mặt tài chính.", "key": [{"w": "〜面", "r": "めん", "hv": "DIỆN", "m": "mặt, phương diện"}, {"w": "金銭", "r": "きんせん", "hv": "KIM TIỀN", "m": "tiền bạc"}], "x": {"1": "〜類 (loại, nhóm đồ vật): 衣類, 書類, 金属類. “金銭類” chỉ các loại tiền, không phải “phương diện”.", "2": "〜味 (sắc thái, cảm giác): 現実味, 人間味. 金銭味 không tồn tại.", "4": "〜機 (máy móc): 洗濯機, 飛行機. Không ghép với 金銭."}, "n": ["精神面, 健康面, 経済面, 安全面."], "why": "Hỗ trợ <b>về mặt<\/b> tiền bạc. Hậu tố <b>〜面<\/b> (めん) ＝ phương diện, mặt: 金銭面, 健康面, 精神面. 金銭面で支援する ＝ hỗ trợ về mặt tài chính."}, {"s": "{候補者|こうほしゃ}は会う人（　）に握手をしていた。", "o": ["ぶり", "おき", "あたり", "ごと"], "a": 4, "ar": "〜ごとに", "vi": "Ứng cử viên bắt tay từng người mình gặp.", "key": [{"w": "〜ごとに", "r": "ごとに", "hv": "(毎)", "m": "mỗi, từng"}, {"w": "候補者", "r": "こうほしゃ", "hv": "HẬU BỔ GIẢ", "m": "ứng cử viên"}], "x": {"1": "〜ぶり: sau một khoảng thời gian mới lại (3年ぶり) hoặc dáng vẻ (話しぶり). Không đi với 会う人.", "2": "〜おき (cách quãng): 1日おき, 2メートルおき — đi với số lượng, không đi với “người gặp”.", "3": "〜あたり (tính bình quân mỗi): 一人あたり1000円. Dùng để tính toán, không dùng cho hành động lặp lại với từng người."}, "n": ["ごとに và おきに: ３日ごとに = mỗi 3 ngày; ３日おきに = cách 3 ngày (tức 4 ngày một lần)."], "why": "Bắt tay <b>mỗi<\/b> người gặp. Hậu tố <b>〜ごとに<\/b> ＝ mỗi, cứ mỗi (lặp lại với từng đơn vị): 会う人ごとに, 一時間ごとに."}, {"s": "きみの話は単なる理想（　）でしかない。", "o": ["発", "性", "論", "難"], "a": 3, "ar": "理想論 りそうろん", "vi": "Lời cậu nói chẳng qua chỉ là lý thuyết suông.", "key": [{"w": "〜論", "r": "ろん", "hv": "LUẬN", "m": "thuyết, quan điểm"}], "x": {"1": "〜発 (xuất phát từ): 東京発, 10時発. 理想発 vô nghĩa.", "2": "〜性 (tính chất): 可能性, 安全性. 理想性 không dùng; câu cần “lời nói lý tưởng hão”.", "4": "〜難 (khó khăn, thiếu hụt): 経営難, 就職難. 理想難 không tồn tại."}, "g": ["<b class=\"jp\">〜でしかない<\/b>: chỉ là… mà thôi. <b class=\"jp\">単なる<\/b>: đơn thuần."], "n": ["結論, 議論, 一般論, 陰謀論."], "why": "Lời nói chỉ là <b>lý thuyết suông<\/b>. Hậu tố <b>〜論<\/b> (ろん) ＝ luận, lý thuyết: 理想論 (lý tưởng hão), 一般論 (nói chung chung), 結論."}, {"s": "大雨注意（　）が{発令|はつれい}された。", "o": ["界", "服", "報", "案"], "a": 3, "ar": "注意報 ちゅういほう", "vi": "Đã ban bố cảnh báo mưa lớn.", "key": [{"w": "注意報", "r": "ちゅういほう", "hv": "CHÚ Ý BÁO", "m": "bản tin cảnh báo (mức chú ý)"}, {"w": "発令", "r": "はつれい", "hv": "PHÁT LỆNH", "m": "ban bố"}], "x": {"1": "〜界 (giới, lĩnh vực): 芸能界, 経済界. 注意界 vô nghĩa.", "2": "〜服 (quần áo): 制服, 作業服. Không liên quan.", "4": "〜案 (phương án, bản đề xuất): 提案, 改善案. Không đi với 注意 trong nghĩa thời tiết."}, "n": ["Mức cảnh báo thời tiết Nhật: 注意報 → 警報 けいほう → 特別警報."], "why": "Cơ quan khí tượng <b>ban bố<\/b> (発令) <b>cảnh báo<\/b>. Hậu tố <b>〜報<\/b> (ほう) ＝ bản tin, thông báo: 注意報 (cảnh báo), 警報 (báo động), 速報 (tin nhanh), 天気予報."}, {"s": "{山田|やまだ}さんは、クラス（　）の勉強家だった。", "o": ["育ち", "連れ", "きって", "漬け"], "a": 3, "ar": "〜きっての", "vi": "Anh Yamada từng là người chăm học nhất lớp.", "key": [{"w": "〜きっての", "r": "きっての", "hv": "—", "m": "nhất trong (phạm vi)"}], "x": {"1": "〜育ち (lớn lên ở): 東京育ち, 田舎育ち. “Lớn lên ở lớp học” vô nghĩa.", "2": "〜連れ (dẫn theo): 子供連れ, 家族連れ. Không hợp.", "4": "〜漬け (ngập trong): 勉強漬け (học suốt ngày) — gần nghĩa nhưng là “bị ngâm trong việc học”, không ghép với クラス."}, "n": ["日本きっての名医 (danh y bậc nhất Nhật). 勉強家: người chăm học."], "why": "Người <b>chăm học nhất<\/b> lớp. Hậu tố <b>Nきっての<\/b> ＝ nhất trong N (trang trọng, khen): クラスきっての勉強家, 日本きっての名医."}, {"s": "その会社は深刻な経営（　）におちいっている。", "o": ["差", "額", "型", "難"], "a": 4, "ar": "経営難 けいえいなん", "vi": "Công ty đó đang rơi vào khó khăn kinh doanh nghiêm trọng.", "key": [{"w": "〜難", "r": "なん", "hv": "NAN", "m": "sự khó khăn, thiếu hụt"}, {"w": "陥る", "r": "おちいる", "hv": "HÃM", "m": "rơi vào (tình trạng xấu)"}], "x": {"1": "〜差 (chênh lệch): 時差, 温度差. 経営差 không dùng, và không “rơi vào” chênh lệch.", "2": "〜額 (số tiền): 金額, 売上額. Không ghép với 経営.", "3": "〜型 (kiểu, mẫu): 大型, 新型. Không hợp nghĩa “rơi vào”."}, "n": ["財政難, 就職難, 住宅難."], "why": "Rơi vào (におちいる) <b>khó khăn<\/b> kinh doanh. Hậu tố <b>〜難<\/b> (なん) ＝ khó khăn, thiếu: 経営難, 就職難, 住宅難, 資金難."}, {"s": "その問題の平和的解決（　）を見つけた。", "o": ["剤", "法", "表", "面"], "a": 2, "ar": "解決法 かいけつほう", "vi": "Đã tìm ra cách giải quyết vấn đề một cách hòa bình.", "key": [{"w": "〜法", "r": "ほう", "hv": "PHÁP", "m": "phương pháp, cách"}], "x": {"1": "〜剤 (thuốc, chất): 洗剤, 薬剤, 消毒剤. “Thuốc giải quyết” không hợp với vấn đề xã hội.", "3": "〜表 (bảng biểu): 予定表, 時刻表. Không “tìm thấy bảng giải quyết”.", "4": "〜面 (phương diện): 解決面 không phải từ thông dụng."}, "n": ["使用法, 学習法, 治療法."], "why": "Tìm ra <b>cách<\/b> giải quyết. Hậu tố <b>〜法<\/b> (ほう) ＝ phương pháp: 解決法, 学習法, 治療法."}, {"s": "{興奮|こうふん}している人に大声でどなるのは（　）効果だ。", "o": ["再", "逆", "諸", "最"], "a": 2, "ar": "逆効果 ぎゃくこうか", "vi": "Quát lớn vào người đang kích động chỉ phản tác dụng.", "key": [{"w": "逆〜", "r": "ぎゃく", "hv": "NGHỊCH", "m": "ngược lại"}, {"w": "怒鳴る", "r": "どなる", "hv": "NỘ MINH", "m": "quát tháo"}], "x": {"1": "再〜 (tái, lại): 再開発, 再確認. 再効果 không tồn tại.", "3": "諸〜 (các, nhiều): 諸問題, 諸外国. Không ghép với 効果 theo nghĩa này.", "4": "最〜 (nhất): 最高, 最新. 最効果 không tồn tại; “hiệu quả nhất” là 最も効果的."}, "n": ["逆転, 逆輸入, 逆方向."], "why": "Quát người đang kích động chỉ làm tệ hơn → <b>phản tác dụng<\/b>. Tiền tố <b>逆〜<\/b> (ぎゃく) ＝ ngược: 逆効果, 逆転, 逆輸入."}, {"s": "我々は海岸（　）を走った。", "o": ["従い", "付き", "沿い", "並び"], "a": 3, "ar": "海岸沿い かいがんぞい", "vi": "Chúng tôi chạy dọc bờ biển.", "key": [{"w": "〜沿い", "r": "ぞい", "hv": "DUYÊN", "m": "dọc theo"}], "x": {"1": "従い (theo — mệnh lệnh, quy định): dùng trong 〜に従い, không gắn trực tiếp sau 海岸.", "2": "〜付き (có kèm theo): 朝食付き, 保証付き. 海岸付き không phải cách nói.", "4": "〜並び (dãy, hàng): 家並み, 歯並び. Không chỉ đường đi dọc."}, "n": ["川沿い, 線路沿い, 道路沿い. Xem Đề 18 câu 5 (にそって)."], "why": "Chạy <b>dọc<\/b> bờ biển. Hậu tố <b>〜沿い<\/b> (ぞい) ＝ dọc theo: 海岸沿い, 川沿い, 線路沿い."}, {"s": "このクラブは相互の{親睦|しんぼく}をはかることが（　）目的です。", "o": ["来", "主", "両", "本"], "a": 2, "ar": "主目的 しゅもくてき", "vi": "Mục đích chính của câu lạc bộ là thắt chặt tình thân giữa các thành viên.", "key": [{"w": "主〜", "r": "しゅ", "hv": "CHỦ", "m": "chính, chủ yếu"}, {"w": "親睦", "r": "しんぼく", "hv": "THÂN MỤC", "m": "tình thân, hòa thuận"}], "x": {"1": "来〜 (tới): 来年, 来週. 来目的 vô nghĩa.", "3": "両〜 (cả hai): 両国, 両親. Câu chỉ có một mục đích.", "4": "本〜 (này, chính thức): 本日, 本会議. 本目的 không dùng."}, "n": ["主成分, 主原料. 〜をはかる (図る): nhằm, mưu cầu."], "why": "<b>Mục đích chính<\/b>. Tiền tố <b>主〜<\/b> (しゅ) ＝ chính, chủ yếu: 主目的, 主成分, 主人公."}, {"s": "歴史（　）の人物で{尊敬|そんけい}する人はだれですか。", "o": ["流", "上", "風", "発"], "a": 2, "ar": "歴史上 れきしじょう", "vi": "Trong số nhân vật lịch sử, người bạn kính trọng là ai?", "key": [{"w": "〜上", "r": "じょう", "hv": "THƯỢNG", "m": "về mặt, trong phạm vi"}], "x": {"1": "〜流 (kiểu, trường phái): 日本流, 自己流. 歴史流 vô nghĩa.", "3": "〜風 (phong cách): 和風, 洋風. “Nhân vật kiểu lịch sử” sai nghĩa.", "4": "〜発 (xuất phát): không ghép với 歴史."}, "n": ["法律上, 事実上, 教育上."], "why": "Nhân vật <b>trong lịch sử<\/b>. Hậu tố <b>〜上<\/b> (じょう) ＝ trên phương diện, trong phạm vi: 歴史上, 法律上, 教育上."}, {"s": "まだ{妥協|だきょう}（　）が見出せないままだ。", "o": ["報", "点", "法", "度"], "a": 2, "ar": "妥協点 だきょうてん", "vi": "Vẫn chưa tìm ra điểm thỏa hiệp.", "key": [{"w": "〜点", "r": "てん", "hv": "ĐIỂM", "m": "điểm"}, {"w": "妥協", "r": "だきょう", "hv": "THỎA HIỆP", "m": "thỏa hiệp"}], "x": {"1": "〜報 (thông báo): 妥協報 không tồn tại.", "3": "〜法 (phương pháp): 妥協法 không phải cách nói; người ta tìm “điểm” thỏa hiệp, không tìm “phương pháp thỏa hiệp”.", "4": "〜度 (mức độ): 満足度, 危険度. 妥協度 không dùng."}, "g": ["<b class=\"jp\">〜ままだ<\/b>: vẫn nguyên trạng thái."], "n": ["問題点, 共通点, 出発点."], "why": "Chưa tìm thấy <b>điểm<\/b> thỏa hiệp. Hậu tố <b>〜点<\/b> (てん) ＝ điểm: 妥協点, 問題点, 共通点. Động từ 見出す (tìm ra) khớp với “điểm”."}, {"s": "リストラのうわさが現実（　）を帯びてきた。", "o": ["味", "色", "調", "上"], "a": 1, "ar": "現実味 げんじつみ", "vi": "Tin đồn cắt giảm nhân sự đã bắt đầu có vẻ thành thật.", "key": [{"w": "現実味を帯びる", "r": "げんじつみをおびる", "hv": "HIỆN THỰC VỊ", "m": "trở nên có tính hiện thực"}], "x": {"2": "〜色 (màu sắc, khuynh hướng): 政治色, 地方色. “現実色” không dùng.", "3": "〜調 (giọng điệu, nhịp): 命令調, 好調. 現実調 không tồn tại.", "4": "〜上 (về mặt): 現実上 không dùng; và không đi với 帯びる."}, "n": ["帯びる おびる: mang (tính chất). 赤みを帯びる: ngả đỏ."], "why": "Tin đồn <b>bắt đầu có tính hiện thực<\/b>. Hậu tố <b>〜味<\/b> (み) ＝ cảm giác, sắc thái: 現実味を帯びる (trở nên có vẻ thật) là collocation cố định."}, {"s": "申し訳ありません、全席予約（　）です。", "o": ["済み", "離れ", "切れ", "漬け"], "a": 1, "ar": "予約済み よやくずみ", "vi": "Xin lỗi quý khách, tất cả chỗ ngồi đã được đặt trước.", "key": [{"w": "〜済み", "r": "ずみ", "hv": "TẾ", "m": "đã xong"}], "x": {"2": "〜離れ (xa rời, chán): 活字離れ, 親離れ. 予約離れ vô nghĩa.", "3": "〜切れ (hết): 品切れ, 期限切れ. 予約切れ không phải từ dùng; muốn nói “hết chỗ” thì là 満席 / 売り切れ.", "4": "〜漬け (ngập trong): 勉強漬け. Không hợp."}, "n": ["Xem Đề 1 câu 6 (消毒済み)."], "why": "Tất cả chỗ <b>đã được đặt<\/b>. Hậu tố <b>〜済み<\/b> (ずみ) ＝ đã xong: 予約済み, 支払い済み, 使用済み."}, {"s": "結婚{披露宴|ひろうえん}の司会（　）を頼まれた。", "o": ["系", "作", "権", "役"], "a": 4, "ar": "司会役 しかいやく", "vi": "Tôi được nhờ làm MC cho tiệc cưới.", "key": [{"w": "〜役", "r": "やく", "hv": "DỊCH", "m": "vai trò"}, {"w": "司会", "r": "しかい", "hv": "TƯ HỘI", "m": "dẫn chương trình"}], "x": {"1": "〜系 (hệ, dòng): 理系, 文系. 司会系 vô nghĩa.", "2": "〜作 (tác phẩm): 名作, 新作. Không hợp.", "3": "〜権 (quyền): 司会権 không dùng; người ta “nhờ làm MC” chứ không nhờ “quyền MC”."}, "n": ["案内役, 相談役, まとめ役."], "why": "Được nhờ <b>làm vai trò<\/b> MC. Hậu tố <b>〜役<\/b> (やく) ＝ vai, vai trò: 司会役, 相談役, 主役."}, {"s": "必ず学校の行事予定（　）を確認してください。", "o": ["術", "表", "色", "状"], "a": 2, "ar": "予定表 よていひょう", "vi": "Nhất định hãy kiểm tra lịch sự kiện của trường.", "key": [{"w": "〜表", "r": "ひょう", "hv": "BIỂU", "m": "bảng, biểu"}], "x": {"1": "〜術 (thuật, kỹ thuật): 美術, 手術. 予定術 vô nghĩa.", "3": "〜色 (màu, khuynh hướng): không ghép với 予定.", "4": "〜状 (thư, giấy tờ): 招待状, 年賀状. 予定状 không dùng; lịch trình là “bảng”."}, "n": ["時刻表, 成績表, 一覧表."], "why": "Xem <b>bảng<\/b> lịch sự kiện. Hậu tố <b>〜表<\/b> (ひょう) ＝ bảng: 予定表, 時刻表, 成績表."}, {"s": "その作家は幅広い読者（　）を持っている。", "o": ["率", "物", "層", "力"], "a": 3, "ar": "読者層 どくしゃそう", "vi": "Nhà văn đó có lượng độc giả rất rộng.", "key": [{"w": "〜層", "r": "そう", "hv": "TẦNG", "m": "tầng lớp, nhóm người"}], "x": {"1": "〜率 (tỷ lệ): 合格率. “Tỷ lệ độc giả rộng” sai collocation (率 đi với 高い / 低い).", "2": "〜物 (vật): 読者物 vô nghĩa.", "4": "〜力 (sức, năng lực): 読者力 không dùng."}, "n": ["若者層, 富裕層. Xem Đề 1 câu 11 (選手層)."], "why": "Có <b>tầng lớp<\/b> độc giả rộng. Hậu tố <b>〜層<\/b> (そう) ＝ tầng lớp: 読者層, 若者層, 富裕層. 幅広い (rộng) đi tự nhiên với 層."}, {"s": "この棚はいろいろと（　）目的に使える。", "o": ["多", "副", "真", "助"], "a": 1, "ar": "多目的 たもくてき", "vi": "Chiếc kệ này dùng được cho nhiều mục đích.", "key": [{"w": "多〜", "r": "た", "hv": "ĐA", "m": "nhiều"}], "x": {"2": "副〜 (phó, phụ): 副作用, 副社長. 副目的 không phải từ thông dụng, và câu có いろいろと (nhiều kiểu) → cần “nhiều”.", "3": "真〜 (thật, chính): 真ん中, 真夏. 真目的 không dùng.", "4": "助〜 (trợ): 助教授, 助手. 助目的 không tồn tại."}, "n": ["多機能, 多国籍, 多目的ホール."], "why": "Dùng cho <b>nhiều<\/b> mục đích. Tiền tố <b>多〜<\/b> (た) ＝ nhiều: 多目的, 多機能, 多国籍."}, {"s": "私のおじがこの土地の所有（　）を持っている。", "o": ["庫", "状", "片", "権"], "a": 4, "ar": "所有権 しょゆうけん", "vi": "Chú tôi nắm quyền sở hữu mảnh đất này.", "key": [{"w": "〜権", "r": "けん", "hv": "QUYỀN", "m": "quyền"}], "x": {"1": "〜庫 (kho): 倉庫, 冷蔵庫. 所有庫 vô nghĩa.", "2": "〜状 (tình trạng, thư): 所有状 không dùng.", "3": "〜片 (mảnh): 破片, 断片. Không hợp."}, "n": ["著作権, 選挙権, 決定権."], "why": "Nắm <b>quyền<\/b> sở hữu đất. Hậu tố <b>〜権<\/b> (けん) ＝ quyền: 所有権, 選挙権, 著作権."}, {"s": "本年度の我が社の売り上げは11億円から22億円に（　）上昇した。", "o": ["急", "要", "全", "反"], "a": 1, "ar": "急上昇 きゅうじょうしょう", "vi": "Doanh thu năm nay của công ty chúng tôi tăng vọt từ 1,1 tỷ yên lên 2,2 tỷ yên.", "key": [{"w": "急〜", "r": "きゅう", "hv": "CẤP", "m": "đột ngột, nhanh"}], "x": {"2": "要〜 (cần): 要注意, 要確認. 要上昇 vô nghĩa.", "3": "全〜 (toàn bộ): 全世界, 全国民. 全上昇 không tồn tại.", "4": "反〜 (phản, chống): 反社会的, 反比例. Không hợp với tăng doanh thu."}, "n": ["急成長, 急停止, 急カーブ."], "why": "Doanh thu tăng gấp đôi trong một năm → <b>tăng vọt<\/b>. Tiền tố <b>急〜<\/b> (きゅう) ＝ gấp, đột ngột: 急上昇, 急停車, 急増."}], "sum": [{"h": "Cách làm dạng 語形成 (問題3 · tiền tố / hậu tố)", "li": ["Đây là dạng <b>học thuộc từ ghép<\/b>: phần lớn đáp án là cụm cố định (金銭面, 経営難, 注意報, 予約済み). Gặp từ ghép mới thì ghi cả cụm.", "Dịch nghĩa của chỗ trống trước (“về mặt”, “khó khăn”, “nhiều”), rồi tìm hậu tố/tiền tố mang nghĩa đó.", "Chú ý <b>động từ đi kèm<\/b>: 現実味を<b>帯びる<\/b>, 妥協点を<b>見出す<\/b>, 経営難に<b>陥る<\/b>, 注意報が<b>発令される<\/b>.", "Phân biệt cách đọc biến âm: 沿い ぞい, 済み ずみ, 漬け づけ, 連れ づれ (đục hóa khi làm hậu tố)."]}, {"h": "Hậu tố N2 hay gặp", "tbl": {"head": ["Hậu tố", "Nghĩa", "Ví dụ"], "rows": [["〜面", "về mặt", "金銭面, 健康面, 精神面"], ["〜難", "khó khăn, thiếu", "経営難, 就職難, 住宅難"], ["〜報", "bản tin", "注意報, 警報, 速報"], ["〜論", "luận, lý thuyết", "理想論, 一般論, 結論"], ["〜法", "phương pháp", "解決法, 学習法, 治療法"], ["〜点", "điểm", "妥協点, 問題点, 共通点"], ["〜味", "sắc thái", "現実味, 人間味, 新鮮味"], ["〜上", "về phương diện", "歴史上, 法律上, 健康上"], ["〜層", "tầng lớp", "読者層, 若年層, 富裕層"], ["〜権", "quyền", "所有権, 選挙権, 著作権"], ["〜役", "vai trò", "司会役, 主役, 相談役"], ["〜済み / 〜付き / 〜沿い", "đã xong / có kèm / dọc theo", "予約済み / 朝食付き / 川沿い"], ["〜ごとに / 〜おき / 〜あたり", "mỗi / cách quãng / bình quân", "1時間ごとに / 1日おき / 一人あたり"], ["〜きっての", "nhất trong", "クラスきっての秀才"]]}}, {"h": "Tiền tố N2 hay gặp", "tbl": {"head": ["Tiền tố", "Nghĩa", "Ví dụ"], "rows": [["逆〜", "ngược", "逆効果, 逆転, 逆輸入"], ["主〜", "chính", "主目的, 主成分, 主原因"], ["多〜", "nhiều", "多目的, 多機能, 多文化"], ["急〜", "đột ngột", "急上昇, 急増, 急停車"], ["再〜", "lại", "再開発, 再確認, 再利用"], ["諸〜", "các", "諸問題, 諸外国, 諸事情"], ["最〜", "nhất", "最高, 最新, 最優先"], ["副〜", "phó, phụ", "副作用, 副社長, 副業"], ["要〜", "cần", "要注意, 要確認, 要予約"], ["反〜", "phản", "反比例, 反社会的, 反対"], ["未〜 / 非〜 / 無〜 / 不〜", "chưa / không phải / không có / không", "未完成 / 非常識 / 無責任 / 不完全"]]}}, {"h": "Mẹo phân biệt các hậu tố dễ nhầm", "li": ["〜ごとに (mỗi lần, từng cái) ≠ 〜おきに (cách quãng) ≠ 〜あたり (chia bình quân). 1日おきに = cách một ngày; 1日ごとに = mỗi ngày.", "〜面 (phương diện) ≠ 〜上 (trong phạm vi): 金銭面で困る / 法律上問題がある.", "〜済み (đã làm xong) ≠ 〜切れ (đã hết sạch): 予約済み / 品切れ, 期限切れ.", "〜流 (cách làm của ai) ≠ 〜風 (phong cách, dáng vẻ): 日本流のやり方 / 和風の部屋."]}], "source": {"folder": "https://drive.google.com/drive/folders/1vRlfsMVZi57E9Mm4glnXVMSX29fPGINg", "goc": "https://drive.google.com/file/d/1Cpe63csFwT9uw6XCDb2KP7BhNX5thDwV/view", "chua": "https://drive.google.com/file/d/1Qt6VS4adEbnH3yzKkoX9KbeaRKLiIz3H/view"}, "series": "DORA Nihongo · Đề 7 · Từ vựng N5–N2 trúng tủ"}, {"no": 8, "folderLabel": "Từ vựng", "cat": "Từ vựng", "file": "ĐỀ 14 - TỪ VỰNG N2", "title": "Đề 8 · Từ vựng N2", "jp": "文脈規定", "mondai": "<b>問題4<\/b> （　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。 Chọn từ thích hợp nhất để điền vào chỗ trống.", "qs": [{"s": "１時間以上{床|ゆか}に座っていたら、足が（　）。", "o": ["しびれた", "つぶれた", "やぶれた", "くずれた"], "a": 1, "ar": "痺れる", "vi": "Ngồi dưới sàn hơn một tiếng làm chân tôi tê rần.", "key": [{"w": "痺れる", "r": "しびれる", "hv": "TÝ", "m": "tê, tê dại"}], "x": {"2": "つぶれる (bị đè bẹp; phá sản): chân không bị “bẹp” vì ngồi; 店がつぶれる, 箱がつぶれる.", "3": "やぶれる (rách; thua): dùng cho giấy, vải (服が破れる), không dùng cho chân.", "4": "くずれる (sụp đổ, lở; thời tiết xấu đi): 山が崩れる, 天気が崩れる. Không tả cảm giác ở chân."}, "g": ["<b class=\"jp\">Vていたら<\/b>: đang làm… thì (kết quả xảy ra)."], "n": ["しびれを切らす: mất kiên nhẫn (quán ngữ)."], "why": "Ngồi lâu dưới sàn → chân bị <b>tê<\/b>. Collocation cố định <b>足がしびれる<\/b> (痺れる: tê rần)."}, {"s": "（　）スマホが{欲|ほ}しいのなら、自分で買いなさい。", "o": ["必ずしも", "どうしても", "少なくとも", "くれぐれも"], "a": 2, "ar": "どうしても", "vi": "Nếu con nhất định muốn có điện thoại thì tự mà mua đi.", "key": [{"w": "どうしても", "r": "どうしても", "hv": "—", "m": "bằng mọi giá; dù thế nào cũng (không)"}], "x": {"1": "必ずしも phải đi với phủ định (必ずしも〜とは限らない: không hẳn). Câu này khẳng định.", "3": "少なくとも (ít nhất thì): đi với số lượng, mức tối thiểu. “Ít nhất thì muốn điện thoại” không hợp.", "4": "くれぐれも (xin hết sức): dùng khi dặn dò, nhờ vả lịch sự (くれぐれもお大事に). Không dùng cho mong muốn của bản thân."}, "g": ["<b class=\"jp\">〜のなら<\/b>: nếu (tiếp nhận ý người nghe). <b class=\"jp\">Vなさい<\/b>: mệnh lệnh nhẹ."], "n": ["どうしても + phủ định: どうしても分からない (thế nào cũng không hiểu)."], "why": "Vế sau là điều kiện “nếu muốn thì tự mua” → nhấn mạnh <b>mong muốn mãnh liệt<\/b>. <b>どうしても<\/b>＋〜たい ＝ nhất định muốn, muốn bằng mọi giá."}, {"s": "その新聞社は、国際政治関係の{論文|ろんぶん}の全国（　）を{開催|かいさい}している。", "o": ["コンサート", "コンクリート", "コンクール", "コンセント"], "a": 3, "ar": "concours", "vi": "Tòa soạn đó tổ chức cuộc thi viết luận toàn quốc về chính trị quốc tế.", "key": [{"w": "コンクール", "r": "コンクール", "hv": "—", "m": "cuộc thi (tiếng Pháp concours)"}], "x": {"1": "コンサート (hòa nhạc): không thi viết luận ở buổi hòa nhạc.", "2": "コンクリート (bê tông): vật liệu xây dựng — bẫy âm gần giống.", "4": "コンセント (ổ cắm điện): bẫy âm gần giống, khác nghĩa hoàn toàn."}, "n": ["Nhóm từ ngoại lai dễ nhầm vì cùng đầu コン〜."], "why": "論文の全国〜を開催 ＝ tổ chức <b>cuộc thi<\/b> viết luận toàn quốc. <b>コンクール<\/b> (concours) ＝ cuộc thi (âm nhạc, tranh, văn)."}, {"s": "暗いから（　）に気をつけてください。", "o": ["足音", "足早", "足元", "足跡"], "a": 3, "ar": "あしもと", "vi": "Trời tối, xin hãy cẩn thận dưới chân.", "key": [{"w": "足元", "r": "あしもと", "hv": "TÚC NGUYÊN", "m": "dưới chân, bước chân"}], "x": {"1": "足音 (tiếng bước chân): không liên quan đến việc trời tối dễ vấp.", "2": "足早 (bước vội): là trạng thái đi, không phải chỗ để “cẩn thận”.", "4": "足跡 (dấu chân): là vết để lại, không cần cẩn thận vì trời tối."}, "n": ["足元を見る: lợi dụng điểm yếu. Xem Đề 20 câu 19 (足元に用心)."], "why": "Trời tối → cẩn thận <b>dưới chân<\/b> (kẻo vấp ngã). Câu cố định <b>足元に気をつけて<\/b>."}, {"s": "道路の建設をめぐって住民同士が（　）している。", "o": ["対照", "対立", "対策", "対面"], "a": 2, "ar": "たいりつ", "vi": "Người dân đang mâu thuẫn với nhau xoay quanh việc làm đường.", "key": [{"w": "対立", "r": "たいりつ", "hv": "ĐỐI LẬP", "m": "đối lập, mâu thuẫn"}], "x": {"1": "対照 (đối chiếu, tương phản): dùng để so sánh hai thứ (対照的な性格). Người dân không “đối chiếu với nhau”.", "3": "対策 (biện pháp đối phó): 対策を立てる. Không dùng 住民同士が対策している.", "4": "対面 (gặp mặt trực tiếp): không mang nghĩa mâu thuẫn do bất đồng."}, "g": ["<b class=\"jp\">〜をめぐって<\/b>: xoay quanh (vấn đề tranh cãi)."], "n": ["同士 どうし: những người cùng… với nhau."], "why": "〜をめぐって (xoay quanh vấn đề) ＋ 住民同士 (người dân với nhau) → <b>đối lập, mâu thuẫn<\/b>. <b>対立する<\/b>: hai phe đối đầu."}, {"s": "固く{結|むす}んであるから、なかなか{靴|くつ}の（　）がほどけない。", "o": ["つな", "いと", "なわ", "ひも"], "a": 4, "ar": "紐", "vi": "Vì buộc chặt nên mãi không cởi được dây giày.", "key": [{"w": "紐", "r": "ひも", "hv": "NỮU", "m": "dây (buộc)"}], "x": {"1": "つな (綱: dây thừng to): dùng kéo co (綱引き), buộc tàu — quá to cho giày.", "2": "いと (糸: sợi chỉ): dùng để may, không phải dây buộc giày.", "3": "なわ (縄: dây thừng bện): dùng nhảy dây (縄跳び), buộc đồ — không phải dây giày."}, "g": ["<b class=\"jp\">なかなか〜ない<\/b>: mãi mà không."], "n": ["ほどける (tự) / ほどく (tha): tuột ra / cởi ra."], "why": "Thứ buộc trên giày và cởi ra (ほどける) là <b>dây giày<\/b>: <b>靴のひも<\/b> (紐)."}, {"s": "新聞の一面に{保険金詐欺事件|ほけんきんさぎじけん}が大きな（　）で出ている。", "o": ["見かけ", "見出し", "見本", "見方"], "a": 2, "ar": "みだし", "vi": "Vụ lừa đảo tiền bảo hiểm lên trang nhất báo với dòng tít lớn.", "key": [{"w": "見出し", "r": "みだし", "hv": "KIẾN XUẤT", "m": "tít, tiêu đề"}], "x": {"1": "見かけ (vẻ bề ngoài): nói về người, vật; báo không có “vẻ ngoài lớn”.", "3": "見本 (hàng mẫu): không liên quan đến trình bày tin trên báo.", "4": "見方 (cách nhìn): là quan điểm, không phải phần chữ in trên báo."}, "n": ["一面 いちめん: trang nhất. 詐欺 さぎ: lừa đảo."], "why": "Tin xuất hiện trên trang nhất với chữ lớn → <b>dòng tít<\/b>. <b>見出し<\/b> ＝ tiêu đề bài báo. 大きな見出しで出る là cách nói quen thuộc."}, {"s": "あすの水泳大会で（　）の結果が見られることを楽しみにしています。", "o": ["目的", "自慢", "覚悟", "努力"], "a": 4, "ar": "どりょく", "vi": "Tôi mong được thấy thành quả của sự nỗ lực ở giải bơi ngày mai.", "key": [{"w": "努力", "r": "どりょく", "hv": "NỖ LỰC", "m": "nỗ lực"}], "x": {"1": "目的 (mục đích): “kết quả của mục đích” không hợp nghĩa.", "2": "自慢 (khoe khoang, tự hào): “kết quả của sự khoe khoang” vô nghĩa.", "3": "覚悟 (chuẩn bị tinh thần đón điều xấu): không tạo ra “thành quả” ở giải bơi."}, "n": ["努力が報われる: nỗ lực được đền đáp."], "why": "Mong được thấy <b>thành quả<\/b> trong giải bơi → kết quả của <b>sự nỗ lực<\/b>. Cụm 努力の結果 (thành quả nỗ lực) rất tự nhiên."}, {"s": "{書物|しょもつ}の選択にあたってはもっと（　）にしなければなりませんよ。", "o": ["貴重", "重要", "重大", "慎重"], "a": 4, "ar": "しんちょう", "vi": "Khi chọn sách phải cẩn trọng hơn nữa đấy.", "key": [{"w": "慎重", "r": "しんちょう", "hv": "THẬN TRỌNG", "m": "thận trọng"}], "x": {"1": "貴重 (quý giá): tả giá trị của vật (貴重な資料), không tả thái độ của người chọn.", "2": "重要 (quan trọng): tả tầm quan trọng của sự việc; “phải làm quan trọng hơn” không tự nhiên.", "3": "重大 (nghiêm trọng, hệ trọng): tả sự việc (重大な事故), không tả cách hành động."}, "g": ["<b class=\"jp\">〜にあたって<\/b>: khi, nhân dịp (trang trọng)."], "n": ["Cả 4 đều có chữ 重, chỉ 慎重 mô tả thái độ hành động."], "why": "Khi chọn sách, cần <b>cẩn trọng<\/b> hơn. 〜にする (làm cho, hành động một cách) cần tính từ chỉ thái độ → <b>慎重<\/b> (thận trọng). 慎重にする / 慎重に選ぶ."}, {"s": "A「試験の成績、どうだった？」　B「（　）できたよ。」", "o": ["まあまあ", "ちっとも", "さっぱり", "あんまり"], "a": 1, "ar": "まあまあ", "vi": "A: Kết quả thi thế nào? B: Cũng tàm tạm.", "key": [{"w": "まあまあ", "r": "まあまあ", "hv": "—", "m": "tàm tạm, kha khá"}], "x": {"2": "ちっとも chỉ đi với phủ định (ちっとも分からない). できた khẳng định → sai.", "3": "さっぱり (hoàn toàn không) đi với phủ định (さっぱり分からない). Sai với できた.", "4": "あんまり (không… lắm) đi với phủ định (あんまりできなかった). Sai với できた."}, "n": ["Câu kết thúc bằng できた (khẳng định) nên loại các phó từ đi với phủ định."], "why": "Động từ できた ở thể <b>khẳng định<\/b> → cần phó từ dùng được với khẳng định. <b>まあまあ<\/b> ＝ tàm tạm, cũng được."}, {"s": "アインシュタインは{科学者|かがくしゃ}として（　）な{業績|ぎょうせき}を残した。", "o": ["高級", "上等", "豪華", "偉大"], "a": 4, "ar": "いだい", "vi": "Einstein để lại những thành tựu vĩ đại với tư cách nhà khoa học.", "key": [{"w": "偉大", "r": "いだい", "hv": "VĨ ĐẠI", "m": "vĩ đại"}, {"w": "業績", "r": "ぎょうせき", "hv": "NGHIỆP TÍCH", "m": "thành tựu"}], "x": {"1": "高級 (cao cấp): dùng cho hàng hóa, nhà hàng (高級車). Không dùng cho thành tựu.", "2": "上等 (thượng hạng): dùng cho chất lượng đồ vật (上等な肉).", "3": "豪華 (xa hoa, lộng lẫy): dùng cho bữa tiệc, trang trí (豪華な料理)."}, "g": ["<b class=\"jp\">Nとして<\/b>: với tư cách là."], "why": "業績 (thành tựu) của nhà khoa học → <b>vĩ đại<\/b>. <b>偉大な業績<\/b> là collocation cố định, dùng cho người và công trình lớn."}, {"s": "A「このノートパソコン、使わせていただいてもよろしいでしょうか。」　B「どうぞ、（　）。」", "o": ["ごえんりょなく", "おじゃましました", "おきのどくに", "かしこまりました"], "a": 1, "ar": "ご遠慮なく", "vi": "A: Tôi dùng chiếc laptop này được không ạ? B: Xin mời, cứ tự nhiên.", "key": [{"w": "ご遠慮なく", "r": "ごえんりょなく", "hv": "VIỄN LỰ", "m": "xin cứ tự nhiên"}], "x": {"2": "おじゃましました (tôi đã làm phiền): người khách nói khi ra về, không dùng để cho phép.", "3": "おきのどくに (thật đáng tiếc cho anh chị): câu chia buồn, sai tình huống.", "4": "かしこまりました (vâng, tôi hiểu rồi): người dưới nhận yêu cầu. Người cho phép không nói câu này."}, "g": ["<b class=\"jp\">使わせていただいてもよろしいでしょうか<\/b>: xin phép rất lịch sự."], "why": "A xin phép dùng laptop, B cho phép → <b>ご遠慮なく<\/b> (cứ tự nhiên, đừng ngại). どうぞ、ご遠慮なく là câu đáp cố định."}, {"s": "その{遊覧船|ゆうらんせん}の{乗客数|じょうきゃくすう}は定員を50人も（　）していた。", "o": ["過剰", "通過", "過失", "超過"], "a": 4, "ar": "ちょうか", "vi": "Số khách trên du thuyền vượt sức chứa tới 50 người.", "key": [{"w": "超過", "r": "ちょうか", "hv": "SIÊU QUÁ", "m": "vượt quá (định mức)"}, {"w": "定員", "r": "ていいん", "hv": "ĐỊNH VIÊN", "m": "số người quy định"}], "x": {"1": "過剰 (dư thừa): là tính từ/danh từ, không có dạng 過剰する nhận を (定員を過剰する sai).", "2": "通過 (đi qua): 駅を通過する — đi ngang qua chứ không phải “vượt quá”.", "3": "過失 (lỗi sơ suất): không phải động từ chỉ vượt mức."}, "n": ["[số lượng] + も: nhấn mạnh nhiều. 超過料金: phí vượt mức."], "why": "定員を50人も〜した ＝ <b>vượt<\/b> sức chứa 50 người. Động từ nhận tân ngữ を và chỉ vượt quá giới hạn là <b>超過する<\/b> (定員を超過する)."}, {"s": "私は子供の頃からパイロットになる夢を（　）きた。", "o": ["かかえて", "くだいて", "いだいて", "むかえて"], "a": 3, "ar": "抱く → いだく", "vi": "Từ nhỏ tôi đã luôn ấp ủ ước mơ làm phi công.", "key": [{"w": "抱く", "r": "いだく", "hv": "BÃO", "m": "ấp ủ (ước mơ, cảm xúc)"}], "x": {"1": "かかえる (ôm, gánh): dùng cho vấn đề, gánh nặng (問題を抱える). Ước mơ là điều tích cực nên dùng 抱く.", "2": "くだく (đập vỡ): ngược nghĩa; “đập tan ước mơ” mới dùng 夢を砕く — câu này nói ấp ủ từ nhỏ.", "4": "むかえる (đón): không “đón ước mơ”."}, "g": ["<b class=\"jp\">Vてきた<\/b>: đã làm liên tục từ quá khứ đến nay."], "n": ["抱く だく: ôm (vật lý); いだく: ấp ủ (trừu tượng): 疑問を抱く, 不安を抱く."], "why": "Tân ngữ là 夢 (ước mơ) và có từ nhỏ đến giờ (〜てきた) → <b>ấp ủ<\/b>. <b>夢を抱く<\/b> đọc <b>いだく<\/b> (văn trang trọng)."}, {"s": "そろそろお茶の時間だね。（　）、昨日買ったクッキーどうした？", "o": ["そういえば", "なぜなら", "それとも", "だって"], "a": 1, "ar": "そう言えば", "vi": "Sắp đến giờ uống trà rồi nhỉ. Nhắc mới nhớ, bánh quy mua hôm qua đâu rồi?", "key": [{"w": "そういえば", "r": "そういえば", "hv": "—", "m": "nhắc mới nhớ"}], "x": {"2": "なぜなら (bởi vì): câu sau phải là lý do của câu trước. Câu hỏi về bánh quy không giải thích lý do.", "3": "それとも (hay là): nối hai lựa chọn trong câu hỏi (AそれともB). Không có lựa chọn ở đây.", "4": "だって (vì, nhưng mà — biện minh): dùng để bào chữa, không dùng để chuyển chủ đề."}, "why": "Đang nói giờ uống trà thì <b>chợt nhớ ra<\/b> chuyện bánh quy. Liên từ <b>そういえば<\/b> ＝ nhắc mới nhớ, chuyển sang chủ đề liên quan."}, {"s": "（　）のメンバーは10時に{競技場|きょうぎじょう}に集まることになっている。", "o": ["サービス", "ゲスト", "ライバル", "チーム"], "a": 4, "ar": "team", "vi": "Các thành viên đội theo kế hoạch sẽ tập trung ở sân thi đấu lúc 10 giờ.", "key": [{"w": "チーム", "r": "チーム", "hv": "—", "m": "đội"}], "x": {"1": "サービス (dịch vụ): “thành viên dịch vụ” vô nghĩa.", "2": "ゲスト (khách mời): khách mời không tập trung theo lịch thi đấu như thành viên.", "3": "ライバル (đối thủ): đối thủ không có “thành viên” tập trung theo kế hoạch của mình."}, "g": ["<b class=\"jp\">〜ことになっている<\/b>: theo quy định/kế hoạch."], "why": "〜のメンバー tập trung ở sân thi đấu (競技場) → <b>thành viên đội<\/b>. <b>チーム<\/b>のメンバー."}, {"s": "その店はここから（　）10分ほど歩いたところにあります。", "o": ["ほんの", "はるかに", "とっくに", "めっきり"], "a": 1, "ar": "ほんの", "vi": "Cửa hàng đó chỉ cách đây chừng 10 phút đi bộ.", "key": [{"w": "ほんの", "r": "ほんの", "hv": "—", "m": "chỉ (một chút)"}], "x": {"2": "はるかに (hơn hẳn): dùng trong so sánh (はるかに大きい), không đứng trước số phút.", "3": "とっくに (từ lâu rồi): đi với hành động đã xong (とっくに終わった).", "4": "めっきり (rõ rệt): tả sự thay đổi (めっきり寒くなった)."}, "n": ["ほんの少し, ほんの気持ちです (chút lòng thành)."], "why": "10分ほど (khoảng 10 phút) → nhấn mạnh <b>chỉ có<\/b> chừng đó (gần). <b>ほんの<\/b>＋số lượng nhỏ ＝ chỉ, vẻn vẹn."}, {"s": "熱いコーヒーのおかげで{凍|こご}えていた{指先|ゆびさき}に（　）が戻ってきた。", "o": ["感激", "感動", "感情", "感覚"], "a": 4, "ar": "かんかく", "vi": "Nhờ cà phê nóng mà đầu ngón tay đang cóng đã có cảm giác trở lại.", "key": [{"w": "感覚", "r": "かんかく", "hv": "CẢM GIÁC", "m": "cảm giác (giác quan)"}, {"w": "凍える", "r": "こごえる", "hv": "ĐÔNG", "m": "cóng, rét cóng"}], "x": {"1": "感激 (xúc động mạnh): là cảm xúc trong lòng, không phải xúc giác ở ngón tay.", "2": "感動 (cảm động): cảm xúc, không phải cảm giác vật lý.", "3": "感情 (tình cảm, cảm xúc): ngón tay không có “tình cảm”."}, "why": "Ngón tay đang tê cóng, nhờ cà phê nóng mà <b>cảm giác<\/b> (xúc giác) trở lại → <b>感覚<\/b>."}, {"s": "彼のピアノ演奏はプロの（　）に達している。", "o": ["スタイル", "ゴール", "パターン", "レベル"], "a": 4, "ar": "level", "vi": "Màn biểu diễn piano của anh ấy đã đạt trình độ chuyên nghiệp.", "key": [{"w": "レベル", "r": "レベル", "hv": "—", "m": "trình độ, mức"}], "x": {"1": "スタイル (phong cách): không “đạt tới” phong cách theo nghĩa mức độ.", "2": "ゴール (đích): ゴールに達する có thể dùng cho đích đến, nhưng “đích của dân chuyên” không hợp nghĩa.", "3": "パターン (khuôn mẫu): không phải mức độ để đạt tới."}, "g": ["<b class=\"jp\">〜に達する<\/b>: đạt tới."], "why": "〜に達する (đạt đến) một mức → <b>trình độ<\/b>. <b>プロのレベルに達する<\/b> ＝ đạt trình độ chuyên nghiệp."}, {"s": "（　）ようですが、６時までには必ず来てくださいね。", "o": ["えらい", "かゆい", "ゆるい", "くどい"], "a": 4, "ar": "くどい", "vi": "Biết là nói lại thì hơi dài dòng, nhưng nhất định phải đến trước 6 giờ nhé.", "key": [{"w": "くどい", "r": "くどい", "hv": "—", "m": "dài dòng, lặp đi lặp lại"}], "x": {"1": "えらい (giỏi, đáng nể; vất vả): えらいようですが không phải câu rào đón.", "2": "かゆい (ngứa): không liên quan.", "3": "ゆるい (lỏng, dễ dãi): không phải câu rào đón khi nhắc lại."}, "n": ["くどいようですが: câu mào đầu khi dặn lại."], "why": "Nhắc lại điều đã dặn (phải đến trước 6 giờ) → người nói rào trước: <b>くどいようですが<\/b> ＝ biết là nhắc đi nhắc lại thì dài dòng, nhưng… — câu rào đón cố định."}], "sum": [{"h": "Dấu hiệu nhận biết nhanh trong 文脈規定", "li": ["<b>Phó từ đi với phủ định<\/b>: ちっとも, さっぱり, あんまり, 必ずしも, 少しも, めったに. Câu khẳng định → loại ngay (câu 10, câu 2).", "<b>Câu giao tiếp cố định<\/b>: どうぞご遠慮なく (cứ tự nhiên), くどいようですが (nhắc lại thì dài dòng nhưng), お邪魔しました, お気の毒に, かしこまりました.", "<b>Liên từ<\/b>: そういえば (nhắc mới nhớ), なぜなら (bởi vì — câu sau là lý do), それとも (hay là — lựa chọn), だって (vì — bào chữa).", "<b>Từ ngoại lai na ná nhau<\/b>: コンクール (cuộc thi) / コンサート / コンクリート / コンセント — đọc kỹ từng chữ."]}, {"h": "Nhóm từ cùng chữ đầu trong đề", "tbl": {"head": ["Nhóm", "Các từ", "Phân biệt"], "rows": [["足〜", "足元 / 足音 / 足跡 / 足早", "dưới chân / tiếng bước / dấu chân / bước vội"], ["見〜", "見出し / 見かけ / 見本 / 見方", "tít báo / bề ngoài / hàng mẫu / cách nhìn"], ["対〜", "対立 / 対照 / 対策 / 対面", "đối lập / tương phản / biện pháp / gặp mặt"], ["〜重", "慎重 / 貴重 / 重要 / 重大", "thận trọng / quý / quan trọng / hệ trọng"], ["感〜", "感覚 / 感激 / 感動 / 感情", "cảm giác / xúc động mạnh / cảm động / tình cảm"], ["過〜", "超過 / 過剰 / 通過 / 過失", "vượt mức / dư thừa / đi qua / sơ suất"]]}}, {"h": "Dây và vật buộc", "li": ["ひも (紐): dây nhỏ — 靴ひも, ひもを結ぶ / ほどく.", "なわ (縄): dây thừng bện — 縄跳び, 縄で縛る. つな (綱): dây thừng to — 綱引き, 命綱 (dây cứu sinh).", "いと (糸): chỉ — 針と糸. コード: dây điện. ロープ: dây thừng (ngoại lai).", "Động từ: 結ぶ むすぶ (buộc), ほどく (cởi), 縛る しばる (trói), ほどける (bị tuột)."]}, {"h": "Phó từ mở rộng cùng nhóm", "tbl": {"head": ["Phó từ", "Nghĩa", "Ví dụ"], "rows": [["どうしても", "nhất định; dù thế nào cũng (không)", "どうしても行きたい / どうしても分からない"], ["ほんの", "chỉ, vẻn vẹn (+ lượng nhỏ)", "ほんの少し, ほんの気持ちです"], ["はるかに", "hơn hẳn", "はるかに高い"], ["とっくに", "từ lâu rồi", "とっくに帰った"], ["めっきり", "rõ rệt (thay đổi)", "めっきり寒くなった"], ["まあまあ", "tàm tạm", "まあまあの出来"], ["くれぐれも", "xin hết sức (dặn dò)", "くれぐれもよろしく"]]}}], "source": {"folder": "https://drive.google.com/drive/folders/1wQmVMGk71d-DyTdtNUoH0uI5iwTnDzzR", "goc": "https://drive.google.com/file/d/1PjfVzIWN-lrCZsBjjk2WzAqDdAoEHrUf/view", "chua": "https://drive.google.com/file/d/1pH0gwQBUpahsczxDY21_7b53x7fe2GoO/view"}, "series": "DORA Nihongo · Đề 8 · Từ vựng N5–N2 trúng tủ"}, {"no": 9, "folderLabel": "Ngữ pháp", "cat": "Ngữ pháp", "file": "ĐỀ 15 - NGỮ PHÁP N2", "title": "Đề 9 · Ngữ pháp N2", "jp": "文法形式", "mondai": "<b>問題7<\/b> 次の文の（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。 Chọn mẫu ngữ pháp thích hợp nhất để điền vào chỗ trống.", "qs": [{"s": "お忙しい（　）おいでくださいまして、ありがとうございます。", "o": ["ところを", "ものを", "あいだを", "ことを"], "a": 1, "ar": "〜ところを", "vi": "Cảm ơn anh chị đã đến dù đang bận.", "key": [{"w": "〜ところを", "r": "ところを", "hv": "—", "m": "trong lúc (người nghe đang…), dùng khi cảm ơn/xin lỗi"}], "x": {"2": "〜ものを (giá mà… vậy mà — tiếc nuối, trách): 言えばいいものを. Câu cảm ơn không có ý trách.", "3": "あいだを: không có mẫu “お忙しいあいだを”. 〜あいだに chỉ khoảng thời gian, không mang nghĩa “dù đang bận”.", "4": "ことを: “お忙しいことを” không tạo thành câu cảm ơn; ことを cần động từ phía sau nhận nó làm tân ngữ."}, "g": ["<b class=\"jp\">お忙しいところを / お休みのところを + すみません/ありがとう<\/b>."], "n": ["おいでくださる: kính ngữ của 来てくれる."], "why": "Câu cảm ơn lịch sự khi người kia <b>đang bận mà vẫn đến<\/b>. Mẫu cố định <b>お忙しいところを<\/b>＋(わざわざ)〜くださって: trong lúc (anh chị) đang… vậy mà. Dùng trong thư từ, phát biểu."}, {"s": "かたくるしいあいさつは（　）さっそく一杯やりましょう。", "o": ["抜きつつ", "抜いても", "抜きにして", "抜きながら"], "a": 3, "ar": "〜は抜きにして", "vi": "Bỏ qua mấy lời chào hỏi khách sáo đi, làm một ly luôn nào!", "key": [{"w": "〜を/は抜きにして", "r": "ぬきにして", "hv": "BẠT", "m": "bỏ qua, không kể đến"}, {"w": "堅苦しい", "r": "かたくるしい", "hv": "KIÊN KHỔ", "m": "câu nệ, gò bó"}], "x": {"1": "抜きつつ: 〜つつ (vừa… vừa) chỉ hai hành động đồng thời; “vừa bỏ chào hỏi vừa uống” không phải nghĩa của mẫu này.", "2": "抜いても (dù có rút ra): nghĩa nhượng bộ, không phải đề nghị bỏ qua.", "4": "抜きながら (vừa rút ra vừa): 抜く ở đây là động từ “rút”, không mang nghĩa “bỏ qua chào hỏi”."}, "n": ["Biến thể: 抜きで (Đề 18 câu 9), 抜きには語れない (không thể nói mà bỏ qua)."], "why": "Đề nghị <b>bỏ qua<\/b> chào hỏi khách sáo để uống luôn. Mẫu <b>Nは抜きにして<\/b> (= Nは抜きで): bỏ qua N, không có N."}, {"s": "一時的に（　）、両国の{戦闘|せんとう}が{休戦状態|きゅうせんじょうたい}に入ったことは{慶賀|けいが}すべきことだ。", "o": ["だけ", "つけ", "しか", "せよ"], "a": 4, "ar": "〜にせよ", "vi": "Dù chỉ là tạm thời, việc giao tranh giữa hai nước đi vào đình chiến là điều đáng mừng.", "key": [{"w": "〜にせよ", "r": "にせよ", "hv": "—", "m": "dù là… đi nữa (= にしろ, にしても)"}], "x": {"1": "一時的にだけ (chỉ tạm thời): không có nghĩa nhượng bộ “dù… nhưng vẫn”, câu sau bị đứt mạch.", "2": "一時的につけ: 〜につけ (hễ… là) đi với động từ cảm nhận (見るにつけ) hoặc cặp 〜につけ〜につけ. Không dùng ở đây.", "3": "〜しか cần phủ định đi sau (しか〜ない). Câu không có phủ định."}, "g": ["<b class=\"jp\">Vるべき<\/b>: nên, đáng (慶賀すべき: đáng chúc mừng)."], "why": "Vế trước nhượng bộ: <b>dù chỉ là tạm thời<\/b>, vế sau vẫn đáng mừng. Mẫu <b>〜にせよ<\/b> (= 〜にしても): dù là… đi nữa. 一時的にせよ."}, {"s": "去年の夏休みは宿題に{追|お}われていて、旅行（　）。", "o": ["はずではなかった", "までもなかった", "ことではなかった", "どころではなかった"], "a": 4, "ar": "〜どころではない", "vi": "Hè năm ngoái tôi ngập trong bài tập, chẳng còn tâm trí đâu mà đi du lịch.", "key": [{"w": "〜どころではない", "r": "どころではない", "hv": "—", "m": "không phải lúc để…, không có tâm trí…"}], "x": {"1": "〜はずではなかった (lẽ ra không phải thế): diễn tả kết quả trái dự tính. Câu nói về không có thời gian, không nói về dự tính.", "2": "〜までもなかった (không cần phải): ý là việc đó thừa. Du lịch không phải việc “không cần thiết”.", "3": "〜ことではなかった (không phải là chuyện…): không diễn tả hoàn cảnh bận bịu."}, "g": ["<b class=\"jp\">〜に追われる<\/b>: bị cuốn vào, bận ngập đầu (仕事に追われる)."], "why": "Bị bài tập vây kín → <b>không còn tâm trí / hoàn cảnh nào<\/b> để đi du lịch. Mẫu <b>Nどころではない<\/b>: không phải lúc để…"}, {"s": "A「あしたのパーティーに行きたくないの？」　B「行きたくないこと（　）ないけど、あまり気が進まないんだ。」", "o": ["は", "と", "さえ", "まで"], "a": 1, "ar": "〜ないことはない", "vi": "A: Mai cậu không muốn đi tiệc à? B: Không hẳn là không muốn, chỉ là không hào hứng lắm.", "key": [{"w": "〜ないことはない", "r": "ないことはない", "hv": "—", "m": "không phải là không… (khẳng định yếu)"}, {"w": "気が進まない", "r": "きがすすまない", "hv": "—", "m": "không hào hứng"}], "x": {"2": "ないことと: không có mẫu “ないこととない”.", "3": "さえ (ngay cả): “ngay cả không muốn cũng không có” — không thành nghĩa.", "4": "まで (đến cả): tương tự, không tạo mẫu khẳng định dè dặt."}, "n": ["Biến thể: 〜ないこともない. Xem Đề 18 câu 4 (言えないこともない)."], "why": "B trả lời dè dặt: không phải là không muốn đi, nhưng không hào hứng. Mẫu <b>〜ないことはない<\/b>: không phải là không… (khẳng định yếu). Chỗ trống là trợ từ <b>は<\/b>."}, {"s": "私が留学できたのは、両親のおかげ（　）。", "o": ["にほかならない", "のかいがない", "になくてはならない", "ではいられない"], "a": 1, "ar": "〜にほかならない", "vi": "Tôi đi du học được chính là nhờ bố mẹ.", "key": [{"w": "〜にほかならない", "r": "にほかならない", "hv": "(他)", "m": "chính là, không gì khác ngoài"}], "x": {"2": "〜かいがない (không bõ công): 努力したかいがない. Ngược nghĩa câu cảm ơn bố mẹ.", "3": "なくてはならない ở đây đứng sau に nghĩa là “không thể thiếu đối với…” (Nにとってなくてはならない). “Là nhờ bố mẹ, không thể thiếu” sai cấu trúc.", "4": "〜ではいられない (không thể cứ… được): diễn tả không kìm được, không hợp."}, "g": ["<b class=\"jp\">〜のは〜にほかならない<\/b>: khẳng định nguyên nhân duy nhất."], "n": ["Xem Đề 18 câu 3 (憎しみにほかならない)."], "why": "Khẳng định mạnh: lý do đi du học được <b>chính là<\/b> nhờ bố mẹ. Mẫu <b>Nにほかならない<\/b>: chính là, không gì khác ngoài. Hay đi với 〜のは〜のおかげ／ため."}, {"s": "台風の{上陸|じょうりく}に（　）、{九州地方|きゅうしゅうちほう}に{警戒警報|けいかいけいほう}が{発令|はつれい}されました。", "o": ["わたって", "ともなって", "比べて", "反して"], "a": 2, "ar": "〜に伴って", "vi": "Cùng với việc bão đổ bộ, lệnh cảnh báo đã được ban bố ở vùng Kyushu.", "key": [{"w": "〜に伴って", "r": "にともなって", "hv": "BẠN", "m": "cùng với, kéo theo"}, {"w": "上陸", "r": "じょうりく", "hv": "THƯỢNG LỤC", "m": "đổ bộ"}], "x": {"1": "〜にわたって (suốt, trải dài): đi với khoảng thời gian/không gian (3日間にわたって). 上陸 là một sự kiện.", "3": "〜に比べて (so với): không có gì được so sánh ở đây.", "4": "〜に反して (trái với): bão đổ bộ và ra cảnh báo không trái ngược nhau."}, "n": ["Dạng bổ nghĩa danh từ: N1 に伴う N2 (Đề 18 câu 8)."], "why": "Bão đổ bộ → <b>đi kèm theo đó<\/b> là lệnh cảnh báo. Mẫu <b>Nに伴って<\/b>: cùng với, kèm theo (sự thay đổi kéo theo)."}, {"s": "うちにコンピューターがすでにある（　）、新しいのが出るとほしくなる。", "o": ["をもとにして", "とすれば", "にもかかわらず", "にそって"], "a": 3, "ar": "〜にもかかわらず", "vi": "Dù ở nhà đã có máy tính, cứ có mẫu mới ra là tôi lại muốn mua.", "key": [{"w": "〜にもかかわらず", "r": "にもかかわらず", "hv": "—", "m": "mặc dù, bất chấp"}], "x": {"1": "〜をもとにして (dựa trên): cần một cơ sở, chất liệu (事実をもとにして). Không nối mệnh đề trái ngược.", "2": "〜とすれば (nếu giả sử): mệnh đề giả định — nhưng việc có máy tính là sự thật (すでにある).", "4": "〜にそって (theo, dọc theo): đi với danh từ (方針にそって), không đi sau động từ ある."}, "n": ["Xem Đề 18 câu 6."], "why": "Đã có máy tính <b>mà vẫn<\/b> muốn mua máy mới → quan hệ trái ngược. Mẫu <b>thể thường＋にもかかわらず<\/b>: mặc dù. ある＋にもかかわらず → đúng."}, {"s": "たぶん来るだろうという{予想|よそう}に（　）、彼は来なかった。", "o": ["限って", "反して", "際して", "対して"], "a": 2, "ar": "〜に反して", "vi": "Trái với dự đoán rằng có lẽ anh ấy sẽ đến, anh ấy đã không đến.", "key": [{"w": "〜に反して", "r": "にはんして", "hv": "PHẢN", "m": "trái với (dự đoán, kỳ vọng)"}], "x": {"1": "〜に限って (riêng… thì; đúng lúc… lại): 予想に限って không có nghĩa.", "3": "〜に際して (nhân dịp, khi): đi với sự kiện (出発に際して). Không đi với 予想.", "4": "〜に対して (đối với; trái lại): 予想に対して nghĩa là “đối với dự đoán”, không diễn tả kết quả trái ngược tự nhiên như に反して."}, "n": ["予想に反して, 期待に反して. Xem Đề 18 câu 2."], "why": "Dự đoán là sẽ đến nhưng thực tế không đến → <b>trái với<\/b> dự đoán. Mẫu <b>予想に反して<\/b> là collocation cố định (期待に反して, 意に反して)."}, {"s": "技術に（　）劣る他社の商品が売れる理由が分からない。", "o": ["さしても", "おいても", "あたっても", "とっても"], "a": 2, "ar": "〜においても", "vi": "Tôi không hiểu vì sao sản phẩm của công ty khác, vốn kém cả về mặt kỹ thuật, lại bán chạy.", "key": [{"w": "〜において", "r": "において", "hv": "—", "m": "ở, về mặt (trang trọng)"}, {"w": "劣る", "r": "おとる", "hv": "LIỆT", "m": "kém hơn"}], "x": {"1": "にさしても: không có mẫu này.", "3": "〜にあたっても (khi bắt đầu việc gì): đi với hành động quan trọng (開始にあたって), không đi với 技術.", "4": "〜にとっても (đối với ai cũng): chủ thể phải là người/tổ chức chịu tác động, không phải 技術."}, "n": ["Trái nghĩa của 劣る: 勝る まさる, 優れる すぐれる."], "why": "Sản phẩm công ty khác kém <b>cả về mặt<\/b> kỹ thuật. Mẫu <b>Nにおいても<\/b> (= Nの面でも): cả trong lĩnh vực, phương diện N."}, {"s": "そのころ母は英語の教師（　）中学校で働いていた。", "o": ["からいって", "に限って", "をのぞいて", "として"], "a": 4, "ar": "〜として", "vi": "Hồi đó mẹ tôi làm giáo viên tiếng Anh ở một trường cấp hai.", "key": [{"w": "〜として", "r": "として", "hv": "—", "m": "với tư cách là"}], "x": {"1": "〜からいって (xét từ): 経験からいって. Không nêu vai trò.", "2": "〜に限って (riêng): không hợp nghĩa “làm ở trường với vai trò giáo viên”.", "3": "〜をのぞいて (ngoại trừ): mâu thuẫn — mẹ chính là giáo viên."}, "why": "Mẹ làm việc ở trường <b>với tư cách<\/b> giáo viên tiếng Anh. Mẫu <b>Nとして<\/b>: với tư cách, vai trò N."}, {"s": "{良|よ}き（　）{悪|あ}しき（　）、もうその話はどんどん進行しているのだから、なりゆきを見守りましょう。", "o": ["につけ／につけ", "にあり／にあり", "でも／でも", "とも／とも"], "a": 1, "ar": "〜につけ〜につけ", "vi": "Dù tốt hay xấu thì chuyện đó cũng đang tiến triển nhanh rồi, ta cứ theo dõi diễn biến thôi.", "key": [{"w": "AにつけBにつけ", "r": "につけ", "hv": "—", "m": "dù A hay B (cặp đối lập)"}, {"w": "成り行き", "r": "なりゆき", "hv": "THÀNH HÀNH", "m": "diễn biến, chiều hướng"}], "x": {"2": "にあり／にあり: không có mẫu này.", "3": "でも／でも (dù… hay…): đi với danh từ hiện đại (雨でも雪でも). 良き／悪しき là dạng cổ chỉ đi trong thành ngữ với につけ.", "4": "とも／とも: có mẫu 〜とも〜とも nhưng không ghép với 良き/悪しき theo thành ngữ này."}, "n": ["Cụm cố định: 良きにつけ悪しきにつけ, 雨につけ風につけ. 〜につけ còn: hễ… là (写真を見るにつけ思い出す)."], "why": "Cặp văn cổ <b>良きにつけ悪しきにつけ<\/b>: dù tốt hay xấu (thành ngữ cố định). 〜につけ〜につけ ＝ cả khi… lẫn khi…"}], "sum": [{"h": "Nhóm mẫu “Nに＋động từ” (dạng hay ra nhất N2)", "tbl": {"head": ["Mẫu", "Nghĩa", "Ví dụ"], "rows": [["〜に伴って", "cùng với (thay đổi kéo theo)", "台風の上陸に伴って"], ["〜に反して", "trái với (dự đoán, kỳ vọng)", "予想に反して"], ["〜に際して", "nhân dịp, khi (trang trọng)", "出発に際して"], ["〜に対して", "đối với; trái lại", "親に対して, 兄は〜のに対して弟は〜"], ["〜において / においても", "tại, trong lĩnh vực", "技術においても劣る"], ["〜にわたって", "suốt, trải khắp", "3日間にわたって"], ["〜にそって", "theo, dọc theo", "方針にそって"], ["〜にあたって", "khi bắt đầu (việc quan trọng)", "開店にあたって"], ["〜に限って", "riêng; đúng lúc… lại", "急いでいる時に限って"], ["〜にとって", "đối với (ai)", "私にとって大切だ"]]}}, {"h": "Khẳng định mạnh và khẳng định dè dặt", "li": ["<b>Mạnh<\/b>: 〜にほかならない (chính là), 〜に違いない (chắc chắn), 〜に決まっている (đương nhiên).", "<b>Dè dặt<\/b>: 〜ないことはない / 〜ないこともない (không phải là không), 〜なくもない.", "<b>Không thể / không phải lúc<\/b>: 〜どころではない (không phải lúc), 〜わけにはいかない (không thể vì đạo lý), 〜ようがない (không có cách)."]}, {"h": "Nhượng bộ “dù… thì”", "tbl": {"head": ["Mẫu", "Sắc thái", "Ví dụ"], "rows": [["〜にせよ / 〜にしろ / 〜にしても", "dù… đi nữa", "一時的にせよ"], ["〜にもかかわらず", "mặc dù (văn viết)", "雨にもかかわらず"], ["〜くせに", "vậy mà (chê trách)", "知っているくせに"], ["〜ところを", "dù đang… (cảm ơn, xin lỗi)", "お忙しいところを"], ["〜につけ〜につけ", "dù… hay…", "良きにつけ悪しきにつけ"], ["〜であれ〜であれ", "dù là… hay…", "大人であれ子どもであれ"]]}}, {"h": "Mẫu “bỏ qua / không có”", "li": ["<b>Nは抜きにして / N抜きで<\/b>: bỏ qua N (あいさつは抜きにして).", "<b>Nを抜きにしては〜ない<\/b>: nếu không có N thì không thể (彼の協力を抜きにしては成功しなかった).", "<b>Nなしに / Nなしでは<\/b>: không có N (許可なしに入るな).", "<b>〜ことなく<\/b>: mà không (休むことなく働く)."]}], "source": {"folder": "https://drive.google.com/drive/folders/1Mloi48ZJW7ey0zF8RXFmzOPu12C2nQo-", "goc": "https://drive.google.com/file/d/1mbY3rDbnngBhgV38xiQc2zHyVuoDuHWU/view", "chua": "https://drive.google.com/file/d/1Ofpl0Fx8Zpzwzh9j38vPzQeHOctPG-1d/view"}, "series": "DORA Nihongo · Đề 9 · Ngữ pháp N5–N2 trúng tủ"}, {"no": 10, "folderLabel": "Kanji", "cat": "Kanji", "file": "ĐỀ 16 - KANJI N2", "title": "Đề 10 · Kanji N2", "jp": "漢字読み", "mondai": "<b>問題1<\/b> ＿＿の言葉の読み方として最もよいものを、1・2・3・4から一つ選びなさい。 Chọn cách đọc đúng nhất cho từ được gạch chân.", "qs": [{"s": "時計の_針_は12時を指していた。", "o": ["たか", "はしら", "くぎ", "はり"], "a": 4, "ar": "針", "vi": "Kim đồng hồ đang chỉ 12 giờ.", "key": [{"w": "針", "r": "はり", "hv": "CHÂM", "m": "cây kim"}], "x": {"1": "たか là 鷹 (chim ưng). Chữ khác; đồng hồ không có “chim ưng”.", "2": "はしら là 柱 (cột). Chữ khác (bộ 木); 時計の柱 vô nghĩa.", "3": "くぎ là 釘 (cái đinh). Bẫy cùng bộ 金 (kim loại) với 針, nhưng là chữ khác."}, "n": ["On しん: 方針 ほうしん (phương châm), 針葉樹. 指す さす: chỉ."], "why": "針 âm Kun đọc <b>はり<\/b>: cây kim. Ngữ cảnh 時計の針 (kim đồng hồ) 〜を指す (chỉ vào) khớp nghĩa. Âm On là しん (方針, 針路)."}, {"s": "晴れている日は、この山頂からすばらしい_景色_が見える。", "o": ["けいろ", "けいいろ", "けしき", "けいしき"], "a": 3, "ar": "景色", "vi": "Những ngày trời quang, từ đỉnh núi này có thể ngắm cảnh tuyệt đẹp.", "key": [{"w": "景色", "r": "けしき", "hv": "CẢNH SẮC", "m": "phong cảnh"}], "x": {"1": "けいろ là 経路 (lộ trình). Khác chữ; 色 không đọc ろ.", "2": "けいいろ: không có từ này. Ghép âm On けい với Kun いろ — sai.", "4": "けいしき là 形式 (hình thức). Bẫy vì 景 đọc けい ở 景気, 風景, nhưng riêng 景色 đọc けしき."}, "n": ["景色 là cách đọc đặc biệt (熟字訓): け + しき. Thường: 景 けい (風景, 景気), 色 しょく/いろ."], "why": "景色 là từ đọc đặc biệt (熟字訓, nằm trong bảng phụ lục chữ Hán thông dụng): <b>けしき<\/b>, không đọc けいしょく. Ngữ cảnh ngắm cảnh từ đỉnh núi → cảnh sắc."}, {"s": "彼女は私の_隣_に座った。", "o": ["おもて", "わき", "となり", "うら"], "a": 3, "ar": "隣", "vi": "Cô ấy ngồi xuống cạnh tôi.", "key": [{"w": "隣", "r": "となり", "hv": "LÂN", "m": "bên cạnh (sát, cùng hàng)"}], "x": {"1": "おもて là 表 (mặt trước, bên ngoài). Chữ khác.", "2": "わき là 脇 (nách, bên cạnh). Nghĩa gần nhưng là chữ khác; 隣 không đọc わき.", "4": "うら là 裏 (mặt sau). Chữ khác, nghĩa khác."}, "n": ["On りん: 近隣 きんりん (lân cận). 隣人 りんじん: hàng xóm."], "why": "隣 âm Kun <b>となり<\/b>: bên cạnh (sát cạnh, cùng loại: 隣の席, 隣の家). Ngữ cảnh 私の隣に座った khớp nghĩa."}, {"s": "この際、{堅苦|かたくる}しいあいさつは_省略_しましょう。", "o": ["せいりゃく", "しょうりゃく", "せいやく", "しょうやく"], "a": 2, "ar": "省略", "vi": "Nhân dịp này, ta bỏ qua mấy lời chào hỏi khách sáo đi.", "key": [{"w": "省略", "r": "しょうりゃく", "hv": "TỈNH LƯỢC", "m": "lược bớt"}], "x": {"1": "せいりゃく: không có từ này. 省 đọc せい chỉ ở 反省, 帰省; trong 省略 đọc しょう.", "3": "せいやく là 制約 (ràng buộc). Sai cả hai chữ; 略 phải là りゃく.", "4": "しょうやく: 省 đúng nhưng 略 thiếu âm ghép — phải là りゃく, không phải やく."}, "n": ["省 しょう: 省エネ, 文部科学省. 略 りゃく: 略す, 戦略. Xem Đề 9 câu 2 (かたくるしい)."], "why": "省 có hai âm: せい (反省) và <b>しょう<\/b> (省略, 省エネ). 略 đọc <b>りゃく<\/b>. 省略 ＝ <b>しょうりゃく<\/b>: lược bỏ. Ngữ cảnh bỏ qua chào hỏi khách sáo khớp nghĩa."}, {"s": "娘の運動会をビデオで_撮影_した。", "o": ["さつえい", "さいげい", "さいえい", "さつげい"], "a": 1, "ar": "撮影", "vi": "Tôi quay video hội thao của con gái.", "key": [{"w": "撮影", "r": "さつえい", "hv": "TOÁT ẢNH", "m": "quay phim, chụp ảnh"}], "x": {"2": "さいげい: không có từ này. Sai cả hai chữ.", "3": "さいえい: không có từ này. 影 đúng là えい nhưng 撮 đọc さつ, không phải さい.", "4": "さつげい: không có từ này. 撮 đúng nhưng 影 đọc えい (âm trong), không phải げい."}, "n": ["撮る とる: chụp. 影 えい / かげ (bóng). Xem Đề 11 câu 3."], "why": "撮 đọc <b>さつ<\/b> (Kun: 撮る とる), 影 đọc <b>えい<\/b> ＝ <b>さつえい<\/b>: quay phim, chụp ảnh. Ngữ cảnh ビデオで〜した khớp nghĩa."}, {"s": "彼女は楽な_姿勢_で座っていた。", "o": ["しせい", "うんせい", "きせい", "じょうせい"], "a": 1, "ar": "姿勢", "vi"
