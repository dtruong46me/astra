<title>Đề 7 Từ vựng N2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho:wght@400;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Klee+One:wght@600&display=swap">
<style>
/* Layout: one exam sheet column; sticky answer bar on top; each question is a row of the sheet with a mark-sheet answer strip and a fold-out correction note. */
:root {
  --paper: #f6f7f9;
  --sheet: #ffffff;
  --ink: #1d2433;
  --ink-soft: #566074;
  --rule: #dfe3ea;
  --ai: #2b4a8b;          /* 藍 indigo: marks, links */
  --ai-wash: #e8edf7;
  --shu: #d2352b;         /* 朱 red pen: grading */
  --shu-wash: #fbeceb;
  --ok: #1f7a4d;
  --ok-wash: #e6f4ec;
  --font-jp: "BIZ UDPMincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-pen: "Klee One", "Be Vietnam Pro", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12151b; --sheet: #1a1e26; --ink: #e6e9ef; --ink-soft: #9aa3b5; --rule: #2c323e;
    --ai: #8fb0f0; --ai-wash: #22304a; --shu: #ff7b6e; --shu-wash: #3a2224; --ok: #6fd3a0; --ok-wash: #1d3329;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12151b; --sheet: #1a1e26; --ink: #e6e9ef; --ink-soft: #9aa3b5; --rule: #2c323e;
  --ai: #8fb0f0; --ai-wash: #22304a; --shu: #ff7b6e; --shu-wash: #3a2224; --ok: #6fd3a0; --ok-wash: #1d3329;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; }
a { color: var(--ai); }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }

.wrap { max-width: 780px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }

/* Header */
header.top { padding-block: 28px 18px; display: grid; gap: 10px; }
.series { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
h1 { margin: 0; font-size: clamp(24px, 5vw, 32px); line-height: 1.2; text-wrap: balance; font-weight: 700; }
h1 .jp { font-family: var(--font-jp); font-weight: 700; margin-inline-end: .35em; }
.mondai { margin: 0; color: var(--ink-soft); }
.mondai b { font-family: var(--font-jp); color: var(--ink); font-weight: 700; }
.sources { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.src { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--sheet); text-decoration: none; font-size: 13px; font-weight: 500; color: var(--ink); }
.src:hover { border-color: var(--ai); color: var(--ai); }
.src .k { font-family: var(--font-jp); color: var(--ai); font-weight: 700; }
.notice { font-size: 13px; color: var(--ink-soft); background: var(--sheet); border: 1px dashed var(--rule); border-radius: 8px; padding: 8px 12px; }

/* Sticky bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); margin-inline: -16px; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.progress { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-soft); margin-inline-end: auto; display: flex; align-items: center; gap: 10px; }
.score { font-family: var(--font-pen); color: var(--shu); font-size: 22px; line-height: 1; }
.score small { font-size: 14px; }
button { font: inherit; cursor: pointer; }
.btn { border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; }
.btn:hover { border-color: var(--ai); }
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--sheet); }
.btn.primary:hover { filter: brightness(1.08); }

/* Sheet */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; margin-top: 18px; }
.q { padding: 20px 18px 16px; border-top: 1px solid var(--rule); display: grid; grid-template-columns: auto 1fr; column-gap: 14px; row-gap: 12px; position: relative; }
.q:first-child { border-top: 0; }
.qn { grid-row: span 3; width: 30px; height: 30px; border: 1.5px solid var(--ai); color: var(--ai); border-radius: 6px; display: grid; place-items: center; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; position: relative; }
.qbody { min-width: 0; display: grid; gap: 12px; }
.stem { font-family: var(--font-jp); font-size: 19px; line-height: 2.1; margin: 0; }
.stem ruby rt { font-size: 10px; color: var(--ink-soft); font-family: var(--font-jp); }
.stem u { text-decoration: none; border-bottom: 2px solid var(--ai); padding-bottom: 1px; }
.blank { display: inline-block; min-width: 4.5em; text-align: center; border-bottom: 2px solid var(--ink-soft); margin-inline: .2em; line-height: 1.5; }
.blank.filled { color: var(--ai); border-bottom-color: var(--ai); }
.blank:empty::before { content: "\3000"; }

.opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 10px; list-style: none; margin: 0; padding: 0; }
.opts.long { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 560px) { .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; border: 1px solid transparent; background: transparent; color: var(--ink); padding: 6px 8px; border-radius: 8px; font-family: var(--font-jp); font-size: 17px; min-width: 0; }
.opt:hover { background: var(--ai-wash); }
.opt .bub { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink-soft); display: grid; place-items: center; font-family: var(--font-ui); font-size: 12px; font-weight: 700; color: var(--ink-soft); transition: background .12s, color .12s; }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt[aria-pressed="true"] .bub { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.graded .opt { cursor: default; }
.graded .opt:hover { background: transparent; }
.graded .opt.is-ans { background: var(--ok-wash); }
.graded .opt.is-ans .bub { border-color: var(--ok); color: var(--ok); }
.graded .opt.is-ans[aria-pressed="true"] .bub { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.graded .opt.is-wrong { background: var(--shu-wash); }
.graded .opt.is-wrong .bub { background: var(--shu); border-color: var(--shu); color: var(--sheet); }

/* red-pen marks */
.mark { position: absolute; left: -6px; top: -9px; width: 44px; height: 44px; pointer-events: none; display: none; }
.graded .mark { display: block; }
.mark circle, .mark path { fill: none; stroke: var(--shu); stroke-width: 3; stroke-linecap: round; }

/* Explanation */
details.ex { border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
details.ex > summary { list-style: none; cursor: pointer; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--ai); display: flex; align-items: center; gap: 8px; }
details.ex > summary::-webkit-details-marker { display: none; }
details.ex > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; margin-inline-end: 2px; }
details.ex[open] > summary::before { transform: rotate(45deg); }
.exb { padding: 4px 14px 14px; display: grid; gap: 14px; font-size: 14.5px; }
.exb h4 { margin: 0 0 4px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.exb .jp, .exb ruby { font-family: var(--font-jp); }
.exb ruby rt { font-size: 9.5px; color: var(--ink-soft); }
.ansline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
.ansline .circ { font-family: var(--font-pen); color: var(--shu); font-size: 20px; }
.ansline .w { font-family: var(--font-jp); font-size: 20px; font-weight: 700; }
.ansline .r { font-family: var(--font-jp); color: var(--ink-soft); }
.vi { margin: 0; font-style: italic; }
.jpline { margin: 0 0 2px; font-family: var(--font-jp); font-size: 16px; line-height: 2; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: start; padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
td.w { font-family: var(--font-jp); font-size: 17px; font-weight: 700; white-space: nowrap; }
td.r { font-family: var(--font-jp); white-space: nowrap; }
td.hv { font-size: 12.5px; font-weight: 600; letter-spacing: .04em; color: var(--ai); white-space: nowrap; }
ul.others, ul.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
ul.others li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
ul.others .n { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--shu); color: var(--shu); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
ul.others li > div { min-width: 0; }
ul.notes li { padding-inline-start: 14px; position: relative; }
ul.notes li::before { content: ""; position: absolute; left: 0; top: .7em; width: 6px; height: 6px; border-radius: 50%; background: var(--ai); }
.g { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; }
.g b.jp { color: var(--ai); }

/* Answer key + footer */
.key { margin-top: 18px; }
.key table { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.key td, .key th { text-align: center; font-variant-numeric: tabular-nums; }
.key td { font-weight: 700; color: var(--shu); font-family: var(--font-pen); font-size: 17px; }
footer { margin-top: 28px; font-size: 13px; color: var(--ink-soft); display: grid; gap: 10px; }
footer nav { display: flex; flex-wrap: wrap; gap: 8px; }
footer .here { border-color: var(--ai); color: var(--ai); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="series" id="series"></div>
    <h1 id="h1"></h1>
    <p class="mondai" id="mondai"></p>
    <div class="sources" id="sources"></div>
    <div class="notice" id="notice" hidden></div>
  </header>

  <div class="bar">
    <div class="progress"><span id="prog">0/20 câu đã chọn</span><span class="score" id="score" hidden></span></div>

  <main class="sheet" id="sheet"></main>

  <footer>
    <div id="sib"></div>
    <div id="copy"></div>
  </footer>
</div>

const SIBLINGS = [{"id": "de13-kanji-n2", "label": "Đề 13 · Kanji N2", "url": "https://claude.ai/artifact/Ugz2oKP4tDzDQbrmK1DTcD"}, {"id": "de7-tuvung-n2", "label": "Đề 7 · Từ vựng N2", "url": "https://claude.ai/artifact/DcgGAMZp93gWf95FXf8qXe"}];

const CIRC = ["", "①", "②", "③", "④"];
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
// markup: {漢字|かな} → ruby, _x_ → underline (target word). HTML in data is trusted (authored).
const fmt = s => String(s || "")
  .replace(/\{([^|{}]+)\|([^{}]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>")
  .replace(/_([^_]+)_/g, "<u>$1</u>");

const STORE = "jlpt-" + EXAM.id;
let state = { picks: {}, graded: false };
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.picks) state = s; } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };

function header() {
  document.getElementById("series").textContent = EXAM.series;
  document.getElementById("h1").innerHTML = `<span class="jp">${esc(EXAM.jp)}</span>${esc(EXAM.title)}`;
  document.getElementById("mondai").innerHTML = EXAM.mondai;
  const S = EXAM.source;
  document.getElementById("sources").innerHTML = [
    [S.goc, "問題", "Đề gốc (PDF)"],
    [S.chua, "解説", "Đề chữa (PDF)"],
    [S.folder, "Drive", "Thư mục gốc"],
  ].filter(x => x[0]).map(([u, k, l]) => `<a class="src" href="${u}" target="_blank" rel="noopener"><span class="k">${k}</span>${l}</a>`).join("");
  if (EXAM.notice) { const n = document.getElementById("notice"); n.innerHTML = EXAM.notice; n.hidden = false; }
  document.getElementById("copy").innerHTML = EXAM.copy;
  document.getElementById("sib").innerHTML = SIBLINGS.length ? `<div style="margin-bottom:6px">Các đề khác trong bộ này:</div><nav>${SIBLINGS.map(s => `<a class="src${s.id === EXAM.id ? " here" : ""}" href="${s.url}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join("")}</nav>` : "";
}

function stemHTML(q, i) {
  let h = fmt(esc(q.s));
  const pick = state.picks[i];
  const fill = EXAM.kind === "vocab" && pick ? esc(q.o[pick - 1]) : "";
  return h.replace("（　）", `<span class="blank${fill ? " filled" : ""}" data-blank="${i}">${fill}</span>`);
}

function exHTML(q) {
  const a = q.a;
  const parts = [];
  parts.push(`<div><h4>Đáp án</h4><div class="ansline"><span class="circ">${CIRC[a]}</span><span class="w">${esc(q.o[a - 1])}</span>${q.ar ? `<span class="r">${fmt(q.ar)}</span>` : ""}</div></div>`);
  parts.push(`<div><h4>Dịch câu</h4><p class="jpline">${fmt(q.s.replace("（　）", `<u>${q.o[a - 1]}</u>`))}</p><p class="vi">${q.vi}</p></div>`);
  if (q.key && q.key.length) {
    parts.push(`<div><h4>Từ vựng</h4><div class="tbl"><table><thead><tr><th>Từ</th><th>Cách đọc</th><th>Hán Việt</th><th>Nghĩa</th></tr></thead><tbody>${
      q.key.map(k => `<tr><td class="w">${k.w}</td><td class="r">${k.r}</td><td class="hv">${k.hv || "—"}</td><td>${fmt(k.m)}</td></tr>`).join("")
    }</tbody></table></div></div>`);
  }
  if (q.x) {
    parts.push(`<div><h4>Các phương án còn lại</h4><ul class="others">${
      [1, 2, 3, 4].filter(n => n !== a && q.x[n]).map(n => `<li><span class="n">${n}</span><div><span class="jp">${esc(q.o[n - 1])}</span> — ${fmt(q.x[n])}</div></li>`).join("")
    }</ul></div>`);
  }
  if (q.g && q.g.length) {
    parts.push(`<div><h4>Ngữ pháp trong câu</h4><div style="display:grid;gap:6px">${q.g.map(g => `<div class="g">${fmt(g)}</div>`).join("")}</div></div>`);
  }
  if (q.n && q.n.length) {
    parts.push(`<div><h4>Ghi chú · Mở rộng</h4><ul class="notes">${q.n.map(n => `<li>${fmt(n)}</li>`).join("")}</ul></div>`);
  }
  return parts.join("");
}

const MARK_OK = `<svg class="mark" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="18" transform="rotate(-20 22 22)" stroke-dasharray="108 6"/></svg>`;
const MARK_NG = `<svg class="mark" viewBox="0 0 44 44" aria-hidden="true"><path d="M9 22 L18 33 L37 8"/></svg>`;

function render() {
  const sheet = document.getElementById("sheet");
  sheet.innerHTML = EXAM.qs.map((q, i) => {
    const long = q.o.some(o => o.length > 6);
    const pick = state.picks[i];
    const ok = pick === q.a;
    return `<section class="q${state.graded ? " graded" : ""}" id="q${i + 1}" data-i="${i}">
      <div class="qn">${i + 1}${state.graded ? (ok ? MARK_OK : MARK_NG) : ""}</div>
      <div class="qbody">
        <p class="stem">${stemHTML(q, i)}</p>
        <ul class="opts${long ? " long" : ""}">${q.o.map((o, j) => {
          const n = j + 1, cls = ["opt"];
          if (state.graded && n === q.a) cls.push("is-ans");
          if (state.graded && n === pick && n !== q.a) cls.push("is-wrong");
          return `<li><button type="button" class="${cls.join(" ")}" data-n="${n}" aria-pressed="${pick === n}"><span class="bub">${n}</span><span class="t">${esc(o)}</span></button></li>`;
        }).join("")}</ul>
        <details class="ex"><summary>Xem giải thích câu ${i + 1}</summary><div class="exb">${exHTML(q)}</div></details>
      </div>
    </section>`;
  }).join("");
  status();
}

function status() {
  const done = Object.keys(state.picks).length, total = EXAM.qs.length;
  document.getElementById("prog").textContent = `${done}/${total} câu đã chọn`;
  const sc = document.getElementById("score");
  if (state.graded) {
    const right = EXAM.qs.filter((q, i) => state.picks[i] === q.a).length;
    sc.innerHTML = `${right}<small>/${total}</small>`;
    sc.hidden = false;
  } else sc.hidden = true;
  document.getElementById("grade").textContent = state.graded ? "Đã chấm" : "Chấm điểm";
  document.getElementById("grade").disabled = state.graded;
}

document.getElementById("sheet").addEventListener("click", e => {
  const b = e.target.closest(".opt");
  if (!b || state.graded) return;
  const qEl = b.closest(".q"), i = +qEl.dataset.i, n = +b.dataset.n;
  if (state.picks[i] === n) delete state.picks[i]; else state.picks[i] = n;
  save();
  qEl.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-pressed", String(+o.dataset.n === state.picks[i])));
  const bl = qEl.querySelector(".blank");
  if (bl) { const p = state.picks[i]; bl.textContent = p ? EXAM.qs[i].o[p - 1] : ""; bl.classList.toggle("filled", !!p); }
  status();
});
document.getElementById("grade").addEventListener("click", () => {
  state.graded = true; save(); render();
  const first = EXAM.qs.findIndex((q, i) => state.picks[i] !== q.a);
  if (first >= 0) document.getElementById("q" + (first + 1)).scrollIntoView({ behavior: "smooth", block: "center" });
});
document.getElementById("reset").addEventListener("click", () => { state = { picks: {}, graded: false }; save(); render(); window.scrollTo({ top: 0 }); });
document.getElementById("toggleAll").addEventListener("click", e => {
  const all = [...document.querySelectorAll("#sheet details.ex")];
  const open = !all.every(d => d.open);
  all.forEach(d => d.open = open);
  e.currentTarget.textContent = open ? "Đóng tất cả giải thích" : "Mở tất cả giải thích";
});

function keyTable() {
  const qs = EXAM.qs, rows = [];
  for (let s = 0; s < qs.length; s += 10) {
    const sl = qs.slice(s, s + 10);
    rows.push(`<tr><th>Câu</th>${sl.map((_, k) => `<th>${s + k + 1}</th>`).join("")}</tr><tr><th>Đ/A</th>${sl.map(q => `<td>${q.a}</td>`).join("")}</tr>`);
  }
  document.getElementById("keytbl").innerHTML = `<table>${rows.join("")}</table>`;
}

header(); render(); keyTable();
</script>
