<title>Thẻ từ vựng N2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one study column (max 760px) under a sticky header; the card is a ring-bound 単語カード;
   the list view is a dense ledger grouped by lesson. Colour: 藍 (indigo) ink on cool paper, 朱 for marks. */
:root{
  --paper:#EDF0F3; --card:#FFFFFF; --soft:#F5F7F9; --ink:#17212C; --muted:#5A6878; --line:#D8DFE6;
  --ai:#24477D; --ai-soft:#E1E8F3; --shu:#BF4128; --shu-soft:#FBE9E4;
  --again:#BC3A28; --hard:#9A6410; --good:#2B7A4B; --easy:#2760A6;
  --again-soft:#F9E6E2; --hard-soft:#F7EEDD; --good-soft:#E1F1E7; --easy-soft:#E2ECF8;
  --shadow:0 1px 2px rgba(23,33,44,.06),0 10px 30px rgba(23,33,44,.07);
  --f-mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --c-rev:#2F64B8; --c-new:#C9502F;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1218; --card:#161E27; --soft:#1B2530; --ink:#E4E9EF; --muted:#94A2B1; --line:#283442;
  --ai:#93B4E8; --ai-soft:#1D2B3E; --shu:#F08A70; --shu-soft:#3A221D;
  --again:#F08A78; --hard:#E2B15A; --good:#6FCB94; --easy:#86B4F0;
  --again-soft:#3A2220; --hard-soft:#352B19; --good-soft:#1A3326; --easy-soft:#1B2A3E;
  --c-rev:#5B8EE0; --c-new:#E0694A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0D1218; --card:#161E27; --soft:#1B2530; --ink:#E4E9EF; --muted:#94A2B1; --line:#283442;
  --ai:#93B4E8; --ai-soft:#1D2B3E; --shu:#F08A70; --shu-soft:#3A221D;
  --again:#F08A78; --hard:#E2B15A; --good:#6FCB94; --easy:#86B4F0;
  --again-soft:#3A2220; --hard-soft:#352B19; --good-soft:#1A3326; --easy-soft:#1B2A3E;
  --c-rev:#5B8EE0; --c-new:#E0694A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.jp{font-family:var(--f-jp)}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500;font-family:var(--f-jp)}
.brand .grow{flex:1;min-width:0}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)} .sync.err i{background:var(--again)}
.navrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.filterbtn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:7px 12px;font-size:13.5px;font-weight:500;max-width:100%;min-width:0}
.filterbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filters{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.filters h3{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--card)}
.lessongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.lessongrid .chip{border-radius:9px;padding:6px 0;text-align:center;font-variant-numeric:tabular-nums}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:0;background:none;color:var(--ai);font-weight:600;font-size:13px;padding:2px 4px}

main.wrap{padding-block:18px 40px}

/* study */
.deckbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.counts{display:flex;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.counts b{font-size:16px;margin-right:4px}
.c-new{color:var(--new,var(--easy))} .c-learn{color:var(--again)} .c-due{color:var(--good)}
.deckbar .tools{margin-left:auto;display:flex;gap:6px}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 11px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.ghost[disabled]{opacity:.45;cursor:default}
.crambar{display:flex;align-items:center;gap:10px;background:var(--shu-soft);color:var(--shu);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.crambar button{margin-left:auto;border:0;background:none;color:inherit;font-weight:700;text-decoration:underline}

.fc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px 22px 24px;min-height:340px;display:flex;flex-direction:column}
.fc::before{content:"";position:absolute;top:16px;left:16px;width:13px;height:13px;border-radius:50%;background:var(--paper);box-shadow:inset 0 1px 2px rgba(0,0,0,.18);border:1px solid var(--line)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-left:24px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .no{font-family:var(--f-jp);letter-spacing:.04em}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.front{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px 0 8px;text-align:center}
.bigword{font-family:var(--f-mincho);font-weight:800;font-size:clamp(46px,12vw,84px);line-height:1.15;letter-spacing:.04em;word-break:keep-all}
.bigword rt{font-family:var(--f-jp);font-weight:500;font-size:.24em;letter-spacing:.12em;color:var(--muted)}
.front .vi-big{font-size:clamp(22px,5vw,30px);font-weight:700;text-wrap:balance;max-width:28ch}
.hintbtn{border:1px dashed var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--muted)}
.say{border:1px solid var(--line);background:var(--soft);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;color:var(--ai);flex:none}
.say svg{width:17px;height:17px}
.say.lg{width:44px;height:44px}
.say.lg svg{width:21px;height:21px}
.say.playing{background:var(--ai);color:var(--card);border-color:var(--ai)}

.back{margin-top:18px;display:grid;gap:22px}
.headrow{display:block}
.headrow .wline{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.midword{font-family:var(--f-mincho);font-weight:800;font-size:40px;line-height:1.2;letter-spacing:.04em}
.midword rt{font-family:var(--f-jp);font-weight:500;font-size:.34em;letter-spacing:.1em;color:var(--muted)}
.hv{font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--shu);margin-top:4px}
.vimean{font-size:20px;font-weight:700;line-height:1.35;margin-top:4px;text-wrap:balance}
.sec h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:baseline}
.sec h4 .jp{letter-spacing:.1em;text-transform:none;font-weight:500}
.senses{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.senses>li{display:grid;gap:8px}
.senses.multi>li{counter-increment:s;padding-left:30px;position:relative}
.senses.multi>li::before{content:counter(s);position:absolute;left:0;top:1px;width:21px;height:21px;border-radius:50%;background:var(--ai);color:var(--card);font-size:12px;font-weight:700;display:grid;place-items:center}
.def{font-family:var(--f-jp);font-weight:700;font-size:16px}
.def small{display:block;font-family:var(--f-ui);font-weight:500;font-size:13.5px;color:var(--muted)}
.pts{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.pts li{font-family:var(--f-jp);font-size:13.5px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:2px 9px}
.exs{display:grid;gap:10px}
.ex{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.ex .jp{font-size:16px;line-height:1.7;white-space:pre-line}
.ex mark{background:none;color:inherit;text-decoration:underline 2px var(--shu);text-underline-offset:4px;font-weight:700}
.ex .note{color:var(--muted);font-size:.88em}
.tr{font-size:14px;color:var(--muted);margin-top:2px;white-space:pre-line}
.hide-tr .tr{filter:blur(5px);cursor:pointer;user-select:none;transition:filter .15s}
.hide-tr .tr.show{filter:none}
.uses{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.uses li{font-family:var(--f-jp);font-size:14.5px;background:var(--soft);border-left:3px solid var(--ai);border-radius:0 8px 8px 0;padding:6px 10px}
.rels{display:flex;flex-wrap:wrap;gap:8px}
.rel{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 11px;text-align:left;display:grid;gap:0;max-width:100%}
.rel b{font-family:var(--f-jp);font-size:15.5px;font-weight:700}
.rel b small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.rel span{font-size:12.5px;color:var(--muted)}
.rel.indeck{border-color:color-mix(in srgb,var(--ai) 45%,var(--line))}
.rel.indeck b::after{content:"→";color:var(--ai);margin-left:6px;font-size:12px}

.answer{position:sticky;bottom:env(safe-area-inset-bottom,0px);padding-block:12px;background:linear-gradient(to top,var(--paper) 70%,transparent);z-index:5}
.reveal{width:100%;border:0;background:var(--ai);color:var(--card);border-radius:14px;padding:15px;font-weight:700;font-size:16px;box-shadow:var(--shadow)}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grade{border:1px solid transparent;border-radius:14px;padding:10px 4px;display:grid;gap:1px;justify-items:center;font-weight:700;font-size:15px}
.grade small{font-weight:500;font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.g1{background:var(--again-soft);color:var(--again)} .g2{background:var(--hard-soft);color:var(--hard)}
.g3{background:var(--good-soft);color:var(--good)} .g4{background:var(--easy-soft);color:var(--easy)}
.grade:hover{border-color:currentColor}
.keys{margin-top:8px;text-align:center;font-size:12px;color:var(--muted)}
.keys kbd{font-family:var(--f-ui);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;background:var(--card)}
@media (hover:none){.keys{display:none}}

.done{text-align:center;padding:48px 20px;display:grid;gap:14px;justify-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px}
.done h2{margin:0;font-size:20px;text-wrap:balance}
.done p{margin:0;color:var(--muted);max-width:44ch}
.done .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.primary{border:0;background:var(--ai);color:var(--card);border-radius:11px;padding:9px 16px;font-weight:600}

/* list */
.listbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:0 12px}
.search input{border:0;background:none;padding:9px 0;width:100%;min-width:0;outline:none}
.summary{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:14px;font-variant-numeric:tabular-nums}
.summary b{color:var(--ink)}
.lesson{margin-bottom:18px}
.lesson header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 2px 8px}
.lesson h3{margin:0;font-family:var(--f-mincho);font-size:19px;font-weight:800}
.lesson h3 small{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);font-weight:500;margin-left:6px}
.prog{flex:1 1 80px;max-width:180px;height:6px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.prog .p-m{background:var(--good)} .prog .p-y{background:color-mix(in srgb,var(--good) 45%,var(--line))} .prog .p-l{background:var(--again)}
.lesson .pcount{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lesson header .ghost{margin-left:auto}
.rows{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rowi{display:grid;grid-template-columns:2.4rem minmax(7.5rem,1fr) minmax(0,2fr) 5.6rem 34px;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer}
.rowi:first-child{border-top:0}
.rowi:hover{background:var(--soft)}
.rowi .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-family:var(--f-jp)}
.rowi .w{font-family:var(--f-mincho);font-weight:800;font-size:21px;line-height:1.25;min-width:0}
.rowi .w rt{font-family:var(--f-jp);font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:.06em}
.rowi .w .h{display:block;font-family:var(--f-ui);font-weight:700;font-size:10.5px;letter-spacing:.12em;color:var(--shu);margin-top:1px}
.rowi .m{min-width:0;font-size:14px}
.hidemean .rowi .m{filter:blur(6px)}
.hidemean .rowi:hover .m{filter:none}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;text-align:center;white-space:nowrap;justify-self:start}
.st-new{background:var(--easy-soft);color:var(--easy)} .st-learn{background:var(--again-soft);color:var(--again)}
.st-due{background:var(--good-soft);color:var(--good)} .st-young{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.st-mature{background:var(--good);color:var(--card)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
@media (max-width:640px){
  .rowi{grid-template-columns:minmax(0,1fr) auto 34px;grid-template-areas:"w p s" "m m m";row-gap:2px;padding:10px 14px}
  .rowi .n{display:none}
  .rowi .w{grid-area:w} .rowi .m{grid-area:m} .rowi .pill{grid-area:p} .rowi .say{grid-area:s}
  .midword{font-size:34px}
  .fc{padding:18px 16px 20px}
}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tile .v{font-size:28px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .v small{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.tile .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.panel{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 16px;margin-bottom:16px}
.panelhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.panelhead h3{margin:0;font-size:15px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin:10px 0 4px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chartwrap{overflow-x:auto;position:relative;padding-top:6px}
.chart{position:relative;display:flex;align-items:flex-end;gap:4px;height:210px;padding:18px 26px 0 2px;min-width:100%}
.chart .grid{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:10.5px;color:var(--muted);pointer-events:none}
.chart .grid span{position:absolute;right:0;top:-8px;font-variant-numeric:tabular-nums;background:var(--card);padding-left:3px}
.col{flex:1 1 0;min-width:30px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;position:relative;cursor:default;z-index:1}
.col .tot{font-size:11.5px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;margin-bottom:3px}
.col .seg2{border-radius:4px 4px 0 0;min-height:0}
.col .seg2+.seg2{border-radius:0;margin-top:0}
.col .s-new{background:var(--c-new);border-radius:4px 4px 0 0}
.col .s-rev{background:var(--c-rev)}
.col .s-new+.s-rev{border-top:2px solid var(--card);border-radius:0}
.col:hover .seg2,.col.on .seg2{filter:brightness(1.12)}
.xlabels{display:flex;gap:4px;padding:6px 26px 0 2px;min-width:100%}
.xlabels span{flex:1 1 0;min-width:30px;text-align:center;font-size:11px;color:var(--muted);line-height:1.25;white-space:nowrap;overflow:hidden}
.xlabels span.today{color:var(--ink);font-weight:600}
.tip{position:absolute;z-index:3;background:var(--ink);color:var(--paper);border-radius:8px;padding:6px 9px;font-size:12.5px;pointer-events:none;white-space:nowrap}
.tip b{display:block;font-size:12px}
.note2{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 8px;border-top:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:600;font-size:12px;border-top:0}
details.more summary{cursor:pointer;font-weight:600;font-size:14px}
details.more[open] summary{margin-bottom:8px}

/* overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,15,22,.45);display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media (min-width:700px){.overlay{align-items:center;padding:24px}.sheet{border-radius:20px;max-height:88%}}
.sheet .bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sheet .bar .meta{padding-left:0;flex:1}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.form{display:grid;gap:14px}
.field{display:grid;gap:5px}
.field label,.field .lbl{font-weight:600;font-size:13.5px}
.field .help{font-size:12.5px;color:var(--muted)}
.field input[type=number],.field select,.field textarea{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 10px;width:100%;max-width:100%}
.field textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:4px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.danger{border:1px solid var(--again);color:var(--again);background:none;border-radius:10px;padding:7px 12px;font-weight:600}
.confirm{background:var(--again-soft);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--again);font-weight:600;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 14px;font-size:13.5px;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){
  .fc.flip .back{animation:rise .22s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}

/* ---------- stats / forecast ---------- */
const WD = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
function dayLabel(k, start) {
  if (k === 0) return "Hôm nay";
  if (k === 1) return "Mai";
  const d = new Date(start + k * DAY + 12 * 3600e3);
  return WD[d.getDay()] + " " + d.getDate() + "/" + (d.getMonth() + 1);
}
function forecast(H) {
  const now = Date.now(), start = nextDayStart(now) - DAY, T = today();
  const rev = new Array(H).fill(0), nw = new Array(H).fill(0);
  const chain = (k, i, e) => { let g = 0; while (k < H && g++ < 60) { rev[k]++; i = Math.max(i + 1, Math.round(i * e)); k += i; } };
  let fresh = 0;
  for (const v of pool()) {
    const c = P.cards[v.id];
    if (!c || !c.q) { fresh++; continue; }
    const e = (c.e || 2500) / 1000;
    if (c.q === 1) { rev[0]++; chain(1, 1, e); }
    else if (c.q === 3) { rev[0]++; const i = Math.max(1, c.i || 1); chain(i, i, e); }
    else chain(Math.max(0, Math.floor((c.d - start) / DAY)), c.i || 1, e);
  }
  const per = Math.max(0, P.settings.newPerDay);
  let left = fresh, lastNewDay = -1;
  for (let k = 0; k < 3650 && left > 0 && per > 0; k++) {
    const n = Math.min(left, k === 0 ? Math.max(0, per + (T.x || 0) - T.n) : per);
    if (n > 0) { left -= n; lastNewDay = k; if (k < H) { nw[k] += n; for (let j = 0; j < n; j++) chain(k + 1, 1, 2.5); } }
  }
  return { rev, nw, start, fresh, lastNewDay, T };
}
function renderStats() {
  const H = [7, 14, 30].includes(UI.horizon) ? UI.horizon : 14;
  document.querySelectorAll("#horizon button").forEach(b => b.setAttribute("aria-selected", +b.dataset.h === H));
  const F = forecast(Math.max(H, 30)), now = Date.now();
  const all = pool(); let learned = 0, mature = 0;
  for (const v of all) { const st = status(v.id, now); if (st !== "new") learned++; if (st === "mature") mature++; }
  const tot = k => F.rev[k] + F.nw[k];
  const week = [1, 2, 3, 4, 5, 6, 7].reduce((a, k) => a + tot(k), 0);
  const finish = F.fresh === 0 ? "Đã học hết từ mới" : F.lastNewDay < 0 ? "Số từ mới mỗi ngày đang là 0" : F.lastNewDay === 0 ? "Xong ngay hôm nay" : "Ngày " + new Date(F.start + F.lastNewDay * DAY + 12 * 3600e3).toLocaleDateString("vi-VN");
  $("#tiles").innerHTML = `
    <div class="tile"><div class="k">Hôm nay còn</div><div class="v">${tot(0)}<small>từ</small></div><div class="d">${F.rev[0]} ôn lại · ${F.nw[0]} mới · đã làm ${F.T.n + F.T.r}</div></div>
    <div class="tile"><div class="k">Ngày mai</div><div class="v">${tot(1)}<small>từ</small></div><div class="d">${F.rev[1]} ôn lại · ${F.nw[1]} mới</div></div>
    <div class="tile"><div class="k">7 ngày tới</div><div class="v">${week}<small>lượt</small></div><div class="d">Trung bình ${Math.round(week / 7)} từ mỗi ngày</div></div>
    <div class="tile"><div class="k">Đã học</div><div class="v">${learned}<small>/ ${all.length}</small></div><div class="d">${mature} đã thuộc · học hết từ mới: ${finish}</div></div>`;
  const max = Math.max(1, ...Array.from({ length: H }, (_, k) => tot(k)));
  const step = max <= 5 ? 1 : max <= 12 ? 2 : max <= 30 ? 5 : max <= 60 ? 10 : max <= 150 ? 25 : 50;
  const top = Math.ceil(max / step) * step, PX = 170;
  let grid = "";
  for (let g = step; g <= top; g += step) grid += `<div class="grid" style="bottom:${g / top * PX}px"><span>${g}</span></div>`;
  const showTot = H <= 14;
  const cols = Array.from({ length: H }, (_, k) => {
    const r = F.rev[k], n = F.nw[k];
    return `<div class="col" data-k="${k}">${showTot && r + n ? `<div class="tot">${r + n}</div>` : ""}${n ? `<div class="seg2 s-new" style="height:${n / top * PX}px"></div>` : ""}${r ? `<div class="seg2 s-rev" style="height:${r / top * PX}px"></div>` : ""}</div>`;
  }).join("");
  const minW = H * 34 + 28 + "px";
  $("#chartwrap").innerHTML = `<div class="chart" style="min-width:${minW};height:${PX + 22}px">${grid}${cols}</div>
    <div class="xlabels" style="min-width:${minW}">${Array.from({ length: H }, (_, k) => `<span class="${k === 0 ? "today" : ""}">${H > 14 && k > 1 && k % 3 !== 0 ? "" : dayLabel(k, F.start).replace(" ", "<br>")}</span>`).join("")}</div>`;
  $("#chartwrap").dataset.h = H;
  $("#fcNote").textContent = `Dự kiến theo bộ lọc hiện tại, với ${P.settings.newPerDay} từ mới mỗi ngày và giả sử mỗi lần ôn bạn chọn "Được". Chọn "Lại" nhiều thì số lượt ôn sẽ tăng.`;
  $("#fcTable").innerHTML = `<tr><th>Ngày</th><th>Ôn lại</th><th>Từ mới</th><th>Tổng</th></tr>` +
    Array.from({ length: H }, (_, k) => `<tr><td>${dayLabel(k, F.start)}</td><td>${F.rev[k]}</td><td>${F.nw[k]}</td><td><b>${tot(k)}</b></td></tr>`).join("");
  statsCache = F;
}

document.addEventListener("keydown", e => {
  if (!$("#overlay").hidden) { if (e.key === "Escape") closeSheet(); return; }
  if (UI.tab !== "study" || e.target.closest("input,textarea,select") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); revealed ? answer(3) : reveal(); }
  else if (revealed && ["1", "2", "3", "4"].includes(e.key)) answer(+e.key);
  else if (e.key === "r" || e.key === "R") { if (cur) speak(cur.r || cur.w, document.querySelector(".fc .say.lg")); }
  else if (e.key === "z" || e.key === "Z") undo();
});

/* ---------- boot ---------- */
$("#q").value = UI.q || "";
renderFilters();
setTab(["list", "stats"].includes(UI.tab) ? UI.tab : "study");
document.addEventListener("mouseover", e => { const c = e.target.closest && e.target.closest("#chartwrap .col"); if (c) showTip(c); });
document.addEventListener("mouseout", e => { if (e.target.closest && e.target.closest("#chartwrap .col") && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("#chartwrap .col"))) showTip(null); });
setSync("local");
connect();
</script>
