<title>パワードリル N2</title>
<meta name="description" content="Luyện đề 日本語パワードリル N2 文字・語彙 và 文法: tự làm, xem đáp án, giải thích tiếng Việt, bảng từ vựng Hán Việt, bảng mẫu ngữ pháp và flashcard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: answer-sheet column (max 860px) under a slim indigo masthead; red-pen marks for grading. */
:root{
  --paper:#f3f5f9; --card:#ffffff; --ink:#1b2133; --muted:#5a637a; --line:#dde2eb; --line2:#c9d0dc;
  --ai:#2a3c8c; --ai-ink:#ffffff; --ai-soft:#e6eaf7; --mast:#24357f; --mast-ink:#ffffff;
  --shu:#c7351c; --shu-soft:#fbe9e4;
  --ok:#1d7a4c; --ok-soft:#e1f2e8; --bad:#b02a1f; --bad-soft:#fbe5e2;
  --gold:#b97f00; --gold-soft:#fff3d6;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.05);
  --f-ui:"Be Vietnam Pro","Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f121a; --card:#171b26; --ink:#e5e8f1; --muted:#9aa2b6; --line:#272d3c; --line2:#353c4e;
  --ai:#9db0ff; --ai-ink:#0f121a; --ai-soft:#1d2540; --mast:#18214a; --mast-ink:#e8ecff;
  --shu:#ff7b5f; --shu-soft:#3a1c15;
  --ok:#5fcb92; --ok-soft:#14301f; --bad:#ff8c80; --bad-soft:#3b1a17;
  --gold:#f0c24f; --gold-soft:#352a10;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0f121a; --card:#171b26; --ink:#e5e8f1; --muted:#9aa2b6; --line:#272d3c; --line2:#353c4e;
  --ai:#9db0ff; --ai-ink:#0f121a; --ai-soft:#1d2540;
  --shu:#ff7b5f; --shu-soft:#3a1c15;
  --ok:#5fcb92; --ok-soft:#14301f; --bad:#ff8c80; --bad-soft:#3b1a17;
  --gold:#f0c24f; --gold-soft:#352a10;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;}
.jp{font-family:var(--f-jp)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ai)}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:4px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px}

/* masthead */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--mast);color:var(--mast-ink)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:52px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:inherit;margin-right:auto}
.brand b{font-family:var(--f-disp);font-weight:800;font-size:18px;letter-spacing:.02em}
.brand span{font-size:12px;opacity:.8;letter-spacing:.06em}
.brand b .bl{font-size:inherit;opacity:1;letter-spacing:inherit}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;background:transparent;border:0;color:inherit;padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px;opacity:.8}
.tabs button[aria-current="page"]{background:var(--mast-ink);color:var(--mast);opacity:1}
.sync{font-size:11px;letter-spacing:.04em;opacity:.85;display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6}
.sync.on i{background:#7be0a6;opacity:1}

main{padding-block:20px 120px}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* home */
.hero{display:grid;gap:14px;margin-bottom:22px}
.hero h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(26px,5vw,36px);line-height:1.15}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.continue{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:7px 14px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ai);color:var(--ai-ink);border-color:var(--ai)}
.btn.warn{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.stage{margin-top:26px}
.stage h2{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.stage h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;display:grid;gap:4px;min-height:96px;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--ai)}
.tile .t{font-family:var(--f-disp);font-weight:800;font-size:20px;line-height:1.1}
.tile.train .t{font-size:16px}
.tile .s{font-size:12px;color:var(--muted)}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--ai)}
.stamp{position:absolute;top:8px;right:8px;font-family:var(--f-disp);font-weight:800;color:var(--shu);border:2px solid var(--shu);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;font-size:13px;line-height:1;transform:rotate(-8deg);font-variant-numeric:tabular-nums;background:var(--card)}
.stamp small{font-size:9px;display:block;opacity:.8}

/* unit */
.uhead{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin-bottom:8px}
.uhead h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(30px,6vw,42px);line-height:1}
.uhead .meta{color:var(--muted);font-size:13px;margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
.scorebox{border:1.5px solid var(--ink);width:92px;height:66px;position:relative;background:var(--card);font-variant-numeric:tabular-nums}
.scorebox::before{content:"";position:absolute;left:10px;right:10px;top:50%;border-top:1.5px solid var(--ink);transform:rotate(-34deg)}
.scorebox .den{position:absolute;right:8px;bottom:4px;font-size:18px;font-weight:700}
.scorebox .num{position:absolute;left:10px;top:2px;font-size:26px;font-weight:800;color:var(--shu);font-family:var(--f-disp)}
.back{font-size:13px;font-weight:600;text-decoration:none;display:inline-flex;gap:4px;margin-bottom:12px;background:none;border:0;color:var(--ai);padding:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:10;background:var(--paper);padding-block:8px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:2px;background:var(--card)}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ai);color:var(--ai-ink)}
.toolbar .sp{margin-left:auto}
.linkbtn{background:none;border:0;color:var(--ai);font-size:13px;font-weight:600;padding:4px 2px}

.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mondai{background:var(--ink);color:var(--paper);font-weight:700;border-radius:999px;padding:2px 12px;font-size:13px;font-family:var(--f-jp)}
.sec-h .nm{font-weight:600}
.sec-h .nm small{color:var(--muted);font-weight:500;margin-left:6px}
.sec-h .pt{margin-left:auto;font-size:12px;color:var(--muted)}
.ins{font-size:13px;color:var(--muted);margin:6px 0 10px}

.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px;margin-top:10px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px}
.qn{width:24px;height:24px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:13px;font-weight:700;border-radius:3px;margin-top:2px}
.qt{font-size:17px;line-height:1.75;min-width:0}
.qt u{text-decoration:none;border-bottom:1.5px solid var(--ink);padding-bottom:1px}
.qt .blank{letter-spacing:.2em;white-space:nowrap}
.qt .fill{color:var(--ok);font-weight:700;border-bottom:2px solid var(--ok)}
.qword{font-family:var(--f-disp);font-weight:800;font-size:22px}
.opts{grid-column:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.opts.long{grid-template-columns:1fr}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:7px 10px;font-size:15px;line-height:1.5;min-width:0}
.opt .k{font-weight:700;color:var(--muted);font-family:var(--f-ui);font-size:13px;min-width:12px;padding-top:1px}
.opt .ot{min-width:0;overflow-wrap:anywhere}
.opt .ot u{text-decoration:none;border-bottom:1.5px solid currentColor}
.opt:hover:not(:disabled){border-color:var(--ai)}
.opt.pick{border-color:var(--ai);background:var(--ai-soft);box-shadow:inset 0 0 0 1px var(--ai)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.ok .k{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through;text-decoration-color:var(--bad)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.mark{grid-column:2;font-size:12px;font-weight:700;margin-top:4px}
.mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)}

details.exp{grid-column:1/-1;margin-top:8px;border-top:1px dashed var(--line2)}
details.exp summary{list-style:none;cursor:pointer;padding:8px 0 2px;font-size:13px;font-weight:600;color:var(--ai);display:flex;align-items:center;gap:6px}
details.exp summary::-webkit-details-marker{display:none}
details.exp summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.exp[open] summary::before{transform:rotate(45deg)}
.xb{display:grid;gap:10px;padding:8px 0 4px}
.xr{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;font-size:14px}
.xr>*{min-width:0}
.xr>b{font-size:12px;color:var(--muted);font-weight:600;padding-top:2px}
.xr .jp{font-size:15px}
.xr ol{margin:0;padding-left:18px}
.xr ol li{margin-bottom:2px}
.gram{background:var(--gold-soft);border-radius:6px;padding:4px 8px}

/* vocab table */
.vt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table.vt{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.vt th{text-align:left;font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0}
.vt td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.vt tr:last-child td{border-bottom:0}
.vt .w{font-family:var(--f-jp);font-size:17px;font-weight:700;white-space:nowrap}
.vt .rd{font-family:var(--f-jp);white-space:nowrap}
.vt .hv{font-size:12px;letter-spacing:.04em;font-weight:600;color:var(--shu);white-space:nowrap}
.mini table.vt{min-width:0}
.mini .vt td{padding:5px 8px}
.mini .vt .w{font-size:15px}
.star{border:0;background:none;padding:2px;line-height:0;color:var(--line2)}
.star svg{width:18px;height:18px}
.star.on{color:var(--gold)}
.tag{border:1px solid currentColor;border-radius:999px;font-size:11px;font-weight:600;padding:1px 8px;white-space:nowrap;background:none}
.tag.c{color:var(--shu)} .tag.r{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip small{opacity:.7;font-weight:500;margin-left:3px;font-variant-numeric:tabular-nums}
.search{flex:1;min-width:180px;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:7px 10px;font:inherit;color:var(--ink)}
.vsum{margin-top:34px;padding-top:18px;border-top:2px solid var(--ink)}
.vsum h2{font-family:var(--f-disp);font-weight:800;font-size:22px}
.vsum p{margin:4px 0 0;color:var(--muted);font-size:13px}
.ulinks a{font-size:12px;margin-right:6px;font-family:var(--f-jp);white-space:nowrap}

/* bottom bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .wrap{display:flex;align-items:center;gap:12px;min-height:58px;flex-wrap:wrap;padding-block:6px}
.dock .cnt{font-variant-numeric:tabular-nums;font-size:14px}
.dock .cnt b{font-size:18px}
.timer{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.timer.over{color:var(--shu);font-weight:700}
.dock .sp{margin-left:auto;display:flex;gap:8px}
.result{font-weight:700;color:var(--shu);font-family:var(--f-disp);font-size:20px}

/* flashcards */
.fc-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select.sel{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;max-width:100%}
.boxes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:14px 0}
.boxes div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11px;color:var(--muted)}
.boxes b{display:block;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-height:280px;display:grid;place-items:center;text-align:center;padding:28px 18px;cursor:pointer;user-select:none;position:relative}
.card .big{font-family:var(--f-disp);font-weight:800;font-size:clamp(40px,11vw,72px);line-height:1.15;overflow-wrap:anywhere}
.card .bigvi{font-size:clamp(22px,5vw,30px);font-weight:600;max-width:24ch}
.card .cback{display:grid;gap:6px;margin-top:14px}
.card .rd{font-family:var(--f-jp);font-size:22px}
.card .hv{color:var(--shu);font-weight:700;letter-spacing:.08em;font-size:13px}
.card .mn{font-size:18px}
.card .hint{position:absolute;bottom:10px;left:0;right:0;font-size:12px;color:var(--muted)}
.card .corner{position:absolute;top:10px;right:12px;display:flex;gap:6px;align-items:center}
.speak{border:0;background:none;color:var(--muted);padding:2px;line-height:0}
.speak svg{width:20px;height:20px}
.fc-act{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fc-act .btn{justify-content:center;padding:12px}
.fc-act .no{color:var(--bad);border-color:var(--bad)}
.fc-act .yes{color:var(--ok);border-color:var(--ok)}
.fc-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.empty{background:var(--card);border:1px dashed var(--line2);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink);display:block;margin-bottom:6px;font-size:16px}
.foot{margin-top:40px;font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.note{font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:10px}

/* grammar book */
.muted{color:var(--muted)}
.slot{display:inline-block;min-width:3.6em;border-bottom:1.5px solid var(--ink);margin:0 3px;text-align:center;line-height:1.5;vertical-align:baseline}
.slot.st{color:var(--shu);font-weight:700}
.slot.f{min-width:0;padding:0 4px;color:var(--ink);font-weight:500}
.slot.f.st{background:var(--ok-soft);color:var(--ok);font-weight:700;border-bottom-color:var(--ok);position:relative}
.slot.f.st em{font-style:normal;font-size:10px;position:absolute;top:-11px;left:50%;transform:translateX(-50%);color:var(--shu)}
.passage{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;font-size:16px;line-height:1.95;margin-top:6px}
.passage p{margin:0 0 6px;text-indent:1em}
.passage .src{font-size:12px;color:var(--muted);text-align:right;margin-top:6px}
.pbox{display:inline-block;border:1.5px solid var(--ink);min-width:2.4em;text-align:center;font-family:var(--f-ui);font-size:12px;font-weight:700;line-height:1.45;padding:0 4px;margin:0 2px;text-indent:0;border-radius:2px}
.pbox.f{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-family:var(--f-jp);font-size:15px;min-width:0}
.pbox.f i{font-style:normal;font-size:10px;font-family:var(--f-ui);margin-right:4px;opacity:.75}
details.pv{border-top:0;margin-top:4px}
ol.oe{margin:0;padding-left:20px}
ol.oe li{margin-bottom:3px}
ol.oe li.okli b{color:var(--ok)}
table.gt{min-width:520px}
.gt .p{font-family:var(--f-jp);font-size:16px;font-weight:700;white-space:nowrap}
.gt .cn{font-family:var(--f-jp);font-size:12.5px;color:var(--muted)}
.gt .ex{font-family:var(--f-jp);font-size:13px;color:var(--muted);margin-top:2px}
.mini .gt .p{font-size:14px;white-space:normal}
.mo{display:none}
.card .bigg{font-family:var(--f-disp);font-weight:800;font-size:clamp(28px,7.5vw,46px);line-height:1.25;overflow-wrap:anywhere}
.card .cn{font-family:var(--f-jp);font-size:15px;color:var(--muted)}
.card .exs{font-family:var(--f-jp);font-size:15px;max-width:34ch;margin-inline:auto}
.card .exv{font-size:13px;color:var(--muted);max-width:40ch;margin-inline:auto}
.booktag{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--ai-soft);color:var(--ai);margin-right:6px;vertical-align:2px}

@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .xr{grid-template-columns:minmax(0,1fr);gap:2px}
  .gt .dk{display:none}
  .gt .mo{display:block}
  table.gt{min-width:0}
  .gt .p{white-space:normal;min-width:5.5em}
  .brand span{display:none}
  .brand b .bl{display:none}
  .tabs button{padding:6px 8px}
  .sync span{display:none}
  .tabs button{padding:6px 8px;font-size:13px}
  .top .wrap{gap:8px;flex-wrap:nowrap}
  .brand b{font-size:16px}
  .qt{font-size:16px}
  .uhead{grid-template-columns:1fr}
  .scorebox{display:none}
}
@media (max-width:400px){
  .tabs{gap:0}
  .tabs button{padding:6px 6px;font-size:12.5px}
  .top .wrap{gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

{t:13,p:"「フリーター」という言葉は、1980年代中頃、あるアルバイト情報誌が使い始めた[1]世の中に広まっていったと言われています。「自由に始めたり辞めたりをくり返すアルバイトの人」を「フリーのアルバイター」と定義し、それを短くして「フリーター」という言葉ができたのです。\n「職業は？」と聞かれたとき、学生ならアルバイトをしていても「学生です」と答えるでしょう。でも、彼らは学生とも違いました。「無業者」と呼ばれたりもしていましたが、「無職」といったい何が[2-a]、「失業者」[2-b]と、わかりにくい存在でした。しかし、カタカナで「フリーター」と名付けられたことで、何か特別な、新しい職業である[3]イメージがともなってきました。それによって、就職の面接などでも、「今はフリーターをやっています」と口にできるようになったのです。",
pvi:"Người ta nói rằng từ “freeter” lan rộng trong xã hội nhờ một tạp chí việc làm thêm bắt đầu dùng nó vào giữa thập niên 1980. Họ định nghĩa “người làm thêm cứ bắt đầu rồi nghỉ việc một cách tự do” là “free arbeiter”, rồi rút gọn thành “freeter”.\nKhi được hỏi “Nghề nghiệp là gì?”, sinh viên dù đi làm thêm vẫn trả lời “Là sinh viên”. Nhưng họ cũng khác sinh viên. Họ từng bị gọi là “người không có việc”, nhưng khác “thất nghiệp” ở chỗ nào, có phải là “người mất việc” không — đó là những người khó xác định. Tuy nhiên, nhờ được đặt tên bằng katakana là “freeter”, họ được gắn với hình ảnh như thể đó là một nghề mới, đặc biệt. Nhờ vậy, ngay cả ở buổi phỏng vấn xin việc, người ta cũng có thể nói “Hiện tôi đang làm freeter”.",

{t:13,p:"長旅をする[1]何を持っていくべきか。そう考えたときに思い浮かぶのはこんなこと。\n「旅は、持ち物が[2]楽しい」\n実際に長い旅をしながら、ぼくはそう確信するようになりました。\n友人で、小さなバックパックひとつにコンビニのビニール袋みたいなものをときに併せ持つだけで2，3年にわたって世界中を旅している人がいます。しかも彼は、途中で何度かそのすべてを盗られたりしているのですが、[3-a]荷物が[3-b]なくしても被害は少なく、すぐに元通りに旅が続けられます。また、大切なものをなくしたらどうしようとか、荷物が重くて面倒だからここに行くのはやめようとか、そんなことを考えることなく、どこにでも気軽に行けるのです。",
src:"近藤雄生著『旅に出よう―世界にはいろんな生き方があふれてる』岩波書店刊",
pvi:"Khi đi một chuyến dài nên mang theo gì? Mỗi lần nghĩ vậy, điều hiện lên trong đầu tôi là thế này.\n“Đi du lịch, đồ mang theo càng ít càng vui.”\nQua những chuyến đi dài thực tế, tôi ngày càng tin chắc như vậy.\nTôi có một người bạn đã đi khắp thế giới suốt 2–3 năm chỉ với một chiếc ba lô nhỏ, thỉnh thoảng thêm một thứ như túi nilon cửa hàng tiện lợi. Hơn nữa, giữa đường anh ấy còn vài lần bị lấy trộm toàn bộ đồ đạc, nhưng vì hành lý vốn đã ít nên dù mất cũng thiệt hại không nhiều, và có thể tiếp tục chuyến đi ngay như cũ. Anh ấy cũng không phải nghĩ “mất đồ quý thì sao” hay “hành lý nặng phiền quá, thôi không đi chỗ này”, mà có thể thoải mái đi bất cứ đâu.",

{t:13,p:"私は電話が嫌いだ。連絡はもっぱらメールを利用する。\nなぜか。それは、電話には、受ける側の自由がないからである。メールの利点[1]、世界中の人々に瞬時にメッセージが送れることだと多くの人は思っているに違いない。だが、それよりも大きな利点は、受け手がそのメッセージをいつ読んでいつ返事するかを自由に選べることにあるのではないかと私は思う。\nところが電話は、完全に連絡する側の都合だ。受ける側がどんなに[2]、電話をかけた瞬間、相手の電話は鳴る。携帯だと履歴が残るので、たいした用事でもないのに、相手がかけ直してくることもある。自分の用事でかけたのに、わざわざ相手にかけさせてしまうことになる[3]、私はとても電話をする気にはならないのである。",
pvi:"Tôi ghét điện thoại. Liên lạc thì tôi chủ yếu dùng email.\nVì sao? Vì với điện thoại, người nhận không có tự do. Nói đến ưu điểm của email, chắc nhiều người nghĩ là gửi được tin nhắn tức thì cho người khắp thế giới. Nhưng tôi cho rằng ưu điểm lớn hơn là người nhận được tự do chọn khi nào đọc và khi nào trả lời.\nCòn điện thoại thì hoàn toàn theo sự tiện lợi của người gọi. Dù người nhận bận đến đâu, khoảnh khắc gọi là điện thoại bên kia reo. Với di động, lịch sử cuộc gọi còn lưu lại, nên dù chẳng có việc gì quan trọng, đối phương cũng có khi gọi lại. Nghĩ đến việc mình gọi vì việc của mình mà lại khiến đối phương phải mất công gọi lại, tôi chẳng còn muốn gọi điện chút nào.",

{t:13,p:"「山登りしてみたい、でも初めてなのでどうしたらいいでしょうか」「疲れない歩き方ってあるのでしょうか」という質問が、最近特に多い。\nなんでも初めては不安な[1]。また、山登りは特別なものと思う人も結構多い。身近にハイキングでも行ってみようか、という仲間がいれば入りやすいのだが、だれもいないと不安だ。\nそんなとき、市や町が主催する山の講座に参加してみたら、と勧めている。[2]スポーツ店に相談するのもいい。初めて山を歩く人のために、という企画が必ずある。ここでいいリーダーに出会えるかどうかは運[3]だ。リーダーがよければそこに集まる人たちもいい。\n一回、一回と数を重ねるごとに、自分と同じ体力の人、似たような環境の人、同じ好みを持っている人――などと知り合いになれる。山歩きも楽しいが、仲間に会えることがうれしい、となればしめたものだ。",
src:"田部井淳子著『山を楽しむ』岩波書店刊",
pvi:"Gần đây đặc biệt nhiều câu hỏi kiểu “Tôi muốn thử leo núi nhưng là lần đầu nên phải làm sao?”, “Có cách đi bộ không mệt không?”.\nViệc gì lần đầu cũng thấy bất an. Cũng có khá nhiều người nghĩ leo núi là chuyện đặc biệt. Nếu xung quanh có bạn bè rủ “đi hiking thử không” thì dễ bắt đầu, nhưng không có ai thì lo.\nNhững lúc đó, tôi khuyên hãy thử tham gia lớp leo núi do thành phố, thị trấn tổ chức. Hoặc hỏi ý kiến cửa hàng thể thao cũng được. Chắc chắn có chương trình dành cho người lần đầu đi núi. Gặp được trưởng nhóm tốt hay không là tuỳ vào vận may. Trưởng nhóm tốt thì những người tụ họp ở đó cũng tốt.\nMỗi lần đi thêm một chuyến, bạn sẽ quen được những người có thể lực giống mình, hoàn cảnh tương tự, cùng sở thích… Đi núi đã vui, mà đến mức thấy vui vì được gặp bạn bè thì thật tuyệt.",

{t:13,p:"森林は私たちに木材というとても便利な材料を与えてくれる。軽い[1]とても丈夫で、加工も簡単だし、燃やすこともできる。\n人類は地球上に誕生したときから木材を利用してきたに違いない。とくに日本人は、日用品や住宅資材など生活の中でありとあらゆるものに木材を利用し、「森と木の文化」を育んできた。これは、日本が豊かな森林に恵まれた風土にあって、最も身近なものとして木材があったということに[2]。そして、豊富な樹種に恵まれたことから木の特性を理解して上手に使い分け、無駄なく利用し、何度も再利用してきた。\nこうした日本の森と木の文化は、木材を使うことで、それも日本で育った木材をできるだけ使うことで守っていくことができる。その結果、日本の森が元気になり、地球も元気にすることができる。そして何より、私たちも元気になることができる。\n環境に対して負荷の小さい木材は、私たち人間[3]もやさしい資材だからだ。",
src:"矢部三雄著『恵みの森 癒しの木 森の名所50選を歩く』講談社刊",
pvi:"Rừng cho chúng ta một vật liệu rất tiện lợi là gỗ. Gỗ nhẹ nhưng lại rất bền, dễ gia công, lại đốt được.\nChắc chắn từ khi xuất hiện trên Trái Đất, loài người đã dùng gỗ. Đặc biệt người Nhật dùng gỗ cho mọi thứ trong cuộc sống, từ đồ dùng hằng ngày đến vật liệu xây nhà, nuôi dưỡng nên “văn hoá rừng và gỗ”. Điều này không gì khác chính là vì Nhật Bản có phong thổ được ưu đãi với rừng phong phú, và gỗ là thứ gần gũi nhất. Rồi nhờ có nhiều loài cây, người Nhật hiểu đặc tính từng loại gỗ, khéo léo dùng đúng chỗ, không lãng phí và tái sử dụng nhiều lần.\nVăn hoá rừng và gỗ ấy có thể được gìn giữ bằng cách dùng gỗ, hơn nữa là dùng càng nhiều càng tốt gỗ trồng ở Nhật. Kết quả là rừng Nhật khoẻ lại, Trái Đất cũng khoẻ lại. Và hơn hết, chính chúng ta cũng khoẻ lên.\nBởi vì gỗ — vật liệu ít gây gánh nặng cho môi trường — cũng là vật liệu thân thiện với chính con người chúng ta.",

{t:13,p:"あなたは、いま判断できるレベルよりも、ずっとたくさんの情報を得ています。その結果、逆に行動しなくなっています。情報から結果を予測してしまうからです。（中略）\nやってもみないのに「やっても無理だよ」と答え、[1]のです。（中略）声を出したり、他人に声をかけることも、同じように思っているのではないかと心配になります。\n「あなたは、この二日間、何も食べていません。お金ももっていません。[2]、どうすればいいでしょうか」。あなたにこのように尋ねたらどうしますか。「ネットで検索して調べます」と答えるかもしれません。しかし、何十時間ネットで調べても、おなかはふくれないでしょう。メールで食べものを送ってもらいますか？\nそんなものは投げだし、すぐに外に出て、通りがかりの人に片っぱしから事情を話してみたらどうでしょう。たぶん一時間以内に、あなたは一食分、食べられているでしょう。[3-a]声をかけたからです。[3-b]、あなたのすべきことなのです。",
src:"福島英著『声のトレーニング』岩波書店刊 ※一部省略あり",
pvi:"Bạn đang có lượng thông tin nhiều hơn rất nhiều so với mức bạn có thể phán đoán. Kết quả là, ngược lại, bạn không còn hành động nữa. Vì bạn đã dự đoán trước kết quả từ thông tin. (lược)\nChưa thử làm mà đã trả lời “làm cũng vô ích thôi” rồi không chịu hành động. (lược) Tôi lo rằng cả việc lên tiếng hay bắt chuyện với người khác, bạn cũng nghĩ như vậy.\n“Bạn đã không ăn gì suốt hai ngày. Cũng không có tiền. Vậy thì, nên làm gì?” Nếu được hỏi thế, bạn sẽ làm sao? Có thể bạn sẽ trả lời “Tôi sẽ tra trên mạng”. Nhưng dù tra mạng hàng chục tiếng thì bụng cũng không no. Hay nhờ người ta gửi đồ ăn qua email?\nHãy vứt những thứ đó đi, ra ngoài ngay và thử lần lượt kể hoàn cảnh với người qua đường xem sao. Có lẽ trong vòng một tiếng, bạn đã được ăn một bữa. Đó là vì bạn đã lên tiếng. Chính điều đó là việc bạn nên làm.",

{t:13,p:"人が暮らしのなかで何かを選ぶという機会は、私が生きたこの六十年で、ずいぶんと増えたように思います。衣類一つをとっても、今は家の中に溢れかえっていて、いかに処分するかが問題となる状況です。[1]デパートやスーパーに行って、商品の山にさらされると、ついついまた何かを選んで買ってしまう。そういう生活になっています。\nあるいは子どものおもちゃ[2]、私が子どもだった頃には、買ってもらえるものが本当にかぎられていました。子ども向けの商品は、[3-a]に比べてずいぶん貧弱でした。\nところが、いまは子どもをターゲットとした商品市場が、親を巻き込んだかたちで、圧倒的な広がりを持つようになっていて、子どもが小学校に上がる頃には、ダンボール数箱分のおもちゃのガラクタがたまっていたりします。[3-b]の子どもたちが持っているおもちゃの量は、[3-c]に比べて、おそらく100倍以上に達しているのではないかと思います。",
src:"浜田寿美男著『心はなぜ不自由なのか』PHP研究所刊",

{t:13,p:"日本人は風呂好きと言われている。この場合の「風呂好き」はシャワーを浴びることではなく、湯ぶねに入ることをいうことが多い。わざわざ湯ぶねにお湯をため、そこに全身をつけて体を温める。入る前には湯ぶねの外で全身を洗う。だから家族が同じ湯ぶねのお湯に入ることは汚いことでも[1]。\n一方、西洋式のいわゆるバスルーム[2]、清潔を保つ場所といえるだろう。ここにはトイレとバスタブ、つまり日本で言う湯ぶねが一緒にある。トイレは体の内部からのものを流し、バスタブでは体表面の汚れを流す。バスルームは体全体の汚れを落とすところなのだ。だから、西洋の人々[3]、バスタブのお湯を他の人と一緒に使うなどということは考えられない。\n湯ぶねとバスタブは形は似ているが、実はまったく目的が違うのである。",
pvi:"Người ta nói người Nhật thích tắm. “Thích tắm” ở đây thường không phải là tắm vòi sen mà là ngâm mình trong bồn. Họ mất công xả nước nóng vào bồn, ngâm cả người để làm ấm cơ thể. Trước khi vào bồn thì tắm rửa toàn thân ở bên ngoài. Vì thế, việc cả nhà dùng chung một bồn nước chẳng có gì là bẩn.\nMặt khác, phòng tắm kiểu phương Tây thì có thể nói là nơi giữ gìn sự sạch sẽ. Ở đó có cả toilet và bồn tắm. Toilet xả những thứ từ bên trong cơ thể, còn bồn tắm rửa trôi bụi bẩn bề mặt cơ thể. Phòng tắm là nơi tẩy sạch mọi bụi bẩn của cơ thể. Vì vậy, xét từ góc độ của người phương Tây thì việc dùng chung nước bồn tắm với người khác là không thể nghĩ tới.\nBồn ngâm Nhật và bồn tắm Tây trông giống nhau nhưng thực ra mục đích hoàn toàn khác nhau.",

{t:13,p:"じつは川の中や水辺の周辺には、皆さんが知らない、あるいは[1]、多くの生き物たちのさまざまな暮らしがあるのです。そのことを体感するには、たくさんの本を読んだり、ビデオを見たりして知識を身につけるよりも、もっと確実な方法があります。それは、皆さんがふだんの暮らしの中で知らず知らず[2]身につけてしまった、時間や空間やさまざまな日常生活に対する「人工的な感覚」を、できるだけ捨て去ることです。そして水に囲まれた小宇宙に自分の身を置く心持ちになって、川を感じてみることです。つまり川の流れに身をひたして、魚たちの視線で川をながめてみるのです。\n私たちは、身のまわりの世界のほとんどを「視覚」を通して認識しています。でも、目にはして[3]、“ほんとうは見ていない”ことも多いのです。",
src:"松浦秀俊著『川に親しむ』岩波書店刊",

{t:13,p:"お昼前にコンビニに買い物に行こうとして、公園で懐かしい光景に出会った。\n若いおとうさんと子供たち、おにいちゃんは小学一年生か二年生、妹は幼稚園の年長組って[1]かな、三人でキャッチボールをしていた。おにいちゃんも妹も新品のグローブをはめて、おとうさんが放るボールを追っかける。（中略）\n顔よりグローブのほうが大きい妹は、おにいちゃんに文句ばかり[2]、すごく楽しそうだった。おにいちゃんはどうやらイチローのファンみたいで、背面キャッチに挑戦してはボールを頭で受けている。\nでも、妹よりもおにいちゃんよりも楽しそうに笑っていたのは、やっぱりおとうさんだった。おにいちゃんも妹も、いつか、おとうさんといっしょにキャッチボールをしたことを懐かしく思い出すだろう。子供たちがひょっとして忘れてしまっても、おとうさんはよく晴れた休日のキャッチボールのことをぜったい、ぜーったいに[3]。",
src:"重松清著『ナイフ』新潮社刊 ※一部省略あり",
pvi:"Trước buổi trưa, định ra cửa hàng tiện lợi mua đồ, tôi bắt gặp một cảnh tượng thân thương trong công viên.\nMột ông bố trẻ và hai đứa con — anh trai chắc học lớp một hay lớp hai, em gái chắc đang ở lớp lớn mẫu giáo — ba bố con đang chơi ném bắt bóng. Cả anh lẫn em đều đeo găng mới tinh, chạy theo quả bóng bố ném. (lược)\nCô em gái có cái găng to hơn cả mặt, dù bị anh trai cằn nhằn suốt nhưng trông rất vui. Cậu anh hình như là fan của Ichiro, cứ thử bắt bóng sau lưng rồi lại để bóng rơi trúng đầu.\nNhưng người cười vui hơn cả hai đứa trẻ chính là ông bố. Rồi một ngày nào đó hai anh em sẽ nhớ lại đầy hoài niệm việc từng chơi ném bóng với bố. Dù bọn trẻ có lỡ quên đi, ông bố chắc chắn, chắc chắn sẽ không bao giờ quên buổi ném bóng ngày nghỉ trời trong ấy.",

{t:13,p:"人はなぜおしゃれをするのか？ ファッションの目的はいったい何か？\nファッションについて、根源的なところからこうたずねてみたら、答えるのは[1]やさしくない。答えが単純ではないからである。\n他人によく[2-a]から。自分をよく[2-b]から。とっさにそんな答えがうかんでくる。だが、その《他人》とは、つきつめてみれば、いったい誰なのか？\nたしかに、問いの答えはシンプルではない。他人ではなく、自己満足のためというのも一つの答えだろうし、他人を意識しているとしても、わたしが「より美しい《私》」を見せたい相手は、ひとりとは[3]、時と場所、状況によって変化しうるからである。わたしは不特定多数の目に自分の姿をさしだしているのであり、意識のどこかでいつもそのことを知っている。",
src:"山田登世子著『ファッションの技法』講談社刊",
pvi:"Vì sao con người làm đẹp? Rốt cuộc mục đích của thời trang là gì?\nNếu thử đặt câu hỏi từ gốc rễ như vậy về thời trang, thì trả lời không dễ đến thế. Vì câu trả lời không đơn giản.\nVì muốn được người khác nhìn với con mắt tốt. Vì muốn cho thấy bản thân đẹp. Những câu trả lời như thế hiện ra ngay. Nhưng nghĩ cho cùng, “người khác” đó rốt cuộc là ai?\nĐúng là câu trả lời không đơn giản. “Vì sự thoả mãn bản thân chứ không vì người khác” cũng là một câu trả lời; và dù có ý thức về người khác đi nữa, thì người mà tôi muốn cho thấy “một tôi đẹp hơn” không chỉ giới hạn ở một người, mà có thể thay đổi tuỳ thời gian, nơi chốn, hoàn cảnh. Tôi phơi bày hình ảnh mình trước ánh mắt của vô số người không xác định, và ở đâu đó trong ý thức, tôi luôn biết điều đó.",

{t:13,p:"今年も桜の季節がやってきた。\n桜といえば、花見だ。花見は7世紀頃、貴族によって始められたと言われている。はじめは野山の桜を見に出かけていたが、そのうち、庭に桜を植えて花を見ながら食事や酒を楽しむようになったそうだ。その後、この花見の習慣は多くの人に広がり、江戸時代には、身分の上下[1]、みんなが花見を楽しむようになった。\n桜は、いつ咲くかわからないうえ、待っているとなかなか咲いて[2]。ところが、咲き始めると、あたり一面が桜の色に見えるほどみごとに咲く。しかし、花は長い間咲いている[3]。10日ほどで、あっという間に散ってしまう。\n花の美しさ[4]、そんな桜の「生き方」も、日本人が桜を好む理由だろう。絵をはじめ、和歌や俳句など文学においても桜はくり返し現れる。\n実は、桜と日本人のつきあいは古い。研究に[5-a]二千年以上前から人々は桜の咲き方に[5-b]米がどのぐらいできるかを占っていたらしい。\n昔から日本人にとって、桜は特別な存在であったようだ。",
pvi:"Năm nay mùa hoa anh đào lại đến.\nNói đến anh đào là nói đến ngắm hoa. Người ta nói việc ngắm hoa được giới quý tộc bắt đầu vào khoảng thế kỷ 7. Ban đầu họ ra núi đồi để ngắm, rồi dần dần trồng anh đào trong vườn và vừa ngắm hoa vừa thưởng thức đồ ăn, rượu. Sau đó, tập quán này lan ra nhiều người, đến thời Edo thì không phân biệt thân phận cao thấp, ai cũng thưởng hoa.\nAnh đào không biết khi nào nở, mà chờ thì mãi không nở cho. Thế nhưng khi đã nở thì nở rộ đến mức cả một vùng như nhuộm màu hoa. Nhưng hoa không nở được lâu. Chỉ khoảng 10 ngày là rụng hết trong chớp mắt.\nVẻ đẹp của hoa là đương nhiên, nhưng “cách sống” ấy của hoa anh đào chắc cũng là lý do người Nhật yêu thích nó. Anh đào xuất hiện nhiều lần không chỉ trong hội hoạ mà trong cả văn học như waka, haiku.\nThật ra, mối quan hệ giữa anh đào và người Nhật đã có từ lâu. Theo nghiên cứu, từ hơn hai nghìn năm trước, người ta đã dựa vào cách hoa nở để bói xem lúa được mùa đến đâu.\nTừ xưa, với người Nhật, anh đào dường như là một sự tồn tại đặc biệt.",

{t:13,p:"私は、小さい頃からずっとペットのいる生活にあこがれていた。仲の良い友達はみんな犬や猫を飼っているのに、うちは母が動物が嫌いな[1]、私は高校生になるまで一度もペットを飼ったことがなかった。\n私は何度も母に、友達の犬の写真を見せたり、感動的な動物映画を見せたりして、\n「いいなあ、うちにもこんなかわいいペットがいたらなあ」\nと、わざとらしく大きな声で言ったりしていたのだが、そのたびに母からは、\n「見てるだけならいいけど、花の世話もできないあんたに動物の世話なんて[2]」\nと、冷たい返事が返ってくるばかりだった。\nところが、そんなわが家に子犬がやってくることになった。母の長年の友人である田中さんの家に子犬が3匹生まれたので、1匹[3]というのだ。\nもちろん母はすぐに断った。しかし田中さんはあきらめず、何度も電話をかけてきて、\n「うちの狭い部屋じゃ、[4-a]3匹全部は育てられ[4-b]のよ。捨てるなんて絶対にできないし、他の友達はみんなペット禁止のマンションだし……。とにかく、今度の日曜、1匹連れていくから！」\nそういうわけで、田中さんは日曜日、強引に子犬を連れてわが家にやってきた。それが、私とシロとのはじめての出会いだった。\nあれから十年。あんなに反対していた母も、今ではシロ[5-a]生活[5-b]考えられないと言っている。",
pvi:"Từ nhỏ tôi luôn ao ước một cuộc sống có thú cưng. Bạn thân đứa nào cũng nuôi chó mèo, vậy mà tại mẹ tôi ghét động vật nên đến tận khi lên cấp ba tôi chưa từng nuôi con nào.\nTôi nhiều lần cho mẹ xem ảnh con chó của bạn, cho xem phim động vật cảm động, rồi cố tình nói to “Thích ghê, nhà mình mà có con thú cưng dễ thương thế này thì hay biết mấy”, nhưng lần nào mẹ cũng chỉ đáp lạnh lùng: “Nhìn thôi thì được, chứ con đến hoa còn không chăm nổi thì chăm động vật làm sao được”.\nThế rồi, một chú chó con lại sắp đến nhà tôi. Nhà bác Tanaka, bạn lâu năm của mẹ, có 3 chú chó con mới sinh, bác muốn nhà tôi nhận nuôi 1 con.\nĐương nhiên mẹ từ chối ngay. Nhưng bác Tanaka không bỏ cuộc, gọi điện nhiều lần: “Phòng nhà tôi chật, có vẻ không thể nào nuôi nổi cả 3 con. Bỏ đi thì nhất định không được, bạn khác thì toàn ở chung cư cấm nuôi thú… Thôi, Chủ nhật tới tôi mang 1 con sang nhé!”\nThế là Chủ nhật bác Tanaka cứ thế mang chó con đến nhà tôi. Đó là lần đầu tôi gặp Shiro.\nĐã mười năm từ đó. Đến cả mẹ, người từng phản đối kịch liệt, giờ cũng nói không thể tưởng tượng cuộc sống thiếu Shiro.",

{t:13,p:"山田花子様\n\nこのたびは、当校の「英会話レッスン3カ月集中コース」へのお申し込み、まことにありがとうございます。\n山田様の英会話力の向上のため、スタッフ一丸となってサポート[1]。\nさて、コース開始前に、いくつか注意事項がございます。まず、一度納入された受講料は、どのような場合におきましてもご返金には応じられませんので、ご了承ください。やむを得ずレッスンに参加できない場合は、前後1週間以内[2]、同じレベルの別のクラスを受講することが可能です。ただし、事前のご連絡がなかった場合、他のクラスにご参加いただくことは[3]のでご注意ください。\nなお、受講料には教材費が含まれておりません。初回のレッスンの際に教材のご紹介と販売をいたしますので、必要[4]ご購入ください。\n初回のレッスンは、通常より30分早いスタートとなります。くれぐれも、遅れる[5]、お気をつけください。\nそれでは、当日お会いできますことを、スタッフ一同心よりお待ちしております。\n\n英会話スクールABC　スタッフ代表　木村太郎",
pvi:"Kính gửi chị Yamada Hanako,\nCảm ơn chị đã đăng ký “Khoá học hội thoại tiếng Anh tập trung 3 tháng” của trường.\nĐể nâng cao khả năng hội thoại tiếng Anh của chị, toàn thể nhân viên xin đồng lòng hỗ trợ.\nTrước khi khoá học bắt đầu, có một số điều cần lưu ý. Trước hết, học phí đã nộp sẽ không được hoàn lại trong bất kỳ trường hợp nào, mong chị thông cảm. Trường hợp bất khả kháng không thể tham gia buổi học, nếu trong vòng 1 tuần trước/sau thì có thể học ở lớp khác cùng trình độ. Tuy nhiên, nếu không liên lạc trước thì chúng tôi không thể cho chị tham gia lớp khác, xin lưu ý.\nNgoài ra, học phí chưa bao gồm tiền giáo trình. Buổi học đầu chúng tôi sẽ giới thiệu và bán giáo trình, xin hãy mua tuỳ theo nhu cầu.\nBuổi học đầu bắt đầu sớm hơn thường lệ 30 phút. Xin chị hết sức lưu ý để không đến muộn.\nToàn thể nhân viên chân thành mong được gặp chị vào ngày học.\nTrường hội thoại tiếng Anh ABC, đại diện nhân viên Kimura Taro",

{t:13,p:"どうも元気がでない、やる気がおきないという日が続くことはないだろうか。\n大きな失敗をした[1]、勉強や仕事が思ったとおりには進んでいない。友人との関係はいつもどおりだが、友人の何気ない一言にひそかに傷ついたり、孤独を感じてしまったりする。また、約束の時間に遅れたとか、貸してほしいと頼まれていたものを忘れたなど、人と付き合う上で、小さなミスが続く自分にがっかりしてしまう。[2]そんな時にかぎって、何かをなくしたり、いつも使っているものがこわれてしまったりする。\nなんとか元気を出さなければと、お酒を飲んだりおいしいものを食べたり、自分なりの方法で気分を変えようとする。しかし、お酒を飲み終わってしまうとまた元に戻って、むしろ疲れとむなしさだけが残る。そのうち気分を変えることさえ[3]。\nこういうときは、静かに待つことだと思う。生きていく長い時間の中には、調子が[4-a]、調子が[4-b]。それは波のようにくり返しやってくる。今は調子の悪いときなのだと受け入れてしまうのも一つの方法なのだ。なんとかしようなどと思わなくていい。毎日[5]ことをきちんとやり、不調の波が引いて行くのを静かに待つ。今は調子が悪いときだということを受け入れることは、反対に、いつかいいときが来るという希望を持つことでもあるのだから。",
pvi:"Bạn có khi nào trải qua chuỗi ngày chẳng hiểu sao không có sức sống, không có động lực không?\nKhông phải là đã thất bại lớn gì, nhưng việc học hay công việc không tiến triển như ý. Quan hệ bạn bè vẫn như mọi khi, nhưng lại âm thầm tổn thương vì một câu nói vô tình của bạn, hay cảm thấy cô đơn. Rồi thì trễ hẹn, quên món đồ được nhờ cho mượn… trong giao tiếp, ta thất vọng về bản thân cứ mắc lỗi nhỏ liên tục. Thêm vào đó, đúng những lúc như thế lại làm mất đồ, hay đồ dùng hằng ngày bị hỏng.\nNghĩ phải lấy lại tinh thần, ta uống rượu, ăn món ngon, thử thay đổi tâm trạng theo cách của mình. Nhưng uống xong lại trở về như cũ, chỉ còn lại mệt mỏi và trống rỗng. Dần dần đến cả việc thay đổi tâm trạng cũng không muốn làm nữa.\nNhững lúc thế này, tôi nghĩ nên lặng lẽ chờ đợi. Trong quãng đời dài, có lúc phong độ tốt thì cũng có lúc xấu. Chúng lặp lại như những con sóng. Chấp nhận rằng bây giờ là lúc không tốt cũng là một cách. Không cần nghĩ phải làm gì đó. Mỗi ngày làm đàng hoàng những việc nên làm, lặng lẽ chờ con sóng xấu rút đi. Bởi chấp nhận rằng giờ là lúc không tốt, ngược lại, cũng là mang hy vọng rằng một ngày nào đó lúc tốt sẽ đến.",

{t:13,p:"ある人が自分の作った米10kgを売ろうと考えました。この人は10kgの米に5,000円という値段をつけました。では、この5,000円という値段は何から決められたのでしょう。この米がとれた土地の価値[1]いるのか、それとも米を作ったこの人の働きからなのでしょうか。\nこの米の価値は、人の働きと、土地[2]自然の働きとを合わせることで生み出されたと言えます。\nイギリスのウィリアム・ペティという統計学者は「労働は富の父であり、土地（自然）は富の母である」と言っています。しかし、実際にはこの米[3]支払われた5,000円を人と自然が分け合うことはありません。5,000円はすべて人のものになります。\nところで、父親が母親の役割をみとめない家庭はよい家庭でしょうか。そのような家庭を[4-a]よい家庭とは[4-b]と思います。これは人と自然の関係にもあてはまります。人は、母である自然の役割をきちんと認めてきませんでした。だから今、家庭である地球の環境がよい状態ではないのです。\n人は自然とともに生み出した米10kgから得た5,000円を、自分たちだけのものにするのをあらためなければなりません。自然は何も要求してきませんが、このお金が自然のために使われて[5]と考えなければならないのです。",
pvi:"Có người định bán 10 kg gạo do mình làm ra. Người này đặt giá 5.000 yên cho 10 kg gạo. Vậy cái giá 5.000 yên ấy được quyết định từ đâu? Dựa trên giá trị của mảnh đất trồng ra gạo, hay từ công sức của người làm ra gạo?\nCó thể nói giá trị của gạo được tạo ra bằng cách kết hợp công sức con người và đất đai, tức là sức lao động của tự nhiên.\nNhà thống kê học người Anh William Petty nói: “Lao động là cha của của cải, đất đai (tự nhiên) là mẹ của của cải.” Nhưng thực tế, 5.000 yên trả cho số gạo này không được con người và tự nhiên chia nhau. Tất cả 5.000 yên thuộc về con người.\nNhân tiện, một gia đình mà người cha không thừa nhận vai trò của người mẹ có phải là gia đình tốt? Tôi nghĩ không ai lại gọi gia đình như thế là gia đình tốt. Điều này cũng đúng với quan hệ giữa con người và tự nhiên. Con người đã không thừa nhận đúng mức vai trò của người mẹ là tự nhiên. Vì vậy mà bây giờ môi trường của Trái Đất — mái nhà chung — không ở trạng thái tốt.\nCon người phải sửa đổi việc coi 5.000 yên thu được từ 10 kg gạo cùng tự nhiên làm ra là của riêng mình. Tự nhiên không đòi hỏi gì, nhưng chúng ta phải nghĩ rằng số tiền này được dùng cho tự nhiên là điều đương nhiên.",

{t:13,p:"もし、子どもに「自動車はどうやって動いているの？」と聞かれたら、あなたはどのように答えますか。\nかりに、あなたが自動車が動く仕組みを正確に知っていた[1]。あなたは、「それはね……」と自信を持って説明を始めるでしょう。ところが、子どもからは、「エンジンって何？」「シャフトって何？」と次々と質問が返ってきます。あなたは「あれ？ 変だな。どうしてうまく説明できないんだろう？」とあわてるかもしれません。そして自分の知識を子どもがわかるように説明することが、決して簡単ではないと気づくことに[2]。\n実はこのように、どんなことでも、[3-a]言葉を使って説明するよりも[3-b]言葉で説明するほうが、はるかに[3-c]のです。\nでは、次に、あなたが自動車の仕組みを知らない場合のことを考えてください。その場合はどうするでしょうか。子どもの質問に答えられないのは大人として恥ずかしいからと、知っているふりをして適当に答えておきますか。\n「知らない」ということは決して恥ずかしいことではありません。すべてのことを知っている[4]のですから。それよりも、知らないことを隠そうとするほうが、もっと恥ずかしいことだと言えます。\nですから、自分があまりよく知らないことについて子どもに質問されたら、「私もよくわからないから、一緒に調べてみよう」と[5]。",
pvi:"Nếu bị con hỏi “Ô tô chạy bằng cách nào ạ?”, bạn sẽ trả lời ra sao?\nGiả sử bạn biết chính xác cơ chế hoạt động của ô tô. Bạn sẽ tự tin bắt đầu giải thích “Đó là vì…”. Thế nhưng con lại hỏi liên tục “Động cơ là gì?”, “Trục là gì?”. Có thể bạn sẽ lúng túng “Ơ, lạ nhỉ, sao mình không giải thích được?”. Và có lẽ bạn sẽ nhận ra rằng giải thích kiến thức của mình sao cho trẻ hiểu tuyệt đối không đơn giản.\nThật ra, việc gì cũng vậy, giải thích bằng lời dễ hiểu khó hơn nhiều so với giải thích bằng lời khó.\nTiếp theo, hãy nghĩ đến trường hợp bạn không biết cơ chế ô tô. Khi đó bạn sẽ làm gì? Vì là người lớn mà không trả lời được câu hỏi của trẻ thì xấu hổ, nên bạn giả vờ biết rồi trả lời qua loa ư?\n“Không biết” tuyệt đối không phải là điều đáng xấu hổ. Bởi làm gì có ai biết hết mọi thứ. Ngược lại, cố che giấu điều mình không biết mới là đáng xấu hổ hơn.\nVì vậy, nếu bị trẻ hỏi điều mình không rõ, hãy thử trả lời “Bố/mẹ cũng không rõ lắm, mình cùng tìm hiểu nhé” xem sao.",

{t:13,p:"私には10歳年下の弟がいる。\n弟が小さい頃は、母の代わりによく私が弟の世話をしていたものだ。ミルクをあげたり、お風呂に入れたり、遊び相手になったり。家にいるときは、とにかく何をする[1]いっしょだった。その頃の私は、[2-a]に対して、[2-b]というよりも自分の[2-c]のような気持ちで接していたように思う。\n弟は、私や母の言うことをよく聞く素直ないい子だったが、食事に関してだけは別だった。野菜が嫌いで、まったく口にしようとしなかったのだ。なんとか[3]と、母はいろいろと料理を工夫した。ところが、弟は料理の中に野菜を見つけると、すぐに口から出してしまうのだった。母は心配[4]、医者にまで相談したが、「だいじょうぶ、そのうち食べるようになりますよ」と言われるだけだった。\n医者の言葉どおり、弟は成長する[5]、少しずつ野菜を食べるようになった。そして、小学校を卒業する頃には、ほとんど何でも食べられるようになった。母はとても喜んでいたが、私はそんな弟の成長に、少し寂しさも感じていた。",
pvi:"Tôi có một em trai kém tôi 10 tuổi.\nHồi em còn nhỏ, tôi thường thay mẹ chăm em. Cho em bú, tắm cho em, chơi cùng em. Ở nhà thì làm gì cũng có nhau. Hồi ấy, tôi nghĩ mình đối xử với em không phải như với một đứa em mà như với chính con mình.\nEm là đứa trẻ ngoan, nghe lời tôi và mẹ, nhưng riêng chuyện ăn uống thì khác. Em ghét rau, nhất quyết không chịu ăn. Mẹ đã khéo léo nấu nhiều kiểu để bằng cách nào đó cho em ăn. Thế nhưng hễ thấy rau trong món ăn là em nhè ra ngay. Mẹ lo quá nên đi hỏi cả bác sĩ, nhưng chỉ được bảo “Không sao đâu, rồi cháu sẽ ăn thôi”.\nĐúng như bác sĩ nói, càng lớn em càng ăn rau dần. Đến khi tốt nghiệp tiểu học thì hầu như cái gì cũng ăn được. Mẹ vui lắm, còn tôi lại thấy hơi buồn trước sự trưởng thành ấy của em.",

{t:13,p:"さて、次は「今日の占い」のコーナーです。生まれた月によって、今日の運勢をランキング形式で発表します。\nそれでは、今日の1位の発表です。今日一番ラッキーなのは、11月生まれの方です。\n11月生まれのあなた、今日は人間関係がとてもうまくいく日です。性別や年齢[1]、いろいろな人と親しくなれるでしょう。ラッキーカラーは黄色です。黄色のものを身につけていると、すてきな出会いがあるかもしれません。[2]、誘われたことを何でもOKしていると、あとで都合がつかなくなって困ったことになりかねないので、気をつけてくださいね。\n今日、一番運勢が悪いのは……、残念、3月生まれの方です。\n3月生まれのあなたは、今日は慎重な行動を心がけましょう。思ったことをすぐに口に出して人を傷つけたり、よく考えずに行動して失敗するかもしれません。何か思いついた[3]、それをすぐに行動に移すのではなく、少し時間をおいてゆっくり考えることをおすすめします。そうすれば、つまらない失敗を[4]でしょう。今日のラッキーカラーは赤です。順位が低い[5]がっかりしないで、トマトやいちごなど、赤いものを食べて、今日一日を元気に乗り切りましょう！",
pvi:"Tiếp theo là chuyên mục “Bói hôm nay”. Chúng tôi công bố vận may hôm nay theo tháng sinh dưới dạng bảng xếp hạng.\nNào, công bố hạng 1 hôm nay. Người may mắn nhất hôm nay là người sinh tháng 11.\nBạn sinh tháng 11, hôm nay là ngày quan hệ con người rất suôn sẻ. Bất kể giới tính hay tuổi tác, bạn có thể thân thiết với nhiều người. Màu may mắn là màu vàng. Mang theo đồ màu vàng, biết đâu bạn sẽ có cuộc gặp gỡ tuyệt vời. Tuy nhiên, nếu cái gì được rủ cũng nhận lời thì có thể sau đó không thu xếp được và gặp rắc rối, hãy cẩn thận nhé.\nHôm nay, người vận xui nhất là… tiếc quá, người sinh tháng 3.\nBạn sinh tháng 3, hôm nay hãy chú ý hành động thận trọng. Có thể bạn sẽ nói ngay điều mình nghĩ làm tổn thương người khác, hay hành động thiếu suy nghĩ mà thất bại. Dù có nảy ra ý gì, đừng hành động ngay mà hãy để một chút thời gian suy nghĩ kỹ. Như vậy bạn sẽ không phải mắc những thất bại vớ vẩn. Màu may mắn hôm nay là màu đỏ. Đừng vì xếp hạng thấp mà thất vọng, hãy ăn đồ màu đỏ như cà chua, dâu tây để vượt qua một ngày thật khoẻ khoắn nhé!",

{t:13,p:"会議室で打ち合わせをしている[1]、地震があった。\n思いがけず大きな揺れに驚く私たちを見て、部長が、「みなさん、落ち着いて行動してください」と言った。私は、「そうだ、こういうときは[2]。落ち着かなければ」と思った。\nしかし、思っていたより揺れは長く続き、私たちはどうしていいのかわからずに、会議室の机がガタガタ音を立てて動いているのを見ている[3]だった。「落ち着いて！」ともう一度部長の声が聞こえてきたが、落ち着こうと思えば思うほど、体は動かないのだ。\nその時、別の声が聞こえた。\n「窓ガラスから離れて、机の下にもぐれ！」\nはっと気がついて、私は急いで窓ガラスから離れ、大きな机の下にもぐった。地震の際は窓ガラスから離れないと、ガラスが割れたとき危ない、という話を机の下で思い出していた。その後しばらくして揺れはおさまり、幸い、けが人は一人も出なかった。\n考えてみると、災害や事故のような緊急の場合は、冷静な行動が必要だと[4-a]実際には何をしたらいいのか[4-b]、動きが止まってしまうものだ。そういうときに必要なのは、「落ち着け」という言葉より、「窓から離れろ」や「机の下にもぐれ」などという具体的な指示ではないだろうか。緊急時には、具体的な指示こそが人を動かし、安全確保へとつながると言えるだろう。\n今回の一件[5]、私は具体的な指示の大切さというものを改めて考えさせられた。",
pvi:"Đang giữa lúc họp bàn ở phòng họp thì có động đất.\nThấy chúng tôi giật mình trước cơn rung lớn bất ngờ, trưởng phòng nói: “Mọi người, hãy bình tĩnh hành động”. Tôi nghĩ: “Đúng rồi, những lúc thế này không được hoảng. Phải bình tĩnh”.\nNhưng cơn rung kéo dài hơn tôi nghĩ, chúng tôi không biết làm gì, chỉ biết đứng nhìn bàn phòng họp rung lạch cạch. Lại nghe tiếng trưởng phòng “Bình tĩnh!”, nhưng càng cố bình tĩnh thì cơ thể càng không cử động được.\nLúc đó, một giọng khác vang lên: “Tránh xa cửa kính, chui xuống gầm bàn!”\nChợt tỉnh ra, tôi vội tránh xa cửa kính và chui xuống gầm chiếc bàn lớn. Dưới gầm bàn, tôi nhớ lại lời dặn khi động đất phải tránh xa cửa kính, nếu không kính vỡ sẽ nguy hiểm. Một lúc sau cơn rung dừng, may là không ai bị thương.\nNghĩ lại thì, trong tình huống khẩn cấp như thiên tai hay tai nạn, dù biết là cần hành động bình tĩnh, nhưng ta lại không biết thực tế phải làm gì và đứng sững lại. Điều cần thiết lúc ấy có lẽ không phải câu “bình tĩnh” mà là chỉ dẫn cụ thể như “tránh xa cửa sổ” hay “chui xuống gầm bàn”. Có thể nói khi khẩn cấp, chính chỉ dẫn cụ thể mới khiến con người hành động và dẫn tới đảm bảo an toàn.\nQua sự việc lần này, tôi lại được dịp suy nghĩ về tầm quan trọng của chỉ dẫn cụ thể.",

{t:13,p:"リビングに行くと、母と姉がお茶を飲みながら話していた。\n姉は怒ったような顔をして、母に言った。\n「それでね、6時に会う約束をしていたのに彼が来たのは7時。5分や10分[1]、1時間も遅れて来たのよ。あり得ないでしょ？ しかも、絶対に『ごめんなさい』って言わないの。謝る[2]、言い訳ばっかりしているの」\n「それはひどいわね」\n母は、あきれたように言った。\n「でしょ？ そのくせ、レストランで注文した料理がなかなか運ばれてこないからって、人目もかまわず、大声で店員さんに文句言うのよ。それに……」\n姉の話が[3-a]か[3-b]かのうちに、私は思わず姉に向かって言った。\n「お姉ちゃん！ そんな男とはもう別れたら？」\n姉と母は、私の顔を見てびっくりしたような表情をしていたが、次の瞬間、二人とも大声で笑い出した。そして、私に向かってこう言った。\n「何を勘違いしてるの？ 私がそんな男とつき合う[4]でしょ。ドラマの話よ。お母さんが先週見るのを忘れたって言うから、話してあげてたのよ。もう、あんたって本当にそそっかしい[5]」",
pvi:"Tôi ra phòng khách thì thấy mẹ và chị đang vừa uống trà vừa nói chuyện.\nChị làm mặt như đang giận, nói với mẹ:\n“Rồi đấy, hẹn gặp lúc 6 giờ mà 7 giờ anh ta mới đến. 5 hay 10 phút thì còn được, đằng này trễ tận 1 tiếng. Không thể chấp nhận được đúng không? Đã thế nhất định không nói ‘xin lỗi’. Chẳng những không xin lỗi mà còn toàn biện hộ.”\n“Thế thì quá đáng thật.” Mẹ nói vẻ ngán ngẩm.\n“Đúng không? Vậy mà vì món đã gọi ở nhà hàng mãi không mang ra, anh ta bất chấp người xung quanh, to tiếng phàn nàn với nhân viên. Rồi thì…”\nChị chưa nói hết câu, tôi đã buột miệng nói với chị: “Chị ơi! Chia tay với gã đó đi!”\nChị và mẹ nhìn mặt tôi vẻ ngạc nhiên, nhưng ngay sau đó cả hai cười phá lên. Rồi nói với tôi:\n“Em hiểu lầm gì thế? Chị làm sao mà quen gã như thế được. Chuyện phim truyền hình đấy. Mẹ bảo tuần trước quên xem nên chị kể cho mẹ thôi. Trời ạ, em đúng là hấp tấp thật đấy.”",

{t:13,p:"5月5日の「こどもの日」を前に、政府が出生率の調査結果を発表した。それによると、日本の人口全体における子どもの割合は、30年間減少し続けており、今年はついに14％を下回ったそうだ。日本の少子化問題は、ますます深刻化していると[1]。\n少子化の大きな原因として、女性の社会進出が進んだことや、育児費用が高いことなどが挙げられている。\nたしかに、今の日本社会では、子どもが生まれた[2]、女性が長い間会社を休みにくい雰囲気がある。そのうえ、小さい子どもを預ける施設の数も十分ではないため、女性にとって、子どもを産むことは仕事を失うことにも[3]のだ。\nまた、経済的な問題で子どもを産むことをためらう人もいる。「職を失ううえに育児費用がかかるのでは、とても育てられ[4]」とあきらめたり、夫婦二人でゆとりある生活を送ることを選択したりするケースも増えている。\nこのままでは将来の労働力が不足するおそれがあるとして、国による早急な対応を望む声があがっている。しかしその一方で、少子化は必ずしも[5]という意見もある。むしろ少子化の現状に対応した社会システムを作るべきだ、という声も少なくない。",
pvi:"Trước “Ngày Thiếu nhi” 5/5, chính phủ đã công bố kết quả điều tra tỉ lệ sinh. Theo đó, tỉ lệ trẻ em trong tổng dân số Nhật đã giảm liên tục suốt 30 năm, năm nay cuối cùng xuống dưới 14%. Phải nói rằng vấn đề giảm sinh của Nhật ngày càng nghiêm trọng.\nNguyên nhân lớn được nêu ra là phụ nữ tham gia xã hội nhiều hơn và chi phí nuôi con cao.\nĐúng là trong xã hội Nhật hiện nay, dù có con, phụ nữ vẫn khó nghỉ làm dài ngày. Hơn nữa, số cơ sở gửi trẻ nhỏ không đủ, nên với phụ nữ, sinh con có thể dẫn tới mất việc.\nNgoài ra, cũng có người ngần ngại sinh con vì vấn đề kinh tế. Ngày càng nhiều trường hợp từ bỏ vì “đã mất việc lại còn tốn tiền nuôi con thì khó mà nuôi nổi”, hoặc chọn cuộc sống thong thả chỉ hai vợ chồng.\nCó ý kiến lo ngại cứ thế này tương lai sẽ thiếu lao động và mong nhà nước nhanh chóng ứng phó. Nhưng mặt khác cũng có ý kiến cho rằng giảm sinh chưa chắc đã là xấu. Không ít người còn cho rằng nên xây dựng hệ thống xã hội phù hợp với hiện trạng giảm sinh.",

{t:13,p:"インターネットは私たちの生活を大きく変えた。もはやインターネットがない生活[1]世の中になった。\nしかしながら、インターネットは使い方[2]、非常に危険なツールとなることを忘れてはならない。ここ数年、インターネットに関するトラブルや犯罪は増加する一方である。そのため、インターネットの利用者は、自分自身を守るための知識や技術を身につけておく必要があるだろう。さらに、本当に安心してインターネットを使うことができるような社会を実現させるためには、子どもたちの教育が特に重要である。知識や技術を教えることは[3]、子どもたちのモラルを高めていくことが求められている。\nそこで最近、子どもたちを対象にした「インターネット安全教室」が各地で開催されている。そこでは、インターネットを利用するときのルールやマナー、犯罪に巻き込まれる危険性などをわかりやすく教えている。たとえば、個人情報の流出や、掲示板などでの発言が深刻なトラブルに[4]ということを、くわしく説明している。\n特に、小学生の場合、パソコンの機能については驚くほど高度な知識や技術を持って[5]、自分が得た情報については、何が正しくて何が間違っているのかを判断できないことが多い。\nそのため、インターネット安全教室では、ネット上で得た情報について、少しでも疑問に思うことがあったら、すぐに親や先生に相談するように促すことも行っている。",
pvi:"Internet đã thay đổi lớn cuộc sống của chúng ta. Giờ đây đã là thời mà cuộc sống không có internet là điều không thể nghĩ tới.\nTuy nhiên, không được quên rằng tuỳ cách dùng, internet có thể trở thành công cụ rất nguy hiểm. Mấy năm nay, rắc rối và tội phạm liên quan đến internet ngày càng tăng. Vì vậy người dùng cần trang bị kiến thức và kỹ năng để tự bảo vệ mình. Hơn nữa, để hiện thực hoá một xã hội có thể dùng internet thật sự an tâm, giáo dục trẻ em đặc biệt quan trọng. Dạy kiến thức, kỹ năng là đương nhiên, mà còn cần nâng cao đạo đức của trẻ.\nVì thế gần đây, các “Lớp học an toàn internet” dành cho trẻ em được tổ chức ở nhiều nơi. Ở đó dạy dễ hiểu về quy tắc, phép lịch sự khi dùng internet, nguy cơ bị cuốn vào tội phạm… Chẳng hạn, giải thích kỹ rằng rò rỉ thông tin cá nhân hay phát ngôn trên diễn đàn có thể dẫn đến rắc rối nghiêm trọng.\nĐặc biệt, học sinh tiểu học tuy có kiến thức, kỹ năng cao đến kinh ngạc về chức năng máy tính, nhưng nhiều khi không phán đoán được thông tin mình nhận được cái gì đúng, cái gì sai.\nVì vậy, lớp học an toàn internet còn khuyến khích trẻ hễ có chút nghi ngờ về thông tin trên mạng thì hỏi ngay bố mẹ hoặc thầy cô.",

{t:13,p:"私は自転車に乗れるようになるまでに、かなり苦労をしたほうだと思う。友人や知人の話をきく[1]、皆それほどたいした苦労もなく乗れている人が多い。なんとなく乗ったら乗れたとか、いつのまにか乗れるようになっていたとか、[2]夢か魔法でも使ったのかと言いたい話ばっかりである。\n私の場合はまさに血と汗と涙の特訓であった。一度目は、小学校二年の夏に友人の勧めで練習をすることになった。（中略）\n友人は既に乗れるので「さあ、がんばっていこう。カンタンカンタン」と気軽に言う。初めはその言葉にのせられ、ああそうか、カンタンなのかと両足を地面から離したとたんに転んだ。全然話が違うではないか。これの[3-a]カンタンな[3-b]。少し考えればわかる事だが、このふたつしかない車輪が地面に立つわけはないのである。だから両足を地面から離したら転ぶに決まっている。冗談ではない、この友人は何てことを私にさせるのであろう。そんな思いが湧いていた。私は友人に「乗れるわけないよ。コレ、転ぶに決まってるじゃん。両足離したらすぐ転ぶ[4]」と文句を言った。しかし友人は「転ぶ前にこぐんだよ。そうすれば転ばないで前に進むんだから。ホントだよ」と言う。\nホントかなァ…と[5]、もう一回やってみる。ダメである。やはり転ぶ。転ぶ前にペダルに足をかけてそれを回すなどという余裕は全くない。とにかく、地面から足を離すと同時に車体は傾くのである。どうしようもない。",
src:"さくらももこ著『あのころ』集英社刊 ※一部省略あり",
pvi:"Tôi nghĩ mình thuộc loại đã vất vả khá nhiều mới đi được xe đạp. Theo những gì nghe bạn bè, người quen kể, phần lớn ai cũng đi được mà chẳng khổ sở gì. Toàn những chuyện như cứ thế leo lên là đi được, hay lúc nào không hay đã biết đi — với tôi thì toàn là chuyện khiến tôi muốn hỏi họ dùng phép màu chắc.\nVới tôi thì đúng là một khoá huấn luyện máu, mồ hôi và nước mắt. Lần đầu là mùa hè năm lớp hai, tôi tập theo lời rủ của bạn. (lược)\nBạn tôi đã đi được nên nói nhẹ tênh “Nào, cố lên. Dễ ợt dễ ợt”. Ban đầu tôi bị cuốn theo lời đó, nghĩ “à, dễ à”, vừa nhấc hai chân khỏi mặt đất là ngã ngay. Khác hoàn toàn những gì được nói! Cái này mà dễ chỗ nào chứ! Nghĩ một chút là hiểu, cái thứ chỉ có hai bánh này làm sao đứng được trên mặt đất. Nên nhấc hai chân lên là ngã là cái chắc. Đùa à, bạn này bắt mình làm cái trò gì thế. Tôi đã nghĩ như vậy. Tôi cằn nhằn với bạn: “Làm sao mà đi được. Cái này chắc chắn ngã mà. Nhấc hai chân lên là ngã ngay thôi”. Nhưng bạn tôi nói: “Phải đạp trước khi ngã. Làm vậy là không ngã mà đi về phía trước được. Thật đấy”.\nThật không ta… vừa nghi ngờ tôi vừa thử thêm lần nữa. Không được. Vẫn ngã. Chẳng có chút dư dả nào để đặt chân lên bàn đạp mà đạp trước khi ngã. Cứ nhấc chân khỏi mặt đất là thân xe nghiêng ngay. Chịu thua.",

// ---------- timer ----------
let tStart=null,tTick=null;
function enterUnit(id){const st=U(id);if(!st.sub&&mode(id)==="self"&&Object.keys(st.ans).length){tStart=now();clearInterval(tTick);tTick=setInterval(updTimer,1000);}}
function leaveUnit(){clearInterval(tTick);if(route.v==="unit"&&tStart){const st=U(route.id);st.time+=(now()-tStart)/1000;tStart=null;save(false);}}
function elapsed(id){const st=U(id);return st.time+(tStart?(now()-tStart)/1000:0);}
function updTimer(){const el=document.getElementById("timer");if(!el||route.v!=="unit")return;const u=BYID[route.id];const lim=u.kind==="round"?600:180;const e=elapsed(u.id);
 el.textContent=mmss(e)+" / "+mmss(lim);el.classList.toggle("over",e>lim);}
const mode=id=>S.prefs.mode[id]||"self";

// ---------- render ----------
const V=document.getElementById("view"),DOCK=document.getElementById("dock");

function render(){const tab=tabOf();document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.go===tab?"page":"false"));

const HERO={
 v:{h:"日本語パワードリル<br>N2 文字・語彙",p:"30 回 × 18 câu theo đúng dạng đề JLPT N2 phần Chữ – Từ vựng, cùng 10 bài 集中トレーニング. Tự làm có bấm giờ, chấm điểm theo thang 20 của sách, xem đáp án kèm dịch nghĩa, giải thích, Hán Việt."},
 g:{h:"日本語パワードリル<br>N2 文法",p:"30 回 theo đúng dạng đề JLPT N2 phần Ngữ pháp: chọn mẫu ngữ pháp, sắp xếp câu ★, ngữ pháp đoạn văn — cùng 10 bài 集中トレーニング. Xem đáp án kèm dịch nghĩa, phân tích từng lựa chọn, mẫu ngữ pháp và từ vựng."}
};
function renderHome(book){
 const list=BOOKU[book];let done=0,pctSum=0,qa=0;
 list.forEach(u=>{const st=S.units[u.id];if(st){qa+=Object.keys(st.ans||{}).length;if(st.sub){done++;pctSum+=(st.score||0)/u.maxPt;}}});
 const favN=(book==="g"?ALLG:ALLV).filter(e=>isFav(e.k)).length;
 const next=list.find(u=>!(S.units[u.id]&&S.units[u.id].sub))||list[0];
 let h=`<section class="hero"><div class="eyebrow">日本語能力試験対策 · Sách luyện đề ${BOOKN[book]}</div>
 <h1 class="jp">${HERO[book].h}</h1>
 <p>${HERO[book].p}</p>
 <div class="stats">
  <div class="stat"><b>${done}<small style="font-size:13px;color:var(--muted)"> / ${list.length}</small></b><span>Bài đã chấm</span></div>
  <div class="stat"><b>${done?Math.round(pctSum/done*100)+"%":"—"}</b><span>Điểm trung bình</span></div>
  <div class="stat"><b>${qa}</b><span>Câu đã trả lời</span></div>
  <div class="stat"><b>${favN}</b><span>${book==="g"?"Mẫu NP yêu thích":"Từ yêu thích"}</span></div>
 </div>
 <div class="continue"><button class="btn pri" data-open="${next.id}">${(S.units[next.id]&&answered(next))?"Tiếp tục":"Bắt đầu"} ${esc(unitLabel(next))} →</button>
 <button class="btn" data-go="${book==="g"?"grammar":"vocab"}">${book==="g"?"Bảng ngữ pháp":"Bảng từ vựng"}</button>
 <button class="btn" data-fsrc="${book==="g"?"gfav":"fav"}">Ôn flashcard</button></div></section>`;
 // groups: every chunk ending with trainings
 const groups=[];let cur=[];list.forEach((u,i)=>{cur.push(u);const nx=list[i+1];if(u.kind==="train"&&(!nx||nx.kind==="round")){groups.push(cur);cur=[];}});if(cur.length)groups.push(cur);
 groups.forEach((g,gi)=>{const r=g.filter(u=>u.kind==="round");
  h+=`<section class="stage"><h2>Chặng ${gi+1}${r.length?` · 第${r[0].no}〜${r[r.length-1].no}回`:""}</h2><div class="grid">`;
  g.forEach(u=>{const st=S.units[u.id];const an=st?Object.keys(st.ans||{}).length:0;
   const stamp=st&&st.sub?`<div class="stamp">${st.score}<small>/${u.maxPt}</small></div>`:"";
   h+=`<button class="tile ${u.kind}" data-open="${u.id}">${stamp}<span class="t jp">${esc(unitLabel(u))}</span>
   <span class="s">${u.kind==="train"?`<span class="jp">${esc(u.topic)}</span> · `:""}tr. ${esc(u.pages)}</span>
   <span class="s">${st&&st.sub?"Đã chấm":an?`Đang làm ${an}/${u.total}`:`${u.total} câu`}</span>
   <span class="bar"><i style="width:${Math.round(an/u.total*100)}%"></i></span></button>`;});
  h+=`</div></section>`;});
 h+=`<div class="foot"><span>Tiến độ được lưu ngay trên trình duyệt; khi mở bằng tài khoản Claude, tiến độ còn được đồng bộ giữa các thiết bị.</span>
 <button class="btn warn" id="reset" data-step="0">Xoá toàn bộ tiến độ (cả 2 sách)</button></div>`;
 V.innerHTML=h;}

function passageHTML(s,si,showKey){
 const fills={};
 if(showKey)s.qs.forEach((q,qi)=>{const n=qi+1;const ans=q.o[q.a-1];const parts=ans.split("／").map(x=>x.trim());
  if(parts.length>1&&/^[a-c] /.test(parts[0]))parts.forEach(p=>{fills[n+"-"+p[0]]=p.slice(2).trim();});else fills[n]=ans;});
 const body=s.p.split("\n").filter(x=>x.trim()).map(par=>`<p>${esc(par).replace(/\[(\d)(?:-([abc]))?\]/g,(m0,n,l)=>{const key=l?n+"-"+l:n;const f=fills[key];
  return f!=null?`<span class="pbox f"><i>${key}</i>${esc(f)}</span>`:`<span class="pbox">${key}</span>`;})}</p>`).join("");
 let h=`<div class="passage jp">${body}${s.src?`<div class="src">（${esc(s.src)}）</div>`:""}</div>`;
 if(showKey&&s.pvi)h+=`<details class="exp pv" data-k="p${si}"${S.prefs.openAll?" open":""}><summary>Dịch đoạn văn</summary><div class="xb">${s.pvi.split("\n").filter(x=>x.trim()).map(x=>`<p style="margin:0">${esc(x)}</p>`).join("")}</div></details>`;
 return h;}

function qHTML(u,s,q,qi,m,st){
 const showKey=m==="key"||st.sub;const pick=st.ans[q.id];const t=s.t;
 const two=q.o.length===2;const correct=q.o[q.a-1];const kl=n=>two?AB[n-1]:n;
 let lay;
 if(u.book==="g"){const ml=Math.max(...q.o.map(x=>x.length));lay=two?"two":ml>12?"long":ml>6?"two":"";}
 else lay=t===6?"long":two?"two":"";
 let qt;
 if(t===6)qt=`<span class="qword jp">${esc(q.q)}</span>`;
 else if(t===12)qt=starQ(q,showKey);
 else if(t===13)qt=`<span class="muted" style="font-family:var(--f-ui);font-size:14px">Ô</span> <span class="pbox">${qi+1}</span> <span class="muted" style="font-family:var(--f-ui);font-size:14px">trong đoạn văn</span>`;
 else qt=fmtQ(q.q,showKey&&(t===3||t===4||t===7||t===11||t===17)?correct:null);
 let h=`<article class="q" data-q="${q.id}"><div class="qn">${qi+1}</div><div class="qt jp">${qt}</div><div class="opts ${lay}">`;
 q.o.forEach((o,i)=>{const n=i+1;let cls="opt";
  if(showKey){if(n===q.a)cls+=" ok";else if(st.sub&&m==="self"&&pick===n)cls+=" bad";else cls+=" dim";}
  else if(pick===n)cls+=" pick";
  h+=`<button class="${cls}" data-pick="${n}" ${showKey?"disabled":""}><span class="k">${kl(n)}</span><span class="ot jp">${fmtO(o)}</span></button>`;});
 h+=`</div>`;
 if(st.sub&&m==="self"){h+=pick===q.a?`<div class="mark ok">✓ Đúng</div>`:`<div class="mark bad">${pick?"✗ Sai":"— Bỏ trống"} · Đáp án: ${kl(q.a)}</div>`;}
 if(showKey){
  h+=`<details class="exp" data-k="${q.id}"${S.prefs.openAll?" open":""}><summary>Xem kỹ: dịch, giải thích, ${u.book==="g"?"ngữ pháp, ":""}từ vựng</summary><div class="xb">
  <div class="xr"><b>Đáp án</b><div><span class="jp" style="font-weight:700">${kl(q.a)}. ${fmtO(correct)}</span></div></div>`;
  if(t===12)h+=`<div class="xr"><b>Câu đúng</b><div><span class="jp">${esc(fullStar(q))}</span><div class="muted" style="font-size:13px;margin-top:2px">Thứ tự: ${q.ord.join(" → ")} · ★ ở ô thứ 3</div></div></div>`;
  if(q.vi)h+=`<div class="xr"><b>Dịch nghĩa</b><div>${esc(q.vi).replace(/\n/g,"<br>")}</div></div>`;
  h+=`<div class="xr"><b>Giải thích</b><div>${esc(q.ex)}</div></div>`;
  if(q.oe)h+=`<div class="xr"><b>Các lựa chọn</b><ol class="oe">${q.oe.map((x,i)=>`<li class="${i+1===q.a?"okli":""}"><b class="jp">${fmtO(q.o[i])}</b> — ${esc(x)}</li>`).join("")}</ol></div>`;
  if(q.g)h+=`<div class="xr"><b>Ngữ pháp</b><div class="gram jp">${esc(q.g)}</div></div>`;
  if(q.ot)h+=`<div class="xr"><b>Dịch 4 câu</b><ol>${q.ot.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`;
  if(q.gk.length)h+=`<div class="xr"><b>Mẫu ngữ pháp</b><div class="mini">${gtable(q.gk,{mini:true})}</div></div>`;
  if(q.vk.length)h+=`<div class="xr"><b>Từ vựng</b><div class="mini">${vtable(q.vk,{mini:true})}</div></div>`;
  h+=`</div></details>`;}
 return h+`</article>`;}

const EMPTY=`<div class="empty"><b>Không có mục nào khớp bộ lọc</b>Thử chọn bộ lọc khác hoặc xoá ô tìm kiếm.</div>`;
const starBtn=k=>`<button class="star ${isFav(k)?"on":""}" data-fav="${esc(k)}" aria-label="Yêu thích">${STAR}</button>`;

  (opt.mini?"":`<td>${tagBtn(k)}</td>`)+(opt.units?`<td class="ulinks">${ulinks(e.units)}</td>`:"")+`</tr>`;});
 return h+`</tbody></table></div>`;}

 if(!keys.length)return EMPTY;

 keys.forEach(k=>{const e=GRM.get(k);
  h+=`<tr><td>${starBtn(k)}</td><td><div class="p">${esc(e.p)}</div>${e.c?`<div class="cn mo">${esc(e.c)}</div>`:""}</td><td class="cn dk">${esc(e.c)}</td><td>${esc(e.m)}${opt.ex&&e.ex?`<div class="ex">${esc(e.ex)}</div>`:""}</td>`+
  (opt.mini?"":`<td>${tagBtn(k)}</td>`)+(opt.units?`<td class="ulinks">${ulinks(e.units)}</td>`:"")+`</tr>`;});

function filterKeys(keys,f,q){return keys.filter(k=>{if(f==="fav"&&!isFav(k))return false;if((f==="c"||f==="r")&&tagOf(k)!==f)return false;
 if(q){const hay=ENT(k).hay;if(!hay.includes(q)&&!hay.includes(stripVN(q)))return false;}return true;});}
function chipsHTML(keys,f,attr,extra=""){const n=x=>filterKeys(keys,x,"").length;
 return `<div class="chips" role="group" aria-label="Lọc">${[["all","Tất cả"],["c","Hay thi"],["r","Nhận diện"],["fav","★ Yêu thích"]].map(([v,l])=>`<button class="chip" data-${attr}="${v}" aria-pressed="${f===v}">${l}<small>${n(v)}</small></button>`).join("")}${extra}</div>`;}

 if(showKey){

   <p>${u.gkeys.length} mẫu ngữ pháp xuất hiện trong đáp án và giải thích. Bấm ★ để đưa vào flashcard, bấm nhãn mức để đổi “Hay thi” ↔ “Nhận diện”.</p>

  if(u.vkeys.length){const f=S.prefs.vf;const keys=filterKeys(u.vkeys,f,"");

   ${chipsHTML(u.vkeys,f,"vf",`<button class="chip" data-favall="${u.id}" data-kind="v">+ ★ tất cả “Hay thi”</button>`)}${vtable(keys)}</section>`;}}

  else{const sc=scoreOf(u,st.ans);DOCK.innerHTML=`<div class="wrap"><span class="result">${st.score}/${u.maxPt} điểm</span><span class="cnt">${sc.ok}/${u.total} câu đúng · ${mmss(st.time)}${st.best!=null&&st.best!==st.score?` · cao nhất ${st.best}`:""}</span><span class="sp"><button class="btn" data-scroll="${u.gkeys.length?"gsum":"vsum"}">${u.gkeys.length?"Ngữ pháp":"Từ vựng"}</button><button class="btn" id="redo">Làm lại</button></span></div>`;}}
}

let FC={deck:[],i:0,flip:false,sig:""};
function fcBase(){const src=S.prefs.fsrc;
 if(src==="fav")return ALLV.filter(e=>isFav(e.k)).map(e=>e.k);
 if(src==="c")return ALLV.filter(e=>tagOf(e.k)==="c").map(e=>e.k);
 if(src==="gfav")return ALLG.filter(e=>isFav(e.k)).map(e=>e.k);
 if(src==="gc")return ALLG.filter(e=>tagOf(e.k)==="c").map(e=>e.k);
 if(src.startsWith("gu:")&&BYID[src.slice(3)])return BYID[src.slice(3)].gkeys.slice();
 if(BYID[src])return BYID[src].vkeys.slice();return [];}
const lvl=k=>(S.srs[k]&&S.srs[k].b)||0;
function fcSource(){let keys=fcBase();if(S.prefs.fdue)keys=keys.filter(k=>lvl(k)<3);return keys;}
function buildDeck(force){const keys=fcSource();const sig=S.prefs.fsrc+"|"+S.prefs.fdue+"|"+keys.length;
 if(!force&&sig===FC.sig&&FC.deck.length)return;
 const sh=keys.map(k=>[lvl(k),Math.random(),k]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(x=>x[2]);
 FC={deck:sh,i:0,flip:false,sig};}
function renderFlash(){buildDeck(false);
 const src=S.prefs.fsrc;const isG=src.startsWith("g");
 const vfav=ALLV.filter(e=>isFav(e.k)).length,gfav=ALLG.filter(e=>isFav(e.k)).length;
 const box=[0,0,0,0,0];fcBase().forEach(k=>{box[Math.min(4,lvl(k))]++;});
 const opt=(v,l)=>`<option value="${v}" ${src===v?"selected":""}>${l}</option>`;
 let h=`<div class="eyebrow">Ôn tập</div><h1 class="jp" style="font-family:var(--f-disp);font-size:30px">${isG?"文型カード":"単語カード"}</h1>
 <div class="fc-top" style="margin-top:10px"><select class="sel" id="fsrc" aria-label="Bộ thẻ">
 <optgroup label="Từ vựng">${opt("fav",`★ Từ vựng yêu thích (${vfav})`)}${opt("c","Tất cả từ “Hay thi”")}${BOOKU.v.map(u=>opt(u.id,"Từ vựng 語彙 "+esc(u.title))).join("")}${BOOKU.g.map(u=>opt(u.id,"Từ vựng 文法 "+esc(u.title))).join("")}</optgroup>
 <optgroup label="Ngữ pháp">${opt("gfav",`★ Ngữ pháp yêu thích (${gfav})`)}${opt("gc","Tất cả ngữ pháp “Hay thi”")}${BOOKU.g.map(u=>opt("gu:"+u.id,"Ngữ pháp "+esc(u.title))).join("")}</optgroup></select>
 <div class="seg" role="group" aria-label="Chiều thẻ"><button data-fdir="jp" aria-pressed="${S.prefs.fdir==="jp"}">${isG?"文型":"漢字"} → Nghĩa</button><button data-fdir="vi" aria-pressed="${S.prefs.fdir==="vi"}">Nghĩa → ${isG?"文型":"漢字"}</button></div>
 <button class="chip" id="fdue" aria-pressed="${!!S.prefs.fdue}">Chỉ thẻ chưa thuộc</button>
 <button class="chip" id="fshuf">Xáo lại</button></div>
 <div class="boxes" aria-label="Hộp ghi nhớ của bộ thẻ này">${["Mới / quên","Hộp 1","Hộp 2","Hộp 3","Đã thuộc"].map((l,i)=>`<div><b>${box[i]}</b>${l}</div>`).join("")}</div>`;
 if(!FC.deck.length){const favSrc=src==="fav"||src==="gfav";
  h+=`<div class="empty"><b>${favSrc?(isG?"Chưa có mẫu ngữ pháp yêu thích nào":"Chưa có từ yêu thích nào"):"Bộ thẻ này đang trống"}</b>${favSrc?"Bấm ★ trong phần giải thích hoặc bảng tổng hợp cuối bài để thêm vào đây. Hoặc chọn bộ thẻ khác ở ô phía trên.":"Bỏ chọn “Chỉ thẻ chưa thuộc” hoặc chọn bộ thẻ khác."}
  <div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" data-fsrc="c">Ôn tất cả từ “Hay thi”</button><button class="btn" data-fsrc="gc">Ôn tất cả ngữ pháp “Hay thi”</button></div></div>`;V.innerHTML=h;return;}
 if(FC.i>=FC.deck.length){h+=`<div class="empty"><b>Xong một lượt ${FC.deck.length} thẻ</b>Các thẻ bấm “Chưa nhớ” sẽ được xếp lên đầu ở lượt sau.<div style="margin-top:12px"><button class="btn pri" id="fagain">Ôn lượt mới</button></div></div>`;V.innerHTML=h;return;}
 const k=FC.deck[FC.i];const e=ENT(k);const b=lvl(k);const dir=S.prefs.fdir;let front,back;
 if(e.kind==="g"){
  front=dir==="jp"?`<div class="bigg jp">${esc(e.p)}</div>`:`<div class="bigvi">${esc(e.m)}</div>`;
  back=`<div class="cback">${dir==="vi"?`<div class="bigg jp">${esc(e.p)}</div>`:""}${e.c?`<div class="cn">${esc(e.c)}</div>`:""}${dir==="jp"?`<div class="mn">${esc(e.m)}</div>`:""}${e.ex?`<div class="exs">${esc(e.ex)}</div>`:""}${e.exvi?`<div class="exv">${esc(e.exvi)}</div>`:""}<div class="ulinks">${ulinks(e.units)}</div></div>`;
 }else{
  front=dir==="jp"?`<div class="big jp">${esc(e.w)}</div>`:`<div class="bigvi">${esc(e.m)}</div>`;
  back=`<div class="cback">${dir==="vi"?`<div class="big jp" style="font-size:clamp(36px,9vw,56px)">${esc(e.w)}</div>`:""}<div class="rd">${esc(e.r)}</div>${e.hv?`<div class="hv">${esc(e.hv)}</div>`:""}${dir==="jp"?`<div class="mn">${esc(e.m)}</div>`:""}<div class="ulinks">${ulinks(e.units)}</div></div>`;}
 h+=`<div class="card" id="card" tabindex="0" role="button" aria-label="Lật thẻ"><div class="corner"><button class="speak" id="speak" aria-label="Phát âm">${SPK}</button>${starBtn(k)}</div>
 <div>${front}${FC.flip?back:""}</div>${FC.flip?"":`<div class="hint">Chạm hoặc nhấn Space để lật</div>`}</div>
 <div class="fc-act"><button class="btn no" id="fno">Chưa nhớ <small>←</small></button><button class="btn yes" id="fyes">Nhớ rồi <small>→</small></button></div>
 <div class="fc-meta"><span>Thẻ ${FC.i+1} / ${FC.deck.length}</span><span>${b>=4?"Đã thuộc":b?"Hộp "+b:"Mới"} · <span class="tag ${tagOf(k)}" style="border:0">${TAGN[tagOf(k)]}</span></span></div>`;
 V.innerHTML=h;}
function fcRate(ok){const k=FC.deck[FC.i];const b=lvl(k);S.srs[k]={b:ok?Math.min(4,b+1):0,ts:now()};save();FC.i++;FC.flip=false;renderFlash();}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
const speakText=e=>e.kind==="g"?(e.ex||e.p.replace(/[～〜]/g,"")):e.r;

function keepRender(){const y=window.scrollY;const open=[...document.querySelectorAll("details[data-k][open]")].map(d=>d.dataset.k);render();
 open.forEach(id=>{const d=document.querySelector(`details[data-k="${id}"]`);if(d)d.open=true;});window.scrollTo(0,y);}
// ---------- events ----------
document.addEventListener("click",ev=>{const t=ev.target.closest("button,a");if(!t)return;
 if(t.dataset.go){ev.preventDefault();go(t.dataset.go);return;}
 if(t.dataset.open){go(t.dataset.open);return;}
 if(t.dataset.fav){const k=t.dataset.fav;toggleFav(k);document.querySelectorAll(`[data-fav="${CSS.escape(k)}"]`).forEach(b=>b.classList.toggle("on",isFav(k)));
  if((route.v==="vocab"&&S.prefs.vf==="fav")||(route.v==="grammar"&&S.prefs.gf==="fav"))keepRender();return;}
 if(t.dataset.tag){toggleTag(t.dataset.tag);keepRender();return;}
 if(t.dataset.vf){S.prefs.vf=t.dataset.vf;S.prefs.vlim=200;save(false);keepRender();return;}
 if(t.dataset.gf){S.prefs.gf=t.dataset.gf;S.prefs.glim=150;save(false);keepRender();return;}
 if(t.dataset.favall){const u=BYID[t.dataset.favall];(t.dataset.kind==="g"?u.gkeys:u.vkeys).forEach(k=>{if(tagOf(k)==="c"&&!isFav(k))S.favs[k]={on:1,ts:now()};});save();keepRender();return;}
 if(t.dataset.scroll){const el=document.getElementById(t.dataset.scroll);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return;}
 if(t.dataset.fsrc){S.prefs.fsrc=t.dataset.fsrc;save(false);buildDeck(true);if(route.v!=="flash")go("flash");else renderFlash();return;}
 if(route.v==="unit"){const u=BYID[route.id];const st=U(u.id);
  if(t.dataset.pick&&mode(u.id)==="self"&&!st.sub){const q=t.closest(".q").dataset.q;const n=+t.dataset.pick;
   if(st.ans[q]===n)delete st.ans[q];else st.ans[q]=n;st.ts=now();if(!tStart){tStart=now();clearInterval(tTick);tTick=setInterval(updTimer,1000);}save();
   const art=t.closest(".q");art.querySelectorAll(".opt").forEach(b=>b.classList.toggle("pick",st.ans[q]===+b.dataset.pick));
   const c=DOCK.querySelector(".cnt b");if(c)c.textContent=answered(u);return;}
  if(t.dataset.mode){leaveUnit();S.prefs.mode[u.id]=t.dataset.mode;save(false);enterUnit(u.id);render();return;}
  if(t.hasAttribute("data-openall")){S.prefs.openAll=!S.prefs.openAll;save(false);const y=window.scrollY;render();window.scrollTo(0,y);return;}
 }
 if(t.id==="submit"){const u=BYID[route.id];const st=U(u.id);
  if(answered(u)<u.total&&t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent=`Còn ${u.total-answered(u)} câu trống — chấm luôn?`;return;}
  leaveUnit();const sc=scoreOf(u,st.ans);st.sub=true;st.score=sc.pt;st.best=Math.max(st.best||0,sc.pt);st.ts=now();save();render();window.scrollTo(0,0);return;}
 if(t.id==="redo"){const u=BYID[route.id];const st=U(u.id);st.ans={};st.sub=false;st.score=null;st.time=0;st.ts=now();save();S.prefs.mode[u.id]="self";enterUnit(u.id);render();window.scrollTo(0,0);return;}
 if(t.id==="reset"){if(t.dataset.step!=="1"){t.dataset.step="1";t.textContent="Bấm lần nữa để xoá hẳn";return;}
  S=blank();save();render();return;}
 if(t.id==="more"){const l=t.dataset.lim;S.prefs[l]=(S.prefs[l]||(l==="glim"?150:200))+300;keepRender();return;}
 if(t.dataset.fdir){S.prefs.fdir=t.dataset.fdir;save(false);FC.flip=false;renderFlash();return;}
 if(t.id==="fdue"){S.prefs.fdue=!S.prefs.fdue;save(false);buildDeck(true);renderFlash();return;}
 if(t.id==="fshuf"||t.id==="fagain"){buildDeck(true);renderFlash();return;}
 if(t.id==="fno"){fcRate(false);return;} if(t.id==="fyes"){fcRate(true);return;}
 if(t.id==="speak"){ev.stopPropagation();speak(speakText(ENT(FC.deck[FC.i])));return;}
});
document.addEventListener("click",ev=>{const c=ev.target.closest("#card");if(c&&!ev.target.closest("button")){FC.flip=!FC.flip;renderFlash();}});
document.addEventListener("change",ev=>{const t=ev.target;
 if(t.id==="fsrc"){S.prefs.fsrc=t.value;save(false);buildDeck(true);renderFlash();}
 if(t.id==="vu"){S.prefs.vu=t.value;S.prefs.vlim=200;save(false);renderVocab();}
 if(t.id==="gu"){S.prefs.gu=t.value;S.prefs.glim=150;save(false);renderGrammar();}});
let qT=null;
document.addEventListener("input",ev=>{const id=ev.target.id;if(id!=="vq"&&id!=="gq")return;
 S.prefs[id]=ev.target.value;clearTimeout(qT);qT=setTimeout(()=>{const pos=ev.target.selectionStart;if(id==="vq")renderVocab();else renderGrammar();const el=document.getElementById(id);el.focus();try{el.setSelectionRange(pos,pos);}catch(e){}},200);});
document.addEventListener("keydown",ev=>{if(route.v!=="flash"||!FC.deck.length||FC.i>=FC.deck.length)return;if(/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName))return;
 if(ev.key===" "){ev.preventDefault();FC.flip=!FC.flip;renderFlash();}
 else if(ev.key==="ArrowLeft"){fcRate(false);}else if(ev.key==="ArrowRight"){fcRate(true);}});
window.addEventListener("pagehide",()=>{leaveUnit();});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&route.v==="unit"&&tStart){const st=U(route.id);st.time+=(now()-tStart)/1000;tStart=now();save();}});

route=parseHash();render();if(route.v==="unit")enterUnit(route.id);
window.addEventListener("hashchange",()=>{if(route.v==="unit")enterUnit(route.id);});
initSync();
})();
</script>
